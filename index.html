window.__GLOSSARY__ = {"正统":{"en":"orthodoxy, ὀρθοδοξία","def":"希腊文 *orthos*（正确）+ *doxa*（意见、荣耀）。字面意思是「正确的看法」。在基督教语境中，它指被教会主流认为符合使徒传统与圣经的教导。**关键困难是：没有「正统」是自我成立的。** 在公元 325 年之前，没有人能说清「正统」究竟是什么，因为关于核心问题的争论还没有结束。正统很大程度上是**事后追认**的：某一边在政治与教会权力斗争中胜出，之后它的立场就被追溯地称为「正统」，而另一边被命名为「异端」。这意味着「正统 vs 异端」不是一场裁判早已就位的比赛，而是比赛本身产生了裁判。参见 {{异端}}、{{大公会议}}、{{教父}}。","see":["异端","大公会议","教父","正统与异端的权力问题"],"ch":["ch-1"]},"异端":{"en":"heresy, αἵρεσις","def":"希腊文 *hairesis* 原意是「选择」「派别」「学派」，本身毫无贬义——斯多亚派、伊壁鸠鲁派都自称 *hairesis*。它获得「错误教导」这一贬义，是基督教论战用语的结果。**为什么这个词如此重要**：一旦某方被贴上「异端」标签，它就不只是「意见不同」，而是「原理上错误的」，其拥护者可以被逐出共同体、失去财产、甚至被国家处死。所以定义异端的权力，等于定义谁属于教会、谁拥有救恩渠道的权力。本书使用「异端」一词时，一律指**在当时被主流判定为错误、并在后世被历史性地认定为非正统的立场**，而不表示本书作者同意这一判定。参见 {{正统}}、{{绝罚}}、{{诅咒}}.","see":["正统","绝罚","诅咒","殉道者"],"ch":["ch-1"]},"三位一体":{"en":"Trinity, Trinitas, Τριάς","def":"基督教最核心也最难解的教义：神是**唯一的**（一神论不可放弃），但**父、子、圣灵**是三个真实有别的「位格」（{{位格}}），不是三个神；三者同一神性，不分先后高低（{{本体同一}}）。它被表述为：一本质（{{本质}}），三位格。**为什么会有争议**：因为它同时踩中了两条底线。强调「一」，容易滑向认为父、子、圣灵只是同一个神的不同「面具」，于是子不是真神（{{形态论}}）；强调「三」，容易把三个位格说成三个神，于是陷入多神教（{{三神论}}）。正统的表述是一条极窄的缝隙，任何一侧都有人指责它已经越界。公元 325 年尼西亚会议、381 年君士坦丁堡会议、以及整个 4 世纪的论战，都是为了把这句表述固定下来。参见 {{本体同一}}、{{尼西亚信经}}、{{和子句}}.","see":["本体同一","位格","尼西亚信经","和子句","形态论","三神论"],"ch":["ch-2","ch-4"]},"本体同一":{"en":"homoousios, ὁμοούσιος","def":"希腊文 *homos*（同一）+ *ousia*（本质、实体）。「同一本质」：子与父共享**同一个**神性本质，而不是两个相似的本质。这个词是 325 年尼西亚信经的枢纽，也是整个 4 世纪争吵的核心。**为什么一个词引来如此大战**：在当时的哲学语汇中，两个东西若本质相同，它们就无法是「两个」——它们就是同一个东西。因此反对者（{{阿里乌}}派）认为，说子与父「本质相同」，等于取消父子区别，是变相的 {{撒伯里乌主义}}。支持者则回答：用「本质」说的是神性，用「位格」说的是关系，二者不在同一层面。这场争论最终催生了三位一体教义的精确语法。争论中还有折中方案：{{本体相似}}（homoiousios，只差一个字母 i）与 {{本体相异}}（anomoean）。参见 {{本质}}、{{本体相似}}、{{尼西亚信经}}。","see":["本质","本体相似","尼西亚信经","阿里乌","撒伯里乌主义"],"ch":["ch-4"]},"位格":{"en":"hypostasis / persona","def":"希腊文 *hypostasis*（字面：底下的站立，即「实在的结构」），拉丁文 *persona*（原意是戏剧中的面具，引申为法律上的「人格」）。三位一体教义说：一个神性本质，三个位格。**这是全书最重要的语法区分之一**。要理解它，请记住教父们的公式：在神里，凡是涉及**本质/神性**的，都是共同的（全能的、永恒的、创造者）；凡是涉及**位格**的，都是各自独有的（父非受生、子受生、圣灵发出）。位格不是一个「部分」或「三分之一神」，而是关系的「谁」。{{加帕多家教父}}对这一语法的定型贡献最大。**注意**：中文的「位格」是一个生造译词，英文 person 在今天的意思是「个人」，容易误导为三个独立个体；更接近的一个类比是「同一个存在者内部的三重关系」。参见 {{本质}}、{{本体同一}}、{{互渗相寓}}。","see":["本质","本体同一","互渗相寓","加帕多家教父"],"ch":["ch-4"]},"本质":{"en":"ousia / substantia","def":"希腊文 *ousia* 意思是「存在」「所是」；拉丁文 *substantia* 词源是「底下站立的东西」。在三位一体讨论里指神之所以为神的那一个共同的神性。**难点在于**：希腊哲学里 *ousia* 倾向于指「抽象的共同性」（如「人性」），而 *hypostasis* 倾向于指「具体的个别存在者」。如果照字面理解，一个 *ousia* + 三个 *hypostasis* 听起来就像「一个抽象的人性 + 三个具体的人」——这正是 {{三神论}} 的形状。教父们明确拒绝这一推论，主张在神里 *ousia* 与 *hypostasis* 的关系不能照搬受造界的模式，因为神没有「类」与「个体」的区分。参见 {{位格}}、{{加帕多家教父}}。","see":["位格","本体同一","三神论","加帕多家教父"],"ch":["ch-4"]},"本体相似":{"en":"homoiousios, ὁμοιούσιος","def":"「相似的本质」。尼西亚信经之后的折中立场：子与父相似，但不「同一」（与 {{本体同一}} 只差一个希腊字母 iota）。支持者多被称为 {{半阿里乌派}}。他们的理由是：父子若本质「完全相同」，父子之别就被抹掉了；圣经说子「是父的像」（西 1:15），所以「相似」更忠实地保留了区别。**他们的反对者**（{{亚他那修}} 一派）则说：相似可以相似到何种程度？如果相似程度不足，子就不是真神；如果相似到无限，那就是同一。因此「相似」是一个不稳定的中间站。历史最终证明，多数半阿里乌派后来接受了「同一本质」，但仍为自己的用词辩护。参见 {{半阿里乌派}}、{{尼西亚信经}}。","see":["本体同一","半阿里乌派","尼西亚信经","阿里乌"],"ch":["ch-4"]},"正统与异端的权力问题":{"en":"the politics of orthodoxy","def":"一个由现代史学反复讨论的问题：**「正统」如何被确立**。古代没有最高法院。确立正统的实际机制包括：主教会议（{{大公会议}}）的多数表决；皇帝的召集与压力；关键主教的人脉与流放；文本的删改与销毁；以及圣徒传记对失败者的污名化。这并不必然意味着正统的教义内容是纯粹权力产物——许多教义争论有真实的圣经诠释分歧——但它意味着：**「这是正统」与「这是权力获胜的一方」这两句话并不互相排斥**。理解这一点，是理解本书全部内容的前提。参见 {{正统}}、{{异端}}、{{大公会议}}。","see":["正统","异端","大公会议"],"ch":["ch-1"]},"大公会议":{"en":"ecumenical council","def":"希腊文 *oikoumene*（「整个有人居住的世界」）→「普世的」。大公会议指由全教会（后来实际上是全帝国）主教参加的会议，其决议被认为具有普遍约束力。传统上天主教与新教共同承认前七次（尼西亚 325、君士坦丁堡 381、以弗所 431、迦克墩 451、君士坦丁堡二 553、君士坦丁堡三 680–681、尼西亚二 787）；东正教承认前七次；东方教会（{{东方正统教会}}）只承认前三次（因为不承认迦克墩）。**为什么会议本身也是一大争议来源**：谁有权召集（皇帝还是主教）？代表权如何计算？不参加者是否受约束？后来新教一般主张「只有圣经是最高权威」，由此把大公会议降为「教会传统中最可信的部分」而非「无误的法庭」。参见 {{尼西亚会议}}、{{迦克墩}}。","see":["尼西亚会议","迦克墩","正统与异端的权力问题"],"ch":["ch-2"]},"尼西亚信经":{"en":"Nicene Creed / Niceno-Constantinopolitan Creed","def":"基督教最普遍使用的信经。传统上追溯到 325 年尼西亚会议，现存全文实为 381 年君士坦丁堡会议扩订。核心条款：「我信独一主耶稣基督，神的独生子，在万世以前为父所生，出于神而为神，出于光而为光，出于真神而为真神，**受生而非被造，与父一体（{{本体同一}}）**；万物都是借着他造的……」**为什么这几句被反复背诵**：它们是专门用来排除 {{阿里乌}} 立场的。信经里每一个「出于……而为……」都是在堵一个漏洞——「出于光而为光」排除「从无中造出」；「受生而非被造」排除「子是最高的受造物」；「与父一体」排除「相似但不同」。参见 {{信经}}、{{尼西亚会议}}、{{阿里乌}}。","see":["信经","尼西亚会议","阿里乌","本体同一"],"ch":["ch-4"]},"信经":{"en":"creed, symbolum","def":"源自拉丁文 *credo*（「我相信」）。信经是共同认信的固定条文，从早期洗礼问答发展而来。最著名的有 {{使徒信经}}（西方礼仪用，晚期形成）、{{尼西亚信经}}（含 381 年版与拉丁文增补 {{和子句}}）、{{亚他那修信经}}（西方拉丁传统中以诗体阐述三位一体与道成肉身）。**为什么信经被看得如此重要**：在一个注重圣经的时代，「人怎么能把信仰浓缩成固定公式」本身就是争议——早期就有「只信圣经，不要信经」的声音，被回应为「信经只是对圣经的摘要与守卫」。参见 {{尼西亚信经}}、{{使徒信经}}、{{和子句}}。","see":["尼西亚信经","使徒信经","和子句"],"ch":["ch-4"]},"使徒信经":{"en":"Apostles' Creed","def":"西方教会最古老的洗礼信经，现存版本可追溯到约 5–8 世纪高卢地区，因传说每位使徒各贡献一句而得名（此传说本身不可靠）。它简短、没有使用哲学化的「本体同一」等词，只说「我信……独生的子……在本丢彼拉多手下受难」。**它的意义**：常被用来主张一种比尼西亚信经更「圣经化」、更少哲学色彩的信仰。但它的省略也可能只是因为它太古老，而不是因为作者刻意避开哲学。参见 {{信经}}。","see":["信经","尼西亚信经"],"ch":["ch-4"]},"和子句":{"en":"Filioque","def":"拉丁文「和儿子」。西方教会于 6–11 世纪逐步在尼西亚信经中加入了「圣灵是从父**和儿子**（Filioque）发出的」这一句。原希腊文本只说「从父发出」（约 15:26）。**为什么一个词导致东西方教会分裂**：东方认为这篡改了普世信经（且未经大公会议同意），且叠加了两个神性「来源」，威胁父的独一性；西方则认为「从父和子」准确表达了子与父同质（{{本体同一}}），甚至是为了对抗 {{阿里乌}} 余波。1054 年东西方互相绝罚，1204 年第四次十字军攻陷君士坦丁堡，裂痕加深；直至今日，{{东方正统教会}} 仍以此词为根本分歧之一。参见 {{东西方教会大分裂}}、{{东方正统教会}}。","see":["东西方教会大分裂","东方正统教会","尼西亚信经"],"ch":["ch-7"]},"阿里乌":{"en":"Arius, Ἄρειος","def":"约 256–336 年，亚历山大城长老。主张：神是唯一、无始、不可分的；子是「被生」的，故有起点；所以子在本质上是受造的，「曾有一时子不存在」；但子是被造物中最高的，在被造之先被生，可被称为「神」（次等意义）。**为什么他不是一个愚蠢的反派**：他的方案同时保住了严格一神论、神的绝对超越性、以及子的中介功能——这在当时的哲学氛围里非常自然（见 {{新柏拉图主义}} 的等级结构）。**他的对手为什么不能接受**：若子是可变的受造物，那么救恩就来自一个受造物；而早期基督徒已经在向耶稣祷告了（小普林尼 112 年的证词），这已经是既成事实的实践。参见 {{阿里乌主义}}、{{本体同一}}、{{尼西亚信经}}。","see":["阿里乌主义","本体同一","尼西亚信经","亚他那修"],"ch":["ch-4"]},"阿里乌主义":{"en":"Arianism","def":"以 {{阿里乌}} 命名的教义家族，涵盖从激进到温和的整个谱系：{{阿诺莫派}}（本体相异，子与父完全不同）、{{半阿里乌派}}（本体相似）、以及主张子「相似于父的意愿」的政治折中派（*homoiō*）。**流传之广常被严重低估**：4 世纪中期，帝国多数主教一度属于阿里乌阵营；日耳曼诸族（{{哥特人}}、汪达尔人、勃艮第人、伦巴第人）多先接受阿里乌信仰，因此西罗马灭亡后的「蛮族王国」常与本地尼西亚派罗马人形成长期宗教隔离。**它今天还在**：耶和华见证人的基督论（子是被造的最高存在、不是全能神）在结构上与阿里乌极为接近；一位论派亦然。参见 {{阿里乌}}、{{半阿里乌派}}、{{阿诺莫派}}。","see":["阿里乌","半阿里乌派","阿诺莫派","哥特人"],"ch":["ch-4"]},"诺斯替派":{"en":"Gnosticism, γνωστικισμός","def":"来自希腊文 *gnōsis*（知识）。2–4 世纪地中海世界的一族宗教运动，不是单一派别。核心结构：至高善神是纯光；物质世界由一位较低级的「造物主」（*Demiurge*）所造，是困住灵魂的牢笼；灵魂来自光明世界却遗忘了来处；只有获得秘密「知识」才能脱身。基督教诺斯替派（华伦提努、塞特派、巴西里德）读同一部圣经、自称基督徒，但普遍否认 {{道成肉身}}（走 {{幻影说}} 路线）。1945 年拿戈玛第出土的 13 册科普特抄本（约 50 篇文献，含《多马福音》《真理福音》《约翰密传》）让我们第一次能听它自己说话。**为什么它对教会如此致命**：它不攻击基督教，而是提供一个更「灵性」、更精英的版本，从内部掏空十字架与肉身的实在性。参见 {{幻影说}}、{{马吉安}}、{{逻各斯}}。","see":["幻影说","马吉安","逻各斯","道成肉身"],"ch":["ch-2"]},"马吉安":{"en":"Marcion of Sinope, Μαρκίων","def":"约 85–160 年，来自小亚细亚锡诺普的富商，约 140 年到罗马。主张旧约的神是公义而严厉的审判者，新约的神是陌生而慈爱的善神，二者不是同一位；耶稣启示的是那位更高的善神，而非旧约神的弥赛亚。他因此编了一部「圣经」：只收删节版《路加福音》与十封保罗书信，完全抛弃旧约。144 年被逐出罗马教会。**他的历史作用极其反讽**：正因为马吉安编了一部自己的正典，教会才被迫明确「我们承认的圣经是哪几本」，从而催生了新约正典的意识。参见 {{诺斯替派}}、{{正统}}。","see":["诺斯替派","正统","异端"],"ch":["ch-2"]},"幻影说":{"en":"Docetism, δοκητισμός","def":"来自希腊文 *dokein*（「看起来」）。主张基督只是**看起来**有肉身、看起来受苦、看起来死了；他真正的本体是纯灵，未曾真正接触物质。**它为什么会出现**：不是出于恶意，而是出于两个敬虔的直觉——（1）神性不能受苦（神是不变的、无痛的）；（2）物质若是低级的甚至恶的，神不可能真的成为肉身。**为什么教会必须拒绝它**：若基督没有真肉身，则（a）十字架不是真牺牲，救赎落空；（b）肉身复活失去意义；（c）殉道者用自己的肉身作见证就变成愚蠢。约翰书信里「凡灵不认耶稣是成了肉身来的，就不是出于神」（约壹 4:2–3）通常被认为正是针对此说。参见 {{诺斯替派}}、{{道成肉身}}。","see":["诺斯替派","道成肉身","一性论"],"ch":["ch-2"]},"嗣子论":{"en":"Adoptionism","def":"主张耶稣本来是一个人（可能是极圣洁的人），在受洗（或复活、或受孕）时被神「收纳为子」（*adoptio*），得到圣灵与神子的名分。它不是否认耶稣的特殊性，而是否认他**在本体上**永恒地是神。**为什么它一再复活**：它保住了严格一神论，也保住了耶稣真实的人性与真实的顺服。2 世纪的 {{伊便尼派}}、3 世纪撒摩萨塔的保罗（{{动态君主论}}）、8 世纪西班牙的「收养说」、以及近代的 {{一位论派}}，结构上都属于这一族。正统的反驳：若耶稣只是被收养的人，那么拯救来自一个受造物，而不是神自己降临。参见 {{动态君主论}}、{{阿里乌主义}}。","see":["动态君主论","阿里乌主义","神格唯一"],"ch":["ch-1","ch-4"]},"动态君主论":{"en":"Dynamic Monarchianism","def":"{{神格唯一}} 的一种。主张神只有一位，而耶稣是一个被神的能力（*dynamis*）或 {{逻各斯}} 充满的人；逻各斯不是永恒的位格，而是神的一种能力，在耶稣身上达到顶点。代表：3 世纪安提阿主教**撒摩萨塔的保罗**（Paul of Samosata），268 年被安提阿会议谴责。与 {{形态论}} 相对：形态论把父子说成同一个神的不同形态（过度强调「一」），动态君主论则把子降为被神充满的人（保住「一」而牺牲「三」）。参见 {{嗣子论}}、{{神格唯一}}。","see":["神格唯一","嗣子论","逻各斯"],"ch":["ch-2"]},"形态论":{"en":"Modalism / Sabellianism","def":"主张父、子、圣灵不是三个永恒的位格，而是同一位神在历史中先后采取的三种「形态」「面具」或「工作方式」。**为什么它很有吸引力**：它最彻底地保卫了一神论，且能解释圣经里父与子的区别只是「显现方式」不同。**为什么被判定越界**：若父子只是同一神的不同阶段，那么（a）十字架上死的是父自己（「圣父受难说」*patripassianism*），（b）耶稣祷告时是在向自己祷告（约 17 章变成荒诞剧），（c）父子之间的爱变成自爱。正统的第三条路是「一个本质、三个永恒有别的位格」。参见 {{撒伯里乌主义}}、{{三神论}}、{{位格}}。","see":["撒伯里乌主义","三神论","位格"],"ch":["ch-2","ch-4"]},"撒伯里乌主义":{"en":"Sabellianism","def":"3 世纪由撒伯里乌（Sabellius）得名的 {{形态论}} 版本，也因一位早期支持者而被称为「普拉克西亚斯派」。它把父、子、圣灵比作同一个人的三种角色，或太阳的三种表现（光、热、圆盘）。**它为什么重要**：它是尼西亚信经中「三个位格」一词的直接对手。325 年之后，反对 {{本体同一}} 的人最常用的武器就是指控它「其实是撒伯里乌主义」——因为若父子本质完全相同，区别何在？这个指控逼出了 {{加帕多家教父}} 的整套「关系性位格」理论。参见 {{形态论}}、{{本体同一}}、{{位格}}。","see":["形态论","本体同一","位格","加帕多家教父"],"ch":["ch-2","ch-4"]},"三神论":{"en":"Tritheism","def":"主张父、子、圣灵是三个神（或三个神性存在者）。**它在历史上很少被人明确主张**，绝大多数是**被指控**的：任何强调三个位格之区别的说法，都可能被对手指为三神论。**为什么这个指控如此有力**：因为「一个本质 + 三个位格」在希腊哲学的语法里几乎自动滑向「一个普遍 + 三个个体」，而「三个个体的人性」就是三个人。教父的回应是：在神里没有「类」与「个体」的区分，位格不是分割本质，而是同一本质的三种「存在方式」（*tropoi hyparxeōs*）。参见 {{形态论}}、{{本质}}、{{位格}}。","see":["形态论","本质","位格"],"ch":["ch-4"]},"神格唯一":{"en":"Monarchianism","def":"来自希腊文 *monarchia*（「单一本源/单一统治」）。2–3 世纪一类强调「神只有一个本源」的运动，目的是保卫一神论、反对把父子说成两个神。它分两支：（1）{{动态君主论}}——耶稣是被神充满的人；（2）{{形态论}}——父子是同一神的不同形态。**两支都被判为异端**，但它们的动机是正统的：怕的是 {{三神论}}。这个例子最能说明教义史的一个规律：**异端往往不是「不信」，而是「过度保卫某一条真理」。** 参见 {{动态君主论}}、{{形态论}}。","see":["动态君主论","形态论","三神论"],"ch":["ch-2"]},"诺洼天":{"en":"Novatian, Novatianus","def":"约 200–258 年，罗马的神父（可能生于弗里吉亚），早期拉丁神学家，著有《论三位一体》。250 年德西乌斯迫害后，他反对罗马主教哥尼流允许「弃教者」（*lapsi*，在迫害中交出圣经或献祭的人）经补赎后回归，主张教会不能赦免背教之罪。251 年被对立祝圣为罗马主教，形成 {{诺洼天派}}（Novatianists），在东西方延续数世纪。**他的立场为何严肃**：他担心的是教会变成「没有门槛的俱乐部」，把殉道者的血与背教者的妥协放在同一水平。**反对者的反驳**：教会若只容纳圣人，那它就不再是医院；而且「谁配」的判定权本身会变成新的暴政。参见 {{多纳图派}}、{{绝罚}}。","see":["多纳图派","绝罚","殉道者"],"ch":["ch-2"]},"多纳图派":{"en":"Donatism","def":"4 世纪北非（迦太基为中心）的教会分裂运动，得名于 312 年被祝圣为迦太基主教的**多纳图**（Donatus）。核心主张：**圣礼的有效性取决于施行者的圣洁**。在 303–311 年大迫害中「交出圣经者」（*traditores*）所施的洗礼与按立无效，由他们按立的主教也无效，因此与他们共融的教会不是真教会。**为什么它在北非如此顽强**：它是本土柏柏尔人对抗罗马化精英的社会运动，也是「教会必须是圣洁的余种」这一古老直觉的爆发。奥古斯丁花了十几年反驳它，形成「圣礼的有效性来自基督，不来自施行者」的立场，并提出「强迫他们进来」（*compelle intrare*，路 14:23）——这句话后来成为宗教强制的经典依据，也是奥古斯丁遗产中最受争议的一点。参见 {{诺洼天}}、{{圣礼}}。","see":["诺洼天","绝罚","殉道者"],"ch":["ch-2","ch-6"]},"逻各斯":{"en":"Logos, λόγος","def":"希腊文，基本义为「言说」「理性」「比例」「计算」。在希腊哲学（尤其斯多亚）中指贯穿宇宙的理性原则；在犹太传统中指神的话语/智慧（*memra*、*ḥokhmah*）；在《约翰福音》开篇被用来指基督：「太初有道（*logos*），道与神同在，道就是神。」**为什么这个词如此关键**：它是基督教与希腊哲学之间最大的那座桥，也是最大的那道裂缝。一旦「道」＝宇宙理性，问题就来了：它是神本身，还是神的一个工具或中介？它是永恒的，还是在某个时刻被「生」出来的？{{阿里乌}} 正是在这个缝里下刀，而 {{亚他那修}} 必须证明「道」不是中介物而是神自己。参见 {{阿里乌主义}}、{{种子理性}}、{{道成肉身}}。","see":["阿里乌主义","种子理性","道成肉身","查士丁"],"ch":["ch-3","ch-4"]},"道成肉身":{"en":"Incarnation, incarnatio, σάρκωσις","def":"拉丁文 *in carne*（「在肉身中」）。核心主张：神永恒的儿子真实地成为了一个人——不是穿上人形，不是附在人身上，而是取了完整的人性（身体与理性灵魂），成为拿撒勒人耶稣；他既是完全的神，又是完全的人，在一个位格里。**为什么这是整个基督教最容易被攻击的一条**：犹太教与伊斯兰教认为这是把受造物当神（{{偶像崇拜}}）；希腊哲学认为神性不能变化、不能受苦、不能与物质混合；诺斯替派认为物质是坏的。**为什么教会宁可承受这些攻击也不放弃**：因为整个救恩论挂在上面——「未被取用的，就未被医治」（*quod non est assumptum, non est sanatum*）。参见 {{位格}}、{{一性论}}、{{聂斯脱里派}}。","see":["位格","一性论","聂斯脱里派","幻影说"],"ch":["ch-3","ch-5"]},"救赎":{"en":"Atonement, redemption, σωτηρία","def":"基督教对「人如何得救」的整体说明，但它**不是一个统一的教义，而是好几套互相竞争的理论**，这一点常被忽略：（1）**赎价说**（教父时期流行）：基督的死是付给魔鬼的赎金（对「付给谁」有争议，格列高利一世说是付给神）；（2）**经典说/克胜说**（Aulén 称之为 *Christus Victor*）：基督的死与复活击败了死亡与魔鬼的权势；（3）**满足说**（安瑟伦，11 世纪）：人亏欠了神的荣耀，必须偿付；基督以无限的功德代偿；（4）**刑罚代替说**（宗教改革，特别是加尔文）：基督代替罪人承受神对罪的刑罚；（5）**道德影响说**（阿伯拉尔）：十字架显示神的爱，从而改变人心。**为什么这个分歧至今仍在杀人**：第 10 章会看到，宗教改革的核心争吵之一就是「称义」与「赎罪」怎么理解；而当代的「暴力替罚」批评（如 Steve Chalke）在福音派内部引发了剧烈冲突。参见 {{称义}}、{{恩典}}。","see":["称义","恩典"],"ch":["ch-3","ch-11"]},"一性论":{"en":"Monophysitism","def":"希腊文 *monos*（一）+ *physis*（本性）。主张基督在道成肉身之后**只有一个本性**，即神性「吞没」或融合了人性（欧迪奇 Eutyches 的版本），或「神人二性合成为第三种本性」（部分东方教会的表述）。451 年 {{迦克墩}} 会议判定「一个位格、两个本性，不相混淆、不改变、不分割、不分离」。**为什么它不是一个「明显错误」**：一性论者担心的是——若说两个本性，岂不是两个人？岂不把基督分裂了？他们的口号是「一个成了肉身的道」。**历史后果极其沉重**：埃及、叙利亚、亚美尼亚、埃塞俄比亚的教会拒绝迦克墩，形成 {{东方正统教会}}，至今与东正教、天主教未完全合一。参见 {{迦克墩}}、{{聂斯脱里派}}、{{东方正统教会}}。","see":["迦克墩","聂斯脱里派","东方正统教会"],"ch":["ch-5"]},"聂斯脱里派":{"en":"Nestorianism","def":"得名于 428–431 年君士坦丁堡主教**聂斯脱里**（Nestorius）。他被指控主张基督有**两个位格**（或至少两个 *prosōpon*，即两个「脸/角色」），因此马利亚不应被称为「生神者」（*Theotokos*），只能称「生基督者」（*Christotokos*）。431 年以弗所会议谴责并罢免他。**关键的历史修正**：20 世纪发现的《赫拉克利德斯的市场》（聂斯脱里自辩书）显示，他的实际立场比对手描述的更接近正统——他反对的是把神性说成「由马利亚生出」，而不是否认位格合一。**后果**：他的追随者东迁波斯，形成「东方教会」（即今天常说的「亚述教会」），是古代最成功的传教教会之一，唐代传入中国的「景教」即其一支。参见 {{迦克墩}}、{{一性论}}、{{东方正统教会}}。","see":["迦克墩","一性论","东方正统教会"],"ch":["ch-5"]},"东方正统教会":{"en":"Oriental Orthodox Churches","def":"指拒绝 451 年 {{迦克墩}} 会议的东方教会群体，包括**科普特正教会**（埃及）、**叙利亚正教会**（安提阿）、**亚美尼亚使徒教会**、**埃塞俄比亚正教会**、**厄立特里亚正教会**、以及印度的**马兰卡拉教会**。它们自称「一性论」（miaphysite，更准确的表述是「道成肉身后的一个本性，神人二性不相混淆地合一」），否认自己是欧迪奇的极端一性论。**为什么这个区分重要**：它们是世界上最早、最古老的基督教群体之一，比天主教与东正教的分离早六百年；它们的礼仪、语言（科普特文、叙利亚文、亚美尼亚文）、灵修传统完全独立。20 世纪以来，它们与东正教、天主教签署了多份基督论共识声明，承认双方的分歧主要是**术语**而非**信仰**——但正式合一尚未实现。参见 {{一性论}}、{{迦克墩}}、{{东西方教会大分裂}}。","see":["一性论","迦克墩","东西方教会大分裂"],"ch":["ch-5","ch-8"]},"亚他那修":{"en":"Athanasius of Alexandria, Ἀθανάσιος","def":"约 296–373 年，亚历山大主教（328 年起），尼西亚派最顽强的领袖。在 325 年之后的半个世纪里，他**五次被流放**，累计十七年，几乎凭一己之力把「{{本体同一}}」这个词保了下来——所以有「*Athanasius contra mundum*」（亚他那修对抗全世界）之说。主要著作：《驳异端》（*Contra Gentes*）、《论道成肉身》（*De Incarnatione*）、《驳阿里乌派》（*Orationes contra Arianos*）、《圣安东尼传》（把修道运动引入主流）。**他的核心论证不是哲学，而是救恩论**：若基督不是真神，则我们没有被神自己拯救；若基督不是真人，则人性没有被医治。参见 {{阿里乌}}、{{本体同一}}、{{尼西亚信经}}。","see":["阿里乌","本体同一","尼西亚信经","加帕多家教父"],"ch":["ch-4"]},"加帕多家教父":{"en":"the Cappadocian Fathers","def":"指 4 世纪小亚细亚加帕多家地区的三位主教，他们完成了三位一体教义的最终语法：**巴西流**（Basil of Caesarea，约 330–379，著《论圣灵》）、**拿先斯的格列高利**（Gregory of Nazianzus，约 329–390，五篇《神学演讲》）、**尼撒的格列高利**（Gregory of Nyssa，约 335–395，著《驳欧诺米》《论人的造成》）。**他们的关键贡献**：把 *ousia*（本质）与 {{位格|hypostasis}} 明确区分——本质是共同的神性，位格是「存在的方式」（*tropos hyparxeōs*），并以「非受生／受生／发出」这三个**关系**来唯一地标识三个位格。这一步把「一本质三位格」从一句自相矛盾的话，变成了一句有严格语法的命题。参见 {{位格}}、{{本质}}、{{本体同一}}。","see":["位格","本质","本体同一","尼西亚信经"],"ch":["ch-4"]},"半阿里乌派":{"en":"Semi-Arians / Homoiousians","def":"4 世纪中期主张子与父「**本质相似**」（{{本体相似}}，*homoiousios*）的阵营，与「本体同一」只差一个字母 iota。代表人物包括巴西尔·安西拉、老底嘉的乔治。**他们不是骑墙派**：他们的神学理由是，若父子本质完全相同，则父子之别会被抹掉，落入 {{撒伯里乌主义}}；而圣经说子「是父的像」（西 1:15），所以「相似」更忠实。**他们最终为什么消失**：{{亚他那修}} 与 {{加帕多家教父}} 论证「相似」是一个不稳定的中间站（相似到什么程度？），加上 362 年亚历山大会与 381 年君士坦丁堡会议的教义与政治压力，多数人最终接受了「同一本质」。参见 {{本体相似}}、{{本体同一}}。","see":["本体相似","本体同一","阿里乌主义"],"ch":["ch-4"]},"阿诺莫派":{"en":"Anomoeans / Eunomians","def":"来自希腊文 *anomoios*（「不相似」）。最激进的阿里乌派，领袖为**欧诺米**（Eunomius，约 335–394）与埃提乌斯。主张：神的本性就是「非受生」（*agennēsia*），既然子是被生的，那么子的本性就与父**不相似**，甚至可以说子与父在一切方面都不同。**他们的方法论极其重要**：欧诺米认为神的本质可以被精确概念把握——「非受生」就是神的定义。{{加帕多家教父}} 的巴西流与尼撒的格列高利写专文反驳这一点，提出：神的本质不可被人的概念穷尽，我们只能知道神「不是」什么（否定神学）。**这场辩论的结果，深刻塑造了东方神学的「不可知」气质。** 参见 {{阿里乌主义}}、{{加帕多家教父}}。","see":["阿里乌主义","加帕多家教父","半阿里乌派"],"ch":["ch-4"]},"次位论":{"en":"Subordinationism","def":"主张子在存在或地位上次于父，圣灵又次于子。**它本身是一个光谱**：（1）**本体上的次位**（子是被造的，本质低于父）——这是 {{阿里乌主义}}，被判异端；（2）**功能/次序上的次位**（子在经世中顺服父，但本质同一）——这在尼西亚之后的东方神学中被广泛接受，甚至被视为正统（「次序」*taxis* 不等于「等级」）。**麻烦在于**：这两者之间的界线极难划清，而且圣经里有大量看似支持次位的经文（「父比我大」约 14:28；「子也不知道那日子」可 13:32）。尼西亚后的争论花了七十年才把这条界线画出来。**今天仍有人指控正统本身是次位论**（如某些一位论派与伊斯兰护教者的论证）。参见 {{阿里乌主义}}、{{本体同一}}。","see":["阿里乌主义","本体同一","形态论"],"ch":["ch-4"]},"预表":{"en":"typology","def":"一种解经方法：把旧约的人物、事件、制度读作新约的「预像」（希腊文 *typos*，印痕、模型）。例如亚当是基督的「预表」（罗 5:14），旷野的铜蛇预表十字架（约 3:14），约拿三日三夜在鱼腹预表复活（太 12:40），逾越节羔羊预表基督。**它为什么极其重要又极其危险**：重要，因为它是早期教会读旧约的主要方式，也是新约作者自己的解经法；危险，因为**它没有可证伪的标准**——任何一个人都可以把任何一段经文读成自己的预表。这正是犹太教反驳基督教的核心方法论点（见 3.8.5）。**现代学术的区分**：预表（typology，基于历史模式的类比）与寓意（allegory，基于文字符号的隐义）不同；前者至少要求两个事件都是历史性的。参见 {{寓意解经}}、{{弥赛亚}}。","see":["寓意解经","弥赛亚"],"ch":["ch-3"]},"寓意解经":{"en":"allegorical interpretation, ἀλληγορία","def":"不按字面、而按「字面之下的意义」解读经文的方法。它并非基督教的发明：希腊人早就用寓意法把荷马神话解释成自然哲学；犹太哲学家**斐洛**（Philo of Alexandria，约前 20–公元 50）把它系统用于摩西五经。基督教方面，{{奥利金}} 建立了三层解经（字面/道德/属灵），亚历山大学派以寓意解经著称，安提阿学派（摩普绥提亚的狄奥多若、金口约翰）则强调字面—历史义，两派的张力贯穿整个古代教会。**为什么它不可避免**：旧约里神会「后悔」、会命令屠城、会有令人尴尬的性描写，字面阅读在希腊化世界里极难辩护。**为什么它危险**：一旦字面可以被任意越过，「经文说了什么」就变成「解经者想让它说什么」，权力于是完全落在解经者手上。宗教改革的「唯独圣经」在很大程度上是对寓意解经泛滥的反动。参见 {{预表}}、{{奥利金}}。","see":["预表","奥利金","亚历山大的克雷芒"],"ch":["ch-3"]},"奥利金":{"en":"Origen of Alexandria, Ὠριγένης","def":"约 185–254 年，古代最多产、最有影响力的基督教学者（耶柔米说他有约 2000 部作品）。主持亚历山大教理学校，后迁凯撒利亚。贡献：《六经合璧》（*Hexapla*，把希伯来原文与四种希腊译本并列，最早的圣经校勘工程）、《论首要原理》（第一部系统神学）、《驳塞尔苏斯》（保存了对手原文）。**他的思想后来被谴责**：灵魂先存、万物最终复原（*apokatastasis*）、子次于父（{{次位论}}）。543 年与 553 年的会议谴责「奥利金主义」，但他对东方神学的影响无法抹去。**他是「学术型基督徒」的原型**：既接受圣经权威，又使用一切可用的学术工具，因此永远被两头怀疑——基要派怀疑他不信，世俗学者怀疑他护教。参见 {{寓意解经}}、{{次位论}}。","see":["寓意解经","次位论","亚历山大的克雷芒"],"ch":["ch-3"]},"亚历山大的克雷芒":{"en":"Clement of Alexandria, Κλήμης","def":"约 150–215 年，亚历山大教理学校的早期领袖，奥利金的前辈。主张哲学是神给希腊人的「预备福音」，如同律法是给犹太人的（《劝勉希腊人》《杂记》*Stromateis*）。他的名言式立场是：**信仰是知识的起点，不是它的替代品**；真正的「诺斯」（gnosis）是信仰的成熟形态。**他与特土良形成鲜明对照**：同代人，一个说哲学是盟友，一个说哲学是异端的母亲。这两条路线在整部教会史上轮流占上风。参见 {{奥利金}}、{{特土良}}、{{查士丁}}。","see":["奥利金","特土良","查士丁"],"ch":["ch-3"]},"查士丁":{"en":"Justin Martyr, Ἰουστῖνος","def":"约 100–165 年，生于撒玛利亚的异教家庭，游历各哲学学派后皈依基督教，在罗马办学，165 年前后殉道。主要著作：《第一护教辞》《第二护教辞》《与特来弗对话》（与一位犹太拉比的辩论记录，是古代最重要的犹太—基督教对话文献）。**他的核心思想**：基督就是 {{逻各斯}}，而逻各斯是宇宙的理性，因此凡按理性生活的人（苏格拉底、赫拉克利特）都「分有了基督」，希腊哲学是神给外邦人的「种子」（{{种子理性}}）。**这个方案的历史意义**：它为基督教进入希腊化世界提供了正当性；代价是把福音变成「哲学的完成」，于是哲学的批评也变成对福音的批评。参见 {{逻各斯}}、{{种子理性}}、{{亚历山大的克雷芒}}。","see":["逻各斯","种子理性","亚历山大的克雷芒"],"ch":["ch-3"]},"特土良":{"en":"Tertullian, Quintus Septimius Florens","def":"约 160–220 年，迦太基人，第一位用拉丁文大量写作的基督教神学家，被称「拉丁神学之父」。**他创造了后世正统的核心词汇**：*Trinitas*（{{三位一体}}）、*persona*（{{位格}}）、*substantia*（{{本质}}）、*sacramentum*（{{圣礼}}），以及「新旧约」的拉丁表述。**同时他也是最激烈的反哲学者**：「雅典与耶路撒冷有什么相干？」晚年倾向 {{孟他努派}}，因此从未被封圣。**他的悖论**：反对雅典的人，为拉丁西方提供了整套雅典语法。参见 {{三位一体}}、{{位格}}、{{本质}}。","see":["三位一体","位格","本质","孟他努派"],"ch":["ch-2","ch-3"]},"孟他努派":{"en":"Montanism / the New Prophecy","def":"2 世纪后半叶兴起于小亚细亚弗里吉亚，由孟他努（Montanus）与两位女先知（Prisca、Maximilla）发起，自称「新预言」（*Nova Prophetia*）。主张：圣灵仍在透过先知直接说话，末日临近，教会应严格禁食、禁欲、乐于殉道。**为什么被主流判为异端**：不是因为它的道德要求太高，而是因为它的**权威结构**——如果圣灵还在随口说话，那么主教会议的裁定、主教制的管理就失去了最终性。**这是「持续启示 vs 封闭正典」之争的原型**，此后反复出现：从孟他努派到约阿希姆、从再洗礼派到五旬节运动、从摩门教的「持续启示」到各种「新先知」团体。参见 {{特土良}}、{{正典}}。","see":["特土良","正典"],"ch":["ch-2"]},"偶像崇拜":{"en":"idolatry, εἰδωλολατρία","def":"字面是「崇拜偶像（*eidōlon*，影像）」。但圣经的禁令（出 20:4；申 5:8）核心不只是「不要拜雕像」，而是**不要把受造物放在创造者的位置上**——包括金钱（「贪婪就与拜偶像一样」西 3:5）、权力、国家、自我。**为什么这一条是基督教与犹太教、伊斯兰教争论的焦点**：在犹太教与伊斯兰教看来，说一个人（耶稣）是神、并向一个人祷告，正是偶像崇拜的定义；而基督教的辩护是：这不是把受造物当神，而是神自己取了受造的形式（{{道成肉身}}），因此不是人上升为神，而是神下降为人。**这个分歧无法靠定义解决**，因为它取决于你如何认定耶稣的身份——而那正是整个教义史在争论的东西。参见 {{道成肉身}}、{{一神论}}。","see":["道成肉身","一神论"],"ch":["ch-3","ch-18"]},"一神论":{"en":"monotheism","def":"相信只有一个神。**这个词本身是 17 世纪才造出来的**（Henry More, 1660），古代并没有这个术语——因为古代几乎所有文化都预设某种神圣秩序，争论的不是「有几个神」，而是「哪个神有权柄」「其他被称为神的是什么」。基督教的困难在于：它继承了犹太教最严格的{{一神论}}（《示马》申 6:4），同时又在向耶稣祷告。三位一体教义正是这两件事的「强制和解」，而犹太教与伊斯兰教都认为这个和解失败了。参见 {{三位一体}}、{{偶像崇拜}}。","see":["三位一体","偶像崇拜","弥赛亚"],"ch":["ch-3"]},"弥赛亚":{"en":"Messiah, מָשִׁיחַ / Christos, Χριστός","def":"希伯来文 *mashiaḥ*，意为「受膏者」（用油膏立的人：君王、祭司、先知）。希腊文译作 *Christos*，中文音译「基督」——所以「耶稣基督」不是名＋姓，而是「耶稣，那位受膏者」。**关键误解**：这个词在旧约里绝大多数时候指**当时的君王**（如扫罗、大卫、居鲁士），并不是一个专有头衔；「末世将有一位大卫子孙来作王」的期待，是在第二圣殿时期（尤其死海古卷、以诺一书、以斯拉四书）才发展成熟的。**犹太教与基督教的分歧正落在这里**：犹太教按可观测的标准验收（圣殿重建、流亡者归回、普世和平、死人复活），基督教则引入「两次降临」来解释第一次的失败。参见 {{预表}}、{{末世论}}。","see":["预表","末世论","一神论"],"ch":["ch-3","ch-18"]},"末世论":{"en":"eschatology, ἐσχατολογία","def":"关于「末后的事」（*eschata*）的教义：基督再来、死人复活、最后审判、新天新地、地狱与天堂。**为什么它是分裂的最大引擎之一**：因为它直接决定「现在该怎么活」——若末日将至，就该禁欲、殉道、放弃财产（孟他努派、早期修道运动）；若末日遥远，就该建设制度、积累财产（君士坦丁之后的教会）。历史上几乎每一次大规模教派爆发，都伴随一个末世论时间表。**三种基本模型**：千禧年前论（基督在千禧年前再来）、千禧年后论（福音先改造世界，然后基督来）、无千禧年论（千禧是象征，指教会时代）。这三者在 19–20 世纪制造了大量新宗派。参见 {{弥赛亚}}、{{千禧年}}。","see":["弥赛亚","千禧年"],"ch":["ch-3","ch-16"]},"哥特人":{"en":"the Goths","def":"日耳曼民族集团，3 世纪起多次侵扰罗马边疆，410 年阿拉里克攻陷罗马，5 世纪在高卢、西班牙、意大利建立王国。**他们在基督教史上的特殊地位**：多数哥特人在 4 世纪由乌尔菲拉（Ulfilas，约 311–383）传入的是**阿里乌派**基督教，乌尔菲拉还为他们发明了哥特字母并翻译圣经（《银色抄本》*Codex Argenteus* 是其主要残卷）。因此西罗马灭亡后的「蛮族王国」中，统治者（阿里乌派）与被统治的罗马人（尼西亚派）长期分属两个教会，互不共融——这是「教义分裂」直接转化为「族群政治」的最典型案例。参见 {{阿里乌主义}}。","see":["阿里乌主义"],"ch":["ch-4"]},"尼西亚会议":{"en":"Council of Nicaea I, 325","def":"325 年由皇帝**君士坦丁**在小亚细亚尼西亚城召集的第一次大公会议，传统上称有 318 位主教参加（现代估计约 250–300 位）。议题：阿里乌争议、复活节日期、教会分裂（{{诺洼天派}}）、以及二十条教规。成果：《尼西亚信经》初版，其中关键句是「受生而非被造，与父{{本体同一}}」。**必须注意的两件事**：（1）**这是皇帝召集的会议**——基督教从此进入「教义由帝国会议裁定」的时代；（2）**会议没有结束争论**，反而开启了六十年更激烈的混战，因为「本体同一」这个词当时没有被定义。381 年的君士坦丁堡会议才补上关于圣灵的条款，形成今天通行的《尼西亚—君士坦丁堡信经》。参见 {{尼西亚信经}}、{{本体同一}}、{{大公会议}}。","see":["尼西亚信经","本体同一","大公会议"],"ch":["ch-4"]},"迦克墩":{"en":"Council of Chalcedon, 451","def":"第四次大公会议，451 年在君士坦丁堡对岸的迦克墩召开，约 500 位主教参加（规模最大的一次古代会议）。成果是《迦克墩定义》：基督是「一个位格、两个本性」，二者「**不相混淆、不改变、不分割、不分离**」（*asynchytōs, atreptōs, adiairetōs, achōristōs*）地联合在一个位格（*hypostasis*）里。**这四个副词是整部基督论史的结晶**：前两个防 {{一性论}}（不混淆、不改变），后两个防 {{聂斯脱里派}}（不分割、不分离）。**历史后果**：埃及、叙利亚、亚美尼亚、埃塞俄比亚的教会拒绝接受，形成 {{东方正统教会}}，这是基督教史上按人口计算最严重的一次永久分裂（比 1054 年更早、更彻底）。参见 {{一性论}}、{{聂斯脱里派}}、{{东方正统教会}}。","see":["一性论","聂斯脱里派","东方正统教会"],"ch":["ch-5"]},"东西方教会大分裂":{"en":"East–West Schism, 1054","def":"1054 年，罗马教宗使节**宏伯特**（Humbert of Silva Candida）在君士坦丁堡的圣索菲亚大教堂祭坛上放下绝罚书，绝罚君士坦丁堡牧首**色路拉里乌斯**；牧首随即反绝罚。**但这不是一天造成的**：真正的原因是一整套累积的差异——（1）{{和子句}}（西方在信经中加入「和儿子」，东方认为这是单方面篡改普世信经）；（2）教宗的首席权（东方接受「荣誉上的首席」，不接受「普世管辖权」）；（3）礼仪差异（无酵饼 vs 有酵饼、拉丁文 vs 希腊文）；（4）政治与文化（查理曼帝国 vs 拜占庭）。**1204 年第四次十字军攻陷并洗劫君士坦丁堡**，使裂痕从教义变成血仇，是东方记忆中最深的一道伤。1965 年，教宗保罗六世与牧首 Athenagoras 互相撤销 1054 年的绝罚，但合一仍未实现。参见 {{和子句}}、{{东方正统教会}}。","see":["和子句","东方正统教会","教宗首席权"],"ch":["ch-7"]},"教宗首席权":{"en":"papal primacy","def":"天主教关于罗马主教（教宗）在普世教会中拥有最高、完整、直接的管辖权的教义。**它的圣经依据**主要是马太福音 16:18（「你是彼得，我要把我的教会建造在这磐石上」）与约翰福音 21:15–17（「喂养我的羊」）。**东正教的立场**：承认罗马主教在「荣誉上」居首（*primus inter pares*，同侪之首），但不承认他有超越其他主教的管辖权——教会是「各地方教会共融」，不是「一个君主国」。**新教的立场**：多数否认教宗首席权的神学依据，视之为历史产物。**为什么这条如此难谈**：它不只是权力问题，而是**教会论**问题——教会本质上是一个「以罗马为头的可见团契」，还是「地方教会的共融」？1870 年第一次梵蒂冈会议进一步定义「教宗不可错误」（*ex cathedra*），使问题更加困难。参见 {{东西方教会大分裂}}、{{大公会议}}。","see":["东西方教会大分裂","大公会议"],"ch":["ch-7"]},"绝罚":{"en":"excommunication, ἀκοινωνησία / anathema","def":"把一个人排除在教会共融与圣礼之外。**它有两层含义，常被混淆**：（1）**医治性的**（*medicinalis*）：像医疗隔离，目的是使罪人悔改后恢复；（2）**定罪性的**（*anathema*，诅咒）：宣告其为异端、交付审判。1054 年的互相绝罚、1521 年对路德的绝罚，都属第二类。**为什么它是一个真正可怕的东西**：在中世纪，绝罚还带来世俗后果（不得立契约、不得受封、死后不得按教礼安葬），因此它同时是宗教与政治武器。参见 {{诅咒}}、{{异端}}、{{多纳图派}}。","see":["诅咒","异端"],"ch":["ch-2"]},"诅咒":{"en":"anathema, ἀνάθεμα","def":"希腊文 *anathema* 原意是「献给（神）的东西」→「献为祭品」→「交付毁灭」。在新约中（加 1:8–9「若有人传别的福音，他就应当被咒诅」；林前 16:22「主必要来……若有人不爱主，这人可诅可咒」）它指把某人交付神的审判。**教会用法**：大公会议对异端的正式判决通常以「*anathema sit*」（当受诅咒）结尾。**需要注意的翻译问题**：中文「诅咒」带有巫术色彩（呼求灾祸降于某人），而 *anathema* 更接近「宣告他与神的救恩无分」——是**司法判决**而非**魔法攻击**。参见 {{绝罚}}、{{异端}}。","see":["绝罚","异端"],"ch":["ch-2"]},"殉道者":{"en":"martyr, μάρτυς","def":"希腊文原意是「见证人」——法律意义上的目击证人。基督教把这个词专门用于**以自己的死为信仰作证的人**。**为什么殉道在早期教会地位极高**：殉道者的血被视为洗礼的替代（血洗 *baptismus sanguinis*），殉道者被相信直接进入天国，其墓成为圣地，其遗物成为崇拜中心（这后来引发圣髑敬礼与圣像争议）。**为什么它是教义史的引擎**：殉道者以肉身见证「道成肉身是真的」——若基督只是幻影，那为幻影去死就是荒谬的。所以{{幻影说}} 在实践上无法与殉道共存。参见 {{幻影说}}、{{多纳图派}}。","see":["幻影说","多纳图派","诺洼天"],"ch":["ch-2"]},"圣礼":{"en":"sacrament, sacramentum / μυστήριον","def":"拉丁文 *sacramentum* 原指士兵的效忠誓言，特土良用它翻译希腊文 *mysterion*（奥秘）。指基督设立、透过可见记号（水、饼、酒、油）传递不可见恩典的礼仪。**数量本身就是一个分裂点**：天主教与东正教为七件（洗礼、坚振/傅油、圣体/圣餐、告解、终傅、圣秩、婚配），多数新教只承认两件（洗礼、圣餐，因它们是基督明确设立的），贵格会甚至不设外在圣礼。**更深的分裂在「有效性」**：圣礼的效力来自施行者的圣洁（{{多纳图派}}），还是来自基督的应许（奥古斯丁），还是来自领受者的信心（宗教改革）？这三个答案对应三种教会论。参见 {{多纳图派}}、{{称义}}。","see":["多纳图派","称义"],"ch":["ch-2","ch-6"]},"称义":{"en":"justification, iustificatio","def":"法庭式用语：神作为审判者，宣告罪人为「义」。**这是宗教改革的核心，也是 16 世纪分裂的导火索**。天主教的立场（特伦托会议）：称义是**内在的更新**——恩典真实地注入人心，使人变得公义（*iustitia inhaerens*）。路德的立场：称义是**外在的宣告**——基督的义「归算」给信徒，信徒在神眼中被算为义，而本身仍是罪人（*simul iustus et peccator*，「同时是义人与罪人」；*iustitia imputata*）。**为什么这不可调和**：它不只是措辞，而是「救恩到底发生在人里面还是人外面」的问题。1999 年天主教与信义宗签署《关于称义教义的联合声明》，宣称双方在此问题上已无根本分歧——但许多保守派两边都不接受这份声明。参见 {{恩典}}、{{救赎}}、{{唯独信心}}。","see":["恩典","救赎","唯独信心"],"ch":["ch-11"]},"恩典":{"en":"grace, gratia / χάρις","def":"神无偿赐予的恩惠，不是人挣得的报酬。**所有基督教派都同意「得救靠恩典」，分歧在「恩典如何作用」**：奥古斯丁—加尔文路线强调恩典的绝对主权（人完全无能，恩典不可抗拒）；半伯拉纠主义与天主教主流强调恩典与人的自由意志合作；伯拉纠主义则认为人靠自己的努力就能守诫命（被判异端）。**这个光谱上的位置，几乎可以预测一个宗派的其他所有立场**：恩典观决定了人论、圣礼观、教会论、甚至政治态度。参见 {{称义}}、{{预定论}}、{{伯拉纠主义}}。","see":["称义","预定论","伯拉纠主义"],"ch":["ch-6","ch-11"]},"预定论":{"en":"predestination, praedestinatio","def":"神在永恒中预定谁得救（以及，在加尔文主义中，谁被遗弃）。**它的逻辑起点不是冷酷，而是恩典的彻底性**：若得救完全靠恩典，而人全然无能（{{全然败坏}}），那么连「接受恩典」的能力也必须由神赐下——否则得救就有一小部分是我的功劳。奥古斯丁在与 {{伯拉纠主义}} 的论战中发展出这一思路；加尔文把它系统化（{{双重预定}}）；阿米念派则坚持预知而非预定。**为什么它让人极度不安**：它似乎让神成为恶的作者，也让传福音失去意义。这个争论从 5 世纪打到 17 世纪（多特会议），今天仍在福音派内部持续。参见 {{恩典}}、{{加尔文主义}}、{{阿米念主义}}。","see":["恩典","加尔文主义","阿米念主义","伯拉纠主义"],"ch":["ch-6","ch-12"]},"伯拉纠主义":{"en":"Pelagianism","def":"得名于不列颠修士**伯拉纠**（Pelagius，约 354–420 后）。主张：人本来就有能力不犯罪（*posse non peccare*），亚当的罪只为人树立了坏榜样，并未遗传给全人类；恩典的作用是帮助人更容易行善，而非使人从无能变为有能力。**为什么它被判定为异端**：奥古斯丁认为它取消了十字架的必要性——如果人自己能行义，基督何必死？418 年迦太基会议与 431 年以弗所会议谴责之。**半伯拉纠主义**（Semi-Pelagianism，马赛派）试图折中：恩典先于人的努力，但人的同意是自由的——529 年奥兰治会议也谴责了它。**这个标签今天常被滥用**：任何强调人的努力、自由意志、修行的立场，都可能被对手骂成「伯拉纠主义」。参见 {{恩典}}、{{预定论}}。","see":["恩典","预定论","奥古斯丁"],"ch":["ch-6"]},"奥古斯丁":{"en":"Augustine of Hippo, Aurelius Augustinus","def":"354–430 年，北非希波主教，西方拉丁神学最重要的奠基人。经历：摩尼教徒（9 年）→ 怀疑派 → 新柏拉图主义 → 386 年皈依（《忏悔录》记述的「拿起来读」）。主要著作：《忏悔录》《上帝之城》《论三位一体》《论自由意志》《驳伯拉纠》《订正录》。**他决定了西方神学的几乎所有后续议题**：原罪与恩典、预定论、正义战争、教会与国家的「两城」、圣礼的有效性、意志与爱。**他的争议遗产**：（1）为 {{多纳图派}} 论战中的「强迫进来」提供了依据；（2）他的 {{双重预定}} 被加尔文推到极致；（3）他的原罪论（性行为传递罪）被东方教会认为过于法律化。参见 {{恩典}}、{{预定论}}、{{伯拉纠主义}}。","see":["恩典","预定论","伯拉纠主义","多纳图派"],"ch":["ch-6"]},"理念论":{"en":"Theory of Forms, εἶδος","def":"柏拉图的核心学说。主张在可见的具体事物之外，存在着永恒不变、非物质的「理念/形式」（*eidos*、*idea*），具体事物只是分有（*methexis*）或模仿它们。最著名的比喻是洞穴寓言：囚徒只看影子，误以为那是真实。**对基督教的影响**：（1）神的超越性——神不在世界之内；（2）灵魂不朽与灵魂/身体二元；（3）「分有」的语言，用于说明受造物与神的关系；（4）寓意解经的哲学基础。**危险**：同一条思路可以推出「物质是低级的」（→ {{诺斯替派}}）、「神不可能接触物质」（→ {{幻影说}}）。参见 {{新柏拉图主义}}、{{寓意解经}}。","see":["新柏拉图主义","寓意解经","流溢"],"ch":["ch-3"]},"新柏拉图主义":{"en":"Neoplatonism","def":"3 世纪由普罗提诺（Plotinus，约 204–270）系统化的柏拉图主义晚期形态，是 3–6 世纪地中海知识界的「默认操作系统」。结构：**太一**（*to Hen*）→ **心智**（*Nous*）→ **灵魂**（*Psychē*），逐级「{{流溢}}」（*proodos*）。越往下越弱、越多、越不完美。**为什么它对基督教既是最强盟友又是最强对手**：它提供了表达「神的超越性」「三位一体式结构」「灵魂上升」的全部语言（奥古斯丁、加帕多家教父、伪狄奥尼修斯都大量使用）；但它的**等级性**（越往下越低）与**必然性**（流溢不是自由选择）直接支持 {{阿里乌主义}}，而它的连续性（从神到物质没有绝对断裂）与「从无创造」冲突。参见 {{流溢}}、{{太一}}、{{理念论}}。","see":["流溢","太一","理念论","阿里乌主义"],"ch":["ch-3"]},"流溢":{"en":"emanation, πρόοδος","def":"新柏拉图主义的核心机制：万物从「{{太一}}」中「溢出」。**关键比喻**：太阳发光不是因为它决定要发光，而是因为它太满了，光自然溢出；离太阳越远越暗。**流溢的三个特征**：（1）**必然**（不是自由选择）；（2）**等级性**（越远越低）；（3）**连续性**（源头与产物之间没有绝对断裂，只是程度递减）。**为什么这三个特征每一条都踩到基督教的雷**：创造是自由的（不是必然）；受造物与神有绝对的质的断裂（不是程度递减）；子不是「较低的神」，而是与非受造的神同一本质。整个 4 世纪的三位一体之争，很大程度就是**「流溢模型」与「创造模型」的对撞**。参见 {{新柏拉图主义}}、{{太一}}、{{阿里乌主义}}。","see":["新柏拉图主义","太一","阿里乌主义"],"ch":["ch-3","ch-4"]},"太一":{"en":"the One, τὸ ἕν","def":"普罗提诺体系的最高原则。它**超越存在本身**——不能说它「是」什么，只能说它「不是」什么。它是绝对单纯、不可分、不可言说的。**为什么这个概念对基督教神学影响巨大**：（1）它提供了「神的不可言说性」的语言，形成**否定神学**（*via negativa*）：我们只能知道神不是什么；（2）它使「神的单纯性」（*simplicitas Dei*，神没有部分、属性与本质同一）成为标准教义；（3）它也给 {{阿诺莫派}} 提供了反面教材——欧诺米认为神可以被「非受生」这个定义完全把握，{{加帕多家教父}} 反驳说：太一是不可穷尽的。参见 {{新柏拉图主义}}、{{流溢}}。","see":["新柏拉图主义","流溢","加帕多家教父"],"ch":["ch-3"]},"自然法":{"en":"natural law, lex naturalis","def":"主张在一切人为立法之上，存在一套由「事物的本性」或「神的创造秩序」所规定的道德法则，人凭理性可以认识它。**源流**：斯多亚的宇宙理性 → 西塞罗 → 罗马法学家 → 阿奎那（《神学大全》I-II 第 90–97 题：永恒法、自然法、人法、神法的四层结构）→ 格劳秀斯 → 现代人权话语。**为什么它重要**：它是基督教与「不信神的人」之间唯一可能共用的道德语言（保罗在罗马书 2:14–15 已经提出「外邦人顺着本性行律法上的事」）。**为什么它受攻击**：新教（尤其巴特）认为它削弱了「唯独圣经」与人的全然败坏；当代的「自然法」争论（如约翰·菲尼斯）则试图用世俗语言重建它。参见 {{逻各斯}}、{{种子理性}}。","see":["逻各斯","种子理性"],"ch":["ch-3"]},"种子理性":{"en":"logos spermatikos, λόγος σπερματικός","def":"斯多亚术语：宇宙的理性（{{逻各斯}}）像种子一样散落在万物与每个人之中，使人分有理性。**{{查士丁}} 用它做了一个惊人的推论**：既然每个人都分有逻各斯的种子，那么凡按理性生活的人（苏格拉底、赫拉克利特、甚至某些异教诗人）都在某种意义上属于基督；希腊哲学是这颗种子的成果，而基督是「整棵树」。**这个方案的双刃**：它让受过教育的希腊人可以带着自己的文化皈依（极大促进了传播）；但它也把「认识神」的途径从「历史启示」扩展到了「人类理性」，为后来的自然神学与自由主义神学埋下伏笔。参见 {{逻各斯}}、{{查士丁}}、{{自然法}}。","see":["逻各斯","查士丁","自然法"],"ch":["ch-3"]},"实体":{"en":"substance / ousia, substantia","def":"哲学核心范畴。**在亚里士多德那里**：*ousia* 指「这一个」具体事物（第一实体，如「苏格拉底」），「人」「动物」是第二实体。**在柏拉图那里**：指共同本质、理念。**在拉丁神学里**：*substantia* 通常译 *ousia*（本质），但早期拉丁作家也用它译 *hypostasis*（位格），造成长期混乱。**这就是 3.6 节那张表的要点**：同一个中文词「实体」，可能在三个完全不同的意义上被使用。读教义史时，遇到「实体」二字，务必先问：这里对应的是 *ousia* 还是 *hypostasis*？参见 {{偶性}}、{{本质}}、{{位格}}。","see":["偶性","本质","位格"],"ch":["ch-3"]},"偶性":{"en":"accident, συμβεβηκός / accidens","def":"亚里士多德范畴：依附于{{实体}}、可以变化而不改变该事物「是什么」的性质（颜色、大小、位置、关系）。**它在教义史上有一个决定性的用途**：**圣餐变体论**（transubstantiation）。1215 年第四次拉特兰会议用「实体转化、偶性留存」来说明：饼与酒的**实体**变为基督的身体与血，而**偶性**（外观、味道、触感）保持不变。**这就是为什么这个看似枯燥的哲学术语，成了宗教改革最激烈的一个战场**：路德拒绝「变体论」而主张「同体论」（*consubstantiation*，基督的身体「在、同、under」饼酒之中），慈运理则主张纯纪念说。参见 {{实体}}、{{圣礼}}。","see":["实体","圣礼","本质"],"ch":["ch-3","ch-10"]},"取代论":{"en":"supersessionism / replacement theology","def":"认为基督教会取代了以色列，成为神真正的选民；犹太民族因拒绝基督而失去其约的地位。**它的经文依据**：加拉太书 6:16「神的以色列民」、希伯来书（新约取代旧约的祭司与献祭）、马太福音 21:43（「神的国必从你们夺去」）。**它的历史后果极其沉重**：为基督教反犹主义提供了神学正当性，从教父的「杀害神者」（*deicide*）指控，到中世纪的强迫改宗与驱逐，直至 20 世纪的大屠杀。**二战后的转折**：1965 年《Nostra Aetate》否定了「犹太人被神弃绝」的说法；当代主流神学（无论天主教、新教）大多已放弃强版本的取代论，转而讨论「神与以色列的约仍然有效」与「教会与以色列的关系」的不同模型。参见 {{弥赛亚}}、{{预表}}。","see":["弥赛亚","预表"],"ch":["ch-3","ch-18"]},"使徒统绪":{"en":"apostolic succession","def":"主张主教的神圣职分从使徒一代代按手传递下来，因此主教团是使徒的合法继承者，其教导与圣礼具有权威。**爱任纽**（约 180 年）最早系统使用它来对抗 {{诺斯替派}}：诺斯替派声称有「秘密口传」，爱任纽则列出罗马主教的 succession list 说——真正的传统在公开的主教链条里。**为什么它是一个持续的分裂点**：（1）天主教与东正教认为它是教会之所以为教会的必要结构；（2）多数新教认为它没有圣经依据，且历史链条本身可疑（存在「无主教」的时期与「异端主教」的问题）；（3）英国国教处于中间：保留主教制，但与罗马、东正教对「统绪是否必须」仍有分歧。参见 {{诺斯替派}}、{{大公会议}}。","see":["诺斯替派","大公会议","教宗首席权"],"ch":["ch-2"]},"正典":{"en":"canon, κανών","def":"希腊文原意是「芦苇杆、量尺」→「标准、目录」。指被教会认定为权威经书的固定清单。**新约正典的形成没有一次会议拍板**：它是一个 2–4 世纪逐渐收敛的过程，关键节点包括 {{马吉安}} 的挑战（144 年）、爱任纽与特土良的引用范围、穆拉多利残卷（约 2 世纪末或 4 世纪）、优西比乌的分类（4 世纪初）、以及 367 年亚他那修的第 39 封节期书信（最早列出与今天完全相同的 27 卷）。**分裂点**：次经（*deuterocanonical*，天主教与东正教视为正典，新教视为「次经」但不作教义依据）；埃塞俄比亚教会的正典更宽（含《以诺一书》《禧年书》）。参见 {{孟他努派}}、{{使徒统绪}}。","see":["孟他努派","使徒统绪","异端"],"ch":["ch-2"]},"千禧年":{"en":"millennium, χιλιετία","def":"出自启示录 20:1–6：基督与复活的圣徒作王一千年。**三种解读**：（1）**前千禧年论**（premillennialism）：基督在千禧年前亲自降临，建立地上国度——19 世纪达秘与普利茅斯弟兄会发展出「时代论」（dispensationalism），20 世纪经司可福圣经广泛传播，深刻影响美国福音派与政治（尤其对以色列的支持）；（2）**后千禧年论**（postmillennialism）：福音先改造世界，迎来长期的公义与和平，然后基督再来——19 世纪社会福音运动的动力之一；（3）**无千禧年论**（amillennialism）：千禧是象征，指基督复活后到再来的整个教会时代——奥古斯丁与多数传统教会（天主教、东正教、改革宗）的立场。**为什么这个技术性区分如此重要**：它决定了信徒对世界的态度——是「逃离即将毁灭的世界」，还是「努力改造它」。参见 {{末世论}}。","see":["末世论","弥赛亚"],"ch":["ch-16"]},"唯独信心":{"en":"sola fide","def":"宗教改革三大「唯独」之一（另两个是 *sola scriptura* 唯独圣经、*sola gratia* 唯独恩典）。主张人称义是**唯独因信**基督，不靠行为（包括宗教行为、善功、圣礼、赎罪券）。**路德的关键区分**：律法与福音、称义（神对人的宣告）与成圣（人被更新）。**天主教的反驳**（特伦托会议第 6 会期）：信心是称义的起点，但称义本身包含爱所赋予的内在更新，因此「行为」不是称义的代价，而是称义的生命。**两边的误解**：新教常被误解为「不用做好人」，天主教常被误解为「靠行为得救」。**1999 年《关于称义教义的联合声明》**宣称双方在此已无根本分歧，但信义宗内部与天主教保守派都有强烈反对。参见 {{称义}}、{{恩典}}、{{加尔文主义}}。","see":["称义","恩典","加尔文主义"],"ch":["ch-11"]},"加尔文主义":{"en":"Calvinism / Reformed theology","def":"以**加尔文**（John Calvin，1509–1564，日内瓦）为代表的改革宗神学，核心是「TULIP」五点（多特会议 1618–19 对阿米念派的回应）：全然败坏（Total depravity）、无条件拣选（Unconditional election）、有限赎罪（Limited atonement）、不可抗拒的恩典（Irresistible grace）、圣徒永蒙保守（Perseverance of the saints）。**必须注意**：这五点原本是针对阿米念派的**辩护性表述**，不是加尔文自己写的系统摘要；加尔文本人的《基督教要义》重心在「认识神与认识自己」。**加尔文主义的实际影响远超神学**：它塑造了长老会、改革宗、部分浸信会，也通过马克斯·韦伯的《新教伦理与资本主义精神》（1905）被关联到现代资本主义的工作伦理——尽管韦伯的论证远比流行版本复杂。参见 {{预定论}}、{{阿米念主义}}、{{唯独信心}}。","see":["预定论","阿米念主义","唯独信心"],"ch":["ch-12"]},"阿米念主义":{"en":"Arminianism","def":"得名于荷兰神学家**阿米念**（Jacobus Arminius，1560–1609）。反对严格加尔文主义的五点，主张：神的拣选基于**预知**的信心（不是无条件的）；基督为**所有人**死（不是只为选民）；恩典**可以被抗拒**；真信徒**可能失落**。1610 年其追随者提出《抗辩书》（*Remonstrance*），1618–19 年多特会议谴责之，但阿米念主义存活下来，深刻影响**卫理宗**（约翰·卫斯理）、五旬节派、以及大部分现代福音派。**为什么这个区分今天仍然尖锐**：它决定「传福音有没有意义」「不信的人该怪谁」「神是否偏私」这些非常实际的问题。参见 {{加尔文主义}}、{{预定论}}、{{恩典}}。","see":["加尔文主义","预定论","恩典"],"ch":["ch-12"]},"全然败坏":{"en":"total depravity","def":"加尔文主义五点之首。主张：罪影响了人的**每一个部分**（理智、意志、情感、身体），因此人靠自己不能主动向神迈出第一步。**它不是「人坏到极点」**：这个常见误解必须纠正——「全然」（total）指的是**范围的全面性**，不是**程度的极端性**；它不否认人有相对的善、文化成就、道德能力，而是否认人有**自救**的能力。**为什么它是整套体系的基石**：如果人还有一点向神的能力，那么拣选就必须以「神预知他会用这一点能力」为条件，阿米念主义由此成立；若人完全无能，则拣选必然是无条件的。参见 {{加尔文主义}}、{{预定论}}、{{恩典}}。","see":["加尔文主义","预定论","恩典"],"ch":["ch-12"]},"双重预定":{"en":"double predestination","def":"主张神在永恒中既预定谁得救（拣选），也预定谁被遗弃（弃绝）。**它的逻辑**：若拣选是无条件的，那么「不被拣选」也是无条件的，因此也是被预定的。**加尔文与加尔文派的差别**：加尔文本人对此极为谨慎（称之为「可怕的定旨」*decretum horribile*），强调人堕落是「因自己」而得救是「因恩典」；但 17 世纪的多特会议与后来的严格加尔文主义（如特奥多尔·贝扎）更明确地表述了双重预定。**主要的反对**：它似乎让神成为恶的作者，取消人的道德责任。**回应**（《威斯敏斯特信条》）：神的定旨不强迫人的意志，第二因（人的选择）是真实的。这个回应是否成立，是 400 年未决的争论。参见 {{预定论}}、{{加尔文主义}}。","see":["预定论","加尔文主义","恩典"],"ch":["ch-12"]},"教父":{"en":"Church Fathers, Patres Ecclesiae","def":"指古代教会（通常到 8 世纪，东方到 8 世纪、西方到 7 世纪）被公认为信仰见证者的作家。**四类划分**：（1）**使徒教父**（1 世纪末–2 世纪初：罗马的革利免、伊格那丢、坡旅甲、《十二使徒遗训》）；（2）**护教士**（2 世纪：查士丁、雅典那哥拉、爱任纽、特土良）；（3）**亚历山大学派**（克雷芒、奥利金）与**安提阿学派**（狄奥多若、金口约翰）；（4）**黄金时代教父**（4–5 世纪：亚他那修、加帕多家三杰、安波罗修、耶柔米、奥古斯丁、区利罗）。**东方与西方的名单不同**：东方最推崇亚他那修、巴西流、金口约翰；西方最推崇安波罗修、耶柔米、奥古斯丁、大格列高利。**为什么这个名单是争议本身**：谁算「教父」，等于谁算「传统」；而「传统」是正统的第二个来源（第一个是圣经）。新教把教父降为「可参考的见证」而非「权威」，天主教与东正教则视之为圣灵引导教会的证据。参见 {{使徒统绪}}、{{正统}}。","see":["使徒统绪","正统","大公会议"],"ch":["ch-2"]},"互渗相寓":{"en":"perichoresis, περιχώρησις","def":"希腊文「互相穿透、彼此环绕」。**三位一体教义中最精微的一个概念**：三个位格不是彼此外在、各占一块「神性份额」，而是彼此完全内住、互相渗透，同时又不混淆——每一位都完整地拥有神性，且完全在另两位之中。**它要解决什么问题**：如果只说「三个位格」，容易滑向 {{三神论}}（三个分开的神）；如果只说「一个本质」，容易滑向 {{形态论}}（三个面具）。互渗相寓是第三条路：**区别是关系性的，不是分割性的。** 这个词最早见于 {{加帕多家教父}}（尼撒的格列高利、伪狄奥尼修斯），7 世纪由大马士革的约翰正式用于三位一体，后来也被用于基督论（神人二性在一位格中的互渗）。参见 {{位格}}、{{本质}}、{{三神论}}。","see":["位格","本质","三神论","加帕多家教父"],"ch":["ch-4"]},"本体相异":{"en":"anomoeos / heteroousios","def":"希腊文 *anomoios*（不相似）或 *heteroousios*（他本质）。最激进的 {{阿里乌主义}} 立场：子与父的本性完全不同，甚至可以说子与父在一切方面都不相似。代表是 {{阿诺莫派}} 的欧诺米与埃提乌斯。**为什么它重要**：它是「同一—相似—相异」三档中的第三档，也是尼西亚派用来划界的极端参照点——正因为存在「相异」这一档，才使「相似」显得像折中，而折中在教义争论中往往是最危险的位置（因为它两边都能被指责）。参见 {{本体同一}}、{{本体相似}}、{{阿诺莫派}}。","see":["本体同一","本体相似","阿诺莫派"],"ch":["ch-4"]},"敌圣灵派":{"en":"Pneumatomachi / Tropici / Macedonians","def":"希腊文 *pneumatomachoi*（「与圣灵作战的人」）。4 世纪后半叶一个群体，接受子与父同一本质，但否认圣灵的神性，认为圣灵是一个受造的、次等的存在（或只是神的一种能力、一种「被造的活动」）。得名「马其顿派」是因为他们常被联系到君士坦丁堡主教马其顿尼乌（Macedonius）。**为什么这个立场很自然**：如果父是非受生的、子是受生的，那么圣灵是什么？他在圣经里既不被称作「受生」，也不被称作「非受生」，只被称作「发出」——这个第三类的来源方式，让很多人不知道该怎么归类。381 年君士坦丁堡会议正是为了处理这个问题，在信经里加入关于圣灵的完整条款。参见 {{尼西亚信经}}、{{加帕多家教父}}。","see":["尼西亚信经","加帕多家教父","三位一体"],"ch":["ch-4"]},"阿波利拿里主义":{"en":"Apollinarianism","def":"得名于老底嘉主教**阿波利拿里**（Apollinaris of Laodicea，约 310–390），{{亚他那修}} 的朋友。主张：基督有人的身体与「魂」（*psychē*，生命力），但没有人的理性灵魂（*nous*）；在他里面，神的 {{逻各斯}} 取代了理性灵魂的位置。**他的动机是敬虔的**：如果基督有一个会动摇、会犯罪的理性意志，那么他还能是无罪的救主吗？**为什么被判异端**（381 年君士坦丁堡会议）：如果基督没有人的理性灵魂，那么人的理性就没有被医治——而「未被取用的，就未被医治」正是他自己阵营的口号。**这个逻辑反噬极其漂亮**：他用救恩论来论证自己的立场，而对手用同一条原则推翻了他。参见 {{道成肉身}}、{{一性论}}。","see":["道成肉身","一性论","迦克墩"],"ch":["ch-5"]},"一位论派":{"en":"Unitarianism","def":"否认三位一体、主张神只有「一个位格」的运动。**历史线索**：（1）16 世纪宗教改革中的「反三位一体派」——塞尔维特（1553 年在日内瓦被烧死）、索齐尼叔侄在波兰建立「波兰兄弟会」（索齐尼主义）；（2）17–18 世纪英国与美国的「一位论派」（Unitarian），19 世纪在美国发展为新英格兰超验主义的重要土壤；（3）1961 年与普世教会合并为「一位论普世教会」（Unitarian Universalism），今天已不要求任何特定神学立场，包括无神论者。**为什么它值得注意**：它证明了「三位一体」从来不是没有反对者的共识，而是在每一代都有人认为是希腊哲学污染的人。参见 {{阿里乌主义}}、{{三位一体}}。","see":["阿里乌主义","三位一体","神格唯一"],"ch":["ch-4"]},"区利罗":{"en":"Cyril of Alexandria, Κύριλλος","def":"约 376–444 年，亚历山大主教（412 年起），5 世纪最有权力也最富争议的东方主教。**他的基督论公式**是：「一个成了肉身的本性」（*mia physis tou theou Logou sesarkōmenē*）——注意，他用的正是后来被误认为「一性论」的表述，但他本人明确反对欧迪奇的混合说。**他的历史角色**：（1）431 年以弗所会议的主导者，罢免 {{聂斯脱里}}；（2）对 {{生神者}} 称号的坚决捍卫；（3）写《驳朱利安》——古代最系统的反异教著作之一；（4）他的神学被 {{迦克墩}} 会议名义上尊崇，却又被东方一性论者当作旗帜——**一个人同时是两边的祖师**。**争议人格**：他主持过对哲学家希帕提娅之死的时代背景（虽无直接证据表明他下令），也以贿赂与暴力手段对付政敌。参见 {{迦克墩}}、{{一性论}}、{{聂斯脱里派}}。","see":["迦克墩","一性论","聂斯脱里派","生神者"],"ch":["ch-5"]},"聂斯脱里":{"en":"Nestorius, Νεστόριος","def":"约 386–451 年，叙利亚人，428 年任君士坦丁堡主教，431 年被以弗所会议罢免并流放。**他的实际立场**（据 20 世纪发现的《赫拉克利德斯的市场》）：反对把「生神者」理解为「神性从马利亚取得」，主张马利亚生的是「与道联合的那个人」；他明确否认自己主张两个位格。**他为什么被判**：他的对手 {{区利罗}} 把他的 *prosōpon* 理论解读为「两个主体」，并在皇帝支持下抢先开会定罪。**历史的反讽**：他的追随者东迁后建立的「东方教会」成为古代最成功的传教教会之一（见「景教」）；而现代学界普遍认为他可能是被误解的。参见 {{聂斯脱里派}}、{{迦克墩}}、{{生神者}}。","see":["聂斯脱里派","迦克墩","生神者"],"ch":["ch-5"]},"生神者":{"en":"Theotokos, Θεοτόκος","def":"希腊文 *Theos*（神）+ *tokos*（生育者），字面「生神的人」，中文常译「上帝之母」「天主之母」。**为什么这个词是整个 5 世纪争论的引爆点**：它不是一个关于马利亚的称号，而是一个关于基督的命题——**如果你说马利亚生的是神，你就承认了那个在伯利恒出生的人就是永恒的道本身**（主体同一）；如果你说她生的是一个人，你就把道与那个人分开了。431 年以弗所会议确认这个称号，作为对 {{聂斯脱里}} 的判决。**必须注意**：这个词**不**意味着马利亚是神，也不意味着她「生出神性」；它说的是「她所生的那一位，是神」。新教（路德宗除外）对这个词常感不适，因为它容易被误解为对马利亚的过度尊崇。参见 {{聂斯脱里派}}、{{区利罗}}、{{道成肉身}}。","see":["聂斯脱里派","区利罗","道成肉身"],"ch":["ch-5"]},"属性相通":{"en":"communicatio idiomatum","def":"拉丁文「属性的互换/相通」。**基督论的核心技术概念**：因为基督是一个位格，所以属于神性的属性与属于人性的属性，都可以**归属给同一个位格**。于是可以说：「**神被钉死在十字架上**」（指位格，不指神性）；「**那婴孩创造了宇宙**」（同位格）。**界线在哪里**：可以说「神在人性中受苦」，不能说「神性受苦」（神性不变、不能受苦）；可以说「人（耶稣）是全能的」，因为那一位格是神，但不能说「人性是全能的」（人性是受造的）。**为什么它重要**：它是判断一个基督论表述是否越界的实用工具——把每一句话拆成「说的是哪个位格」与「说的是哪个本性」，就能看出它是否混淆或分割。参见 {{位格}}、{{道成肉身}}、{{迦克墩}}。","see":["位格","道成肉身","迦克墩"],"ch":["ch-5"]},"神化":{"en":"theosis / deification, θέωσις","def":"东方基督教的核心救恩观：**神成为人，是为了让人成为神**（亚他那修《论道成肉身》54：「他成为人，使我们成为神」）。**必须严格区分它与「人变成神的本体」**：神化不是人变成神性本质（那是泛神论），而是人「分有」神的生命与性情（彼后 1:4），成为「按神的样子」被更新的受造物。**为什么它对基督论如此关键**：如果基督的人性没有与神性真实联合，那么人性就没有被「渗透」、没有被提升，神化就无从发生。所以东方教会对「两个本性各自保全」的说法本能地不安——它担心通道不够宽。**西方（尤其天主教经院传统）更常用「成圣」（sanctification）与「荣福直观」来表达类似的东西**，语气更法律化、更少本体论色彩。参见 {{道成肉身}}、{{一性论}}、{{救恩}}。","see":["道成肉身","一性论","救赎"],"ch":["ch-5"]},"单志论":{"en":"Monothelitism","def":"希腊文 *monos*（一）+ *thelēma*（意志）。7 世纪由皇帝希拉克略与君士坦丁堡牧首塞尔吉乌斯推动的折中方案：基督有两个本性，但只有**一个意志**（神性的意志），或只有一个「活动/能量」（*energeia*）。**动机**：让一性论者与迦克墩派都能接受，以团结帝国对抗波斯与阿拉伯。**为什么被判异端**（680–681 年第三次君士坦丁堡会议）：若基督没有人的意志，则人性不完整；若人性不完整，则人的意志没有被医治。**关键论证**（大马士革的约翰、耶路撒冷的索夫罗尼乌）：意志属于**本性**而非位格——正如人有人的意志、神有神的意志，二者在基督里并存且不冲突（人性意志完全顺服神性意志）。**这个结论留下了一个至今未决的哲学难题**：若人性意志「必然顺服」，它还是自由的吗？参见 {{迦克墩}}、{{一性论}}。","see":["迦克墩","一性论","道成肉身"],"ch":["ch-5"]},"玛若尼派":{"en":"Maronites","def":"黎巴嫩与叙利亚的东方礼仪天主教会，自称源于 5 世纪隐修士**马若尼**（Maron）的修道团体，7 世纪形成独立宗主教区。**历史争议**：他们长期被指控为 {{单志论}} 者（因为与拜占庭的 681 年决议关系疏远），但 1182 年正式与罗马联合时声明从未持该立场。**今天**：约 300–400 万信徒，是黎巴嫩最大的基督教社群，宗主教驻贝克尔基（Bkerké）。**为什么它值得注意**：它示范了一条「东方教会与罗马联合但保留自己礼仪与法典」的路径——即所谓「东方礼仪天主教会」（*Eastern Catholic Churches*），共 23 个，是梵二之后天主教「合一运动」的重要成果，也是东正教对天主教最不满的一点（被指为「挖墙脚」）。参见 {{单志论}}、{{东方正统教会}}。","see":["单志论","东方正统教会"],"ch":["ch-5"]},"摩尼教":{"en":"Manichaeism","def":"3 世纪由波斯人**摩尼**（Mani，216–274）创立的宗教，是彻底的二元论：光与暗、善神与恶神、灵魂与物质永恒对立。**它的吸引力在于它解决恶的问题**：恶不是善神的失败，而是另一个永恒原理的作为。它还是一个**普世传教宗教**，有自己的经典、教会组织、以及一套极其严格的「选民」（*electi*）与「听者」（*auditores*）两级制度。**与基督教的关系**：摩尼教自称是基督教的完成，承认耶稣是伟大使者之一，但否认他真的受难（{{幻影说}}）。奥古斯丁做了九年摩尼教「听者」，他的《忏悔录》卷三到卷七就是一部脱离摩尼教的思想传记；他后来所有的神学（恶是善的缺失、自由意志、恩典）都在回答摩尼教提出的问题。摩尼教沿丝绸之路东传，唐代称「明教」，影响了中国的民间宗教，直至明清仍有残余。参见 {{原罪}}、{{奥古斯丁}}。","see":["奥古斯丁","幻影说"],"ch":["ch-6"]},"原罪":{"en":"original sin, peccatum originale","def":"奥古斯丁系统化的教义：亚当的堕落不只影响他自己，而是**改变了人性的状态并传给全人类**。它的内容不是「性」（常见误解），而是四重败坏：**必死性**（身体会死）、**无知**（理智昏暗）、**意志的偏向**（*concupiscentia*，欲望失控，使人倾向于恶）、**与神关系的断裂**。**关键区分**：（1）**罪咎**（*reatus*，该受刑罚）与**败坏**（*vitium*，本性的损伤）——天主教后来区分二者，东方教会只承认后者；（2）**亚当的罪**与**我们自己的罪**——奥古斯丁认为二者在存在论上相连（「在亚当里众人都犯了罪」），这也是最受质疑的一点。**圣经依据**：罗 5:12–19、诗 51:5、弗 2:1–3。**为什么它如此重要**：若人只是「受伤」而非「死」，则恩典只是帮助；若人是「死」的，则恩典必须是复活。整个西方神学的骨架挂在这个判断上。参见 {{恩典}}、{{伯拉纠主义}}、{{奥古斯丁}}。","see":["恩典","伯拉纠主义","奥古斯丁"],"ch":["ch-6"]},"半伯拉纠主义":{"en":"Semi-Pelagianism","def":"19 世纪学者造的词，指 5–6 世纪法国南部（马赛派）的一组立场：**恩典是先在的**（人不能靠自己开始信），但**人的意志必须同意恩典**，而这个同意是人的自由行为。代表：约翰·卡西安、文森特·勒兰。**529 年奥兰治会议谴责它**，理由是：若「同意」是人的贡献，得救就有一小部分是我的功劳。**为什么这个词今天常被滥用**：任何强调人的自由、努力、合作的立场，都可能被严格加尔文主义者骂成「半伯拉纠」。但真正的半伯拉纠主义有一个严格定义（恩典先在 + 自由同意），与「靠自己得救」（纯伯拉纠）不同。**天主教的实际立场长期接近这条线**——这就是为什么 1582–1607 年的「恩典之争」（*de auxiliis*）最后被教宗下令停止、不得再互相定罪。参见 {{伯拉纠主义}}、{{恩典}}、{{预定论}}。","see":["伯拉纠主义","恩典","预定论"],"ch":["ch-6"]},"两城":{"en":"two cities, civitas Dei / civitas terrena","def":"奥古斯丁《上帝之城》（*De civitate Dei*，413–426，22 卷）的核心概念。**注意：这不是「教会 vs 国家」**——这是最常见的误读。奥古斯丁说的两城是按**爱的对象**划分的：**上帝之城**由「爱神至于轻视自己」的人组成，**地上之城**由「爱自己至于轻视神」的人组成。二者在今世**混杂在一起**，无法用肉眼分开（这与 {{多纳图派}} 的「纯洁教会」直接对立）。**它的历史作用**：（1）为 410 年罗马被洗劫提供神学解释（真正的城不会陷落）；（2）为西方的政教关系提供了「两个领域」的框架；（3）影响了路德的「两个国度」、以及现代世俗主义的神学谱系（一些学者认为「把凯撒的归凯撒」这一区分的制度化，源于此）。**最受批评的一点**：它容易被读成「属灵的事归教会、世俗的事归国家」，从而为政治权力留下不受约束的空间。参见 {{奥古斯丁}}、{{正义战争}}。","see":["奥古斯丁","正义战争"],"ch":["ch-6"]},"正义战争":{"en":"just war theory, bellum iustum","def":"一套判断「何时可以开战」（*jus ad bellum*）与「战争中可以怎么做」（*jus in bello*）的伦理框架。**源头**：西塞罗与罗马法 → 安波罗修 → **奥古斯丁**（《上帝之城》卷十九等）→ 格拉提安 → 阿奎那 → 维多利亚、格劳秀斯 → 现代国际法。**奥古斯丁的核心论点**：基督徒可以参战，因为（1）动机可以是爱（保护无辜者）；（2）战争的责任在于下令者，不在于执行的士兵；（3）真正的恶是心的恶，不是杀这个动作本身。**经典条件**：合法权威、正当理由、正当意图、最后手段、相称性、区分战斗员与非战斗员。**为什么它极富争议**：批评者（如和平主义传统、门诺派、以及当代的「正义和平」运动）认为它实际上成了国家暴力的橡皮图章；而支持者认为它是唯一能约束战争的现实框架。参见 {{两城}}、{{奥古斯丁}}。","see":["两城","奥古斯丁"],"ch":["ch-6"]},"众议":{"en":"symphonia","def":"希腊文 *symphōnia*（「和谐、共鸣」）。东正教（尤其拜占庭传统）关于教会与国家关系的理想模型：**皇帝管身体（*sacerdotium* 与 *imperium* 的协作），牧首管灵魂，二者在各自的领域内合作**。它的经典表述见于查士丁尼的《新律》与后来的《埃帕纳戈格》（*Epanagoge*，9 世纪）。**必须注意**：这不是「政教分离」，而是「政教协作」——皇帝实际上对教会有巨大影响力（召集会议、任命牧首、定义教义）。**与西方的对照**：西方在中世纪发展出「两把刀」理论（教宗有权干预世俗事务），而东方的皇帝则有权干预教会事务。**为什么它重要**：它解释了为什么东正教没有发展出「教宗」式的独立权威，也解释了为什么东正教在民族国家里容易变成国家教会。参见 {{两城}}、{{教宗首席权}}。","see":["两城","教宗首席权","东正教"],"ch":["ch-7"]},"炼狱":{"en":"purgatory, purgatorium","def":"天主教的教义：在**天堂与地狱之间**存在一个中间状态，那些「死时与神和好、但尚未完成补赎」的灵魂在此被净化，然后进入天堂。**关键点**：（1）它是**暂时的**，不是永刑；（2）它为亡者祈祷与弥撒献祭提供了神学基础（这是 16 世纪赎罪券争议的背景）；（3）1215 年第四次拉特兰会议与 1274 年里昂会议逐步定型，1563 年特伦托会议正式定义。**东正教没有炼狱**，但有「中间状态」与为亡者祈祷（更强调神秘与未知，而非可计算的刑期）。**新教普遍否认炼狱**（因为它在圣经中没有明确依据，且与「唯独因信称义」冲突——若基督的功劳已完全偿付，何须再净化？）。**为什么它重要**：它示范了一个教义如何从「为亡者祈祷的实践」发展成「一套可计算的账本」，而后者正是宗教改革的直接导火索之一。参见 {{变体论}}、{{称义}}。","see":["变体论","称义"],"ch":["ch-7"]},"圣像敬礼":{"en":"veneration of icons, προσκύνησις","def":"对圣像（*eikōn*，画像）的敬礼。**关键区分**（787 年第二次尼西亚会议与大马士革的约翰所确立）：**敬礼**（*proskynēsis*，对像的尊敬）与**崇拜**（*latreia*，唯独对神）不同。敬礼圣像时，敬意「越过图像，归于原型」（巴西流语）。**为什么它引发巨大争议**：726–843 年的 {{圣像破坏运动}} 认为任何图像都是偶像崇拜（依据出 20:4）；拥护圣像者则反驳：若神真的成了人，他就可以被描绘——**道成肉身本身是圣像神学的根基**。**东西方的差异**：东方只允许平面圣像（二维），认为立体的雕像太接近异教偶像；西方则雕像与画像并用。参见 {{偶像崇拜}}、{{道成肉身}}、{{圣像破坏运动}}。","see":["偶像崇拜","道成肉身","圣像破坏运动"],"ch":["ch-7","ch-8"]},"变体论":{"en":"transubstantiation","def":"天主教关于圣餐的教义：祝圣后，饼与酒的**实体**（{{实体}}）变为基督的身体与血，而**偶性**（{{偶性}}：外观、味道、触感）保持不变。**术语来源**：亚里士多德的「实体/偶性」区分；1215 年第四次拉特兰会议用 *transsubstantiatio* 一词，1563 年特伦托会议正式定义。**为什么这个看起来很技术化的教义如此重要**：它同时回答了两个问题——（1）**基督真的临在吗**（是，真实地）；（2）**为什么看起来还是饼**（因为变的是实体，不是偶性）。**其他方案**：路德的「同体论」（*consubstantiatio*，基督的身体「在、同、under」饼酒之中）、加尔文的「属灵临在」、慈运理的「纪念说」。**争议的实质**：这不只是哲学，而是「物质能否承载神性」的问题——它与 {{道成肉身}} 是同一个逻辑。参见 {{圣礼}}、{{实体}}、{{偶性}}。","see":["圣礼","实体","偶性","道成肉身"],"ch":["ch-7","ch-10"]},"东正教":{"en":"Eastern Orthodoxy","def":"指与罗马分离后的东方教会共同体（约 2.2 亿信徒），包括君士坦丁堡、亚历山大、安提阿、耶路撒冷四个古代宗主教区，以及俄罗斯、塞尔维亚、罗马尼亚、保加利亚、格鲁吉亚、希腊、波兰、捷克-斯洛伐克、乌克兰等地的自主教会。**名称**：希腊文 *orthodoxia*（正确荣耀/正确敬拜），1054 年后逐渐成为东方教会的自我标识。**与「东方正统教会」的区别**（这是中文里最容易混淆的一对）：**东正教**＝Eastern Orthodox（接受迦克墩，与罗马在 1054 年分裂）；**东方正统教会**＝Oriental Orthodox（**拒绝**迦克墩，在 451 年分裂）。两者名字几乎相同，但历史与神学完全不同。**核心特征**：礼仪中心（圣礼而非讲道）、{{神化}} 的救恩观、{{众议}} 的政教模型、{{圣像敬礼}}、静修传统（{{静修主义}}）、分布式权威（普世牧首为荣誉首席，无普遍管辖权）。参见 {{东西方教会大分裂}}、{{东方正统教会}}、{{和子句}}。","see":["东西方教会大分裂","东方正统教会","和子句","众议"],"ch":["ch-7","ch-8"]},"圣像破坏运动":{"en":"Iconoclasm, εἰκονομαχία","def":"8–9 世纪拜占庭帝国的一场运动：**破坏圣像**（*eikōn*）并禁止其敬礼。**两个阶段**：（1）726–787 年，皇帝利奥三世下令拆除圣像，大马士革的约翰（在伊斯兰地区，不受皇帝管辖）写三篇《驳斥毁坏圣像者》；（2）813–843 年，第二次破坏运动，最终在 843 年「正统主日」恢复圣像敬礼。**双方论证**：破坏派依据出 20:4（不可造像）与基督论（若只敬拜神性，何必画人性？）；拥护派依据{{道成肉身}}（若神真的成了人，他就可以被描绘），并区分**敬礼**（对像）与**崇拜**（对神）。**历史意义**：（1）它是「道成肉身」教义的最直接推论；（2）它使东方教会与西方教会关系紧张（罗马支持圣像，但用词不同）；（3）它可能受了伊斯兰教与犹太教反图像传统的影响。参见 {{圣像敬礼}}、{{道成肉身}}、{{偶像崇拜}}。","see":["圣像敬礼","道成肉身","偶像崇拜"],"ch":["ch-8"]},"五角体制":{"en":"pentarchy","def":"古代教会形成的五个荣誉中心：罗马、君士坦丁堡、亚历山大、安提阿、耶路撒冷。理论上，普世教会的最高权威是**这五者的一致**（后世的东正教表述是「五个宗主教区 + 普世会议」）。**历史**：451 年迦克墩第 28 条把君士坦丁堡提到第二位；查士丁尼正式确立「五角」的说法。**1054 年之后**，东方把罗马从名单里划掉，剩四个；1589 年莫斯科获得第五个位置。**为什么这个概念重要**：它是东方的「分布式权威」模型的具体形态——**没有单一元首，只有五个古老中心的共识**。这也是东方反对教宗普遍管辖权的历史依据：若教会是「五角」的，那罗马只是其中之一。参见 {{众议}}、{{教宗首席权}}、{{东正教}}。","see":["众议","教宗首席权","东正教"],"ch":["ch-8"]},"阿索斯山":{"en":"Mount Athos, Ἅγιον Ὄρος","def":"希腊北部哈尔基季基半岛东端的一座山与半岛，东正教最重要的修道中心，被称为「圣山」（*Hagion Oros*）。**963 年**，圣亚他那修（Athanasius the Athonite）在此建立大拉伏拉修道院，此后一千年从未中断修士生活。**制度**：实行自治，由 20 所主要修道院组成，各派代表组成「圣议会」（*Protaton*），行政中心在卡里埃斯（Karyes）。**禁止任何女性进入**（这一禁令自 1045 年帝国敕令以来一直有效，欧盟亦予以尊重）。今天约有 2000 名修士，来自希腊、俄罗斯、塞尔维亚、罗马尼亚、保加利亚等国。**为什么它重要**：它是东正教灵修传统的活体保存所——{{静修主义}}、{{耶稣祷文}}、{{帕拉马斯}} 的神学都在这里成形。2016 年克里特泛东正教会议之后，阿索斯山仍是东正教内部最保守、最有道德权威的声音之一。参见 {{静修主义}}、{{耶稣祷文}}、{{东正教}}。","see":["静修主义","耶稣祷文","东正教"],"ch":["ch-8"]},"否定神学":{"en":"apophatic theology, via negativa","def":"希腊文 *apophasis*（「否认、不说」）。一种认识神的方法：**因为神超越一切范畴，所以关于神最准确的说法是否定性的**——不是「神是善」，而是「神不是我们所知的善」；不是「神存在」，而是「神不是任何存在者」。**三条路**：肯定之路（*via positiva*，用受造界最好的词）、否定之路（*via negativa*，逐一否定）、超越之路（*via eminentiae*，「超越存在的存在」）。**代表**：{{伪狄奥尼修斯}}、{{加帕多家教父}}（尤其尼撒的格列高利）、{{阿诺莫派}} 的对手（巴西流以此反驳「神可被概念穷尽」）。**为什么它不是怀疑论**：它不是否认神是善，而是否认**我们的「善」能装下神的善**。**实践后果**：若神彻底不可言说，则任何把神等同于某个概念、制度、民族的做法都是偶像崇拜——这使否定神学成为一种持续的批判力量，包括对教会自身的批判。**西方也有这条线**：阿奎那在《神学大全》第一集第 13 题明确说，我们关于神所说的一切，最终都「不及」（*deficiunt*）。参见 {{伪狄奥尼修斯}}、{{静修主义}}。","see":["伪狄奥尼修斯","静修主义","太一"],"ch":["ch-8"]},"伪狄奥尼修斯":{"en":"Pseudo-Dionysius the Areopagite","def":"6 世纪（约 500 年前后）的一组希腊文著作的作者，假托使徒保罗在雅典所归信的「亚略巴古的丢尼修」（徒 17:34）。**作品**：《论神的名》《神秘神学》《天阶体系》《教阶体系》及十封书信。**思想**：新柏拉图主义的流溢结构 + 基督教的礼仪神学；核心是否定神学与「层级」（*hierarchia*，这个词就是他造的）。**影响之大难以估量**：（1）东方：成为整个拜占庭神秘神学的骨架（马克西姆、大马士革的约翰、帕拉马斯都依赖他）；（2）西方：9 世纪由埃里金纳译成拉丁文，成为中世纪最受尊崇的作者之一（阿奎那写注、但丁《神曲》的天阶直接取自他）；（3）现代：20 世纪的神学美学（von Balthasar）与「否定神学」复兴都回到他。**争议**：15 世纪瓦拉（Lorenzo Valla）与 19 世纪学者证明其非使徒时代作品；路德激烈反对他（「他比柏拉图还柏拉图」）。参见 {{否定神学}}、{{流溢}}。","see":["否定神学","流溢","新柏拉图主义"],"ch":["ch-8"]},"静修主义":{"en":"Hesychasm, ἡσυχασμός","def":"希腊文 *hēsychia*（静默、安宁）。东正教（尤其阿索斯山）的一种祈祷与灵修传统：通过**静默、专注、反复诵念{{耶稣祷文}}、配合呼吸与坐姿**，使心「下降」到自身（*eisodos tou nou eis tēn kardian*，「心灵回归内心」），达到持续的、不需语言的祈祷。**圣经依据**：帖前 5:17「不住地祷告」；太 6:6「进你的内屋，关上门」。**历史**：4–7 世纪的沙漠教父 → 西奈的格列高利（13 世纪）传到阿索斯山 → 尼科迪默斯·阿约里特编《爱善集》（1782）→ 20 世纪经《朝圣者之路》影响西方（「归心祈祷」运动）。**争议**：14 世纪巴拉姆攻击它是幻觉，{{帕拉马斯}} 为它辩护并给出「本质—能量」的神学基础（1351 年定案）。**为什么它重要**：它代表一种完全不同的神学认识论——**关于神的认识需要认识者自身的转化**，而不只是命题的正确。参见 {{耶稣祷文}}、{{帕拉马斯}}、{{否定神学}}。","see":["耶稣祷文","帕拉马斯","否定神学"],"ch":["ch-8"]},"耶稣祷文":{"en":"Jesus Prayer","def":"东正教最普遍的祈祷公式：**「主耶稣基督，神的儿子，怜悯我。」**（*Kyrie Iēsou Christe, huie tou Theou, eleēson me*）。有时扩展为「……怜悯我这个罪人」（路 18:13 税吏的祷告）。**实践**：反复诵念，配合呼吸（吸气时「主耶稣基督，神的儿子」，呼气时「怜悯我」），坐姿低头，目的是使祈祷「自行」在心中持续（《朝圣者之路》称之为「心的祈祷」）。**神学基础**：**道成肉身**——因为神成为人，所以「耶稣」这个名字本身带有神的临在（腓 2:9–11）；**神化**——祈祷的目的是人与神的真实联合，不是单纯的道德改善。**它为什么在西方流行**：20 世纪的「归心祈祷」（Centering Prayer，托马斯·基廷）与「基督默想」运动直接受它影响。参见 {{静修主义}}、{{神化}}。","see":["静修主义","神化","道成肉身"],"ch":["ch-8"]},"旧礼仪派":{"en":"Old Believers, Raskol","def":"俄文 *Raskol*（「分裂」）。17 世纪俄罗斯正教会内拒绝牧首**尼康**礼仪改革的一派。**改革的细节**（看起来极琐碎，但这就是重点）：划十字用**三指**而非两指、阿利路亚唱**三次**而非两次、行列**逆太阳**而非顺太阳、耶稣名拼作 **Iisus** 而非 **Isus**、圣像风格与圣歌的细微差异。**为什么他们拒绝**：不是反对教义，而是反对**改变**——如果教会是神圣的，礼仪是神所悦纳的，那么谁能改？而且如果俄罗斯是「第三罗马」，它为什么要向「已堕落的」希腊人学习？**历史**：1666–67 年大会议谴责反对者；领袖**阿瓦库姆**被流放、1682 年被烧死。旧礼仪派分为「教士派」（保留了主教传承）与「无教士派」（*bezpopovtsy*，无神职，自行主持礼仪）。**今天**：数百万人，分布在俄罗斯、波罗的海、罗马尼亚、北美。**为什么它是本书最好的案例之一**：一个划十字用几根手指的问题，造成了三百多年的分裂——**它证明「礼仪即身份」的力量远超「教义差异」。** 参见 {{东正教}}、{{圣像敬礼}}。","see":["东正教","圣像敬礼"],"ch":["ch-8"]},"买卖圣职":{"en":"simony","def":"用金钱买卖教会职位或圣职。名字来自使徒行传 8:18–24 的**西门**（Simon Magus），他想用钱买使徒的按手权，彼得回答：「你的银子和你一同灭亡吧。」**为什么它是中世纪改革的核心目标**：在 10–11 世纪，主教职位常被世俗领主出售或作为政治酬庸；修道院院长职位可以被买；甚至教宗职位也曾被买卖。**格雷欣式的后果**：职位被买卖 → 任职者必须回收成本 → 更严重的腐败与勒索 → 改革呼声 → 更严的禁令 → 更隐蔽的交易。**1112 年《沃尔姆斯协约》**试图分开「属灵职分」与「世俗财产」，但实践上从未彻底解决。**宗教改革的直接导火索（赎罪券）与它有结构上的亲缘**：都是用金钱交换属灵的好处。参见 {{赎罪券}}、{{教宗首席权}}。","see":["赎罪券","教宗首席权"],"ch":["ch-9"]},"经院神学":{"en":"scholastic theology, theologia scholastica","def":"中世纪大学里发展出的神学方法，核心是三步：**诵读**（*lectio*，读权威文本）、**提问**（*quaestio*，提出一个问题）、**辩论**（*disputatio*，列出正反论证后给出解决方案）。**代表作**：彼得·伦巴德《四部语录》（约 1150，成为标准教材）、阿奎那《神学大全》（1265–1273）。**方法的伦理意义**：它在形式上预设「反方也有道理」——你必须先公正表述对手最强的论证，才有资格反驳。这在教义史上是一种知识伦理的进步。**为什么它受攻击**：它使神学变得极度技术化，只有受过训练的人才能参与；它用亚里士多德的语言重新表述信仰，被批评为「希腊化」的极致；路德称亚里士多德为「那个该死的异教徒」，并烧掉了教会法典。**但要注意**：宗教改革并没有抛弃经院方法——路德与加尔文都是受经院训练的，他们的论证结构（「律法与福音」的辩证）本身就是经院式的。参见 {{唯名论}}、{{称义}}。","see":["唯名论","称义","恩典"],"ch":["ch-9"]},"唯名论":{"en":"nominalism","def":"主张「共相」（universals，如「人性」「红色」「三角形」）**不是真实的实体，只是名称**（*nomina*）；真实存在的只有个别事物。代表：**奥卡姆的威廉**（约 1287–1347）、罗吉尔·培根（部分）、以及 14–15 世纪的大部分大学。**与实在论的对照**：实在论（如阿奎那）认为「人性」是真实存在于个别的人之中的共同本质；唯名论认为那只是我们给相似事物起的名字。**为什么它对教义是地震**：三位一体与基督论的整个语法建立在「本质/本性」这些实在的共相上。若只有个别事物是真实的，「一个本质三个位格」就失去形而上学的支撑。**奥卡姆本人是虔诚的信徒**（他说三位一体不能靠理性证明，只能靠信仰接受），但他开启的路线最终导向宗教改革对经院神学的全面否定。**另一个遗产**：「奥卡姆剃刀」（*entia non sunt multiplicanda praeter necessitatem*，如无必要勿增实体）——现代科学方法论的一个远祖。参见 {{经院神学}}、{{本质}}。","see":["经院神学","本质"],"ch":["ch-9"]},"公会议主义":{"en":"conciliarism","def":"主张**普世会议的权威高于教宗**（*concilium est supra papam*）。**背景**：1378–1417 年「西方大分裂」中同时有三个教宗互相绝罚，使「教宗是元首」这个命题陷入荒谬。**理论**：巴黎大学的热尔松（Gerson）与戴利（d'Ailly）论证，教宗不是一个「君主」而是一个「职分」；当职分本身出问题时，教会（通过大公会议）有权纠正。**实践**：康斯坦茨会议（1414–1418）废黜三个教宗、选出马丁五世，结束分裂。**失败**：新教宗立刻反悔；1460 年比约二世《Execrabilis》通谕禁止「向普世会议上诉」；1870 年梵一会议定义「教宗不可错误」，彻底埋葬。**为什么它是宗教改革的直接原因之一**：康斯坦茨会议在 1415 年烧死了带着安全通行证来的胡斯——**这件事摧毁了「教会能自我纠正」的信用**。一个无法自我纠正的体系，只能靠外部冲击改变。参见 {{胡斯派}}、{{教宗首席权}}。","see":["胡斯派","教宗首席权","大公会议"],"ch":["ch-9"]},"卡特里派":{"en":"Cathars / Albigensians","def":"希腊文 *katharoi*（「纯洁者」）。12–14 世纪法国南部（朗格多克）与意大利北部的二元论运动。**主张**：善神造灵界，恶神（撒但）造物质；物质、身体、婚姻、食物都是恶的；否认道成肉身（基督只是「显现」）、否认圣礼、拒绝旧约的大部分。唯一圣礼是「安慰礼」（*consolamentum*）。分**完美者**（*perfecti*，严格禁欲、不吃肉、不杀生）与**信者**（*credentes*，可过普通生活，临终受安慰礼）两级。**为什么有吸引力**：直接攻击教会财富；给女性宗教权威（女性可成为完美者）；体系简洁（无圣像、无炼狱、无赎罪券）；解释了恶的问题。**镇压**：阿尔比十字军（1209–1229，贝济耶屠城约 2 万人）、蒙特塞居尔围城（1244，200 名完美者被集体烧死）、{{宗教裁判所}}（1231 起）。**结局**：14 世纪初基本消失——**中世纪唯一被彻底消灭的群众性异端**。参见 {{波格米勒派}}、{{摩尼教}}、{{宗教裁判所}}。","see":["波格米勒派","摩尼教","宗教裁判所"],"ch":["ch-9"]},"宗教裁判所":{"en":"Inquisition","def":"天主教会用于侦查与审判异端的机构。**三个阶段**：（1）**中世纪教廷裁判所**（1231 年起，格里高利九世设立，主要对付{{卡特里派}}）；（2）**西班牙宗教裁判所**（1478 年起，由王室控制，主要针对改宗者 *conversos* 与摩里斯科人，更政治化、更官僚化）；（3）**罗马宗教裁判所**（1542 年，即「圣职部」，1965 年改组为「信理部」）。**程序**：告发（告发者身份保密）、审讯（被告不知原告）、酷刑（1252 年允许，有限制）、判决（认罪者轻罚；不认罪者「交给世俗权力」执行火刑）、没收财产（告发者与审判者可分得部分——最腐败的一环）。**关于数字**：现代研究估计西班牙裁判所 300 多年间处死约 3000–5000 人，中世纪裁判所更少。**它的可怕不在数量，而在原则**：它建立了第一套**以「思想正确」为罪名**的司法程序。**新教也有类似的处死**：加尔文 1553 年烧死塞尔维特，茨温利 1527 年处死再洗礼派。参见 {{异端}}、{{绝罚}}、{{卡特里派}}。","see":["异端","绝罚","卡特里派"],"ch":["ch-9"]},"帕拉马斯":{"en":"Gregory Palamas, Γρηγόριος Παλαμᾶς","def":"1296–1359 年，阿索斯山修士，后为帖撒罗尼迦主教，东正教最重要的后期神学家。**核心贡献**：**本质与能量之分**（*ousia* / *energeia*）——神的本质完全不可知、不可分有；神的能量（生命、光、恩典）是**非受造的**且**可分有**。**为什么必须这样区分**：（1）若神完全不可分有，则 {{神化}} 不可能，东方救恩论崩塌；（2）若本质可分有，则神被分割、被受造物吞没，是泛神论；（3）所以必须有一个中间项：非受造但可分有的能量。**争论**：1337–1351 年与巴拉姆（Barlaam of Calabria）辩论；1341、1347、1351 年三次君士坦丁堡会议确认其立场；被封圣，大斋期第二个主日为「帕拉马斯主日」。**主要著作**：《为静修者辩护》（*Triads*）、《一百五十章》。**为什么他重要**：他是东正教与天主教至今最深的教义裂缝的代表——比 {{和子句}} 更难对话，因为它触及「神与世界的关系」这个最底层问题。参见 {{静修主义}}、{{神化}}、{{否定神学}}。","see":["静修主义","神化","否定神学"],"ch":["ch-8"]},"赎罪券":{"en":"indulgence, indulgentia","def":"天主教中，教会以基督与圣徒的「功德宝库」（*thesaurus meritorum*）为基础，免除信徒在炼狱中的暂罚。**关键区分**（这一点最常被误解）：赎罪券**不赦免罪本身**（那是告解圣事的作用），而是免除**罪得赦免后仍须承受的暂罚**。**历史发展**：11 世纪十字军获得「全大赦」→ 13–14 世纪逐渐商品化（捐款换取）→ 1476 年西斯笃四世宣布可用于「为亡者」→ **1517 年路德《九十五条论纲》正是针对这件事**。**为什么它成为导火索**：它把「属灵的恩惠」与「金钱」直接挂钩，而这在逻辑上等于说救恩可以购买——**这正是 {{买卖圣职}} 的结构重演**。**天主教的现代立场**：1563 年特伦托会议禁止买卖赎罪券；1967 年保禄六世进一步限制；今天赎罪券只与祈祷、朝圣、善工相关，不涉及金钱。参见 {{炼狱}}、{{称义}}、{{买卖圣职}}。","see":["炼狱","称义","买卖圣职"],"ch":["ch-9","ch-10"]},"胡斯派":{"en":"Hussites","def":"15 世纪波希米亚的宗教改革运动，得名于**扬·胡斯**（Jan Hus，约 1369–1415），布拉格大学校长、伯利恒礼拜堂讲道者。**主张（布拉格四条款，1420）**：（1）神的道自由传讲；（2）平信徒领杯（饼与酒）；（3）神职人员放弃财富与世俗权力；（4）重罪依法惩罚，不论身份。**「圣杯」是他们的标志。** **来历**：胡斯接受威克里夫的思想，加上捷克民族对德意志教士的反抗。1415 年他在康斯坦茨被烧死（尽管有皇帝的安全通行证）。**后果**：胡斯战争（1419–1434）击败五次十字军；1436 年巴塞尔协定让温和派（圣杯派）与罗马妥协；激进派（塔博尔派）在利帕尼战役（1434）被自己人消灭；1620 年白山战役后波希米亚被强制重新天主教化。**存续**：摩拉维亚教会（1457 年由「波希米亚弟兄会」发展）至今是全球性新教宗派。**路德 1519 年说**：「我们全都是胡斯派。」参见 {{公会议主义}}、{{威克里夫}}、{{圣礼}}。","see":["公会议主义","威克里夫","圣礼"],"ch":["ch-9"]},"波格米勒派":{"en":"Bogomils","def":"10–15 世纪巴尔干（主要保加利亚）的二元论运动。名字来自保加利亚神父**波格米尔**（Bogomil，「蒙神怜爱者」）。**主张**：物质世界是魔鬼所造；基督与撒但是「兄弟」（一善一恶）；拒绝圣礼、十字架、圣像、教堂建筑；反对教会的财富与等级；拒绝婚姻与肉食。**可能来源**：7 世纪亚美尼亚的**保罗派**（Paulicians）。**为什么在保加利亚流行**：农民对贵族与希腊化教士压迫的反抗——它是一个社会运动，不只是神学。**扩散**：通过巴尔干—意大利商路传到西欧，被认为是 {{卡特里派}} 的源头之一（现代学者对传播路径有争议）。**镇压**：拜占庭皇帝亚历克修斯一世曾烧死其领袖巴西尔（约 1111 年）；保加利亚与拜占庭教会长期镇压。**结局**：残余延续到 15 世纪奥斯曼征服。参见 {{卡特里派}}、{{摩尼教}}。","see":["卡特里派","摩尼教"],"ch":["ch-9"]},"威克里夫":{"en":"John Wycliffe","def":"约 1330–1384 年，牛津大学教授，被称为「宗教改革的晨星」。**主张**：（1）否认教宗首席权（他说教宗可能是被预定下地狱的人）；（2）否认 {{变体论}}（认为圣餐中基督是「象征性」临在）；（3）圣经是唯一权威，推动译成英文（**威克里夫圣经**，1382–1395，从拉丁文武加大译本译出）；（4）反对教会财富；（5）{{预定论}}——教会由被预定的人组成，而不是由可见的制度组成（与多纳图派的「真教会」直觉同构）。**影响**：通过布拉格大学传到波希米亚，直接影响 {{胡斯派}}；他的追随者称 {{罗拉德派}}。**结局**：1415 年康斯坦茨会议谴责他；1428 年遗骨被掘出焚烧、骨灰撒入河中。**他的英文圣经**为 1611 年钦定本铺路，是现代英语的重要源头之一。参见 {{胡斯派}}、{{罗拉德派}}、{{变体论}}。","see":["胡斯派","罗拉德派","变体论"],"ch":["ch-9"]},"罗拉德派":{"en":"Lollards","def":"14–16 世纪英国的威克里夫追随者。名字可能来自中古荷兰语 *lollaerd*（「喃喃念经者」，贬义）。**主张**：否认教宗首席权、否认 {{变体论}}、主张圣经是唯一权威、反对教会财富与修道制度，核心是**用英文读圣经**。**活动方式**：农村巡回讲道、手抄英文圣经片段、秘密集会。**镇压**：1401 年英国《焚杀异端法》（*De heretico comburendo*）——**这是英国史上第一部把异端定为死罪的法律**；1414 年「老城堡叛乱」（Oldcastle's Revolt）失败后基本消失。**为什么它重要**：它证明「用白话读圣经」这件事本身，在 15 世纪就是一个可以被处死的立场。参见 {{威克里夫}}、{{胡斯派}}。","see":["威克里夫","胡斯派"],"ch":["ch-9"]},"闵采尔":{"en":"Thomas Müntzer","def":"约 1489–1525 年，德国宗教改革中最激进的神学家，德国农民战争的精神领袖。**主张**：（1）**圣灵直接对每个信徒说话**——不需要圣经的书面权威、也不需要神学训练（他说「圣经是纸做的教宗」）；（2）**用武力建立神的国度**，消灭不敬虔的统治者；（3）教会的财产应归穷人。**与路德的关系**：起初是路德的追随者（1520 年被派到茨维考），后来彻底决裂。路德写《致萨克森诸侯书》要求镇压他，闵采尔则称路德为「维滕堡的教宗」「肉欲博士」。**结局**：1525 年在弗兰肯豪森战役中被诸侯军队击败，被俘、受刑、斩首，头颅被挂在城门外示众。**为什么他重要**：他证明「唯独圣经 + 信徒皆祭司」在逻辑上会释放出社会革命——**如果每个人都能读经，那每个人都能读出「神要推翻压迫者」。** 路德的回应是把他交给刀剑，这个回应定义了此后新教与激进运动的关系。参见 {{路德宗}}、{{重洗派}}、{{农民战争}}。","see":["重洗派","路德宗"],"ch":["ch-10"]},"长老制":{"en":"presbyterian polity","def":"一种教会治理形式：由**牧师**与**平信徒长老**（*presbyteroi*）组成的议会共同治理教会，形成层层相连的议会体系——**堂会**（session）→ **区会**（presbytery）→ **大会**（synod）→ **总会**（general assembly）。**圣经依据**：新约中的 *presbyteros*（长老，徒 14:23、提前 5:17）与 *episkopos*（监督）被视为同一职分的两种称呼（这是长老派的关键论证）。**与主教制的区别**：主教制（天主教、圣公会、路德宗）认为主教是使徒的继承人，拥有超越长老的权柄；长老制认为**所有长老在权柄上平等**，只有「会议」的层级不同。**与会众制的区别**：会众制（浸信会、公理会）认为每个堂会完全自治，没有上级机构。**为什么它重要**：长老制的「多层议会」结构，被一些政治学者（如联邦党人文集的研究者）视为**联邦制**的一个模型来源——权力在多个层级上分配，而非集中于一点。参见 {{加尔文主义}}、{{清教徒}}。","see":["加尔文主义","清教徒"],"ch":["ch-11"]},"天召":{"en":"calling / vocation","def":"拉丁文 *vocatio*。**新教（尤其加尔文主义）的核心概念**：神呼召每个人从事某种世俗职业，而这个职业本身是神圣的——农夫、鞋匠、法官、母亲都是神的呼召，都能荣耀神。**与天主教的对照**：天主教传统区分「宗教生活」（修道、神职，被视为「更完美的呼召」）与「世俗生活」；新教取消了这一等级，**把世俗职业提升为神圣呼召**。**为什么它重要**：（1）它给了普通人的日常劳动以神学尊严；（2）它取消了修道主义的「更高道路」，导致新教地区修道院全部关闭；（3）**韦伯的论证**：《新教伦理与资本主义精神》认为，加尔文主义的「天召」观加上「预定论的不确定感」，产生了「在世俗职业中勤奋、节俭、自律」的伦理，而这恰好与早期资本主义的积累逻辑吻合。**韦伯的论证远比流行版本复杂**（他自己也强调「选择性亲和」而非单向因果）。参见 {{加尔文主义}}、{{预定论}}。","see":["加尔文主义","预定论"],"ch":["ch-11"]},"胡格诺派":{"en":"Huguenots","def":"16–18 世纪法国的加尔文派新教徒。名字来源不明（可能来自日内瓦的德语小称 *Eidgenosse*，「誓约同伴」）。**规模**：16 世纪后期约占总人口 10%，多为贵族、城市中产、手工业者（这与加尔文主义在荷兰、苏格兰的社会基础相似）。**关键事件**：**1572 年 8 月 24 日圣巴多罗买日大屠杀**——巴黎及各省约 5000–30000 名胡格诺被杀（这是 16 世纪最严重的宗教屠杀之一，教宗额我略十三世在罗马为此举行感恩弥撒）；1598 年《南特敕令》给予有限宽容；1685 年路易十四撤销，约 20 万胡格诺流亡（普鲁士、荷兰、英国、南非）。**为什么他们重要**：（1）他们发展出**抵抗权理论**（低层官员有权反抗暴君）——这是洛克《政府论》与美国《独立宣言》的思想源头之一；（2）流亡者把丝织、钟表、印刷技术带到普鲁士与英国，深刻影响了这些国家的工业发展。参见 {{加尔文主义}}、{{清教徒}}。","see":["加尔文主义","清教徒"],"ch":["ch-11"]},"清教徒":{"en":"Puritans","def":"16–17 世纪英国的改革运动，不是一个宗派。**主张**：留在英国国教内部（多数）但要求「进一步纯洁化」（*purify*）——废除主教制、废除公祷书中的「天主教残余」（祭衣、十字架、跪领圣餐、婚戒）、强调讲道、严格的个人与家庭纪律（守主日、禁赌禁戏）、强烈的反天主教意识。**三个阶段**：（1）伊丽莎白时期的教会内部改革（失败）；（2）1603 年詹姆斯一世「没有主教，就没有国王」后出现**分离派**，1620 年「五月花号」移民北美；（3）1640s 英国内战与威斯敏斯特会议（《威斯敏斯特信条》）。**所受批评**：（1）「纯洁化」没有终点，导致无穷分裂；（2）严格的道德纪律造成压抑（霍桑《红字》的原型）；（3）在马萨诸塞，清教徒自己建立了不宽容的政体（处死贵格会士、驱逐罗杰·威廉斯与安妮·哈钦森）。**遗产**：美国的「山巅之城」自我想象、工作伦理、教育（哈佛 1636、耶鲁 1701）、以及「美国例外论」的神学根源。参见 {{加尔文主义}}、{{长老制}}、{{公会议主义}}。","see":["加尔文主义","长老制","加尔文主义"],"ch":["ch-11","ch-13"]},"路德宗":{"en":"Lutheranism","def":"以马丁·路德（1483–1546）为源头的宗派家族，全球约 7000 万信徒。**核心信条**：（1）称义是神**法庭式的宣告**，基督的义**归算**给信徒（*iustitia imputata*），信徒「同时是义人与罪人」（*simul iustus et peccator*）；（2）圣经是唯一权威；（3）圣餐中基督的身体与血**真实临在**（同体论，*consubstantiatio*）；（4）单重预定（拣选无条件，但不强调弃绝的预定）。**信条文献**：《奥格斯堡信条》（1530）、《协和信条》（1577）。**分布**：德国、北欧（瑞典、丹麦、挪威、芬兰、冰岛——皆为国立教会）、北美（ELCA、LCMS）。**内部的第二次分裂**：路德死后 30 年，腓力派（梅兰希顿）与纯正路德派（格内西奥派）为「中间事」「圣餐」「基督论」「原罪」打了 30 年，1577 年《协和信条》试图调和但未真正解决。**与天主教的关系**：1999 年签署《关于称义教义的联合声明》，宣称在此问题上已无根本分歧。参见 {{称义}}、{{唯独信心}}、{{变体论}}、{{恩典}}。","see":["称义","唯独信心","变体论","恩典"],"ch":["ch-10"]},"重洗派":{"en":"Anabaptists","def":"希腊文 *ana-*（再）+ *baptizein*（洗）。16 世纪宗教改革中的「激进改革」一支，因主张**信徒洗礼**（拒绝婴儿洗礼）而得名（这是对手给的贬义名称，他们自称「弟兄」）。**起源**：1525 年 1 月 21 日苏黎世，格列伯为布劳罗克施洗。**核心主张**：（1）**信徒的教会**——教会是自愿聚集的信徒，不是地域性的全民机构；（2）**信徒洗礼**；（3）**门徒训练**——跟随耶稣是具体的生活方式，包括教会纪律；（4）多数群体主张**非暴力**、不宣誓、不任公职、政教分离。**被三方同时迫害**：天主教、路德宗、改革宗（1529 年帝国法令定为死刑）。**曼茨 1527 年在苏黎世被溺死**（讽刺性的刑罚）。**分支**：瑞士弟兄会、南德灵修派、荷兰门诺派、奥地利哈特派、以及明斯特的暴力派（被其他重洗派谴责）。**遗产**：今天约 210 万门诺派、37 万阿米什、5 万哈特派；其「信徒教会」直觉扩散到浸信会、贵格会、五旬节派、以及大部分华人独立教会。参见 {{路德宗}}、{{浸信会}}、{{加尔文主义}}。","see":["路德宗","浸信会","加尔文主义"],"ch":["ch-12"]},"浸信会":{"en":"Baptists","def":"16–17 世纪起源于英国的宗派家族，全球约 1 亿信徒，是最大的新教家族之一。**核心主张**：（1）**信徒洗礼**——只有自己认信的人受洗，通常全身浸水（婴儿洗礼无效）；（2）**政教分离**——教会不应由国家支持或控制；（3）**会众制**——每个堂会自治，无上级机构；（4）**唯独圣经**。**神学上分两支**：**加尔文派浸信会**（如美南浸信会中的改革宗派、司布真）与**阿米念派浸信会**（如自由意志浸信会）。**起源**：1609 年约翰·史密斯在阿姆斯特丹为一批英国分离派施洗（现代浸信会的起点）；1638 年罗杰·威廉斯在北美普罗维登斯建立第一个浸信会堂会。**注意**：浸信会与 16 世纪 {{重洗派}} 有**相似的直觉，但不同的起源**（浸信会源于英国分离派，不继承重洗派的非暴力与财产共享）。**分裂史**：1845 年美南浸信会因奴隶制与美北浸信会分裂；今天美国有数十个浸信会宗派。**它对中国教会影响极大**——多数华人独立教会在洗礼观与教会论上属浸信会式。参见 {{重洗派}}、{{加尔文主义}}、{{阿米念主义}}。","see":["重洗派","加尔文主义","阿米念主义"],"ch":["ch-12"]},"卫理公会":{"en":"Methodism","def":"18 世纪由约翰·卫斯理（1703–1791）与弟弟查尔斯发起的复兴运动，后发展为宗派家族，全球约 8000 万。**核心教义**：（1）**先在的恩典**（*prevenient grace*）——神在每个人心里先赐下普遍的光照，使堕落的人仍有能力回应福音；（2）**拣选基于预知的信心**（{{阿米念主义}}）；（3）**圣灵的见证**给信徒得救的确据；（4）**完全成圣**（今生可达到「完全爱神爱人」，不是无罪而是动机的纯洁）；（5）**社会圣洁**——个人得救必须带来对贫穷、奴隶制、童工的社会行动。**来历**：1729 年牛津「圣社」；1738 年 5 月 24 日卫斯理在阿尔德门街「心奇异地火热」；1784 年为美洲按立监督；1795 年与英国国教分离。**卫斯理终身是英国国教神父，从未正式脱离。** **组织创新**：会社（societies）→ 班会（classes，10–12 人互相问责）→ 支队（bands），是现代「小组教会」的原型；大量使用平信徒（包括女性）讲道。**分裂**：19 世纪因奴隶制分裂为南北；2024 年联合卫理公会因性议题正式分裂，保守派成立「全球卫理公会」（GMC）。**它的神学通过{{圣洁运动}}与{{五旬节派}}扩散到全球**——今日多数「阿米念式」福音派都可追溯到这里。参见 {{阿米念主义}}、{{恩典}}、{{圣洁运动}}。","see":["阿米念主义","恩典","圣洁运动","五旬节派"],"ch":["ch-14"]},"圣洁运动":{"en":"Holiness movement","def":"19 世纪从卫理公会发展出的运动，核心是**完全成圣**（*entire sanctification*）作为信主之后的「**第二次祝福**」（second blessing）——一次可经验的、瞬间的恩典工作，使人脱离罪的权势（不是无罪，而是不再「自愿犯罪」）。**代表**：菲比·帕尔默（Phoebe Palmer，《祭坛之路》1845）、以及由此产生的宗派：拿撒勒人会（1908）、神的教会（Anderson, Indiana）、救世军（部分）。**为什么它重要**：**它是五旬节运动的直接前身**——五旬节派只是加了一句：「这个『第二次祝福』的证据，就是说方言。」参见 {{卫理公会}}、{{五旬节派}}、{{恩典}}。","see":["卫理公会","五旬节派","恩典"],"ch":["ch-15"]},"基督教科学会":{"en":"Christian Science","def":"1879 年由**玛丽·贝克·艾迪**（Mary Baker Eddy，1821–1910）在波士顿创立的新兴宗教，全球约 10 万信徒。**核心主张**：（1）**物质是幻象**，真实的只有「心」（*Mind*）与「灵」；（2）疾病是「必死的心」（*mortal mind*）的错误信念，因此真正的医治是**祈祷与心灵的正确认识**，不是药物；（3）耶稣是「基督」的化身，但不是神，而是最伟大的灵性导师；（4）艾迪的《科学与健康附圣经之钥》（1875）是解释圣经的权威。**为什么它出现**：艾迪本人经历过一次据称由祈祷带来的痊愈（1866），由此发展出整套体系。**所受批评**：（1）拒绝医疗导致可预防的死亡（有多起法律案例，包括儿童因未获治疗而死亡）；（2）「物质是幻象」在逻辑上自我否定（若物质是幻象，那么这本书也是幻象）；（3）对圣经的解读高度选择性。**奇特的遗产**：《基督教科学箴言报》（1908 创刊）是国际知名的严肃媒体——一个边缘教派的报纸成了主流新闻业的一部分。参见 {{基要派}}、{{福音派}}。","see":["基要派","福音派"],"ch":["ch-15"]},"东方礼天主教会":{"en":"Eastern Catholic Churches","def":"保留东方礼仪与法典、同时承认罗马主教首席权的 23 个「自治教会」（*sui iuris*），共约 1800 万信徒。包括马龙派、乌克兰希腊礼天主教会、梅尔基塔礼、加色丁礼、叙利亚-马拉巴礼、叙利亚-马兰卡拉礼等。**来历**：从 16 世纪起，一批东方教会因政治与文化压力（奥斯曼统治、拉丁传教士活动）与罗马联合——1596 年布列斯特联合（乌克兰）、1701 年马龙派正式联合、1552 年马拉巴礼分裂。**它示范了一条合一路径**：「不同礼仪 + 同一信仰 + 一个首脑」。**争议**：（1）东正教与{{东方正统教会}}视之为「挖墙脚」（贬义词「联合主义」*uniatism*）；（2）1993 年 Balamand 文件承认「联合主义」不再是合一的模式；（3）内部长期存在「拉丁化」与「去拉丁化」的拉锯（梵二后多数回归东方礼仪）。参见 {{东正教}}、{{东方正统教会}}、{{教宗首席权}}。","see":["东正教","东方正统教会","教宗首席权"],"ch":["ch-8"]},"轮回":{"en":"saṃsāra, 轮回","def":"梵文 *saṃsāra*（「流转、漂泊」）。印度教、佛教、耆那教共享的宇宙观：**众生依业力（*karma*）在六道（或五道）中不断生死流转**，没有起点，直到解脱。**与基督教的对照**：（1）基督教是「**一次生命、一次审判**」（来 9:27），印度教与佛教是「无数次机会」；（2）基督教的救恩是**关系性的**（与神和好），印度教与佛教的解脱是**从轮回中出离**（*moksha* / *nirvāṇa*）；（3）基督教的「永恒」是**终点**（新天新地），轮回的「永恒」是**循环**。**为什么这个差别重要**：它决定了「一生的选择有多重」——基督教说「极重」，轮回说「还有机会」。**而它也是「为什么只有一次」这个质疑的来源**（见第 22 章）。参见 {{涅槃}}、{{业}}。","see":["涅槃","业"],"ch":["ch-22"]},"涅槃":{"en":"nirvāṇa","def":"梵文/巴利文，字面「吹熄、熄灭」。佛教的终极目标：**贪、瞋、痴的止息**，因而**苦的止息**，从轮回中解脱。**必须避免的误解**：（1）它不是「死亡」（佛陀在菩提树下证悟时即入涅槃，仍活了 45 年）；（2）它不是「虚无」（佛陀拒绝回答「如来死后存在与否」这类问题，称为「**无记**」*avyākata*）；（3）它不是「与神合一」（佛教不设创造主）。**与基督教「天堂」的对照**：天堂是**与神同在的关系状态**（位格性的），涅槃是**苦的止息**（不是位格性的联合）。**这个差别是两种救恩观的分水岭**——一个是「与谁在一起」，一个是「苦有没有了」。参见 {{轮回}}、{{业}}。","see":["轮回","业"],"ch":["ch-22"]},"业":{"en":"karma","def":"梵文，字面「行为、作为」。印度教、佛教、耆那教共享的因果法则：**每一个有意的行为都在宇宙中留下痕迹，并在今生或来世结果**。**与基督教「报应」的区别**：（1）业是**自动的、非位格的**因果（不需要一个审判者）；报应是**位格性的**（神审判）；（2）业的作用跨越**多生多世**；报应在一生或终末；（3）业可以被「回向」或通过修行消解；报应只能通过赦免或代赎解决。**为什么这个区别重要**：它决定了「恶人为何兴旺」这个问题的答案——业说「他前世的善业还没用完」，报应说「审判还没到」。**而两者的牧养后果完全不同**：业容易导致「受害者活该」（这也是印度种姓制度被业报论合理化的原因），报应则保留了「不义必须被纠正」的盼望。参见 {{轮回}}、{{涅槃}}。","see":["轮回","涅槃"],"ch":["ch-22"]},"儒家":{"en":"Confucianism","def":"以孔子（前 551–479）为源头的中国思想传统，核心是**人伦与修身**：仁、义、礼、智、信；五伦（君臣、父子、夫妇、兄弟、朋友）；修身、齐家、治国、平天下。**对基督教的意义**：（1）它提供了「**道德不需要神**」的最完整论证——人可以通过学习与修养成为君子（「人皆可以为尧舜」孟子）；（2）「未知生，焉知死」（论语·先进）把注意力从彼岸拉回此岸；（3）「敬鬼神而远之」（论语·雍也）不否认鬼神，但拒绝依赖它们。**基督教的典型回应**：「人皆可以为尧舜」在实践上从未实现；儒家缺少「赦免」的机制——当你做不到时怎么办？**儒家的再回应**：「过则勿惮改」「改过迁善」——人不需要外部代赎，需要的是知耻与自省。**为什么这一条最戳中要害**：它提出了「一个一生行善的人，凭什么因不信而被定罪」这个问题，而基督教的「原罪」答案在中文语境里几乎无法被听进去。参见 {{原罪}}、{{报应}}。","see":["原罪","报应"],"ch":["ch-22"]},"道家":{"en":"Daoism","def":"以老子、庄子为源头的中国思想传统，核心是**道**：「道可道，非常道」（老子·一章）；「道生一，一生二，二生三，三生万物」（四十二章）；「道常无为而无不为」（三十七章）；「反者道之动」（四十章）。**对基督教的批评**：（1）道是**无为**的——不干预、不说教、不审判；（2）道**不可被固定、不可被命名**——而基督教说「道成了肉身」，有一个具体的名字（耶稣），在道家看来这是把不可说的「道」缩小成了一个可被指认的对象；（3）道通过**柔弱、退让、不争**来运作，与「神用大能审判世界」的形象相反。**一个有意思的对照**：基督教的{{否定神学}}（「神不是任何我们可以命名的东西」）与「道可道，非常道」惊人地相似——**但基督教同时说「道成了肉身」，这是道家不会说的。分歧就在这一句上。** **翻译史注**：约翰福音 1:1 的希腊文 *logos* 被译成中文「道」，让读者以为基督教在讲老子的道；但希腊的 *logos* 是**理性的秩序**（可被言说、可被理解），老子的「道」是**不可言说的根源**。参见 {{否定神学}}、{{逻各斯}}。","see":["否定神学","逻各斯"],"ch":["ch-22"]},"报应":{"en":"retribution, 报应","def":"中国民间信仰的核心观念：**「善有善报，恶有恶报，不是不报，时候未到」**——一个道德的宇宙秩序，不需要一个位格性的审判者。**与基督教「审判」的区别**：（1）报应是**自动的、内在于宇宙的**；审判是**位格性的、终末的**；（2）报应常在**家族**中实现（「积善之家必有余庆」易经·坤文言）；审判是**个人**的（结 18:20）；（3）报应可以**讨价还价**（积德、做功德、改运）；审判不能。**为什么这个区别重要**：它解释了为什么中国读者听到「神审判世人」时，常常觉得「多余」——因为宇宙已经有报应了，为什么还需要一个审判者？**而基督教的回答是**：报应无法解释「恶人为何兴旺、义人为何受苦」这个经验事实（这正是约伯记与诗篇 73 篇的问题），所以需要一个**终末的审判**来纠正。参见 {{儒家}}、{{业}}。","see":["儒家","业"],"ch":["ch-22"]},"五旬节派":{"en":"Pentecostalism","def":"20 世纪最重要的基督教运动，全球约 6 亿（含{{灵恩派}}），是基督教史上增长最快的形态。**核心主张**：（1）**圣灵的洗**是信主之后的第二次经验（不同于重生）；（2）**说方言**（*glossolalia*）是圣灵之洗的「**初始证据**」（*initial evidence*，这是五旬节派最独特的教义）；（3）**神迹医治、预言、赶鬼**在今天仍然有效；（4）末日临近，传福音是紧急任务。**起源**：1901 年帕勒姆在堪萨斯托皮卡提出「初始证据」；1906–1909 年西摩在洛杉矶**阿苏萨街**的复兴（种族融合的聚会，持续三年）；1914 年神召会成立。**内部多样**：从极其保守的「独一神格五旬节派」（否认三位一体）到主教的「神召会」，差别极大。**为什么能跨越文化**：它不依赖神学教育、礼仪传统、教堂建筑——只需要一个人、一个房间、以及「神今天仍然在工作」的信念。**批评**：（1）「初始证据」的教义在哥林多前书 12–14 章中缺乏依据（保罗说「岂都是说方言的吗」林前 12:30）；（2）情绪化聚会容易走向操纵与分裂；（3）其「成功神学」变体剥削穷人。参见 {{灵恩派}}、{{圣洁运动}}、{{卫理公会}}。","see":["灵恩派","圣洁运动","卫理公会"],"ch":["ch-16"]},"灵恩派":{"en":"Charismatic Movement","def":"1960 年代起进入主流教会的{{五旬节派}}式运动，全球数亿信徒。**与五旬节派的区别**：灵恩派**不要求「说方言是必须的证据」**，它强调「圣灵的能力」可以在任何宗派中运行。**关键节点**：1960 年圣公会牧师丹尼斯·班尼特公开宣布「被圣灵充满」（被解除职务）；1967 年天主教灵恩复兴在杜肯大学开始；1970–80 年代「第三波」（彼得·魏格纳）；1990 年代「多伦多祝福」「布朗斯维尔复兴」。**意义**：它是 20 世纪唯一一个**跨越宗派边界**的运动——天主教、圣公会、路德宗、长老会、浸信会、以及独立教会里都有灵恩派。**代价**：它带来了新的分裂（灵恩派与非灵恩派在同一宗派内的冲突）。参见 {{五旬节派}}、{{天主教}}。","see":["五旬节派"],"ch":["ch-16"]},"福音派":{"en":"Evangelicalism","def":"1940 年代从{{基要派}}中分化出来的跨宗派运动，全球约 3–4 亿。**四个标志**（David Bebbington 的经典概括）：（1）**归信主义**（conversionism，个人重生的必要性）；（2）**圣经主义**（biblicism，圣经是最高权威）；（3）**十字架中心**（crucicentrism，基督的代赎是核心）；（4）**行动主义**（activism，传福音与社会行动）。**与基要派的关键分歧**：基要派主张**分离**（不与自由派、天主教、甚至不够纯正的福音派合作）；福音派主张**合作**（在核心教义上合一，其他问题宽容）。**代表**：葛培理、《今日基督教》（1956）、富勒神学院（1947）。**批评**：（1）「福音派」太宽泛，几乎什么都可以叫福音派；（2）它与美国政治保守主义的绑定使福音沦为政治工具；（3）「圣经主义」在实践中常变成「选择性字面主义」。参见 {{基要派}}、{{五旬节派}}。","see":["基要派","五旬节派"],"ch":["ch-16"]},"基要派":{"en":"Fundamentalists","def":"20 世纪初美国新教内部的一场运动，名字来自 1910–1915 年出版的十二册《**基要**》（*The Fundamentals*）。**五个基要**：（1）圣经的**无误**（*inerrancy*）；（2）基督的**神性**；（3）基督的**童贞女降生**；（4）基督的**代赎之死**；（5）基督的**身体复活**与**再来**。**历史**：1925 年**斯科普斯审判**（关于进化论）使基要派在舆论上失败，此后退出公共领域，转入亚文化（教会、学校、出版社、广播）。**与{{福音派}}的分歧**：基要派主张**分离**（不与自由派、天主教、甚至不够纯正的福音派合作），福音派主张**合作**。**批评**：（1）「圣经无误」是 19 世纪普林斯顿神学家（贺治、华腓德）为了对抗自由派而提出的，不是古代教会的信条；（2）选择性字面主义（坚持创世记 6 天，却不坚持利 19:19 的混纺禁令）；（3）拒绝现代学术导致自我隔绝与反智。**注意**：中文语境里「基要主义」常被泛化为「一切保守宗教立场」，甚至指伊斯兰极端主义——但它有严格的历史所指。参见 {{福音派}}、{{原教旨主义}}。","see":["福音派"],"ch":["ch-16"]},"天主教":{"en":"Catholic Church","def":"全球最大的基督教共同体（约 13.9 亿），以罗马主教（教宗）为首。**核心特征**：（1）**教宗首席权**——罗马主教是彼得的继承人，对普世教会拥有直接、普遍、最高的管辖权；（2）**教宗不可错误**（1870 年定义，仅限 *ex cathedra* 的信仰与道德定义，历史上只用过两次）；（3）**七件圣礼**（洗礼、坚振、圣体、告解、终傅、圣秩、婚配）；（4）**{{变体论}}**——圣餐中饼酒的实体变为基督的身体与血；（5）**{{炼狱}}**与圣徒相通；（6）**圣经与传统**并列为启示来源（1546 年特伦托会议）；（7）马利亚的四条信理：{{生神者}}（431）、终身童贞、无原罪（1854）、升天（1950）。**关键节点**：11 世纪东西方分裂 → 1075 年教宗革命 → 1545–1563 特伦托会议（对宗教改革的系统回应）→ 1870 年梵一（教宗不可错误）→ 1962–1965 梵二（礼仪本地化、宗教自由、对犹太教与伊斯兰教的正面表述）。**要解决的问题**：「谁是教会最终的裁判者？」答案是教宗——这给了它极强的统一性，也给了它极强的可批评性。**主要批评**：（1）教宗首席权在古代教会没有依据；（2）「不可错误」是 1870 年的发明；（3）性侵危机暴露了圣统制的问责失灵；（4）女性按立与性伦理立场受现代人权话语批评。**内部张力**：传统派（SSPX）vs 改革派（德国 Synodaler Weg）；拉美与非洲的快速增长 vs 欧洲的急剧衰退。参见 {{教宗首席权}}、{{变体论}}、{{炼狱}}、{{东正教}}。","see":["教宗首席权","变体论","炼狱","东正教"],"ch":["ch-7","ch-23"]},"詹森主义":{"en":"Jansenism","def":"17–18 世纪天主教内部的恩典论运动，得名于荷兰神学家**詹森**（Cornelius Jansen，1585–1638）的遗著《奥古斯丁》（1640）。**主张**：奥古斯丁式的恩典论——人完全无能，恩典不可抗拒；只有被预定的人才能行真正的善；频繁领圣餐需要极高的道德准备。**中心**：巴黎郊外的**皇港修道院**（Port-Royal）；帕斯卡的《致外省人信札》（1656–57）为它辩护，是法国文学的经典。**要解决的问题**：天主教在特伦托会议之后，是否过度倒向了「人的合作」，从而失去了奥古斯丁的恩典论？**论敌**：耶稣会（主张更宽和的道德神学）、教宗（1653 年《机会主义》通谕、1713 年《独生子》通谕谴责）。**所受反驳**：（1）在实践中导致「只有极少数人能领圣餐」的严苛；（2）被指为加尔文主义的伪装；（3）对教会权威的抵抗（「沉默服从」策略）被视为不服从。**结局**：1713 年后被镇压，皇港修道院 1709 年被拆毁。**但影响深远**：帕斯卡、拉辛、以及法国天主教的反现代主义气质；「詹森主义」在今天的法语里仍指一种严苛的道德主义。参见 {{恩典}}、{{奥古斯丁}}、{{预定论}}。","see":["恩典","奥古斯丁","预定论"],"ch":["ch-6","ch-23"]},"普救论":{"en":"Universalism / apokatastasis","def":"主张所有灵魂最终都会得救（*apokatastasis*，万物复原）；地狱不是永恒的，而是**炼净的**；神的爱最终会胜过一切抗拒。**来历**：**奥利金**（约 185–254）是最早的系统提出者（《论首要原理》）；19 世纪美国的**霍普金斯**（Hosea Ballou）与**普世教会**（1793 年成立）把它变成一场运动；20 世纪**卡尔·巴特**与**冯·巴尔塔萨**（《我们敢希望什么》）以更谨慎的方式重提；21 世纪 David Bentley Hart《一切都会好起来》（2019）再次引发争论。**要解决的问题**：如果神是全善全能的，永恒的地狱怎么可能存在？——这与「恶的问题」同构，但方向相反：不是「恶否证神」，而是「永刑否证神的爱」。**论敌**：主流教会（奥利金主义 553 年被谴责；奥古斯丁主张永刑；宗教改革后的信条大多明确肯定永刑）。**所受反驳**：（1）圣经明确说「永刑」（太 25:46）、「不灭的火」（可 9:48）——「永」的希腊文 *aiōnios* 是否可理解为「一个时代」，是核心争点；（2）若人人得救，传福音与悔改的紧迫性被削弱；（3）它似乎取消了人的自由。**现状**：作为宗派的普世教会 1961 年与一位论派合并；**但作为一种神学立场，它在 21 世纪迅速增长**。参见 {{末世论}}、{{救赎}}、{{奥利金}}。","see":["末世论","救赎","奥利金"],"ch":["ch-3","ch-23"]},"普利茅斯弟兄会":{"en":"Plymouth Brethren","def":"1827–1830 年代在都柏林与普利茅斯兴起的运动，核心人物是**达秘**（John Nelson Darby，1800–1882）。**主张**：拒绝宗派、拒绝神职（认为神职制度是「尼哥拉党」的罪）、每周擘饼纪念主、强调「教会是基督身体」的合一（因此不取名、不登记）。**两支**：「封闭支」（*Exclusive*，严守达秘的教会论，彼此排斥）与「开放支」（*Open*，更宽和）。**影响**：达秘的《圣经概要》与**{{时代论}}**通过**司可福圣经**（1909）传入美国，深刻塑造了 20 世纪福音派的末世论。**所受批评**：（1）封闭支的「彼此隔绝」造成大量分裂；（2）「拒绝神职」在实践中发展出另一种非正式的权威（「有恩赐的弟兄」）；（3）它对「宗派」的否定本身是一种宗派立场。**现状**：约 100 万信徒，主要在英国、印度、以及英语世界。参见 {{时代论}}、{{基要派}}。","see":["时代论","基要派"],"ch":["ch-15","ch-23"]},"时代论":{"en":"Dispensationalism","def":"一种末世论解经体系，由**达秘**（J. N. Darby）在 1830 年代发展，经**司可福圣经**（1909）与**达拉斯神学院**（1924）系统化，深刻塑造了 20 世纪美国福音派。**核心主张**：（1）历史被分为七个「时代」（dispensations），神在每个时代用不同的方式对待人；（2）**教会与以色列严格区分**——教会不是「真以色列」，神对以色列的应许仍然字面有效；（3）末世论的核心是「**秘密被提**」（secret rapture）：基督暗中来提走教会，然后地上有七年大灾难，然后基督公开再来、建立千禧年国度。**要解决的问题**：如何把整部圣经读成一个连贯的「神的计划」？**论敌**：改革宗（**{{圣约神学}}**认为只有一个约、教会是「真以色列」）、历史性前千禧年派（不承认「秘密被提」）、主流学术（历史批判学否定达秘的解经）。**所受反驳**：（1）「七个时代」的划分没有经文依据；（2）「秘密被提」在 1830 年之前没有教会传统——这是最致命的一条；（3）它把以色列与教会切得太开，导致一种政治化的末世论（美国福音派对以色列的支持常以此为基础）。**影响**：《末日迷踪》（*Left Behind*，1995–2007，销量 6500 万册）把它带进大众文化。**它对美国政治的影响，远超它的人口比例。** 参见 {{普利茅斯弟兄会}}、{{千禧年}}、{{末世论}}。","see":["普利茅斯弟兄会","千禧年","末世论"],"ch":["ch-16","ch-23"]},"圣约神学":{"en":"covenant theology","def":"改革宗的标准解经框架：把整部圣经读成**一个约**（或两个约：**行为之约** *covenant of works* 与**恩典之约** *covenant of grace*）的展开，而不是七个「时代」。**核心主张**：（1）神与亚当立行为之约（生命之约），亚当失败；（2）神与基督立救赎之约，并在历史中与挪亚、亚伯拉罕、摩西、大卫立约，最终在基督里成全；（3）**教会是「真以色列」**，神对以色列的应许在基督与教会中应验（这是与{{时代论}}最根本的分歧）。**代表文献**：《威斯敏斯特信条》（1646）、霍志恒（Geerhardus Vos）的圣经神学、以及当代的「新圣约神学」（New Covenant Theology，稍有不同）。**为什么它重要**：它是**以色列与教会关系**这个问题的两个主要答案之一——时代论说「两条线」，圣约神学说「一条线」。**这个分歧直接影响了美国福音派对以色列与中东政策的立场。** 参见 {{时代论}}、{{加尔文主义}}、{{取代论}}。","see":["时代论","加尔文主义","取代论"],"ch":["ch-16","ch-23"]},"胡特尔派":{"en":"Hutterites","def":"{{重洗派}}的一支，1528 年由**雅各布·胡特**（Jakob Hutter）在奥地利蒂罗尔建立，今天约 5 万人。**主张**：实行**财产共享**（*Gütergemeinschaft*）——不是共产主义，而是「自愿的、以爱为基础的互助」；拒绝个人财产、拒绝参军、拒绝宣誓；集体农庄（*Bruderhof*，兄弟庄）组织生产与生活。**要解决的问题**：「凡物公用」（徒 2:44–45）是否是基督徒生活的规范？答案是：是，至少对愿意的人。**迁徙路线**：蒂罗尔 → 摩拉维亚 → 匈牙利 → 乌克兰 → 北美（1874–1879）；今天主要分布在美国（南达科他、蒙大拿）与加拿大（阿尔伯塔、马尼托巴）。**所受批评**：（1）财产共享容易导致家长式的权威（领袖的绝对权力）；（2）拒绝现代技术使成员难以适应外部社会；（3）与「个人责任」的现代伦理冲突。**现状**：**全球最成功的自愿共产主义实验之一**——经济上极为成功，人口增长迅速。与阿米什、门诺派并列为重洗派三大存续分支。参见 {{重洗派}}、{{卫理公会}}。","see":["重洗派"],"ch":["ch-12","ch-23"]},"圣多马基督徒":{"en":"St. Thomas Christians / Nasrani","def":"印度西南部（喀拉拉邦）的古老基督教群体，传统上认为由**使徒多马**于公元 52 年建立，今天约 600–700 万。**特征**：礼仪属**叙利亚东方礼**；长期与{{东方教会}}（聂斯脱里派）共融；使用叙利亚语（部分支派至今如此）。**关键事件**：1498 年达伽马到达印度时，当地已有约 200 万基督徒；16 世纪葡萄牙人强制拉丁化；**1653 年「库南十字架誓言」**（*Koonan Cross Oath*）是反抗拉丁化的标志，此后分裂为多个支派。**今天的分支**：叙利亚-马拉巴礼天主教会（与罗马联合，最大）、马兰卡拉叙利亚正教会、马兰卡拉东正教会、马兰卡拉马尔多马叙利亚教会、以及多个新教支派。**为什么它重要**：它是**「基督教不是西方宗教」这句话最有力的证据**——一个比欧洲大多数教会更古老的、本土的、非西方的基督教社群。参见 {{东方正统教会}}、{{聂斯脱里派}}。","see":["东方正统教会","聂斯脱里派"],"ch":["ch-8","ch-23"]},"阿米什":{"en":"Amish","def":"{{门诺派}}的一个分支，1693 年由瑞士裔门诺派领袖**雅各布·阿曼**（Jakob Ammann）因主张更严格的「回避」（*Meidung*，对开除者的社交隔绝）而分裂出来。**特征**：（1）**有意识的文化隔离**——不用汽车、不用电网、穿 18 世纪服装、只用单室学校；（2）拒绝现代技术（不是「落后」，而是认为某些技术会瓦解共同体）；（3）「 Rumspringa」（青少年期的自由探索期）之后自愿受洗、终身委身。**分布**：今天约 37 万，主要在美国宾夕法尼亚、俄亥俄、印第安纳，以及加拿大安大略。**所受批评**：（1）「回避」制度造成家庭破裂与心理创伤（近年有大量前阿米什人的证词）；（2）女性与儿童在共同体中的从属地位；（3）拒绝高等教育限制了成员的选择。**但也要注意**：阿米什的人口每 20 年翻一番，保留率高达 85%——**它是现代社会中「自愿的、非暴力的文化隔离」最成功的案例之一。** 参见 {{重洗派}}、{{胡特尔派}}。","see":["重洗派","胡特尔派"],"ch":["ch-12","ch-23"]}};
window.__TIMELINE__ = [{"year":"约前 516","sort":-516,"type":"event","text":"第二圣殿重建完成。此后五百年的犹太教（「第二圣殿时期」）内部出现法利赛、撒都该、爱色尼、奋锐等派别，是基督教诞生的母体。"},{"year":"约前 250","sort":-250,"type":"text","text":"七十士译本（Septuagint, LXX）在埃及逐步译成：希伯来圣经被译为希腊文，把「耶和华」译作 kyrios（主）。这一步为「耶稣是主」这句宣告提供了语言学条件。"},{"year":"约前 20–公元 50","sort":-20,"type":"person","text":"犹太哲学家斐洛（Philo of Alexandria）活动，用希腊哲学（尤其柏拉图主义）系统解释摩西五经，是寓意解经的先行者。"},{"year":"约 4 BCE","sort":-4,"type":"person","text":"耶稣诞生（传统纪年有误，大多数学者倾向公元前 6–4 年）。"},{"year":"约前 4","sort":-4,"type":"person","text":"耶稣诞生（传统纪年有误，大多数学者倾向公元前 6–4 年）。"},{"year":"约 30/33","sort":33,"type":"event","text":"耶稣在耶路撒冷被罗马总督本丢·彼拉多处死；门徒宣称其复活，运动由此开始。"},{"year":"约 35–50","sort":40,"type":"event","text":"「耶路撒冷会议」前后，外邦人是否须受割礼守律法之争；保罗的「因信称义」路线胜出，基督教与犹太教开始分道。"},{"year":"49–64","sort":50,"type":"event","text":"保罗书信陆续写成，是现存最早的基督教文献。"},{"year":"52","sort":52,"type":"event","text":"传统认为使徒多马抵达印度（喀拉拉邦），圣多马基督徒社群的起源。"},{"year":"约 50–60","sort":55,"type":"text","text":"《约翰福音》中的「道」（logos）一词，把犹太教的「神的话语」与希腊哲学的「宇宙理性」缝合，成为后世基督论争论的缝线。"},{"year":"64","sort":64,"type":"event","text":"罗马大火后尼禄迫害基督徒，是第一次有记载的帝国级迫害。"},{"year":"70","sort":70,"type":"event","text":"罗马摧毁耶路撒冷圣殿；犹太教与基督教彻底分流的条件成熟。"},{"year":"70","sort":70,"type":"event","text":"罗马摧毁耶路撒冷圣殿；犹太教与基督教彻底分流的条件成熟。撒都该派随之消亡，法利赛派成为拉比犹太教的祖先。"},{"year":"约 90–100","sort":95,"type":"event","text":"雅麦尼亚（Jamnia）拉比会议前后，《Birkat haMinim》（「祝福异端」，实为诅咒文）加入十八祝福，把「拿撒勒人」逐出会堂。"},{"year":"约 112","sort":112,"type":"person","text":"小普林尼致图拉真书信，最早的外邦人目击记录：基督徒「在固定的日子聚会，向基督如向神一样唱诗」。"},{"year":"约 144","sort":144,"type":"event","text":"马吉安被逐出罗马教会；其删节版圣经促使教会形成「新约正典」的意识。"},{"year":"约 156","sort":156,"type":"person","text":"士每拿主教坡旅甲殉道；早期「正统/异端」界线开始成形。"},{"year":"约 155–160","sort":157,"type":"person","text":"查士丁在罗马著《第一护教辞》，提出「种子理性」：希腊哲学是神给外邦人的预备福音。"},{"year":"约 165","sort":165,"type":"person","text":"查士丁殉道。"},{"year":"约 178","sort":178,"type":"text","text":"塞尔苏斯著《真道》（Alēthēs Logos），古代最系统的反基督教著作；原文已佚，靠奥利金《驳塞尔苏斯》的引用得以部分复原。"},{"year":"约 180","sort":180,"type":"event","text":"爱任纽《驳异端》成书，系统地把诺斯替派命名为「异端」，并构造了「使徒统绪」作为正统标准。"},{"year":"约 197","sort":197,"type":"text","text":"特土良开始以拉丁文写作，首创 Trinitas（三位一体）、persona（位格）、substantia（本质）等术语——反哲学的人为西方正统提供了哲学语法。"},{"year":"约 200","sort":200,"type":"person","text":"特土良活跃；首次用拉丁文系统阐述三位一体（《驳帕克西亚》），「三位一体」「位格」「本质」的拉丁术语逐渐定型。"},{"year":"约 200","sort":200,"type":"event","text":"罗马帕拉丁山出现「Alexamenos 崇拜他的神」涂鸦：被钉十字架者长着驴头，是最早的反基督教图像讽刺。"},{"year":"约 204–270","sort":204,"type":"person","text":"普罗提诺活动，新柏拉图主义成型：太一—心智—灵魂的三级流溢结构，成为 4 世纪教义争论的默认哲学框架。"},{"year":"约 215–254","sort":215,"type":"person","text":"奥利金主持亚历山大教理学校，著《论首要原理》《六经合璧》；三层寓意解经影响整个东方神学，其部分推论后来被谴责。"},{"year":"约 232–305","sort":232,"type":"person","text":"波菲利著十五卷《驳基督徒》，古代最专业的反基督教著作；448 年被下令焚毁，仅存残篇。"},{"year":"249–251","sort":250,"type":"event","text":"德西乌斯迫害；大量信徒弃教（lapsi），引发「弃教者能否重新入教」大争论——诺洼天派分裂。"},{"year":"249–251","sort":250,"type":"event","text":"德西乌斯迫害。大量基督徒交出圣经（traditores）或献祭，引发「弃教者能否回归」之争，催生诺洼天派。"},{"year":"251","sort":251,"type":"schism","text":"诺洼天被对立祝圣为罗马主教，形成诺洼天派；主张教会不能赦免背教之罪。"},{"year":"268","sort":268,"type":"event","text":"安提阿会议谴责撒摩萨塔的保罗（动态君主论）：耶稣是被神充满的人，而非永恒的神。"},{"year":"约 270","sort":270,"type":"person","text":"萨摩萨塔的保罗被安提阿会议谴责，其「基督只是被神充满的人」的立场成为后来「嗣子论」的先声。"},{"year":"约 270","sort":270,"type":"event","text":"萨伯里乌（Sabellius）在罗马活动，形态论（一个神三种面具）被谴责，成为后世指控「本体同一」的常用武器。"},{"year":"303–313","sort":303,"type":"event","text":"戴克里先大迫害；313 年君士坦丁与李锡尼颁布《米兰敕令》，基督教合法化。"},{"year":"303–311","sort":303,"type":"event","text":"戴克里先大迫害，是罗马最后一次、也是最猛烈的一次迫害；大量「交出圣经者」成为多纳图派分裂的导火索。"},{"year":"311–314","sort":311,"type":"event","text":"多纳图派分裂：关于在大迫害中交出圣经的主教所施行的圣礼是否有效。"},{"year":"312","sort":312,"type":"event","text":"君士坦丁在米尔维安桥战役前见异象，以基督标记得胜；次年与李锡尼颁布《米兰敕令》，基督教获得合法地位。"},{"year":"318","sort":318,"type":"event","text":"阿里乌与亚历山大主教亚历山大公开冲突，三位一体大论战爆发。"},{"year":"**325**","sort":325,"type":"council","text":"**尼西亚第一次大公会议**：谴责阿里乌，颁布以 {{本体同一}} 为核心的信经。皇帝君士坦丁主持（或至少召集）。"},{"year":"325","sort":325,"type":"council","text":"第一次尼西亚会议（君士坦丁召集，约 250–300 位主教）：通过《尼西亚信经》初版，关键句「受生而非被造，与父本体同一」；谴责阿里乌。争论并未结束。"},{"year":"328","sort":328,"type":"person","text":"{{亚他那修}} 成为亚历山大主教，此后五次被流放，成为尼西亚派的象征。"},{"year":"328","sort":328,"type":"person","text":"亚他那修任亚历山大主教，此后半个世纪五次被流放，累计十七年，被称为「亚他那修对抗全世界」。"},{"year":"330s–350s","sort":340,"type":"event","text":"阿里乌势力在帝国宫廷得势；由于尼西亚会议后数十年间尼西亚派屡遭压制，教会史家常称之为「阿里乌危机」的后半段。"},{"year":"362","sort":362,"type":"person","text":"「叛教者」尤利安皇帝著《驳加利利人》，最后一次试图以学术与政策手段复兴异教；次年死于波斯战役。"},{"year":"367","sort":367,"type":"text","text":"亚他那修第 39 封节期书信列出与今天完全相同的新约 27 卷，是新约正典定型的关键文献。"},{"year":"**381**","sort":381,"type":"council","text":"**君士坦丁堡第一次大公会议**：确认三位一体，扩充信经，谴责 {{亚玻理拿留主义}} 与 {{马其顿尼主义}}。"},{"year":"381","sort":381,"type":"council","text":"第一次君士坦丁堡会议：扩订信经（加入关于圣灵的条款），谴责阿波利拿里主义，形成今天通行的《尼西亚—君士坦丁堡信经》。"},{"year":"约 386","sort":386,"type":"person","text":"奥古斯丁皈依（《忏悔录》卷八「拿起来读」），此后成为西方拉丁神学的奠基人。"},{"year":"411","sort":411,"type":"event","text":"迦太基会议（奥古斯丁主导）谴责多纳图派，北非教会分裂告一段落，但地下延续至 7 世纪阿拉伯征服。"},{"year":"418","sort":418,"type":"council","text":"迦太基会议谴责伯拉纠主义：人靠自己不能不行罪，恩典是内在的恩赐而非外在的帮助。"},{"year":"约 428","sort":428,"type":"person","text":"聂斯脱里任君士坦丁堡主教，攻击「生神者」称号，基督论之争爆发。"},{"year":"**431**","sort":431,"type":"council","text":"**以弗所大公会议**：谴责 {{聂斯脱利}}，确认「{{上帝之母}}」（Theotokos）。{{东方教会}} 由此与主流分裂。"},{"year":"431","sort":431,"type":"council","text":"以弗所会议：谴责聂斯脱里，确认马利亚为「生神者」（Theotokos）。会议在混乱与对立会议中通过，聂斯脱里的追随者东迁波斯。"},{"year":"449","sort":449,"type":"council","text":"以弗所第二次会议（「强盗会议」）：狄奥斯库若以暴力压制反对者，恢复欧迪奇名誉。罗马主教利奥称之为 latrocinium。"},{"year":"**451**","sort":451,"type":"council","text":"**迦克墩大公会议**：定义基督「一位格、二性」。{{东方正统教会}}（科普特、叙利亚、亚美尼亚等）拒绝接受，史称 {{一性论}} 分裂。"},{"year":"451","sort":451,"type":"council","text":"迦克墩会议（约 500 位主教）：定义「一个位格、两个本性，不相混淆、不改变、不分割、不分离」。埃及、叙利亚、亚美尼亚教会拒绝接受，形成东方正统教会——基督教史上按人口最严重的一次永久分裂。"},{"year":"529","sort":529,"type":"event","text":"奥兰治会议谴责半伯拉纠主义；同年雅典的柏拉图学园被查士丁尼关闭，古典哲学时代终结。"},{"year":"553","sort":553,"type":"council","text":"君士坦丁堡第二次大公会议：谴责「三章」，处理迦克墩后的余波。"},{"year":"553","sort":553,"type":"council","text":"第二次君士坦丁堡会议：谴责「三章」与奥利金主义（灵魂先存、万物复原、次位论）。"},{"year":"589","sort":589,"type":"council","text":"西班牙托莱多第三次会议的文件中最早出现「和子」（Filioque）——是否原本就有此句至今有争议。"},{"year":"680–681","sort":681,"type":"council","text":"第三次君士坦丁堡会议：谴责单志论，确立「两个意志、两个活动，不相违背」。"},{"year":"726","sort":726,"type":"event","text":"拜占庭皇帝利奥三世下令拆除圣像，圣像破坏运动开始；大马士革的约翰写《驳斥毁坏圣像者》。"},{"year":"787","sort":787,"type":"council","text":"第二次尼西亚会议（第七次大公会议）：恢复圣像敬礼，区分「敬礼」与「崇拜」。"},{"year":"843","sort":843,"type":"event","text":"皇后狄奥多拉恢复圣像，东正教定此年为「正统主日」，圣像破坏运动终结。"},{"year":"910","sort":910,"type":"event","text":"克吕尼修道院建立，直接置于教宗保护之下，成为西方修道改革的中心。"},{"year":"963","sort":963,"type":"event","text":"圣亚他那修在阿索斯山建立大拉伏拉修道院，圣山修道传统开始，延续至今未断。"},{"year":"**1054**","sort":1054,"type":"schism","text":"东西方教会互相绝罚（「东西方大分裂」）；背景包括 {{和子句}}、教宗首席权、礼仪差异与政治角力。"},{"year":"1054","sort":1054,"type":"schism","text":"东西方教会大分裂：罗马使节与君士坦丁堡牧首互相绝罚。核心分歧为和子句、教宗首席权、礼仪与政治。"},{"year":"1075","sort":1075,"type":"text","text":"教宗格里高利七世《教宗训令》（Dictatus Papae）27 条：教宗可以罢免皇帝。"},{"year":"1077","sort":1077,"type":"event","text":"卡诺莎：亨利四世在雪地中站三日求赦免。授职礼之争的高潮。"},{"year":"**1095–1291**","sort":1095,"type":"event","text":"十字军东征；1204 年第四次十字军洗劫君士坦丁堡，使东西分裂不可挽回。"},{"year":"1095","sort":1095,"type":"event","text":"教宗乌尔班二世在克莱蒙号召十字军，承诺参战者罪得赦免——「武装朝圣」的神学机制由此确立。"},{"year":"1099","sort":1099,"type":"event","text":"第一次十字军攻占耶路撒冷，屠杀城中穆斯林与犹太人。"},{"year":"1122","sort":1122,"type":"event","text":"《沃尔姆斯协约》：皇帝放弃属灵授职（戒指与牧杖），保留世俗职权授予。"},{"year":"1173","sort":1173,"type":"person","text":"里昂富商彼得·瓦勒度变卖家产、开始传道，瓦勒度派起源。"},{"year":"1204","sort":1204,"type":"event","text":"第四次十字军攻陷并洗劫君士坦丁堡。东西方分裂从教义争议变成血仇。"},{"year":"1209","sort":1209,"type":"event","text":"阿尔比十字军开始；贝济耶城陷落，约 2 万人被杀（包括天主教徒）。"},{"year":"1215","sort":1215,"type":"council","text":"第四次拉特兰会议：使用 transubstantiatio（变体论）一词，并定义炼狱。"},{"year":"1231","sort":1231,"type":"event","text":"教宗格里高利九世建立中世纪宗教裁判所，主要对付卡特里派。"},{"year":"1244","sort":1244,"type":"event","text":"蒙特塞居尔围城结束，约 200 名卡特里派「完美者」拒绝认罪，被集体烧死。"},{"year":"1274","sort":1274,"type":"council","text":"里昂第二次会议：宣布东西方合一（未获东方教会接受）；阿奎那同年去世。"},{"year":"1337","sort":1337,"type":"event","text":"巴拉姆与格列高利·帕拉马斯开始争论「非受造的光」，静修主义之争爆发。"},{"year":"1351","sort":1351,"type":"council","text":"君士坦丁堡会议确认帕拉马斯的「本质—能量」区分，成为东正教官方教义。"},{"year":"1378","sort":1378,"type":"schism","text":"西方大分裂：罗马与阿维尼翁两个教宗互相对立，1409 年出现第三个。"},{"year":"1382","sort":1382,"type":"text","text":"威克里夫圣经（第一部完整英文圣经）问世；其追随者被称为罗拉德派。"},{"year":"1414–1418","sort":1415,"type":"council","text":"康斯坦茨会议：废黜三个教宗、结束西方大分裂；1415 年烧死胡斯（尽管有安全通行证）。"},{"year":"1419–1434","sort":1420,"type":"event","text":"胡斯战争：波希米亚击败五次十字军；1434 年塔博尔派在利帕尼战役被自己人消灭。"},{"year":"1453","sort":1453,"type":"event","text":"奥斯曼帝国攻陷君士坦丁堡，拜占庭帝国终结，东正教重心北移莫斯科。"},{"year":"1478","sort":1478,"type":"event","text":"西班牙宗教裁判所设立，由王室控制，主要针对改宗者与摩里斯科人。"},{"year":"1498","sort":1498,"type":"person","text":"萨沃纳罗拉在佛罗伦萨被绞死并焚烧——他攻击教宗腐败，却反对路德式的恩典论。"},{"year":"**1517**","sort":1517,"type":"event","text":"{{马丁·路德}} 《九十五条论纲》；{{宗教改革}} 开始。"},{"year":"1517","sort":1517,"type":"event","text":"路德在维滕堡发表《九十五条论纲》，宗教改革开始。"},{"year":"1521","sort":1521,"type":"event","text":"沃尔姆斯帝国会议；路德被定为异端。"},{"year":"1521","sort":1521,"type":"event","text":"沃尔姆斯帝国议会：路德拒绝撤回，被帝国通缉；萨克森选侯把他藏在瓦特堡。"},{"year":"1522","sort":1522,"type":"text","text":"路德在瓦特堡把新约译成德文（11 周），奠定现代德语的基础。"},{"year":"1525","sort":1525,"type":"event","text":"1 月 21 日苏黎世「再洗礼」，重洗派诞生；同年德国农民战争（死亡约 10 万人），路德写《驳杀人越货的农民暴徒》。"},{"year":"1528","sort":1528,"type":"event","text":"雅各布·胡特在奥地利蒂罗尔建立胡特尔派，实行财产共享。"},{"year":"1530","sort":1530,"type":"text","text":"《奥格斯堡信条》呈交皇帝，成为路德宗的核心信条。"},{"year":"1531","sort":1531,"type":"event","text":"茨温利在卡佩尔战役中战死，尸体被分尸焚烧。"},{"year":"**1534**","sort":1534,"type":"event","text":"英王亨利八世《至尊法案》，{{英国国教会}} 脱离罗马。"},{"year":"1534","sort":1534,"type":"event","text":"英国《至尊法案》：亨利八世成为英国国教最高首脑。"},{"year":"1536","sort":1536,"type":"text","text":"加尔文 26 岁出版《基督教要义》第一版（6 章）；同年被法雷尔强留日内瓦。"},{"year":"1545–1563","sort":1545,"type":"council","text":"特伦托会议：天主教对宗教改革的系统回应，定义称义（注入的义）、七件圣礼、炼狱、变体论。"},{"year":"1553","sort":1553,"type":"person","text":"塞尔维特在日内瓦因否认三位一体被火刑处死（慢火）。"},{"year":"1555","sort":1555,"type":"event","text":"《奥格斯堡和约》：确立「谁的领地，谁的宗教」原则。"},{"year":"1555","sort":1555,"type":"event","text":"《奥格斯堡和约》：确立「谁的领地，谁的宗教」（cuius regio, eius religio）。"},{"year":"1559","sort":1559,"type":"text","text":"加尔文《基督教要义》拉丁文定本（80 章）；同年建立日内瓦学院。"},{"year":"1560","sort":1560,"type":"event","text":"苏格兰议会废除天主教，诺克斯建立长老制。"},{"year":"1563","sort":1563,"type":"text","text":"《海德堡要理问答》问世，成为改革宗最通用的教理问答。"},{"year":"1572","sort":1572,"type":"event","text":"圣巴多罗买日大屠杀：巴黎及各省约 5000–30000 名胡格诺被杀。"},{"year":"1598","sort":1598,"type":"event","text":"法国《南特敕令》给予胡格诺有限宽容（1685 年被路易十四撤销）。"},{"year":"1609","sort":1609,"type":"event","text":"约翰·史密斯在阿姆斯特丹为一批英国分离派施洗，现代浸信会的起点。"},{"year":"1610","sort":1610,"type":"text","text":"抗辩派提交《抗辩书》（五要点），阿米念争议公开化。"},{"year":"1618–1619","sort":1618,"type":"council","text":"多特会议谴责抗辩派，制定「多特信条」（即后来的 TULIP）；同年荷兰大议长奥尔登巴内维尔特被斩首。"},{"year":"1618–1648","sort":1618,"type":"event","text":"三十年战争：中欧人口损失估计 20%–40%，主要是饥荒、瘟疫与军队掠夺。"},{"year":"1620","sort":1620,"type":"event","text":"「五月花号」清教徒分离派抵达北美；同年白山战役，波希米亚新教贵族被击败。"},{"year":"1640","sort":1640,"type":"text","text":"詹森《奥古斯丁》遗著出版，詹森主义兴起；1653 与 1713 年两度被教宗谴责。"},{"year":"1643–1649","sort":1643,"type":"council","text":"威斯敏斯特会议：《威斯敏斯特信条》与大小要理问答；1649 年查理一世被处死。"},{"year":"**1648**","sort":1648,"type":"event","text":"《威斯特伐利亚和约》，三十年战争结束；宗教战争时代终结的象征。"},{"year":"1648","sort":1648,"type":"event","text":"《威斯特伐利亚和约》：确认教随国立并扩展到加尔文派，建立主权国家原则；教宗宣布和约无效但无人理会。"},{"year":"1675","sort":1675,"type":"text","text":"施本尔《敬虔的渴望》出版，敬虔主义开始。"},{"year":"1727","sort":1727,"type":"event","text":"黑恩胡特的圣餐礼中摩拉维亚弟兄会形成，此后 30 年派出数百名宣教士。"},{"year":"1738","sort":1738,"type":"person","text":"5 月 24 日卫斯理在伦敦阿尔德门街「心奇异地火热」，循道运动的核心经验。"},{"year":"1741","sort":1741,"type":"text","text":"爱德华兹《落在忿怒之神手中的罪人》布道，第一次大觉醒的高峰。"},{"year":"1789","sort":1789,"type":"event","text":"法国大革命；{{世俗化}} 与{{无神论}} 政治化的重要节点。"},{"year":"1799","sort":1799,"type":"text","text":"施莱尔马赫《论宗教》出版，现代自由派神学的起点。"},{"year":"1830","sort":1830,"type":"event","text":"约瑟·斯密出版《摩门经》，后期圣徒教会成立。 同年：普利茅斯弟兄会在都柏林与普利茅斯兴起；达秘开始发展时代论。"},{"ye         var rows = [];
