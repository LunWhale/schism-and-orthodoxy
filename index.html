<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裂教与正统 · 基督教思想分裂通史（含外部批判）</title>
<meta name="description" content="自公元1世纪至21世纪，基督教内部派别分裂的完整谱系：主张、历史背景、哲学背景、论战对象、所受反驳，以及犹太教、伊斯兰教与无神论的外部批判。面向零基础读者的深度导览。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238a2f1d'/%3E%3Cpath d='M29 12h6v14h14v6H35v20h-6V32H15v-6h14z' fill='%23f7f3eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f7f3eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
<style>:root{
  --font-serif: "Source Han Serif SC","Noto Serif SC","Songti SC",Songti,STSong,"SimSun",Georgia,serif;
  --font-kai: "Kaiti SC",KaiTi,STKaiti,"Songti SC",serif;
  --font-sans: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --font-mono: "SF Mono",Menlo,Consolas,monospace;
  --bg:#f7f3eb; --bg2:#efe9dd; --paper:#fffdf8; --ink:#221f1b; --ink2:#4a443c; --ink3:#7a7266;
  --rule:#ddd3c2; --rule2:#eae3d5;
  --accent:#8a2f1d;      /* 朱 */
  --accent2:#1d4b6e;     /* 靛 */
  --gold:#9a7b3f;
  --green:#3f5d43;
  --mark:rgba(214,180,90,.32);
  --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 24px rgba(60,45,20,.06);
  --sidebar-w:292px; --measure:38rem; --fs:17.5px; --lh:1.9;
  --radius:10px;
}
html[data-theme="dark"]{
  --bg:#15161a; --bg2:#1b1d22; --paper:#1d1f24; --ink:#e6e2d8; --ink2:#b9b3a6; --ink3:#8b8579;
  --rule:#31333a; --rule2:#282a30;
  --accent:#d98a70; --accent2:#7fb0d4; --gold:#c9a961; --green:#8fb894;
  --mark:rgba(200,160,70,.26);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-serif);font-size:var(--fs);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"palt" 1;
}
::selection{background:var(--mark)}
a{color:var(--accent2);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent2) 25%,transparent)}
a:hover{border-bottom-color:var(--accent2)}
button{font-family:var(--font-sans);cursor:pointer}

/* ---------- 进度条 ---------- */
#progressbar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));z-index:70;transition:width .1s linear}

/* ---------- 侧栏 ---------- */
#sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:60;
  background:color-mix(in srgb,var(--bg2) 88%,var(--paper));
  border-right:1px solid var(--rule);display:flex;flex-direction:column;
  font-family:var(--font-sans);font-size:13.5px;line-height:1.5;
  transition:transform .28s ease;
}
.sb-head{padding:20px 20px 10px}
.sb-title{font-family:var(--font-serif);font-size:20px;letter-spacing:.08em;font-weight:700}
.sb-sub{color:var(--ink3);font-size:12px;margin-top:3px;letter-spacing:.06em}
.sb-tools{padding:0 14px 10px;border-bottom:1px solid var(--rule)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .ico{position:absolute;left:9px;width:15px;height:15px;fill:none;stroke:var(--ink3);stroke-width:2}
#search{width:100%;padding:8px 34px 8px 30px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:13px;outline:none}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.kbd-esc{position:absolute;right:8px;font-size:10px;color:var(--ink3);border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-family:var(--font-mono);cursor:pointer;background:var(--bg2);display:none}
#search:not(:placeholder-shown)+.kbd-esc{display:block}
#search-results{max-height:46vh;overflow:auto;margin-top:8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
#search-results .sr-item{padding:8px 10px;border-bottom:1px solid var(--rule2);cursor:pointer;font-size:12.5px;line-height:1.55}
#search-results .sr-item:hover,#search-results .sr-item.on{background:color-mix(in srgb,var(--gold) 14%,transparent)}
#search-results .sr-path{color:var(--ink3);font-size:10.5px;letter-spacing:.04em}
#search-results .sr-snip mark{background:var(--mark);color:inherit}
#search-results .sr-empty{padding:14px;color:var(--ink3);font-size:12.5px;text-align:center}
.sb-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sb-actions button{flex:1 1 auto;padding:5px 8px;font-size:11.5px;border:1px solid var(--rule);background:transparent;color:var(--ink2);border-radius:6px;white-space:nowrap}
.sb-actions button:hover{background:var(--bg);border-color:var(--ink3)}
#toc{flex:1;overflow:auto;padding:10px 8px 24px;scrollbar-width:thin}
#toc .toc-part{margin:12px 6px 4px;font-family:var(--font-serif);font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.05em;display:block;padding:4px 6px;border-bottom:1px dashed var(--rule)}
#toc .toc-part:hover{color:var(--accent)}
#toc a{display:block;color:var(--ink2);padding:3px 10px 3px 16px;border:none;border-left:2px solid transparent;font-size:12.5px;border-radius:0 4px 4px 0}
#toc a:hover{background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--ink)}
#toc a.active{color:var(--accent);border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);font-weight:600}
#toc a.lv3{padding-left:28px;font-size:12px;color:var(--ink3)}
#toc a.lv4{display:none}
.sb-foot{padding:8px 16px;border-top:1px solid var(--rule);color:var(--ink3);font-size:11px;line-height:1.6}
[hidden]{display:none!important}
#sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:59}

/* ---------- 顶栏 ---------- */
#topbar{
  display:none;position:fixed;top:0;left:0;right:0;height:50px;z-index:55;
  align-items:center;gap:10px;padding:0 12px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);font-family:var(--font-sans);
}
#menu-btn{border:none;background:none;font-size:19px;color:var(--ink);padding:4px 6px}
.tb-title{font-family:var(--font-serif);font-weight:700;letter-spacing:.08em;flex:1}
.tb-tools{display:flex;gap:6px}
.tb-tools button{border:1px solid var(--rule);background:var(--paper);color:var(--ink2);border-radius:6px;padding:4px 9px;font-size:12px}
.tb-progress{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.tb-progress span{display:block;height:100%;width:0;background:var(--accent)}

/* ---------- 主体 ---------- */
#doc{margin-left:var(--sidebar-w);padding:0}
#content{
  max-width:calc(var(--measure) + 8rem);
  margin:0 auto;padding:64px clamp(20px,5vw,56px) 80px;
}
.loading{text-align:center;color:var(--ink3);padding:120px 0;font-family:var(--font-sans)}

#content p{margin:0 0 1.05em;text-align:justify;hyphens:auto}
#content li>p{margin-bottom:.5em}
#content strong{font-weight:700;color:var(--ink)}
#content em{font-style:normal;color:var(--accent);}
#content strong em,#content em strong{color:var(--accent);font-weight:700}

h1.title-main{
  font-size:clamp(30px,4.4vw,46px);line-height:1.25;letter-spacing:.06em;
  margin:0 0 .25em;font-weight:700;text-align:center;
}
h1.title-main+.subtitle{
  text-align:center;color:var(--ink3);font-size:clamp(14px,1.6vw,17px);
  letter-spacing:.14em;margin:0 auto 2.4em;max-width:34em;
}

#content h1{
  font-size:clamp(23px,2.6vw,30px);line-height:1.35;letter-spacing:.04em;
  margin:3.2em 0 .9em;padding-top:.6em;border-top:3px double var(--rule);
  scroll-margin-top:64px;
}
#content h1 .num{display:block;font-family:var(--font-sans);font-size:11.5px;letter-spacing:.32em;color:var(--accent);font-weight:600;margin-bottom:.6em;text-transform:uppercase}
#content h2{
  font-size:clamp(19px,2.1vw,23px);line-height:1.4;letter-spacing:.03em;
  margin:2.4em 0 .7em;scroll-margin-top:64px;
}
#content h2::before{content:"§";color:var(--gold);font-size:.8em;margin-right:.5em;font-weight:400}
#content h3{
  font-size:1.06em;margin:1.9em 0 .55em;color:var(--ink);letter-spacing:.02em;scroll-margin-top:64px;
  border-left:3px solid var(--gold);padding-left:.6em;
}
#content h4{font-size:.98em;margin:1.5em 0 .4em;color:var(--ink2);scroll-margin-top:64px;font-weight:700}
#content h5{font-size:.94em;margin:1.2em 0 .3em;color:var(--ink2);font-family:var(--font-sans);scroll-margin-top:64px}
.anchor{opacity:0;margin-left:.4em;color:var(--ink3);font-size:.7em;border:none;font-weight:400}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor{opacity:1}

#content ul,#content ol{padding-left:1.6em;margin:0 0 1.05em}
#content li{margin-bottom:.35em}
#content li::marker{color:var(--gold)}

#content blockquote{
  margin:1.5em 0;padding:.9em 1.2em .9em 1.4em;
  border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 4%,transparent);
  color:var(--ink2);font-size:.97em;
}
#content blockquote p:last-child{margin-bottom:0}
#content blockquote cite{display:block;font-size:.85em;color:var(--ink3);font-style:normal;text-align:right;margin-top:.4em}

#content hr{border:none;text-align:center;margin:2.6em 0;height:1.2em}
#content hr::after{content:"❦";color:var(--gold);font-size:14px;letter-spacing:1em;padding-left:1em}

#content code{font-family:var(--font-mono);font-size:.86em;background:var(--bg2);padding:.1em .35em;border-radius:4px;border:1px solid var(--rule2)}
#content pre{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:1em 1.2em;overflow:auto;font-size:.82em;line-height:1.7}
#content pre code{background:none;border:none;padding:0}

table{border-collapse:collapse;width:100%;margin:1.5em 0;font-size:.86em;line-height:1.6;font-family:var(--font-sans)}
.tablewrap{overflow-x:auto;margin:1.5em 0;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper)}
.tablewrap table{margin:0;min-width:34em}
th,td{padding:.6em .8em;border-bottom:1px solid var(--rule2);vertical-align:top;text-align:left}
thead th{background:color-mix(in srgb,var(--gold) 10%,transparent);font-weight:700;font-size:.95em;border-bottom:1px solid var(--rule);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--gold) 5%,transparent)}

/* 术语 */
.term{
  border-bottom:1px dashed color-mix(in srgb,var(--accent2) 55%,transparent);
  cursor:help;color:inherit;font-weight:600;
}
.term::after{content:"°";font-size:.7em;vertical-align:super;color:var(--accent2);opacity:.75;margin-left:.08em}
.term:hover{background:color-mix(in srgb,var(--accent2) 8%,transparent)}

/* 引证 */
.cite{font-family:var(--font-sans);font-size:.84em;color:var(--ink3);border:none}
.cite::before{content:"[";margin-right:.05em}
.cite::after{content:"]";margin-left:.05em}

/* 强调块 */
.callout{margin:1.7em 0;padding:1em 1.2em;border-radius:var(--radius);background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);font-size:.95em}
.callout .co-title{font-family:var(--font-sans);font-weight:700;font-size:.9em;letter-spacing:.08em;margin-bottom:.5em;color:var(--accent)}
.callout p:last-child{margin-bottom:0}
.callout.why{border-left:4px solid var(--accent2);background:color-mix(in srgb,var(--accent2) 5%,var(--paper))}
.callout.pit{border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--paper))}
.callout.src{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--paper))}

/* 派别卡片（blockquote 变体） */
.ccard{
  margin:1.6em 0;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper);
  box-shadow:var(--shadow);overflow:hidden;font-size:.93em;
}
.ccard-hd{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:.5em .8em;
  padding:.75em 1.1em;background:color-mix(in srgb,var(--gold) 9%,var(--paper));
  border-bottom:1px solid var(--rule2);
}
.ccard-k{font-family:var(--font-serif);font-weight:700;font-size:1.05em;letter-spacing:.03em}
.ccard-en{font-family:var(--font-serif);color:var(--ink3);font-size:.86em;font-style:italic}
.ccard-tags{display:flex;flex-wrap:wrap;gap:.3em}
.ccard-tag{font-family:var(--font-sans);font-size:.7em;padding:.12em .5em;border-radius:99px;border:1px solid var(--rule);color:var(--ink3);letter-spacing:.04em;white-space:nowrap}
.ccard-tag.t1{color:#7a3d12;border-color:#d9b48a;background:#f8efe2}
.ccard-tag.t2{color:#1d4b6e;border-color:#a9c4d8;background:#eaf1f6}
.ccard-tag.t3{color:#5b3a64;border-color:#c8b0cf;background:#f2ecf5}
.ccard-tag.t4{color:#3f5d43;border-color:#aec6b2;background:#ecf2ed}
.ccard-tag.t5{color:#8a2f1d;border-color:#e0b1a5;background:#f9ece8}
html[data-theme="dark"] .ccard-tag{background:transparent}
.ccard-body{padding:.9em 1.1em 1em}
.ccard-body dl{margin:0;display:grid;grid-template-columns:5.2em 1fr;gap:.45em .9em;align-items:start}
.ccard-body dt{font-family:var(--font-sans);font-size:.78em;font-weight:700;letter-spacing:.12em;color:var(--ink3);padding-top:.28em;text-align:right}
.ccard-body dd{margin:0}
.ccard-body dd p{margin:0 0 .55em;font-size:.97em;line-height:1.78}
.ccard-body dd p:last-child{margin-bottom:0}
.ccard-body .verbatim{color:var(--accent2);font-weight:600}
@media (max-width:640px){
  .ccard-body dl{grid-template-columns:1fr;gap:.1em}
  .ccard-body dt{text-align:left;padding-top:.5em}
}

/* 对比结构 */
.versus{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:1.6em 0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;font-size:.92em;background:var(--paper)}
.versus>div{padding:.9em 1.1em}
.versus>div:first-child{border-right:1px solid var(--rule)}
.versus h6{font-family:var(--font-sans);font-size:.78em;letter-spacing:.14em;margin:0 0 .5em;color:var(--accent)}
.versus>div:last-child h6{color:var(--accent2)}
.versus p{margin:0 0 .5em}
@media (max-width:640px){.versus{grid-template-columns:1fr}.versus>div:first-child{border-right:none;border-bottom:1px solid var(--rule)}}

/* 时间线 */
.tl{margin:1.8em 0 2.4em;border-left:2px solid var(--rule);padding-left:0;list-style:none}
.tl li{position:relative;padding:.15em 0 .9em 1.6em;margin:0}
.tl li::before{content:"";position:absolute;left:-6px;top:.65em;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--gold)}
.tl li.major::before{background:var(--accent);border-color:var(--accent)}
.tl-year{font-family:var(--font-mono);font-size:.82em;color:var(--accent);font-weight:600;letter-spacing:.02em}
.tl-txt{font-size:.94em}

/* 阅读层级：l1 总览 / l2 标准 / l3 深潜 */
html[data-level="l1"] .callout.src,html[data-level="l1"] .callout.note{display:none!important}
html[data-level="l2"] .callout.src{display:none!important}
html[data-level="l1"] .l2{display:none!important}
html[data-level="l1"] .l3{display:none!important}
html[data-level="l2"] .l3{display:none!important}
.lvl-note{display:none}

/* 目录/章节首屏 */
.titre-page{margin:0 0 4em;text-align:center}
.titre-orn{color:var(--gold);letter-spacing:.6em;font-size:14px;margin:1.2em 0}
.titre-meta{font-family:var(--font-sans);font-size:12px;color:var(--ink3);letter-spacing:.1em;line-height:2}

.lead{font-size:1.06em;color:var(--ink2)}
.lead::first-letter{font-size:3.1em;float:left;line-height:.92;padding:.06em .1em 0 0;font-weight:700;color:var(--accent);font-family:var(--font-serif)}

/* 脚注与参考文献 */
.fn-ref{font-size:.72em;vertical-align:super;color:var(--accent2);border:none;font-family:var(--font-sans)}
.biblio{font-size:.86em;font-family:var(--font-sans);line-height:1.75}
.biblio p{padding-left:1.6em;text-indent:-1.6em;margin-bottom:.5em}

/* ---------- 抽屉（术语/历表详情） ---------- */
#drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:80;backdrop-filter:blur(2px)}
#drawer{
  display:flex;position:fixed;z-index:81;right:0;top:0;bottom:0;width:min(520px,92vw);
  background:var(--paper);box-shadow:-8px 0 40px rgba(0,0,0,.18);
  display:flex;flex-direction:column;
  animation:slidein .24s ease;
}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dw-head{display:flex;align-items:flex-start;gap:1em;padding:20px 22px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.dw-head h3{margin:0;font-size:20px;line-height:1.4;flex:1;letter-spacing:.03em}
.dw-head h3 small{display:block;font-family:var(--font-serif);font-weight:400;font-style:italic;font-size:12.5px;color:var(--ink3);margin-top:4px;letter-spacing:.02em}
#dw-close{border:none;background:none;font-size:24px;color:var(--ink3);line-height:1;padding:0 2px}
#dw-body{padding:16px 22px 60px;overflow:auto;font-size:15px;line-height:1.85;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
#dw-body p{margin:0 0 .9em}
#dw-body ul{padding-left:1.4em}
#dw-body .dw-label{font-family:var(--font-sans);font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700;margin:1.2em 0 .35em}
#dw-body .dw-rel{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.4em}
#dw-body .dw-rel button{font-size:12px;padding:3px 9px;border:1px solid var(--rule);background:var(--bg2);border-radius:99px;color:var(--ink2)}
#dw-body .dw-rel button:hover{border-color:var(--accent);color:var(--accent)}
#dw-body .dw-see{margin-top:1.6em;padding-top:.9em;border-top:1px dashed var(--rule);font-family:var(--font-sans);font-size:12.5px;color:var(--ink3)}

/* 悬浮提示 */
#popover{
  position:absolute;z-index:85;max-width:330px;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.14);
  padding:.7em .9em;font-size:13px;line-height:1.7;font-family:var(--font-sans);
  pointer-events:none;
}
#popover b{color:var(--accent)}
#popover .po-hint{color:var(--ink3);font-size:11px;margin-top:.35em}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-family:var(--font-sans);font-size:13px;z-index:90}
#totop{position:fixed;right:22px;bottom:22px;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);font-size:16px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:50}
#totop.on{opacity:1;pointer-events:auto}

.docfoot{border-top:1px solid var(--rule);margin-top:60px;padding:28px clamp(20px,5vw,56px) 80px;max-width:calc(var(--measure) + 8rem);margin-left:auto;margin-right:auto;font-family:var(--font-sans);font-size:12.5px;color:var(--ink2);text-align:center}
.docfoot .dim{color:var(--ink3);font-size:11.5px}

mark{background:var(--mark);color:inherit;padding:0 .05em;border-radius:2px}

# 裂教与正统

## 基督教思想分裂通史 · 从耶路撒冷到网络时代

**本书读者不需要任何神学基础。** 每一个专业术语都会在正文中就地解释，并可点击查询术语库。

## 四、关于本书的立场

这本书**不是护教书，也不是反教书**。它试图做到：

1. **对每个派别，先按它自己的理解把它讲清楚**，再讲别人怎么反驳它。绝大多数教会史要么只讲「{{正统}}」怎么赢了，要么只讲异端多么冤枉。本书希望两边都摆出来。
2. **区分「史实」「史料争议」「神学判断」三层**。比如「{{尼西亚会议}}有多少位主教参加」是史实（传统说 318 位，现代估计约 250–300 位）；「阿里乌是不是真诚的基督徒」是判断；「{{尼西亚信经}}是否符合圣经」是神学争论。三者不能混为一谈。
3. **外部批判的核心章节**（犹太教、伊斯兰教、无神论、世俗主义）与内部论战同等分量。因为这些批判恰恰是许多基督徒一生中真正会遇到的质疑，而且它们往往比教会内部的派别之争更尖锐。

## 六、给零基础读者的三个「最小知识包」

如果你完全没接触过基督教，先记住下面三件事，本书后面会反复用到。

**第一件：基督教的核心叙事。**
基督教是从犹太教中长出来的一个运动。它的故事是：一位叫耶稣的犹太教师（约公元前 4 年—公元 30/33 年）被罗马当局钉死在十字架上，他的追随者宣称他死后第三天复活了，并宣称他就是犹太经典（基督徒称之为《旧约》）所预言的「{{弥赛亚}}」（希腊文 Christos，音译「基督」）。信徒们相信，通过他的死与复活，人与神之间的隔阂被修复了。这个运动从犹太人的一个小圈子，在两三百年内传遍了罗马帝国，并在公元 4 世纪成为帝国国教。

**第二件：基督教信仰的三根支柱。**
后来被固定下来的「正统」信仰，可以粗略地归纳为三条：**（1）{{三位一体}}**——只有一个神，但这个神是父、子、圣灵三个「位格」，不是三个神，也不是一个神在扮演三个角色；**（2）{{道成肉身}}**——神永恒的儿子真的成了一个人，即耶稣，他既是完全的神又是完全的人；**（3）{{救赎}}**——人靠自己无法得救，救恩来自神的{{恩典}}，通过基督的工作赐下。

**第三件：为什么会有这么多分裂。**
基督教信仰从一开始就同时包含几个相互拉扯的要素：**严格的{{一神论}}**（来自犹太教）、**对耶稣的神性敬拜**（早期信徒已经在向耶稣祷告）、**对一部经书的极端重视**（经文怎么说，就是最终依据）、**希腊哲学提供的概念工具**（用来精确表达信仰），以及**一个需要统一组织的共同体**（谁有权力裁定「正确」）。这五样东西放在一起，几乎必然产生冲突：每次调和，都会在某处挤出一个新的矛盾，而那个矛盾又会变成下一代人的战场。本书要讲的，就是这两千年里，这些矛盾一次次爆发、又被一次次「缝合」的历史。

# 导论：什么算「教会」？什么算「正统」？

## 0.1 一个令人不安的事实：基督教从来就不是「一个」宗教

今天全球大约有 24 亿人自称基督徒，分布在大约四万个相互独立的教会、教团与宗派之中。这个数字常被引用，也常被误读：它的大部分来自非洲、拉美、亚洲的独立教会，以及美国高度碎裂的新教小教派。可是，即使把统计口径放到最宽、最保守的版本，「正统」也只是其中一条主线，而这条主线本身就是一次次分裂之后**留下来**的那部分。

换句话说：基督教的历史更像一棵不断分叉的大树，而不是一根笔直的主干加上一圈「异端」旁枝。每一次分叉，当时两边都认为自己是正统，对方才是被撒但欺骗的人；多年以后，其中一边的文字、圣徒、会议记录被保存下来、被写进教科书，另一边则常常只剩下对手的转述。

本书要问的不是「谁对」。本书要问：

- 每一次分裂，**两边到底在争什么**？
- 这个争论看起来像「一个字母的差别」时，**它背后真正的火种是什么**？
- 胜出的一方凭什么说对方错了？失败的一方又会怎样反驳？
- 教会外面的世界——犹太人、穆斯林、无神论者、世俗主义者——又如何看这一整套争论？

## 0.2 先讲一个具体的例子：一个字母引发的血案

公元 4 世纪，罗马帝国的教会为了一个希腊词吵了六十多年，而且这个词与它的竞争对手**只差一个字母**：

- {{本体同一}}（*homoousios*）：子与父**同一本质**——尼西亚会议（325 年）的立场。
- {{本体相似}}（*homoiousios*）：子与父**相似的本质**——折中派的立场。

在希腊文里，区别是 *homoousios* 与 *homoiousios* 之间多出来的那个小写字母 i（ι，读作「iota」）。英语里至今有习语 *not one iota of difference*（毫无差别），就是从这场争论来的。当时许多人嘲讽说：两派为了一个字母，把帝国搅得天翻地覆；尼撒的格列高利就留下过一段著名的抱怨：380 年前后的君士坦丁堡，你问面包多少钱，回答是「父比子大」；你问澡堂水热了没有，回答是「子是從无中造的」。

但这不是「一个字母」的争吵。它背后是三个致命的问题：

:::why t="一个字母，为什么能让整个帝国翻脸？"
**第一，如果子不是「真神」而是「最接近神的受造物」，那么人到底被谁拯救了？**
　　当时的救恩观是：神成了人，才把人「提升」到神的生命里（一句名言：*「未被取用的，就未被医治」*——神没有亲自承担的，就没有被神修复）。如果拯救人的只是一个受造的中间物，那么人类最深处的问题就没有被真正解决。这不是抽象形而上学，而是「你到底把希望寄托在谁身上」。

**第二，如果子真的是「一位神」，那亚伯拉罕的神还是一位吗？**
　　这是犹太教的底线，也是伊斯兰教后来指控基督教的要害。争「一」还是争「三」的每一次努力，都可能滑向另一端。

**第三，谁来裁定？**
　　如果两本同样引圣经的书信得出相反结论，那就要有一个权威来裁断。而一旦承认「教会会议有裁决权」，就等于承认在圣经之外还有权威——这条线会一直牵扯到 16 世纪的宗教改革。
:::

这就是本书的基本思路：**每一个神学分歧，都是现实问题投射到词语上的影子。** 解释清楚现实问题，词汇才有意义。

## 0.3 三种「分裂」，别混为一谈

中文常说「分裂」「教派」「宗派」，但教会史里至少有三类不同的东西，混在一起将无法理解：

| 类型 | 争的层次 | 典型例子 | 后果 |
| --- | --- | --- | --- |
| **教义分裂**（异端问题） | 「什么是真的」——信仰本身 | 阿里乌派之争 | 一方被定为异端，理论上失去救恩；历史上伴随着流放、杀害、焚书 |
| **教会论分裂**（分裂 / 裂教问题） | 「谁是真教会」——组织与权威 | 1054 年东西方分裂、1517 年宗教改革 | 双方或多方都保留{{正典}}与基本信仰，但在「谁是合法教会」上互不承认 |
| **历史性脱离** | 因政治、民族、语言而分裂 | 埃及、埃塞俄比亚、亚美尼亚教会脱离帝国教会 | 往往披着教义外衣（如「一性论」），实际动力来自民族身份与政治独立 |

一个重要的观察是：**第二类的每一方都认为对方是第一类。** 天主教历史上一度把新教徒说成「异端」，新教徒则常常把天主教会说成「敌基督的体系」。要想公平地理解历史，就得先看每一方究竟是用哪一套逻辑在给自己找正当性。

## 0.4 「正统」是怎么被造出来的：五种实际机制

这一节讲的是本书称之为{{正统与异端的权力问题}}的东西——它不是某个古代争议，而是贯穿全书两千年的结构性机制。

如果你以为「正统」是圣经里白纸黑字写好的，那么教会史会让你困惑。现代教会史与早期基督教研究已经比较清楚地勾勒出，在实际运作中，正统至少经过以下五种机制才被确立：

1. **界线划定的需要**：{{马吉安}} 在 140 年代带来了自己删节版的圣经，迫使教会明确「哪些书算权威」；{{诺斯替派}} 的泛滥迫使爱任纽写《驳异端》，首次系统地给出「正统」的标准——使徒传承、主教序列、公共{{信经}}。
2. **政治权力的介入**：325 年尼西亚会议由皇帝君士坦丁召集；之后一百年里，皇帝换、教会立场就跟着换，尼西亚派被流放五次；《萨拉米斯历史》记载，{{亚他那修}} 的五次流放几乎都是皇帝下令，而不是教会投票的结果。
3. **会议的表决与缺席**：{{大公会议}}的表决结果很大程度上取决于谁被允许参加、谁被提前赶走。以弗所会议（431）就出现了「对方先开会、先定罪」的荒诞场面。{{东方正统教会}} 至今只承认前三次大公会议，正是因为迦克墩会议（451）的多数派立场对他们而言是被强力通过的。
4. **文本的保存与销毁**：胜出者的作品被抄写、进入修道院图书馆、被翻译成拉丁文；失败者的作品靠对手的批驳引用而残存片段，靠 1945 年埃及拿戈玛第（Nag Hammadi）发现的陶罐才留下了一批诺斯替文献。
5. **叙事的编排**：把胜利书写成「信仰自古如此、异端后来才冒出来」，把失败者写成道德败坏、愚蠢、淫乱或贪财的人。这种模式在古代末期就已经定型，并在后世被不断复制。

:::src t="关于「正统的形成」有哪些证据"
- 德国学者 **沃尔特·鲍尔**（Walter Bauer）在 1934 年的《正统与异端》（*Rechtgläubigkeit und Ketzerei im ältesten Christentum*）中提出一个后来被广泛讨论、也被部分修正的论点：在罗马、以弗所、安条克等地，最早占主导地位的基督教未必是后世所说的「正统」；「正统」很大程度是罗马教会经由影响力而输出的。
- 英国学者 **亨利·查德维克**（Henry Chadwick）、**拉里·赫塔多**（Larry Hurtado）等对鲍尔的修正：早期信仰确实存在相当大的一致性（对耶稣卑屈身份的尊崇），「正统/异端」二分不能完全贬为权力的产物。
- 对 4 世纪政治与教义互动，标准叙述见 **R. P. C. Hanson**, *The Search for the Christian Doctrine of God*（1988），以及 **Lewis Ayres**, *Nicaea and its Legacy*（2004）。
:::

## 0.5 本书的结构

全书分为六部：

- **第一部：诸根**（第 1–3 章）。基督教如何从犹太教中长出来，为什么围绕「耶稣是谁」从一开始就埋下争议；同时解释当时提供思维框架的希腊哲学，以及犹太教、希腊化世界与罗马帝国外部的看法。
- **第二部：古代教义大辩论**（第 4–7 章）。从诺斯替派、三位一体之争、基督论之争，讲到多纳图派、奥古斯丁与伯拉纠，以及东西方分裂。这是教义分裂最密集、对后世影响最深的时代。
- **第三部：东西方的两条路**（第 8–9 章）。中世纪天主教内部的分裂（东西方分裂后的东方诸教会、{{圣像破坏运动}}后的东方教会传统），以及天主教内部的改革派与异端（瓦勒度派、{{胡斯派}}等）。
- **第四部：宗教改革及其后裔**（第 10–13 章）。路德、加尔文、慈运理、重洗派、英格兰宗教改革，以及三十年战争中产生的各种宗派。
- **第五部：现代与当代**（第 14–17 章）。18 世纪以来的复兴运动、新兴宗派、大觉醒、五旬节运动、独立教会、灵恩运动、{{末世论}}团体，以及当代的进步/保守分裂。
- **第六部：外部批判**（第 18–23 章）。犹太教、伊斯兰教、印度教与佛教及其他宗教、无神论、世俗主义对基督教整体的批判；以及基督教内部的回应。

每一部之后都有「**争论的温度计**」——把这一时期的争论按「核心争议词」「历史触发器」「各方立场」「今天的影响」列成表，方便回看。

:::note
本书以「派别卡片」呈现每一个具体的宗派、团体或异端运动。如果某个派别在书写时被历史地判定为异端，**卡片不会因此采用侮辱性的语调来描述它**，而是尽量先把它自己的逻辑讲清楚，再讲别人如何反驳它。
:::

# 第一部：诸根

## 为什么「耶稣是谁」这个问题从一开始就注定要炸

在讲任何派别之前，必须先讲清楚一个前提：基督教不是从一套完整的教义开始的。它从一个**宣告**开始。

那个宣告极短，用希腊文说只有四个词：*Iesous Kyrios*——「耶稣是主」。保罗在《罗马书》10:9 写道：「你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。」这几乎是现存最古老的基督教信条。

麻烦在于：*kyrios*（主）这个词，在希腊化犹太教的语境中，是用来翻译希伯来圣经里上帝的名字（YHWH，通常读作 *Adonai*「主」）的。七十士译本（公元前 3 世纪开始在埃及翻译的希腊文旧约）把「耶和华」统统译作 *kyrios*。于是「耶稣是主」这句话，在一个犹太人的耳朵里，几乎就是「耶稣是耶和华」。

一个严格的犹太人当然会说：不行，这是亵渎。而一个早期基督徒会说：我们不是在说有两个神，我们是在说——那个唯一的神，在耶稣里亲自来了。

**这就是全部混乱的种子。** 从那以后两千年，教义分裂的核心，几乎都可以归为对这个句子的不同安置方式：

- 如果你把「耶稣是主」理解为**神以某种方式在一个人里面工作**，你保住了严格的一神论，却牺牲了「神亲自成为人」——这是 {{嗣子论}}、{{动态君主论}}，以及后来的各种「耶稣是个被神充满的人」式立场的共同结构。
- 如果你把「耶稣是主」理解为**神自己成了人**，你保住了救恩的深度，却要面对「一个神怎么会有一个儿子」「怎么会有一个被钉死的神」的指控——这是正统的方向，也是犹太教与伊斯兰教最主要的攻击点。
- 如果你说**耶稣只是显现得像人**，你保住了神的超越性，却让十字架变成一场幻象——这是 {{幻影说}}，{{诺斯替派}} 的常用方案。
- 如果你说**耶稣是受造物中最高的那一位**，你保住了神与受造界的绝对距离，但你得解释为什么早期基督徒已经在向一个受造物祷告——这是 {{阿里乌主义}}。

本书的每一章，几乎都可以看成对这四种基本方案（以及它们的变体）的重新编排。它们不是愚蠢的错误，而是一个**极其狭窄、且处处是陷阱的语义空间**里，不同人做出的不同下注。

## 第 1 章：从犹太教中长出的新枝 {#ch-1}

### 1.1 起初：一个犹太末世论运动

要理解基督教，先要理解它的母体——第二圣殿时期的犹太教（约公元前 516 年到公元 70 年）。

这个时期的犹太教并不是铁板一块，至少可以分出几个活跃的派别：

- **法利赛派**（*Perushim*，「分别出来的人」）：强调口传律法、洁净礼仪、复活与天使、来世的赏罚。他们是后来拉比犹太教的直接祖先。新约里的「法利赛人」常被描绘成伪善者，但历史上的法利赛派是当时最受民众尊敬的敬虔群体之一，他们对律法的热忱保存了犹太教在圣殿被毁后的存续。
- **撒都该派**（*Tzedukim*）：祭司贵族与圣殿精英，只承认摩西五经的权威，不承认口传传统，也不相信复活与天使。他们的神学立场在圣殿被毁（70 年）后失去了立足之地，随组织一起消亡。
- **爱色尼派**（*Essenes*）：苦修、集体生活、独身、严格洁净。死海古卷（1947 年起在昆兰洞穴发现）与这个群体密切相关。他们的文献让我们窥见一个高度末世论、自我认定为「光明之子」的犹太教团体。
- **奋锐党**（*Zealots*，或「匕首党」*Sicarii*）：主张武装反抗罗马，是 66–70 年第一次犹太战争与 132–135 年巴尔·科赫巴起义中的激进力量。
- **启示文学传统**：但以理书、以诺一书、《摩西升天记》、《以斯拉四书》等，充满异象、天使、列国审判、弥赛亚降临、死者复活、新天新地。这个传统是**理解耶稣运动的基本框架**：耶稣的宣讲（「天国近了」）几乎完全是一种启示文学语言。

:::why t="这对理解基督教有什么用"
如果不知道第二圣殿犹太教的多样性，就会误以为基督教是「从犹太教中分裂出来」那么简单。实际上，基督教诞生的时候，犹太教内部正在激烈地争论「末日何时来」「谁是义人」「圣殿与律法还有多大意义」。耶稣运动的头十几年，完全是在这个犹太教内部的讨论里进行的：门徒上圣殿、守安息日、遵守饮食诫命，争论的核心不是「要不要信耶稣」，而是「弥赛亚已经来了，我们现在该怎么活」。

「基督教」作为一种与犹太教分开的宗教，是一个漫长的、有争议的、有时是暴力的过程——不是某一天宣布成立的。
:::

### 1.2 关键事件：耶路撒冷会议与「外邦人问题」

使徒行传 15 章记载的「耶路撒冷会议」（约公元 49 年），是基督教史上第一个重大的教义/实践争议。问题很具体：**外邦人信耶稣，是否必须受割礼、遵守摩西律法（尤其是饮食与安息日规定）才能得救？**

保罗的立场是：不用。他的论证后来成了整部《罗马书》和《加拉太书》的主线——人{{称义}}是靠「信」（*pistis*）基督，不是靠「律法的行为」（*erga nomou*）。这场争论的结果是折中：外邦人不需要受割礼，但会议要求他们「禁戒偶像的污秽和奸淫，并勒死的牲畜和血」（徒 15:20）。

**为什么这件事重要**：如果不解决，基督教将永远是一个犹太教内部的派别；解决之后，一个以「信」而非「族群身份」为边界的新共同体才有可能。这也埋下了一条此后两千年反复出现的张力：**信仰的边界应当是「信什么」，还是「属于哪个群体」？** 每一次裂教，都可以在这个问题上找到影子。

:::src t="史料说明"
《使徒行传》是唯一记载耶路撒冷会议的文献，写于事件之后几十年，作者（传统上认为是路加）有他的神学意图（强调教会从耶路撒冷到罗马的合法延续）。学者对会议的「具体过程」与「最终决议的形式」有分歧：有人认为它就是加拉太书 2:1–10 提到的那次会面，有人认为两者不同。
:::

### 1.3 冲突的日常形态：谁有资格被称为「神的子民」？

《十二使徒遗训》（*Didache*，成书于 1 世纪末至 2 世纪初）的一段祷文保存了早期教会的一个细节：在圣餐时，信徒祷告说「愿你的教会从地极聚集，进入你的国」，然后加上一句——「正如这饼从前是散在山上的麦子，被聚合成一个饼」。这种语言暗示，早期教会认为自己是**「真以色列」**，是犹太教应许的继承者。

这直接造成了与犹太教的口水战，而争战的语言在《约翰福音》里变得格外尖锐：耶稣对犹太人说「你们的父是魔鬼」（约 8:44）。现代学者一般把这类经文理解为 1 世纪末至 2 世纪初教会与犹太会堂关系破裂的产物，而不是耶稣本人的原话；但它对后世的反犹主义有沉重的历史责任。

**这里要特别注意**：{{马吉安}} 在 2 世纪提出「旧约的神是公义而残忍的，新约的神是慈爱善良的」这种二元论，被教会斥为异端；但教会并没有彻底否定这个倾向——从「旧约」这个命名本身（把犹太圣经称为「旧」）、到把犹太人的律法当作已被废掉的「影儿」，一种「取代论」（supersessionism，认为教会取代了以色列）慢慢成为主流。到了 20 世纪，大屠杀之后，许多神学家才开始系统地反省这一立场。

:::pit t="常见误解"
**误解**：「基督教就是犹太教加上耶稣。」
**实际情况**：基督教与犹太教在 1 世纪末到 2 世纪初逐渐分道，分道的过程既有教义因素（耶稣是否弥赛亚），也有社会因素（罗马在 70 年后对犹太人的迫害、会堂对「异端」的驱逐、教会对犹太会堂的敌意）。两者在仪式、节期、经典（犹太教不承认新约）、弥赛亚观、律法地位上都已经分化。把它们的关系简单看作「一条线的延续」，既低估了分道的惨烈，也回避了后来的敌对历史。
:::

### 1.4 争议与反驳：这一章的说法，别人怎么反驳

第 1 章讲的是一件看起来没人会反对的事：基督教从犹太教里长出来。但「怎么长出来的」这一点，本身就是一个战场。下面把三种主要反驳摆出来。

**（一）犹太教的反驳：「你们不是从我们这里长出来的，你们是另一个人。」**

- 犹太教的立场：**基督教不是犹太教的发展，而是犹太教的背离。** 一个犹太人若信耶稣，他不是「完成了犹太教」，而是**改宗了另一个宗教**。
- 具体论据：（1）弥赛亚的标准没有满足（见 3.8 节）；（2）律法被取消；（3）神被说成「有儿子」；（4）「新约」这个概念本身暗示「旧约」已被废弃。
- **基督教最难回应的部分**：如果基督教是犹太教的「延续」，为什么 2000 年来犹太人整体上不接受它？一个「延续」，为什么与母体的主流完全断裂？

**（二）基督教的回应（三种，互相不兼容）。**

| 回应 | 内容 | 代价 |
|---|---|---|
| **取代论**（supersessionism） | 教会是「真以色列」；犹太民族因拒绝基督而失去其约的地位 | 为大屠杀前的反犹主义提供了神学土壤；1965 年梵二与 1994 年{{路德宗}}世界联盟都已否定 |
| **分立论**（disjunction） | 神与以色列的约仍然有效，教会是**另一个**约（外邦人的约）；两条路并行 | 那耶稣对犹太人还有什么意义？「福音是给万民的」这个宣教命令怎么理解？ |
| **合一论**（fulfilment） | 耶稣是犹太教的完成；犹太人终将认出他（罗 11:25–26「以色列全家都要得救」） | 这是一个**未实现的盼望**；而且它把犹太教的现存形态说成「未完成」 |

**（三）内部的反驳：保罗 vs 雅各。**

新约自己就不一致：保罗说「人称义是因着信，不在乎遵行律法」（罗 3:28）；雅各说「人称义是因着行为，不是单因着信」（雅 2:24）。这两个句子**字面上直接矛盾**。

- 传统的调和：保罗讲的是「在神面前称义的开端」，雅各讲的是「在人面前证明信心」（「信心没有行为是死的」）。
- 更批判的读法（现代学术）：这是**两个不同派别的文本被编进同一部正典**——保罗派（外邦人的、因信称义）与雅各派（犹太基督徒的、守律法）。**正典保存了这场争论，而没有解决它。**

**（四）历史的反驳：「耶路撒冷会议」是编出来的吗？**

《使徒行传》15 章是唯一的记载，而它写于事件之后几十年，作者路加有明显的意图（证明教会的合法延续、保罗的使徒身份）。学者对以下各点都有分歧：会议是否真的召开过？加拉太书 2 章提到的是否同一次会面？最终决议的形式是什么？

:::pit t="这一节要说明的方法论"
读教会史时，最容易犯的错是**把「后来的结果」当成「一开始就有的意图」**。

基督教后来成为一个独立的、外邦人为主的宗教——但这不意味着**第一天就有人打算这样**。**事情的结局，不能反推当事人的计划。** 这是本书反复要提醒的一点。
:::

## 第 2 章：早期教会的「异端」全景 {#ch-2}

### 2.1 诺斯替主义：基督教最早、最难缠的竞争者

如果要给「基督教思想史上最大的对手」排名，第一位多半是 {{诺斯替派}}（Gnosticism，来自希腊文 *gnosis*，「知识」）。

诺斯替主义不是单一的派别，而是一族共享某些结构的宗教运动，在 2 至 4 世纪的地中海世界非常流行，既有基督教版本（如华伦提努派、塞特派），也有非基督教版本（如赫尔墨斯主义、曼达派）。

它的基本故事是这样的：

> 至高而不可知的「善神」是纯粹的光。世界的创造者不是这个善神，而是一个较低级的力量（常被称为「造物主」或 *Demiurge*，有时被等同于旧约的耶和华）。这个造物主创造的物质世界是困住灵魂的陷阱。人的灵魂来自上面的光明世界，却忘记了来处；只有获得秘密的「知识」（gnosis），灵魂才能认出自己、脱离肉身、回到光明。

为什么这个故事重要：

- **它解决了「恶从何而来」的问题**：世界不好，是因为创造世界的是一个次等的神（或者干脆是恶的）。这比正统的「恶来自自由意志的堕落」解释得更有力，也更容易让当时的异教徒接受。
- **它让耶稣变成了一个「启示者」而非「救赎者」**：如果物质本身就是坏的，那么神不可能真的成为肉身，十字架上的死也毫无意义——受难只是表面现象，即 {{幻影说}}（Docetism）。所以诺斯替派普遍否认道成肉身。
- **它的救恩是「靠知识」**，因此是精英主义的：得救的人只有少数，而且需要特殊的启示与解经。

:::why t="为什么诺斯替主义让教会如此恐慌"
因为它**不是从外面来的攻击**，而是从内部长出来的。诺斯替派读同样的圣经、自称基督徒、有自己的福音书（《多马福音》《腓力福音》《犹大福音》）、有自己的使徒传统（常归于多马、腓力、抹大拉的马利亚）。它提供了一个更「灵性」、更吸引当时受过教育者的版本：肉身是牢笼，死亡是解脱，秘密知识是钥匙——这几乎是把救赎从「历史事件」转成「内心觉悟」。

对教会来说，这等于掏空了其核心：如果神没有真的成为肉身，十字架就不是真正的牺牲；如果基督的肉身只是幻影，那么殉道也就没有意义（{{殉道者}}以自己的肉身见证道成肉身的真实）。所以三位一体与道成肉身这两条教义，很大程度上是在与诺斯替主义的对撞中成形的。
:::

:::src t="我们的诺斯替文献从哪里来"
直到 1945 年，关于诺斯替派的知识主要来自对手的引用（爱任纽、希坡律陀、伊皮法纽）。1945 年埃及拿戈玛第（Nag Hammadi）出土了 13 册科普特文抄本，包含约 50 篇文献，使诺斯替派第一次能够「自己说话」。这批文献现藏开罗科普特博物馆。重要著作包括《真理福音》《约翰密传》《多马福音》《抹大拉的马利亚福音》等。
:::

### 2.2 马吉安：一个让教会「删经」的人

{{马吉安}}（Marcion，约 85–160 年）是富商，来自小亚细亚的锡诺普，约 140 年到罗马。他提出了一个极其大胆的立场：

- 旧约的神是「公义」、「严厉」的神，用律法、审判、战争统治。
- 新约的神是「恩典」、「爱」的神，在耶稣里显现。
- 二者不是同一位神。耶稣不是旧约神的弥赛亚，而是来启示那位更高的、陌生的善神的。

他据此编了一部「圣经」：只收删节过的《路加福音》与保罗书信（他还删掉了与他立场冲突的部分，比如路加福音中耶稣出生、受洗的某些细节）。他拒绝整个旧约。

**教会是怎么回应的**：马吉安 144 年被逐出罗马教会。教会做了一个后来极其关键的决定——**不扔掉旧约**，而是明确承认旧约与新约是同一个神的两部约书。这个决定直接激发了「新约正典」的形成：如果马吉安能编一部圣经，教会就需要明确自己承认的圣经是哪几本。

:::why t="马吉安主义为什么不断死灰复燃"
马吉安把「旧约的暴力」「新约的爱」当作两个不同的神。这个结构在历史上反复出现：

- 2 至 4 世纪的 **摩尼教**（明教）接受了类似二元论；
- 中世纪的 **卡特里派**（Cathars）把物质世界视为恶的造物；
- 现代许多普通信徒的心里，实际上持一种「马吉安式的直觉」——旧约的耶和华好战、爱发怒，新约的耶稣温柔、讲爱。这是教会史学上称之为「马吉安式阅读」的现象；
- 启蒙时代以来，一些自由派神学家把旧约视为「原始宗教」，新约视为「道德进步」。

所以马吉安并没有被消灭，他的直觉一直在教会内部潜伏。
:::

### 2.3 诺洼天派、多纳图派与「圣洁的教会」之争

再讲一个与诺斯替派完全不同的冲突——它争的不是神论，而是**教会论的边界**。

公元 250 年代，罗马帝国爆发了大规模的迫害（德西乌斯迫害、瓦勒良迫害、戴克里先迫害）。许多基督徒在酷刑或死刑的威胁下交出了圣经（*traditores*，「交出者」），或者向罗马的神献祭。迫害过去以后，问题来了：这些「弃教者」（*lapsi*）能不能重新回到教会？

- **温和派**（以罗马主教哥尼流为代表）：可以。只要按教规补赎，教会可以赦罪，因为教会本身就是「由罪人组成的医院」。
- **严酷派**（以罗马的神父 {{诺洼天}} 为代表）：不行。教会是圣洁的，向偶像献祭等于背叛基督，这种罪教会不能赦免。

这场争论后来在 311 年的大迫害后以另一种形式重演，形成 **{{多纳图派}}**（Donatism）。多纳图派的立场更极端：**圣礼的有效性取决于施行圣礼的主教本人的圣洁。** 如果一个主教在迫害中叛教过，那么他所施的洗礼、按立的圣职都是无效的，由他按立的主教也是无效的。

与之对立的立场，由奥古斯丁在 4 世纪末到 5 世纪初系统化：**圣礼的有效性来自基督，而不是来自施行者的功德。** 一个不称职的教士所施的洗礼仍然有效，因为它不是「他的」洗礼，而是基督的洗礼。

:::why t="这不是「教会纪律」的小问题"
多纳图派之争决定了教会是一个「圣洁者的小团体」还是「包含麦子与稗子的混合体」。如果是前者，那么教会的纯洁就需要一个持续不断的「清除」机制——审查谁配、开除谁，甚至以暴力强迫「洁净」。如果是后者，那么教会就必须接受不完美、没有「终极清洗」，把审判留给神。

这个问题以后会以各种面貌重演：从 16 世纪重洗派要求「信徒教会」，到 20 世纪许多小教派强调「余种」「真教会」；从清教徒的「纯洁的圣约共同体」，到当代对新教自由派的「教义纯洁」的争论，都绕不开这场争论。
:::

### 2.4 早期其他派别

- **伊便尼派**（Ebionites，来自希伯来文 *evyonim*，「贫穷者」）：保留犹太教实践，遵守摩西律法，认为耶稣是弥赛亚但只是一个受洗后得到圣灵的人（{{嗣子论}}），否认保罗的权威。他们对「耶稣是神」的立场感到陌生。残存于几个{{教父}}的记述里，后被边缘化或消失。
- **{{孟他努派}}**（Montanism）：兴起于 2 世纪后半叶的小亚细亚，由孟他努发起，主张「新预言」——即圣灵透过他们的先知继续说话，强调末日的临近、严格禁欲、殉道荣耀。特土良曾一度被其吸引。后被主流教会定为异端，因为「新预言」的持续权威威胁主教制的管理：如果圣灵还在随口说话，谁听主教的？
- **阿勒约派 / 撒摩萨塔的保罗**（Paul of Samosata）：3 世纪安提阿主教，主张「动态君主论」：耶稣是一个人，神的能力/智慧（*Logos*）充满了他，使他成为圣者，但耶稣本身不是永恒的神。268 年安提阿会议谴责了他。
- **撒伯里乌主义**（Sabellianism）：3 世纪，主张父、子、圣灵是同一个神在不同时期的三个「面具」或「工作方式」。被斥为「形态论」（modalism）。这是三位一体教义另一侧的极端：过度强调「一」。
- **特土良**虽然后来成为正统的「教父」，但他本人晚年倾向孟他努派。值得一提的是：他开创的拉丁神学术语——{{三位一体}}（*Trinitas*）、{{位格}}（*persona*）、{{本质}}（*substantia*）——成为后世正统的基础。这是基督教思想史上的一个奇妙现象：**发明核心术语的人，晚年被主流视为异端。**

### 2.5 争议与反驳：谁有资格叫「异端」

这一章列了诺斯替、马吉安、孟他努、诺洼天、伊便尼、撒伯里乌、阿勒约——全部被判为「异端」。**但「异端」这个标签本身就是需要解释的。**

**（一）诺斯替派的反驳：「我们才是真正的基督徒。」**

诺斯替派不认为自己是「异端」，他们认为自己是**更深的理解者**。他们的论据：
1. **他们有更古老的文献**：多马福音、腓力福音、马利亚福音（部分学者认为多马福音的某些层可追溯到 1 世纪）。
2. **他们有使徒的传承**：归于多马、腓力、抹大拉的马利亚。
3. **正统的回应是权力的胜利，不是真理的胜利**：爱任纽的「使徒统绪」名单，是一个**为对抗他们而构造的武器**（见 {{使徒统绪}}）。

**正统的回应**：（1）诺斯替文献晚于正典福音书，且明显依赖它们；（2）它们的神学与早期教会的实践（殉道、圣餐、肉身复活）不相容；（3）「秘密知识」使它无法成为一个公共的宗教。

**（二）孟他努派的反驳：「你们把圣灵关进了主教的办公室。」**

孟他努派的批评极其尖锐：如果圣灵还在说话，为什么只让主教说话？**他们的失败不是因为「错」，而是因为「无法管理」。**

**（三）多纳图派的反驳：「一个叛教的主教，凭什么赦免我的罪？」**

多纳图派的道德力量在于：**他们愿意为自己的立场付出代价**。而奥古斯丁的「圣礼有效性来自基督」虽然在神学上更强，但它也带来一个冷酷的后果：**教会不再需要圣洁**。

**（四）一个必须承认的事实。**

:::src t="「异端」这个词的现代用法"
现代学术（自 Walter Bauer 1934 以来）普遍认为：「正统/异端」的二分**在很大程度上是事后追认的**。

- **Bauer 的论点**：在罗马、以弗所、安条克等地，最早占主导地位的基督教未必是后世所说的「正统」。
- **修正**（Hurtado、Chadwick）：早期信仰确实存在相当大的一致性（对耶稣卑屈身份的尊崇、复活、圣餐），「正统/异端」不能完全贬为权力的产物。

**本书的用法**：「异端」一律指**在当时被主流判定为错误、并在后世被历史性地认定为非正统的立场**，而不表示本书作者同意这一判定。**每一个「异端」，都会先按它自己的理解讲清楚，再讲别人怎么反驳它。**
:::

## 第 3 章：希腊哲学的工具箱 {#ch-3}

### 3.1 一个必须先说的坏消息：教义是用「借来的词」写的

如果你把新约从头到尾读一遍，会发现一件让很多人意外的事：**新约里没有「三位一体」这个词，没有「位格」，没有「本质」，没有「本体同一」，也没有「道成肉身」这个中文词。**

- 「三位一体」的拉丁文 *Trinitas* 是 2 世纪末到 3 世纪初由 {{特土良}} 造出来的。
- 「位格」的拉丁文 *persona*、希腊文 {{位格|hypostasis}} 的这套用法，是 4 世纪才被固定下来的。
- 「本体同一」（{{本体同一}}，*homoousios*）这个词，**根本不在圣经里，甚至在 325 年之前它被很多主教视为「危险的词」**——因为它太哲学了，而且历史上曾被 {{撒伯里乌主义}} 用过。

这就引出了一个极其重要、而且至今没有被彻底解决的问题：**如果这些词都不在圣经里，那么用它们来规定「谁是真基督徒」，正当性从哪里来？**

这个问题有一个专门的名字，叫「**希腊化论题**」（Hellenization thesis）。19 世纪的德国教会史家 **阿道夫·冯·哈纳克**（Adolf von Harnack, 1851–1930）在《教义史》里给出了最尖锐的版本：他认为，所谓「基督教教义」，本质上是**希腊精神用希腊哲学的概念，把福音改造成了一套形而上学体系**。换句话说：教义不是福音的发展，而是福音被希腊哲学「俘获」之后的产物。

:::why t="为什么这个指控这么难回答"
因为它既有真实的成分，也有严重的漏洞，而这两者很难分开。

**真实的部分**：教义的语法确实来自希腊哲学。三位一体用的是「一个本质、三个位格」这种「{{实体}}—属性」的语言；基督论用的是「一个位格、两个本性」这种「实体—本性」的语言。这些都不是圣经的语言，而是公元 2 至 5 世纪地中海世界受过教育的人唯一会用的「精确语言」。当时没有别的选择：要讨论「耶稣与神的关系到底怎么精确表述」，你手上只有柏拉图主义、亚里士多德主义、斯多亚主义这三套词汇。

**漏洞的部分**：说「借用了词汇就等于改变了内容」，这是一个跳跃。举个日常的例子：「引力场」这个词是现代物理学的产物，但你不能因此说「苹果会掉下来」这个事实是被物理学发明出来的。同样，教父们可以说：我们借用了希腊人的语法，是为了保卫圣经里的一个事实——**早期基督徒确实在向耶稣祷告**（这是可以查证的史实，见 3.9 节小普林尼的记载）。教义不是从哲学推出来的，而是从「你们到底在拜谁」这个实践问题倒逼出来的。

但反过来说，教父们也无法完全撇清：**当你选择了一种语言来描述神，你就已经接受了那门语言自带的世界观。** 用「本质」来说神，就已经把神放进了一个「类」与「个体」的框架里——而这正是第 4 章那场大战的起因。
:::

本书的立场是：**不把「希腊化」当成罪名，也不把它当成无所谓的细节。** 它是理解整部教义史的关键机制：每一次教义危机，几乎都是「圣经的某个说法」与「某个哲学术语的固有含义」之间的摩擦。

### 3.2 零基础最小哲学包（一）：柏拉图与「两个世界」

要理解 4 世纪的主教们在吵什么，你需要先理解三套哲学。第一套是**柏拉图主义**。

**柏拉图**（Plato，约公元前 428–348 年）最核心的学说是**{{理念论}}**（Theory of Forms，希腊文 *eidos* 或 *idea*）。

他的出发点是一个很朴素的问题：**为什么所有的圆都画不完美，但我们却知道「真正的圆」是什么？** 你画不出一个绝对完美的圆，但你能判断一个圆「不够圆」。这意味着你心里有一个「圆本身」的标准，而这个标准不来自任何具体的圆。柏拉图说：所以存在着一个**非物质的、永恒的、只有理智才能把握的「圆本身」**，而所有具体的圆只是它的「摹本」，只是「分有」（*methexis*，参与）了它。

把这个思路推到底，柏拉图得到了一个两层世界：

| 层次 | 内容 | 特征 |
|---|---|---|
| 理念世界（*kosmos noetos*，可理知世界） | 圆本身、美本身、正义本身、善本身 | 永恒、不变、非物质、真实 |
| 感性世界（*kosmos aisthetos*，可感世界） | 具体的圆、具体的美、具体的人 | 有生有灭、变化、物质、只是「影子」 |

柏拉图最有名的一个比喻是**洞穴寓言**（《理想国》卷七）：一群囚徒从小被绑在洞穴里，只能看见墙上的影子，以为影子就是全部的真实。有人挣脱了锁链，走出洞口，看见了太阳，回来告诉其他人——而其他人不相信他，甚至想杀他。

**这套哲学对基督教的影响，怎么估计都不算高：**

1. **神的超越性**：神不是世界的一部分，而是完全在世界之外、之上。这为「创造论」（神自由地创造了世界，世界不是神的一部分）提供了语言。
2. **灵魂与身体的对立**：柏拉图认为灵魂是永恒的、属理念世界的，身体是灵魂的 prison（监狱）——这个词在《斐多篇》里真的出现过。这为「灵魂不朽」提供了论证，也埋下了**贬低肉身**的隐患。
3. **「分有」的语言**：受造物「分有」神的美善，但不等于神本身。这个区分后来成了否定 {{偶像崇拜}} 的神学基础。
4. **寓意解经**（allegory，{{寓意解经}}）：如果可见世界只是不可见世界的影子，那么经文里的具体事物也就可以被读成指向更高意义的符号。这套方法（{{寓意解经}}）在亚历山大的 {{奥利金}} 手上发展到了极致，也引发了巨大的争议。

:::pit t="最常见的误解：柏拉图主义 = 基督教的敌人"
很多科普书把柏拉图说成基督教的「污染源」。但历史上，柏拉图主义既是基督教最强的盟友，也是最强的对手。

- **盟友**：奥古斯丁在《忏悔录》卷七里说，他正是通过「柏拉图派的书」才学会了思考「非物质的实在」，从而摆脱了摩尼教的物质主义，能够理解「神是灵」。
- **对手**：同一套哲学也支撑了 {{诺斯替派}}（物质是坏的、灵魂是囚徒）、{{幻影说}}（神不可能真的接触物质）、以及后来的 {{阿里乌主义}}（神与世界之间必须有层级中介）。

**同一把刀，既能切菜也能杀人。** 这就是本书反复要讲的结构。
:::

### 3.3 零基础最小哲学包（二）：亚里士多德与「这一个」

第二套是**亚里士多德**（Aristotle，公元前 384–322 年），柏拉图的学生。他的影响不在「两个世界」，而在**「怎样精确地说一个东西是什么」**——也就是后来所谓的**范畴论**。

亚里士多德提出，任何一句「S 是 P」的描述，都落在十个**范畴**（categories）里。对教义史最重要的只有两个：

- **实体**（*ousia*，也译「本体」「本质」）：那个东西**本身**。例如「这匹马」「苏格拉底」。
- **{{偶性}}**（*symbebekos*，accident）：依附于实体、可以变化而不改变其是什么的性质。例如「白色的」「高的」「在市场上的」。

关键在于：**亚里士多德用 *ousia* 指的是「这一个具体的东西」（希腊文 *tode ti*，「这个某物」），而不是柏拉图意义上的「共同本质」。**

:::why t="这是全书最重要的一处语言陷阱，请慢读"
同一个希腊词 *ousia*，在柏拉图语境和亚里士多德语境里指的东西**几乎相反**：

- **柏拉图式用法**：*ousia* = 共同本质、抽象的一般（「人性」本身）。个体是本质的摹本。
- **亚里士多德式用法**：*ousia* = 具体的个别实体（「这个人」）。「人性」反而是第二义的 *ousia*。

现在把这个混乱放进三位一体的公式里：「**一个 *ousia*，三个 {{位格}}**」。

- 如果听者按**柏拉图**的方式理解：一个共同的神性本质 + 三个分有这个本质的存在者 → 听起来像 **三个神**（{{三神论}}）。
- 如果听者按**亚里士多德**的方式理解：一个具体的神性实体 + 三个……那「三个」是什么？三个属性？三个面具？→ 听起来像 **{{形态论}}**。

**所以「一本质三位格」这句话，在 4 世纪是一个语法上未完成的句子。** 它需要一整套新的规则才能成立，而这套规则（本质＝共同的神性；位格＝关系性的「谁」）是 {{加帕多家教父}} 在 370–380 年代才最终写清楚的。在此之前，这句话两边都能被指控为异端。

这就是为什么尼西亚会议（325）之后，争论不但没有结束，反而又打了六十年——**信经写下来了，但它用的词还没有被定义。**
:::

亚里士多德还提供了另外两组后来被大量使用的概念：

- **形式与质料**（*morphe / hyle*）：任何具体事物 = 形式 + 质料。这组概念后来被用来讨论「基督的人性有没有人的「质料」」「人性是一个「形式」还是「附属品」」。
- **潜能与现实**（*dynamis / energeia*）：一颗种子「潜在地」是一棵树。这组概念后来被用于讨论「基督的意志」「恩典如何作用于人的自由」。
- **四因**（质料因、形式因、动力因、目的因）：其中「目的因」（*telos*）后来支撑了基督教的「目的论」世界观——万物都朝向一个终点。

### 3.4 零基础最小哲学包（三）：斯多亚与「逻各斯」

第三套是**斯多亚主义**（Stoicism），由公元前 3 世纪的芝诺（Zeno of Citium）创立。它对基督教最关键的贡献是两个词：{{逻各斯}} 和**{{自然法}}**。

斯多亚派的基本世界观是**彻底的内在主义**：宇宙是一个活的、有理性的、被神圣的「火」贯穿的整体。这个贯穿万物的理性原则，他们称为 **logos**（λόγος，原意是「言说」「理性」「比例」）。宇宙的每一部分都按 *logos* 运转，人的理性是宇宙理性的一部分（*logos spermatikos*，**{{种子理性}}**——即「散落在个体里的理性的种子」）。

由此推出两件事：

1. **自然法**（*lex naturalis*）：既然宇宙有理性秩序，那么「合乎自然」就是「合乎道德」。这套观念经过西塞罗、罗马法学家，进入基督教伦理（「自然法」是天主教道德神学的支柱之一，直到今天）。
2. **命运与天意**（*heimarmene / pronoia*）：一切按理性必然发生。这一点与基督教的「自由创造」和「人的自由意志」有尖锐冲突——如果一切必然，人为什么还要为罪负责？

但 *logos* 这个词对基督教的意义还要更深，因为它正好出现在《约翰福音》的开头：

> 太初有道（*en archē ēn ho logos*），道与神同在，道就是神。（约 1:1）

**这是一个翻译史上影响巨大的选择。** 「道」这个希腊词 *logos*，在希腊哲学里已经背负了两三百年的「宇宙理性」含义。当约翰（或他的学派）用这个词来指耶稣时，他同时做了两件事：**把犹太教的「神的话语」（*memra*、*davar*）与希腊哲学的「宇宙理性」缝在了一起。** 这个缝合既是基督教能在希腊化世界传播的关键，也是后来一切「基督论」麻烦的源头——因为一旦「道」＝宇宙理性，人们自然会问：这个「道」是神本身，还是神的一个工具？它是永恒的，还是被生的？

{{阿里乌}} 正是在这个缝线上动刀的。而 {{查士丁}} 用「种子理性」来论证「希腊哲学家其实也分有了基督」——这成了基督教与哲学和解的第一个正式方案。

### 3.5 零基础最小哲学包（四）：新柏拉图主义与「流溢」

第四套不是古典希腊哲学，而是它的晚期形态：**新柏拉图主义**（Neoplatonism），代表人物是**普罗提诺**（Plotinus，约 204–270 年）。这套哲学诞生于基督教同期，是 3 至 6 世纪整个地中海知识界的「默认操作系统」。**不理解它，就无法理解奥古斯丁，也无法理解东方教父。**

普罗提诺的体系有三个层级，全部从一个终极原则「流溢」（*proodos*，emanation）出来：

1. **{{太一}}**（*to Hen*）：绝对单纯、不可言说、超越存在本身。你不能说它「是」什么，只能说它「不是」什么（否定神学 *via negativa* 的起源）。
2. **心智**（*Nous*）：太一「溢出」的第一层。它是思想与思想对象的合一，包含一切「形式/理念」。
3. **灵魂**（*Psychē*）：从心智溢出，分为高级（朝向心智）与低级（朝向物质、生成自然界）。

**流溢的比喻**：太阳发光不是因为「决定」要发光，而是因为它太满了，光自然溢出；溢出得越远，就越弱、越暗。所以越往下，存在就越稀薄、越多、越不完美。

:::why t="为什么这个「三级结构」让基督徒又兴奋又恐惧"
**兴奋**：太一—心智—灵魂，看起来像一个「三位一体」！事实上，2 至 3 世纪一些基督徒（尤其是 {{奥利金}}）确实大量借用了这个结构。它给了「父—子—圣灵」一个现成的形而上学骨架。

**恐惧**：因为这个结构有三个致命的差异，而这三个差异正好就是所有「异端」的定义：

1. **它是等级制的（hierarchical）**。太一 > 心智 > 灵魂，越往下越低级。如果把父子圣灵塞进这个框架，子就必然低于父，圣灵更低。**这就是 {{阿里乌主义}} 的形而上学骨架**——所以尼西亚派最恨的，正是这种「等级化」的直觉。
2. **它是必然的（necessary）**。流溢不是自由选择，而是太一本性的必然结果，像太阳必然发光一样。但基督教说创造是神**自由**的：「神愿意，就造了」。如果子是「必然流溢」的，那「父生子的自由」就没了。
3. **它模糊了创造者与受造物的界线**。流溢是一个连续的光谱，从太一到物质没有绝对断裂。而基督教坚持**绝对的断裂**：只有神是非受造的，其他一切（包括最高的天使）都是「从无中造出」（*creatio ex nihilo*）。

**于是整个 4 世纪的争论可以这样重述**：阿里乌把「父—子—圣灵」理解成新柏拉图主义式的三级流溢；亚他那修坚持要打断这个连续光谱，把子**完全**放在「非受造」这一边。这不是「一个字母」的问题，而是**两种关于「神与世界之间有没有中间层」的世界观**的对撞。
:::

:::src t="普罗提诺与波菲利：一个反基督教的哲学学派"
普罗提诺的弟子**波菲利**（Porphyry，约 234–305 年）写了十五卷《驳基督徒》（*Kata Christianōn*），是古代最锋利、最专业的反基督教著作。他的攻击不是谩骂，而是学术性的：他指出但以理书的「预言」其实是事后写的（这一判断在现代圣经学中被部分证实），他指出基督徒的解经是任意取舍，他质问「如果基督是唯一的道，为什么希腊人早就有了真理」。

《驳基督徒》在 448 年被皇帝下令焚毁，今天只剩残篇（主要靠对手的引用）。但它的思想在 18 世纪的启蒙运动中被重新发明了一遍——伏尔泰、吉本的反基督教论证，很多是波菲利的重演。
:::

### 3.6 七个词撑起整部教义史

下面这张表是本书最重要的一张表。**如果你只记住这一节，后面几百页会好读得多。** 这七个词之间的误译、混用、和无法翻译，制造了两千年里绝大部分的教义冲突。

| 希腊文 | 拉丁文 | 字面意思 | 教义中的用法 | 麻烦在哪里 |
|---|---|---|---|---|
| *ousia* | *substantia* / *essentia* | 「所是」「存在」 | 神共同的**本质** | 柏拉图义（共同本质）与亚里士多德义（个别实体）相反；拉丁 *substantia* 是 *hypostasis* 的直译，导致两个不同的希腊词在拉丁文里撞成一个 |
| *hypostasis* | *persona* / *subsistentia* | 「底下的站立」，即实在的结构 | 三个**位格** | 早期希腊教父把它当 *ousia* 的同义词用（所以「三个 hypostasis」一度听起来像「三个神」）；4 世纪才被重新定义为「关系性的个别」 |
| *physis* | *natura* | 「生出」「本性」 | **本性**（神性/人性） | 迦克墩前后，有人把 *physis* 与 *hypostasis* 混用，导致「基督只有一个本性」的说法（{{一性论}}）与「两个位格」的说法同时出现 |
| *prosōpon* | *persona* | 面具、脸、法律人格 | 位格（较弱意义） | 这个词原本**不**表示形而上的实在，只表示「显现出来的角色」；用它翻译 *hypostasis* 会悄悄降低「位格」的实在性，这是 {{聂斯脱里派}} 争议的关键 |
| *persona* | — | 戏剧面具 | 位格 | 现代英语 person 意为「个人、个体」，严重误导：三位格不是三个个体 |
| *substantia* | — | 「底下站立者」 | 本质（西方）／位格（部分早期用法） | 同一个词在拉丁传统里两种用法并存，奥古斯丁不得不专门写文章澄清 |
| *essentia* | — | 「是什么」 | 本质 | 与 *substantia* 在西方神学中逐渐分工，但直到 12 世纪才稳定 |

:::why t="为什么中文比拉丁文更麻烦"
中文神学词汇是**生造的**，每个词都是 19 世纪传教士和翻译者造出来的，而且不同宗派用了不同的造法：

- **位格**（person）：生造词。中文「位」暗示「位置、席位」，「格」暗示「格位、等级」——两个字都在暗示**三个分开的东西**，正好是 {{三神论}} 的方向。
- **本质 / 本体 / 实体 / 性体 / 自立体**：这五个中文词在汉语神学里被用来对应 *ousia*、*substantia*、*hypostasis*、*subsistentia* 的混乱组合，不同宗派、不同译本的用法并不一致。天主教的「本体」、新教的「本质」、{{东正教}}的「性体」，往往指的是**同一个希腊词**。
- **「三位一体」**这个词本身是意译，好在它没有引入错误暗示；但「一体」容易被听成「一个身体/组织」，而不是「一个神性」。

**实用建议**：读任何一本中文神学书时，遇到「本质/本体/实体/性体」这几个词，先别急着理解字面，先问：「这里对应的是 *ousia* 还是 *hypostasis*？」搞清这一点，很多看似矛盾的句子就通了。
:::

### 3.7 预演：为什么一个字母能杀三万人

第 4 章会详细讲 4 世纪的三位一体大战，这里先给一个预告，因为它最能说明「教义争论为什么不是无聊的文字游戏」。

当时有四个主要立场，差别只在希腊文的一个词尾：

| 立场 | 希腊文 | 意思 | 代表 |
|---|---|---|---|
| 本体同一 | homo**ousios** | 子与父**同一**本质 | {{亚他那修}}、尼西亚派 |
| 本体相似 | homoi**ousios** | 子与父**相似**的本质 | {{半阿里乌派}} |
| {{本体相异}} | an**omoeos** | 子与父**不相似** | {{阿诺莫派}}（激进阿里乌派） |
| 受造 | — | 子是受造物 | {{阿里乌}} 本人 |

看起来「相似」是最合理的折中：既不冒犯一神论，又保留了父子之别。**为什么它最终被判定不够？** 因为亚他那修提出了一个逻辑上的「滑坡」：

> 如果子与父只是「相似」，那么请回答：相似到什么程度？
> - 若相似程度有限 → 子不是真神 → 那么救恩来自一个非神的存在 → 人被造物拯救，救恩不成立。
> - 若相似程度无限 → 那就等于同一 → 那「相似」这个词是多余的。

这个论证的关键不在逻辑，而在**救恩论**（soteriology）：「**未被取用的，就未被医治**」（*quod non est assumptum, non est sanatum*）——这是 {{加帕多家教父}} 格列高利·纳齐安的一句话。它的意思是：基督若不是完全的神，他作为神的那部分人性就没有被医治；基督若不是完全的人，他作为人的那部分神性就无法被人的本性承受。**所以教义的精度，被救恩的「有效性」逼出来了。**

:::pit t="关于「一个字母」的两个常见误解"
**误解一**：「他们为了一个字母打仗，说明教义争论都是权力斗争。」
**修正**：字母之争确实有权力成分（皇帝、宫廷、主教席位），但把两者完全等同会漏掉关键事实：**这些词在当时是被当作「救恩是否成立」的技术参数**。用一个现代类比：心脏支架的直径差一毫米，在文件上只是「一个数字」，在病人身上是生死。区别不在数字大小，而在这个数字是否接入了一个真实系统。

**误解二**：「反正都是信耶稣，说法不同而已。」
**修正**：不同的说法会推出不同的实践。如果耶稣不是真神，那么向他祷告就是 {{偶像崇拜}}（这是犹太教和伊斯兰教的核心指控）；如果耶稣不是真人，那么肉身复活、圣餐、殉道就都失去意义。**教义不是关于神的抽象描述，而是关于「这个共同体在做什么」的规则说明。**
:::

### 3.8 外部视角（一）：犹太教怎么看这个新枝 {#ch-3-jewish}

前面讲的都是「基督教内部怎么吵」。但从第 1 世纪开始，还有一方始终在场，而且它的反驳比任何内部异端都更根本：**犹太教**。

理解这一点对零基础读者尤其重要，因为**基督教的所有核心主张，在犹太教看来都是对犹太教本身的偏离**。这不是「外人不懂」，而是「最了解这套经典的人不接受这个结论」。

#### 3.8.1 分歧的四个硬核

**（一）神的一体性。** 犹太教的中心告白是《示马》（*Shema*，申命记 6:4）：「**听啊，以色列！耶和华我们的神是独一的主。**」这句话每天念两次，写在门框的经卷（*mezuzah*）里，是犹太教最不可让步的底线。

在这个框架里，「一个神有三个位格」听起来不是「深奥」，而是**算术上的违约**。犹太教的质疑极其直接：**如果父是神、子是神、圣灵是神，而三者又不是同一个，那你有几个神？** 基督教回答「一个本质、三个位格」，犹太教的回应是：**这个区分是希腊哲学造出来的，圣经里没有。** 你在圣经里找不到任何一个犹太人会说「神是三个位格」。

**（二）偶像崇拜与「道成肉身」。** 犹太教禁止偶像（出埃及记 20:4；申命记 5:8），但禁令的核心不只是「不要拜雕像」，而是**不要把一个受造物当作神来敬拜**。在犹太教看来，说一个人是神，无论这个人多么圣洁，都是把受造物放进创造者的位置——这是偶像崇拜的定义。

**（三）律法的永恒性。** 基督教说律法的礼仪部分（割礼、饮食、献祭）已被基督成全而不再要求外邦人遵守。犹太教认为这是对圣经的取消：**妥拉（Torah）是神永远的约，不是「阶段性的临时措施」。** 一个关键的经文依据是申命记 30:11–14（「这诫命不是你难行的，也不是离你远的」）和诗篇 119 篇对律法的无限推崇。

**（四）弥赛亚的「验收标准」。** 这是最容易讲清、也最容易被忽略的一条。犹太传统对弥赛亚的期待是**可观测的**：

1. 他是**大卫的子孙**（撒下 7:12–16；赛 11:1）；
2. **以利亚要先来**（玛拉基书 4:5；这是为什么新约要专门处理「以利亚已经来了」的问题）；
3. 他会**重建耶路撒冷圣殿**（ Ezekiel 40–48 的异象）；
4. 他会**聚集以色列的流亡者**（赛 11:12）；
5. 他会带来**普世的和平与对神的认识**（赛 2:4「他们要将刀打成犁头」；弥 4:3）；
6. 他会带来**死人复活**（但 12:2）；
7. 万国要上耶路撒冷敬拜（赛 2:2–3；亚 14:16）。

**耶稣没有做到 3、4、5、7。** 这是犹太教拒绝的最实际理由，而且它不是神学辩论，是「验收清单」。基督教的回应是引入「**两次降临**」（first and second coming）：第一次来是受苦的仆人（赛 53），第二次来才是审判与作王。犹太教的回应是：**这个「两次降临」的说法在第二圣殿时期的犹太文献里找不到明确依据，它是为了解释失败而事后发明的。**

:::why t="这一节为什么必须写得这么直白"
因为绝大多数在基督教文化中长大的人（包括很多中国读者，通过电影、文学、圣诞节接触基督教），从来没有听过犹太教这一侧的说法。而一旦听到，往往会经历一个震动：**原来这套叙事在另一个传统里有一整套完全不同的读法，而且那套读法更「原生」。**

本书不裁决谁对。但要强调的是：**犹太教的反驳不是「不信」，而是「读同样的书，得出不同的结论」**——这比任何外部批评都更难回应，因为它共享全部前提。这也是为什么第 18 章（外部批判）把犹太教放在第一位。
:::

#### 3.8.2 犹太文献中的耶稣：一个必须谨慎使用的证据

犹太教经典（《塔木德》、《托塞夫塔》、《米大示》）里有一些关于「Yeshu」（耶稣的希伯来文名）的段落。常见的几处：

- 《巴比伦塔木德·公会篇》43a：提到「Yeshu 在逾越节前夕被挂起来」，并说他「行巫术、引诱以色列人背道」。
- 《托塞夫塔·安息日》11:15：提到以「Yeshu ben Pantera」之名治愈的人。
- 《托塞夫塔》中关于《Birkat haMinim》——即「**祝福异端**」（实际上是一段**{{诅咒}}文**，第 12 条祝福要求「使拿撒勒人立刻灭亡」）。这一条被认为是在 1 世纪末由 Jamnia（雅麦尼亚）的拉比会议加入的，用于把「犹太基督徒」赶出会堂。

:::src t="如何使用这批材料"
必须非常小心。这些文献**成书时间远晚于事件**（塔木德的主要编纂在 5 世纪前后），内容经过长期口传与编辑，且明显带有论战敌意。它们**不能**用来重建历史上的耶稣，只能用来证明一件事：**在 2 世纪以后，犹太社群内部存在一套关于耶稣的负面叙事，而这套叙事与基督教叙事几乎没有任何交集。**

现代学者（如 Schäfer, *Jesus in the Talmud*, 2007）的共识大致是：这些段落反映的是**拉比犹太教对基督教成功的焦虑与回应**，而不是独立的史料。把它们当作「犹太版的耶稣传记」会得出荒谬结论（例如「耶稣是罗马士兵 Pantera 的私生子」这一说法，学术上几乎没有支持）。
:::

#### 3.8.3 中世纪的公开论战：当辩论被安排成一场必输的比赛

中世纪欧洲发生过几次著名的「犹太—基督教论战」，形式是公开的法庭式辩论。它们值得单独讲，因为它们示范了「权力不对等的辩论」长什么样：

| 时间 | 地点 | 基督教方 | 犹太教方 | 结果 |
|---|---|---|---|---|
| 1240 | 巴黎 | 尼古拉·多宁（改宗者） | 拉比耶希耳（Yechiel of Paris） | 塔木德被判「亵渎」，1242 年在巴黎公开焚毁 24 车塔木德抄本 |
| 1263 | 巴塞罗那 | 帕布罗·克里斯蒂亚尼（改宗者） | 纳赫曼尼德（Ramban） | 纳赫曼尼德被指「亵渎」，被迫离开西班牙 |
| 1413–1414 | 托尔托萨 | 约书亚·阿尔博（改宗者） | 多位拉比 | 大量犹太人被迫改宗 |

**这三个案例的共同结构**：辩论的议题由基督教方设定，裁判是教皇或国王，犹太方若「赢」了会被判为顽固。所以它们的实际功能不是「求真」，而是**制造改宗压力与迫害借口**。

:::note
值得注意的细节：1263 年巴塞罗那论战中，纳赫曼尼德提出了一个极其锋利的反问——**「如果弥赛亚真的来了，为什么全世界还没有信他？」** 这句话直指基督教「弥赛亚已来」主张的经验困难。这场辩论之后，他写出了《论赎罪》一书，成为反基督教论战的经典文本之一。
:::

#### 3.8.4 现代犹太教三派的态度

- **正统派**（Orthodox）：坚持传统立场，认为基督教是偶像崇拜（部分极端立场甚至认为基督教比伊斯兰教更严重，因为它把一个人当作神）。不参与神学对话，但可以合作于社会事务。
- **保守派**（Conservative）：立场接近正统但更开放，承认基督教是「神为万民安排的路径」这一说法在部分拉比文献中有先例（如《塔木德》关于「义人外邦人」的讨论），但仍拒绝耶稣是弥赛亚。
- **改革派**（Reform）：19 世纪以来最开放。部分改革派拉比（如 20 世纪的 **Leo Baeck**）把基督教视为犹太教的「姐妹宗教」，认为两者是神与人的约的不同表达。

**1965 年第二次梵蒂冈大公会议的《Nostra Aetate》（《我们的时代》宣言）** 是天主教对犹太教态度的历史性转折：它宣布犹太人「不应被描绘为被神弃绝或受诅咒的民族」，并否定了「取代论」的强版本。这份文件之后，天主教会与犹太教的官方对话才真正开始。

#### 3.8.5 基督徒的常见反驳，与犹太教的反反驳

| 基督徒的论证 | 犹太教的回应 |
|---|---|
| 以赛亚书 53 章「受苦的仆人」指向耶稣 | 希伯来原文的「仆人」在上下文中指**以色列民族**（赛 41:8「你以色列我的仆人」）；且犹太传统从未把它读成弥赛亚 |
| 诗篇 22 篇「他们扎了我的手我的脚」 | 原文是「像狮子」的动词，七十士译本的「扎」是译法问题；且诗篇是**大卫个人的哀歌**，不是弥赛亚预言 |
| 但以理书 9:24–27 的「七十个七」指向耶稣受难 | 这段数字的解经在犹太传统中有完全不同的算法（指向安条克四世或圣殿重建），且但以理书本身的成书年代有争议 |
| 旧约的「预表」（{{预表}}）处处指向基督 | 这是**循环论证**：先假定耶稣是弥赛亚，再去旧约找对应；任何一个人都可以用这种方法「预言」自己 |
| 耶稣复活证明他是神子 | 复活不是弥赛亚的验收标准；且复活需要目击者，而我们只有信徒的记载 |

:::pit t="本书的提醒"
上面这张表**不是**为了让读者站队。它展示的是一个方法论问题：**当双方共享同一部经典时，争论会变成「解经学」的争论，而解经学没有中立的裁判。** 这正是本书第 18 章要处理的核心困难，也是理解后面所有教派分裂的关键——因为基督教内部的每一次分裂，几乎都是**同一种结构**：共享经典、争论解经、没有裁判、最后靠权力裁决。
:::

### 3.9 外部视角（二）：罗马帝国怎么看基督徒 {#ch-3-roman}

如果说犹太教的反驳是「最懂经典的对手」，那么罗马帝国的看法就是「最不懂也最不在乎的对手」——但它决定了基督教最初三百年的命运。

#### 3.9.1 一个关键的观念差异：宗教不是「信仰」

现代人习惯把宗教理解为「个人的内心信念」（belief）。罗马人不是这样理解的。

罗马的宗教概念是 **religio**——它的词源有争议，但核心含义是**「人与神之间的约束/义务」**，属于**公共事务**（*res publica*）的一部分。罗马的宗教体系是一套**仪式性的契约**：国家向神献祭，神保佑国家；个人向家神献祭，家神保佑家庭。**关键不在于你心里信不信，而在于你有没有做这个仪式。**

由此产生两个词的对立：

- **religio**：合法的、公共的、祖先传下来的崇拜。
- **superstitio**：过度的、私人的、外来的、不理性的迷信。**基督教一开始被归类为 superstitio**——因为它的信徒拒绝参加公共祭祀，却对一个人（一个被钉死的罪犯）表现出「迷信般」的狂热。

**这就解释了为什么罗马人觉得基督徒「无神论」（atheotes）**。这个词在今天听来荒谬（基督徒当然信神），但在罗马语境里完全合乎逻辑：**你不承认我们的神，你也不参加我们的祭祀，那你就是「没有神」的人——不是「不信有神」，而是「不承认神对国家的作用」。** 拒绝祭祀不只是宗教问题，还是**政治不忠**的问题。

:::why t="为什么这个误解如此重要"
因为它是基督教与世俗权力冲突的原型。

罗马迫害基督徒，**不是因为他们在神学上错了，而是因为他们的实践破坏了「宗教—国家」的契约**：不参加祭祀 → 神发怒 → 国家遭灾 → 必须找出「责任人」。这就是德尔图良记载的那句著名指控：「**基督徒的错，就是一切灾祸都怪基督徒**」（*Tertullian, Apologeticum* 40）。

**这个结构在整部历史上反复出现**：基督教成为国教之后，它自己变成了「公共宗教」，于是轮到它来指控别人（异端、犹太人、异教徒、无神论者）破坏社会秩序。第 22 章会专门讲这个反转。
:::

#### 3.9.2 罗马人相信的四个谣言

罗马民众对基督徒的指控，在今天看来荒唐，但每一条都能从他们的仪式中「合理」地推出：

| 指控 | 罗马人的推理 | 事实 |
|---|---|---|
| **吃人**（*Thyestean banquet*） | 他们说「吃基督的肉、喝基督的血」 | 指圣餐；且早期教会严守「 disciplina arcani」（保密纪律），不向外人解释，反而助长猜测 |
| **乱伦**（*Oedipal intercourse*） | 他们称彼此为「兄弟」「姐妹」，又举行「爱筵」（*agape*），且在黎明前聚会 | 「兄弟姊妹」是宗教称谓；爱筵是共餐；黎明聚会是因为要上班 |
| **崇拜驴头** | 基督徒是犹太人（犹太教曾被指控拜驴头），且穷人众多 | 一张著名的涂鸦（Palatine 山，约 200 年）画着一个被钉十字架的人，头是驴头，旁书「Alexamenos 崇拜他的神」 |
| **行巫术、分裂家庭** | 他们能「驱鬼」、能让妇女离开丈夫、奴隶离开主人 | 基督教确实吸引了女性和奴隶，也确实要求信徒把信仰置于家庭之上（太 10:35–37） |

#### 3.9.3 三份关键文献

**（一）小普林尼致图拉真书信（约 112 年）**——现存最早的外邦人对基督教仪式的目击描述。小普林尼是比提尼亚—本都的总督，他写信问皇帝怎么处理基督徒：

> 「他们习惯在固定的日子，天还没亮就聚会，轮流向基督**如同向神一样**（*carmenque Christo quasi deo dicere*）唱诗；他们彼此约束，不作恶事，不偷盗、不抢劫、不通奸……之后各自散去，再回来吃一顿普通的、无害的饭食。」

这段话的价值极高，因为它**不是基督徒写的**。它证明了两件事：**（1）早期基督徒确实在向基督祷告/唱诗**——这是「三位一体」教义后来不得不处理的那个实践事实；**（2）圣餐当时还是一顿普通的饭**。

图拉真的回复也很有代表性：「不要主动搜捕他们；但如果被控告且罪名成立，就处罚；**凡否认自己是基督徒、并以向我们的神献祭来证明的，就赦免他**。」——注意：**赦免的条件不是「改信」，而是「献祭」**，也就是履行公共仪式。这再次印证了 3.9.1 的观点。

**（二）塞尔苏斯《真道》（*Alēthēs Logos*，约 178 年）**——古代最系统的反基督教著作，已佚，但我们能通过 **奥利金** 在 248 年写的《驳塞尔苏斯》（*Contra Celsum*）八卷中大量引用它，几乎可以复原其内容。

塞尔苏斯的攻击极其现代：

- **耶稣的复活只有几个歇斯底里的女人和幻觉中的门徒作证**，这在法庭上不成立。
- **一个神怎么会成为人，还被钉死？** 这是「神的不变性」与「神的尊严」问题。
- **基督徒是文盲、妇女、奴隶、小孩**——一个只吸引社会底层的宗教不值得信。
- **如果神要启示，为什么只启示给一个角落的犹太人，而不是给全体人类？**
- **基督徒拒绝参加公共祭祀，等于拒绝文明。**

**（三）尤利安皇帝《驳加利利人》（362 年）**——「叛教者尤利安」是最后一位试图复兴异教的罗马皇帝。他的攻击是**政策与神学并重**的：他指出基督徒自己内部矛盾（阿里乌派与尼西亚派互斗），指出圣经的神是一个「嫉妒、易怒、只爱一个民族」的神，并提出一个战略：**让基督徒去读他们自己的圣经**，因为「他们若真读，就会发现那些荒谬之处」。

:::src t="我们怎么知道这些反驳"
一个有趣的史学现象：**古代反基督教著作全部失传，而反驳它们的基督教著作全部保存下来了**。原因很简单：抄写者是基督徒，他们只抄「有用」的东西——而反驳文章必须连原文一起抄，才看得懂在反驳什么。所以今天我们能读到塞尔苏斯、波菲利、尤利安的片段，全靠对手的引用。这也提醒我们：**古代文献的存亡本身就是权力运作的结果**，这一点在第 2 章讲「正统如何形成」时同样适用。
:::

#### 3.9.4 为什么基督教反而赢了

这是一个史学上的经典问题（爱德华·吉本在《罗马帝国衰亡史》第 15 章专门讨论过）。主要解释有五种，它们不互相排斥：

1. **社会网络**：基督教提供了超越族群的互助共同体，在瘟疫、饥荒、城市移民中承担了「社会保险」的功能。
2. **照顾病人**：在 2 至 3 世纪的大瘟疫中，基督徒留下来照顾病人（许多异教医生会逃），显著提高了存活率与社会声望。
3. **普世性**：不受族群、阶层、性别限制（奴隶、女性、外邦人都可以加入），比密特拉教、伊西斯教更开放。
4. **殉道的说服力**：殉道者在刑场上的平静，对围观者产生了巨大的心理冲击。德尔图良的名言「殉道者的血是教会的种子」（*semen est sanguis christianorum*）并非空话。
5. **政治转折**：312 年君士坦丁在米尔维安桥战役前的异象与「以基督的标记得胜」（*In hoc signo vinces*），以及 313 年的《米兰敕令》——这是决定性但也是「偶然性」的一步。

:::pit t="最常见的误解：基督教靠君士坦丁「赢」的"
这在流行叙述里非常常见，但不符合史实。

到 300 年，基督徒约占帝国人口 10%（不同估算从 5% 到 15%），在东部城市中上层已有相当规模，教会组织遍布帝国；戴克里先 303 年的大迫害之所以发生，恰恰是因为基督教已经大到成为政治问题。**君士坦丁不是扶植了一个小教派，而是站在了一个已经在赢的宗教一边。**

但另一方面，君士坦丁之后的「赢」是另一种赢：**教会获得了国家的权力，也把国家的逻辑带进了教会**——包括皇帝召集大公会议、流放不听话的主教、用行政手段镇压异端。这个转变对第 4 章的教义斗争有直接影响：**325 年的尼西亚会议，是皇帝召集的。**
:::

### 3.10 内部第一次路线斗争：基督徒自己怎么看哲学

最后一个问题是内生的：**基督徒自己，应不应该用希腊哲学？** 这个问题在 2 至 3 世纪就分裂出了两条路线，而这两条路线的对立，一直延续到今天。

#### 3.10.1 赞成派：查士丁与「预备福音」

{{查士丁}}（Justin Martyr，约 100–165 年）是第一个受过完整哲学训练、并试图把哲学与信仰结合的基督教作家。他的核心论证是：

> **基督是「道」（Logos），而道就是理性本身。所以凡按理性生活的人，都在分有基督**——包括苏格拉底、赫拉克利特这些「基督教之前的基督徒」。

他用的概念就是斯多亚的**种子理性**（*logos spermatikos*）：神把理性的种子撒在整个人类里，希腊哲学是这颗种子的成果，而基督是这颗种子长成的「整棵树」。

**这个方案的巨大优势**：它让受过教育的希腊人可以不必放弃自己的文化传统就皈依基督教。**巨大风险**：它把「福音」变成了「哲学的完成」，于是哲学的批评也可以变成对福音的批评。

#### 3.10.2 反对派：特土良与「雅典与耶路撒冷何干」

{{特土良}}（Tertullian，约 160–220 年）的立场截然相反。他的名言是：

> 「**雅典与耶路撒冷有什么相干？学园与教会有什么相干？异端与基督徒有什么相干？**」（*Quid ergo Athenis et Hierosolymis?*）

他认为哲学是「异端的父亲」——一切异端（尤其是 {{诺斯替派}}）都是因为把哲学混进了信仰。他宁愿说「我相信，因为它荒谬」（*credo quia absurdum*，虽然这句话并非他的原话，但表达了他的精神）。

:::pit t="关于特土良的著名误传"
「**我相信，因为不可能**」（*credo quia absurdum est*）这句话经常被安在特土良头上，甚至被用来论证基督教反理性。但**特土良从来没有写过这句话**。它的来源是他《论基督的肉身》（*De carne Christi* 5）中的一句：「**这是确定的，因为不可能**」（*certum est, quia impossibile*）——上下文的意思是：**基督的复活之所以可信，正是因为它不可信**，因为若是人编的，人不会编一个如此违背常识的故事。

这句话的语境是**反驳幻影说**（如果耶稣只是幻影，复活就不荒谬了），而不是「反理性」的宣言。引用它来证明「基督教反智」，是典型的断章取义。
:::

**但这里有一个全书最精彩的讽刺**：**正是特土良，用希腊哲学的语言造出了三位一体教义的核心词汇**——*Trinitas*（三位一体）、*persona*（位格）、*substantia*（本质）。这位「反对雅典」的人，给后世正统提供了一整套雅典的语法。

:::note
这个现象值得记住，因为它不是孤例：**在教义史上，「反哲学」的立场往往不得不用哲学的语言来表达自己。** 20 世纪的新正统神学家卡尔·巴特（Karl Barth）反对「自然神学」，但他的《教会教义学》用的是极其精密的德国观念论语言。这不是虚伪，而是一个无法逃避的结构：**你只能用你手上的语言，反对你手上的语言。**
:::

#### 3.10.3 亚历山大学派：寓意解经与「哲学是学校的教师」

第三条路来自埃及的**亚历山大城**，代表人物是 {{亚历山大的克雷芒}}（Clement of Alexandria，约 150–215 年）和 {{奥利金}}（Origen，约 185–254 年）。

他们的方案是**寓意解经**（{{寓意解经}}）：既然圣经字面常常粗鄙（神会发怒、会后悔、会要求屠杀），那就说明**字面不是真意**，真意在字面之下。奥利金发展出三层解经（字面义、道德义、属灵义），把整部旧约读成一部关于灵魂上升的寓言。

**奥利金的贡献与代价**：

- **贡献**：他写出了古代最系统的基督教神学（《论首要原理》），发明了六经合璧（*Hexapla*），是最早的圣经校勘学家。他是整个东方神学的老师。
- **代价**：他的某些推论后来被判定为异端，包括「灵魂先存」「万物最终复原」（*apokatastasis*，即地狱终将空无一人）「子永恒受生但次于父」（{{次位论}}）。553 年的第二次君士坦丁堡会议（或其后）谴责了「奥利金主义」。

:::why t="为什么这一节的路线斗争，预示了整部现代史"
把 2 至 3 世纪的三种态度，与现代基督教的三大阵营对应起来，你会看到一个惊人的同构：

| 古代立场 | 核心态度 | 现代对应 |
|---|---|---|
| 查士丁 | 哲学是福音的盟友，理性可以通向神 | 自由主义神学、自然神学、天主教新托马斯主义 |
| 特土良 | 哲学是污染，信仰与理性对立 | 基要主义、部分{{福音派}}、「圣经无误」运动 |
| 奥利金 | 字面之下有深意，需要专业解经 | 学术性神学、历史批判学、主流新教神学院 |

**这三种态度今天仍在互相指责对方「不忠」或「不智」。** 所以本书把这一节放在第一部——它不是一个古代话题，它是当代教会分裂的深层结构。
:::

### 3.11 争议与反驳：这一章被质疑的三处

**（一）「希腊化论题」的反对意见。**

哈纳克的论点（教义是希腊哲学对福音的改造）在 20 世纪受到强烈批评：

- **批评一**：它预设了一个「纯粹的福音」，而这个纯粹福音在历史上从未存在过。**连新约本身**（尤其约翰福音与希伯来书）就已经在使用希腊化世界的语言。
- **批评二**：它把「借用词汇」等同于「改变内容」，这是一个跳跃。**任何翻译都是借用**——把希伯来文的 *emunah* 译成希腊文的 *pistis*，就已经在改造它了。
- **批评三**：教义的核心（耶稣是主、他死了、他复活了）**不是从哲学推出来的**，而是从实践（敬拜、圣餐、殉道）逼出来的。哲学只是解释的工具，不是内容的来源。

**但哈纳克的论点有一半是对的**：当你选择了一种语言，你就接受了那门语言自带的世界观。**用「本质」来说神，就已经把神放进了一个「类」与「个体」的框架里**——而这正是第 4 章那场大战的起因。

**（二）「预表论」的反对意见（犹太教的批评）。**

见 3.8.5 节。核心是：**预表论是循环论证**——先假定耶稣是弥赛亚，再去旧约找对应。而任何一个人都可以用这种方法「预言」自己。

**基督教的回应**：（1）新约作者不是在「发明」对应，而是在使用**当时的犹太解经传统**（midrash、pesher）；（2）某些对应（如赛 53、诗 22）在犹太传统中确实有「受苦」的读法；（3）**但本书承认**：这些对应在方法上确实不可证伪，它们的力量来自信仰，不来自论证。

**（三）「罗马的误解」这一节的反对意见。**

有读者会问：既然罗马人误解了基督教，那么「罗马迫害」的责任在谁？

- **一种读法**：罗马的误解是**真诚的**——在一个「宗教 = 公共仪式」的世界里，拒绝参加祭祀确实看起来像「无神论」与「不忠」。
- **另一种读法**（更批判）：罗马不需要「误解」，它只需要**一个替罪羊**。塔西佗记载尼禄在 64 年大火后把基督徒当作替罪羊处死——**这不需要任何神学误解，只需要政治需要。**

**本书的立场**：两种读法都有道理。**迫害的动机可以是真诚的恐惧，也可以纯粹是政治算计，而两者常常同时存在。**

:::pit t="关于「罗马帝国为什么迫害基督徒」的一个必要澄清"
迫害**不是持续的、全帝国范围的**。在 313 年之前，它主要是**地方性的、间歇性的**——有几十年的和平期，也有几年的猛烈迫害（250 年代、303–311）。

**基督徒并不是「一直在被狮子吃掉」。** 这个形象主要来自 19 世纪的小说（如《你往何处去》）与好莱坞电影，而不是史料。
:::

## 第一部派别档案（卡片速查）

全书每个派别都用同一套卡片呈现，方便横向比较。以下是第一部出现的七个群体（阿里乌派要到第二部才正式登场，卡片见第二部档案）。**读卡片的方法**：先看「主张」（它到底信什么），再看「要解决的问题」（它为什么会出现）——因为绝大多数派别不是因为愚蠢而出现的，而是为了堵一个真实的洞。

> [[k:诺斯替派 | en:Gnosticism | 2–4 世纪 | 异端 | 已消亡]]
> **主张**：物质世界由一位次等的「造物主」所造，是囚禁灵魂的牢笼；灵魂来自光明世界；得救靠秘密的「知识」（*gnosis*），不靠历史事件。基督是启示者，不是真正的受难者（→ {{幻影说}}）。
> **来历**：2 世纪前后在地中海世界多处独立成形，有基督教版本（华伦提努、塞特派、巴西里德）与非基督教版本（赫尔墨斯主义、曼达派）。1945 年拿戈玛第出土文献让我们第一次读到它的原典。
> **要解决的问题**：**恶从何而来**。如果神是善的，世界为什么这么坏？它的答案是：世界不是善神造的。这个答案在当时比正统的「自由意志堕落」更有说服力。
> **论敌**：正统教会（爱任纽、特土良、希坡律陀）；同时也攻击旧约的神。
> **所受反驳**：（1）若基督没有真肉身，殉道就没有意义；（2）得救若靠知识，则穷人、文盲无份，与「神爱世人」矛盾；（3）它无法解释为何要把「秘密」公开写成书。
> **结局 / 现状**：4 世纪后式微，但其「物质低劣、灵性高等」的直觉通过摩尼教、卡特里派、以及现代的新时代运动持续存在。

> [[k:马吉安派 | en:Marcionites | 2–4 世纪 | 异端 | 已消亡]]
> **主张**：旧约的神是公义而严厉的审判者，新约的神是陌生而慈爱的善神，二者不是同一位。只承认删节版《路加福音》与十封保罗书信，完全抛弃旧约。
> **来历**：马吉安（约 85–160）144 年在罗马被逐后自建教会。他的教会组织严密、传播广、延续到 5 世纪，是古代最成功的「异端教会」。
> **要解决的问题**：**圣经内部的矛盾**。旧约的报复性经文与新约「爱仇敌」的教导如何统一？他的答案是：不统一，因为是两个神。
> **论敌**：正统教会；尤其是特土良（写五卷《驳马吉安》）。
> **所受反驳**：（1）耶稣自己引用旧约并以之为权威；（2）保罗本人是犹太人、熟读旧约；（3）一个「陌生的善神」突然出现，与「创造主」毫无关系，那「创造」与「救赎」就断裂了。
> **结局 / 现状**：组织消亡，但「旧约的神很暴力、新约的神很温柔」这一**马吉安式直觉**在普通信徒中极为普遍，也是现代自由主义神学的一个默认前提。

> [[k:孟他努派 | en:Montanism / New Prophecy | 2–4 世纪 | 异端 | 已消亡]]
> **主张**：圣灵仍在透过先知直接说话（「新预言」）；末日临近；要求严格禁食、禁欲、乐于殉道。
> **来历**：2 世纪后半叶兴起于小亚细亚弗里吉亚，由孟他努与两位女先知（Prisca、Maximilla）发起。特土良晚年加入。
> **要解决的问题**：**教会正在「制度化」，圣灵去哪儿了？** 当主教取代先知、教规取代灵感，早期那种「圣灵充满」的经验如何保留？
> **论敌**：主教制的代言人（反对「新预言」的权威）；也反对教会对重罪者的宽赦。
> **所受反驳**：（1）若圣灵可以随时说话，则正典与主教会议失去最终性；（2）其先知的行为被指为「狂乱失控」，与理性信仰不符；（3）末日预言落空。
> **结局 / 现状**：被主流判为异端而消亡，但它是此后一切「持续启示」运动的原型：从约阿希姆、再洗礼派，到五旬节运动、摩门教、各种「新先知」团体。

> [[k:伊便尼派 | en:Ebionites | 1–4 世纪 | 异端 | 已消亡]]
> **主张**：耶稣是弥赛亚，但只是一个在受洗时被圣灵充满的义人（→ {{嗣子论}}）；必须遵守摩西律法（包括割礼与饮食）；否认保罗的权威，只用《马太福音》的希伯来版本。
> **来历**：「Ebionites」来自希伯来文 *evyonim*（贫穷者），可能指其苦修生活或对贫穷的尊崇。主要见于教父（爱任纽、伊皮法纽）的记述，也常被联系到耶路撒冷的犹太基督徒群体。
> **要解决的问题**：**如何既承认耶稣是弥赛亚，又不放弃犹太人的身份与律法？** 它是「基督教尚未脱离犹太教」那个阶段的活化石。
> **论敌**：保罗（否认其使徒权柄）、马吉安（认为他们太犹太化）、正统教会（认为他们否定了基督的神性）。
> **所受反驳**：正统方面：若耶稣只是义人，则救恩来自人；犹太教方面：若弥赛亚已来而世界仍未更新，则他不是弥赛亚。**两边都不接受它。**
> **结局 / 现状**：4 世纪后消失。它是理解「基督教如何从犹太教分离」的关键证据。

> [[k:诺洼天派 | en:Novatianists | 3–6 世纪 | 分裂派 | 已消亡]]
> **主张**：教会在迫害后不能赦免「背教」之罪（向偶像献祭、交出圣经）。这不是「纪律从严」，而是「教会必须是圣洁的」。
> **来历**：251 年诺洼天反对罗马主教哥尼流对弃教者的宽赦政策，被对立祝圣为罗马主教。其团体在东西方延续数百年。
> **要解决的问题**：**殉道者的血与背教者的妥协，能不能放在同一个教会里？** 如果教会无条件接纳一切，那殉道还有什么意义？
> **论敌**：罗马主教哥尼流、居普良（后者折中：可以接纳，但须公开补赎）。
> **所受反驳**：（1）教会若只容纳圣人，就不是医院而是俱乐部；（2）「谁配」的判定权本身会变成新的暴政；（3）圣经里彼得三次否认主仍被恢复。
> **结局 / 现状**：6 世纪后逐渐消失。但同一结构在 {{多纳图派}}、重洗派、清教徒、当代「教会纪律」争论中反复出现。

> [[k:多纳图派 | en:Donatism | 4–7 世纪 | 分裂派 | 已消亡]]
> **主张**：**圣礼的有效性取决于施行者的圣洁。** 迫害中叛教的主教所施的洗礼与按立无效，由他按立的主教也无效，与他共融的教会不是真教会。
> **来历**：311 年凯其里安被祝圣为迦太基主教，被指其祝圣者之一曾「交出圣经」；312 年多纳图被对立祝圣。运动在北非乡村与柏柏尔人中极有基础，是对罗马化精英的社会反抗。
> **要解决的问题**：**教会是圣洁的余种，还是麦子与稗子的混合体？** 如果教会里全是妥协者，那它还是基督的身体吗？
> **论敌**：罗马教会、奥古斯丁（写了十几年反驳）、帝国政权（411 年迦太基会议后遭镇压）。
> **所受反驳**：奥古斯丁：（1）圣礼的有效性来自基督，不来自施行者的功德；（2）若圣礼取决于施礼者，信徒就永远无法确定自己受洗了没有；（3）圣经比喻教会是打谷场，稗子要到末了才分开。
> **结局 / 现状**：411 年后被镇压，地下延续到 7 世纪阿拉伯征服。**它留下了一个反面遗产**：奥古斯丁为镇压它而提出的「强迫他们进来」（*compelle intrare*），成为后世宗教强制的经典依据。

> [[k:撒伯里乌派 / 形态论 | en:Sabellianism / Modalism | 3 世纪 | 异端 | 已消亡]]
> **主张**：父、子、圣灵是同一位神在历史中先后采取的三种「面具」或「工作方式」，不是三个永恒的位格。
> **来历**：3 世纪撒伯里乌在罗马传播，前身可追溯到 2 世纪末的普拉克西亚斯（Praxeas，特土良曾写文驳他）。
> **要解决的问题**：**如何最彻底地保卫一神论？** 它担心的是 {{三神论}}：如果父子真是两个，那基督教不就是多神教吗？
> **论敌**：特土良（造出 *Trinitas* 一词正是为了驳它）、希坡律陀、后来的 {{亚他那修}}。
> **所受反驳**：（1）耶稣在客西马尼向父祷告，难道是向自己祷告？（2）十字架上死的是父吗？（「圣父受难说」）（3）父子之间的爱变成自爱，救赎变成神的一场独角戏。
> **结局 / 现状**：3 世纪被谴责，但**它成了此后一千七百年最常用的指控武器**：任何强调父子区别的说法都被指为三神论，任何强调同一的说法都被指为撒伯里乌主义。**三位一体教义就是在这两侧的夹击中划出的那条线。**

:::note
**卡片的用途**：当你在后面几部遇到一个新派别，可以回头对照这张清单，问三个问题——（1）它在回答第一部里的哪一行争议？（2）它的「要解决的问题」是否真实？（3）它受到的反驳是否击中了它？**这三个问题，比记住任何年号都有用。**
:::

## 争论的温度计：第一部 {#part1-thermometer}

下面这张表是第一部的压缩版。每一行都是一个**至今仍在发作**的争议。格式说明：**核心争议词**＝一句话说清在争什么；**历史触发器**＝什么事件把它引爆；**各方立场**＝当时的主要选项；**今天的影响**＝它现在以什么形式存在。

| 核心争议词 | 历史触发器 | 各方立场 | 今天的影响 |
|---|---|---|---|
| **「耶稣是主」到底是什么意思** | 早期信徒向耶稣祷告、唱诗（小普林尼 112 年证实）；犹太人指控这是亵渎 | 嗣子论（耶稣是被神选中的义人）／幻影说（耶稣只是显现为人）／诺斯替（耶稣是启示者，不真死）／正统方向（神真的成了人） | 一切基督论争论的原型；耶和华见证人（嗣子论式）、自由主义神学（耶稣是道德导师）、正统派之间的三方拉锯 |
| **外邦人要不要守摩西律法** | 约 49 年耶路撒冷会议；保罗在加拉太与安提阿与彼得冲突 | 保罗派（因信称义，不要求割礼）／雅各派（保留律法实践）／伊便尼派（必须守全律法） | 「信仰边界是信什么还是属于哪个群体」——从宗教改革的「{{唯独信心}}」到当代教会的「文化基督徒」之争 |
| **物质世界是好的还是坏的** | 诺斯替主义盛行；摩尼教兴起；恶的问题无解 | 诺斯替（物质是监狱，救恩靠知识）／正统（物质是神造的，故是好的；恶来自自由意志）／摩尼教（光暗二元） | 一切「身体是低级的、灵魂是高级的」直觉；基督教科幻式的灵性化；对性的态度；新时代运动 |
| **旧约的神是不是新约的神** | 马吉安 144 年被逐；教会决定保留旧约 | 马吉安（两个神）／正统（一个神，两个约）／部分教父（旧约的严厉是「教育」） | 普通信徒的「马吉安式直觉」；自由主义把旧约当「原始宗教」；反犹主义的神学土壤 |
| **教会的圣洁是「成员的」还是「基督的」** | 250 年德西乌斯迫害、303 年戴克里先迫害后的「弃教者」问题 | 诺洼天派／多纳图派（圣礼有效性取决于施礼者的圣洁）／奥古斯丁（有效性来自基督） | 一切「真教会」运动：重洗派、清教徒、分离主义者、当代的教会纪律与「余种」神学 |
| **圣经到底是哪几本** | 马吉安编了自己的圣经；诺斯替有自己的福音书 | 马吉安（删节版路加＋保罗）／教会（旧约＋四福音＋保罗书信等，4 世纪定型）／各地教会初期差异很大 | 正典的边界问题；「次经」在新教与天主教间的差异；当代对「被排除的福音书」的浪漫化（《达芬奇密码》） |
| **信仰能不能用哲学来说** | 查士丁 vs 特土良 vs 奥利金；诺斯替用哲学掏空信仰 | 哲学是盟友（查士丁）／哲学是污染（特土良）／哲学是工具但需寓意解经（奥利金） | 基要主义 vs 自由主义；自然神学之争；巴特与「自然神学」的世纪之争 |
| **死人复活是肉身的还是象征的** | 诺斯替否认肉身复活；异教哲学鄙视身体；科林斯教会已经有人否认（林前 15:12） | 肉身复活（正统）／象征性复活（诺斯替、部分自由派）／灵魂不朽替代复活（受柏拉图影响） | 当代神学中「复活是象征」的争论；「灵魂上天堂」这一民间信仰其实是希腊化的，不是圣经的 |
| **一个神怎么会「有儿子」** | 「耶稣是主」＋严格一神论＝逻辑死结；希腊哲学的「流溢」提供现成答案 | 嗣子论／形态论（一个神演三个角色）／阿里乌（子是最高的受造物）／正统（同一本质，三个位格） | 耶和华见证人（阿里乌式）、一位论派（Unitarians）、伊斯兰教与犹太教的持续指控 |

:::note
**怎么用这张表**：读到后面任何一章，遇到一个新的派别，可以回到这张表问：**它主要是在回答哪一行的问题？** 绝大多数宗派分裂，都可以归到这张表的某一行，或者几行的组合。这就是本书所谓「争论的温度计」——它测的不是「谁对」，而是「哪根神经被碰到了」。
:::

## 第一部小结：三个待爆的火药桶

第一部讲完了「根」。如果把这一部压缩成三句话，它们是：

1. **基督教诞生于一个尚未定型的犹太教内部，并且从一个极其危险的宣告开始**——「耶稣是主」，这句话在一个严格一神论者耳朵里等于亵渎，在一个信徒心里等于神亲自来了。这个张力不是后来的神学家制造的，它从第一天就在。
2. **基督教的词汇是从希腊哲学借来的，而这些词自带世界观。** *ousia* 的两种用法、*hypostasis* 的歧义、*persona* 的现代误读、中文「位格」的生造——这些语言问题不是「表面功夫」，它们决定了争论的走向。
3. **基督教从来不是在与「外人」的辩论中定义自己的，而是在与「最懂它的人」的辩论中定义自己的。** 犹太教的反驳最根本（共享经典），罗马的误解最致命（决定生死），诺斯替的诱惑最内在（用它的语言说它的话）。这三场对撞，塑造了教会的自我认识。

现在，火已经埋好了。第二部要讲的，是它在 4 至 5 世纪的两次总爆发：**三位一体之争**与**基督论之争**。这两场争论将决定「正统」这个词的最终形状——也将制造出基督教史上最大规模、至今未愈的裂口。

:::titre
**下一部：古代教义大辩论（第 4–7 章）**

从 318 年阿里乌与亚历山大主教的争吵开始，到 451 年迦克墩会议把教会劈成两半，再到 1054 年东西方互相{{绝罚}}。你会看到：一个词的误读如何引发六十年的战争，一次会议的措辞如何让整个民族（埃及、叙利亚、亚美尼亚）永远离开，以及为什么今天的「东方正统教会」比天主教和东正教加起来还要古老。
:::

# 第二部：古代教义大辩论

## 一个长老的布道，如何炸掉了整个帝国

公元 318 年或 319 年的某个主日，埃及亚历山大城的一位长老（*presbyteros*）在讲道中提出了一个在他看来极其敬虔的观点：

> **如果父是唯一的、无始的、不变的，那么子就不可能是无始的。子是「被生」的——被生就有起点。所以，「曾有一时子不存在」。**

这位长老叫 {{阿里乌}}。他不是异教哲学家，不是叛教者，也不是想拆毁教会的人。他是亚历山大城最受尊敬的解经家之一，身材高瘦、口才极好，写的诗歌（《宴席》*Thalia*）在码头工人和水手中间广为传唱。他提出这个观点，是为了**保卫**神的独一与超越——在他看来，当时流行的说法（子与父同等）简直是把神切成两半，是偷偷引入了两个神。

他的主教**亚历山大**（Alexander of Alexandria）听了之后，认为这是彻底的亵渎。两人的冲突从一个教区蔓延到整个埃及，从埃及蔓延到整个东地中海，最后变成一场持续六十五年、牵连四位皇帝、五次大公会议、无数次流放与街头暴力的战争。

:::why t="为什么这不是一场「书斋里的争吵」"
很多人第一次听到「三位一体之争」时的反应是：这些人没有别的事可做吗？

但请注意这场争论的三个现实层面：

1. **它决定了「你在向谁祷告」。** 如果耶稣不是真神，那么基督徒两千年来向耶稣的祷告就是 {{偶像崇拜}}——这是犹太教与伊斯兰教最核心的指控。这不是抽象问题，而是每天在发生的动作。
2. **它决定了「救恩是否成立」。** 若基督是受造物，那么拯救来自一个受造物；而「受造物无法把受造物带回神那里」是当时公认的原则。
3. **它决定了「谁有权力说话」。** 谁召集会议、谁签字、谁被流放——教义问题与教会权力问题在这六十年里完全缠绕在一起，无法分开。

所以 4 世纪的教会不是「闲得发慌」。他们在争的是一个问题的答案：**那个被钉死在十字架上的人，到底是谁？** 这个问题不能回避，因为它决定了基督徒每天在做什么。
:::

## 第 4 章：三位一体之争（318–381） {#ch-4}

### 4.1 阿里乌到底说了什么（以及他为什么不是「不信耶稣」）

先把一个流行误解拆掉：**阿里乌并不否认耶稣的崇高。** 他否认的是「耶稣与父同一本质」。这两件事差别巨大。

阿里乌的完整立场，大致是这样的：

1. 神是唯一的、无始的、不可分、不可变的。**「无始」（*agennētos*）是神独有的属性**，它不只是「很早就存在」，而是「根本没有起源」。
2. 子是「被生」的（*gennētos*）。被生就意味着有一个「生」的动作，因此有一个「之前」。
3. 所以：**「曾有一时子不存在」**（*ēn pote hote ouk ēn*）。子是从无中被父产生的——但不是「创造」（*ktizein*），而是「生」（*gennan*），一种比创造更高的产生方式。
4. 子是受造物中最高的、在万世以前被造的、配得被称为「神」（次等意义）、配得敬拜——但**他不是真神本身**，他的神性是「被赐予的」，因此是可变的（虽然他实际上没有变）。
5. 圣灵是子的第一个受造物，比子更低。

:::pit t="最常见的误解：阿里乌是「理性主义者」，想用哲学削弱信仰"
这个说法流传极广，但历史事实更复杂。

**支持这个说法的证据**：阿里乌确实使用了当时流行的哲学语汇（尤其 {{新柏拉图主义}} 的层级结构），他的名言「曾有一时子不存在」是一个逻辑推演的结果。

**反对这个说法的证据**：（1）他的对手{{亚他那修}}同样使用希腊哲学，而且用得更多；（2）阿里乌的核心关切是**敬虔的**——他怕的是把神「拉低」到受造界，怕的是一种不敬虔的混淆；（3）他写的《宴席》是通俗诗歌，目的是让普通人唱得出来，这更像牧师而不是学院派。

**更准确的说法**：阿里乌不是「用哲学反对信仰」，而是**用一套哲学（强调神的绝对超越与不可分）去保卫一个敬虔直觉（神是独一无二的）**——而这套哲学恰好推出了正统不能接受的结论。这与他的对手所做的是同一件事，只是选了不同的哲学直觉。
:::

### 4.2 双方共用的经文，与完全相反的解经

这场争论最令人绝望的一点是：**双方都引用圣经，而且引用的都是真的。** 没有任何一方能靠「你引错了」取胜。这是理解整场争论的关键。

| 经文 | 阿里乌派怎么读 | 尼西亚派怎么读 |
|---|---|---|
| 箴言 8:22（七十士译本）「耶和华**造**了我，为祂工作的起头」 | 「智慧」就是子；圣经明说他被「造」 | 「造」的译法有争议（*ektisen* vs *eklēsen*）；且这是指「道成肉身」或「经世中的角色」，不是永恒的本质 |
| 约翰福音 14:28「父比我大」 | 明说子小于父 | 「大」指来源（父是非受生的来源），不指本性；否则与约 10:30「我与父原为一」冲突 |
| 马可福音 13:32「子也不知道那日子」 | 子连知识都有限，怎么是全知的神 | 指基督的人性理智，或指「不向人启示」而非「不知道」 |
| 歌罗西书 1:15「首生的，在一切被造的以先」 | 「首生」意味着子属于「被造的」这一类别，只是排第一 | 「首生」在古代语境中指**继承权与优先地位**，不指被造（诗 89:27「立他为长子，高于世上君王」——那位显然不是被造的） |
| 约翰福音 1:1–3「道就是神……万物都是借着他造的」 | 「神」前面没有冠词（*theos* 而非 *ho theos*），所以是「一个神」而非「那位神」 | 约翰在同一句里已经说了「道与神同在」，两个「神」不可能是同一个语法位置；且「万物都是借着他造的」若成立，他自己必不被造 |
| 腓立比书 2:6–11「不以自己与神同等为强夺的」 | 他「没有抢」，说明他本来不是 | 这段是「虚己」（*kenōsis*）：本来同等，却自愿降卑——正是「同等」才使降卑有意义 |
| 约翰福音 8:58「还没有亚伯拉罕就有了我」 | 「就有了我」是比喻性的优先 | 希腊文 *egō eimi*（我是）直指出 3:14 的神名 |

:::why t="为什么「双方都能引经」这件事如此重要"
因为它证明了教义争论**不是「读经不认真」的问题**。

当双方共享同一部经典、且都能从经典中找到支持，那么「经文说了什么」这个问题的答案，就取决于**更大的解释框架**——你预设了什么、你用什么哲学、你关心哪些经文、你如何解决冲突的经文。而这个框架本身不在经文里。

这就是为什么 4 世纪必须开会议、必须发明新词（{{本体同一}}）。**不是因为不尊重圣经，而是因为圣经在这一点上没有给出可以直接引用的公式。** 换句话说：教义不是圣经的替代品，而是**对圣经如何处理自身张力的一份判决书**。

这份判决书可能是错的——犹太教与伊斯兰教都这么认为——但它的性质必须搞清：**它是一份解释性判决，不是一段新启示。**
:::

### 4.3 尼西亚会议（325）：皇帝走进神学

争论爆发后，亚历山大主教写信给各地主教，谴责阿里乌。阿里乌则去找有权势的朋友——包括尼科米底亚主教**优西比乌**（Eusebius of Nicomedia，后来的君士坦丁堡主教，皇帝的远亲）。争论迅速从埃及扩散到整个东地中海。

**皇帝君士坦丁刚刚统一帝国（324 年击败李锡尼），最不想要的就是宗教分裂。** 他派了科尔多瓦的主教**何西乌**去调解，失败。于是他在 325 年召集了一次全帝国主教会议——地点选在尼西亚（今土耳其伊兹尼克），因为他自己在附近的行宫。

:::src t="尼西亚会议的几个关键事实"
- **人数**：传统说 318 位（这个数字来自创世记 14:14，有明显的象征意图）。现代估计约 250–300 位。**西方（拉丁）主教只有 5 位左右**，压倒性多数是希腊语东方主教。
- **主持**：名义上由皇帝主持开幕，实际议程由何西乌与亚历山大一方推动。
- **阿里乌的地位**：他是被审判的对象，有少数支持者（包括尼科米底亚的优西比乌与凯撒利亚的优西比乌）。
- **成果**：（1）一份信经；（2）对阿里乌及其支持者的谴责（*anathema*）；（3）复活节日期规则；（4）20 条教规（关于教会纪律、神职资格等）。
- **谁签了字**：几乎所有主教都签了，包括大部分原本同情阿里乌的人——**但签字不等于同意**。许多人是出于对皇帝的服从，或者因为他们理解「本体同一」的含义与亚他那修不同。
:::

会议的核心争议落在一个词上：**{{本体同一}}**（*homoousios*，「同一本质」）。

这个词的选择极其冒险，原因有三个：

1. **它不在圣经里。** 反对方（优西比乌派）立刻指出：你们用一个圣经没有的词来定别人的罪，这是不合理的。
2. **它曾被用于异端。** 2 世纪的一些 {{形态论}} 者用过类似的说法，所以「同一本质」在很多人听来等于「父子是同一个人」，即 {{撒伯里乌主义}}。
3. **它的含义不清楚。** 当时没有一个公认的定义——「本质」在柏拉图语境与亚里士多德语境里意思相反（见 3.3 节）。

:::why t="那么为什么还要用它？"
因为**所有别的词都已经被阿里乌一方占住了**。

- 用「子来自父」——阿里乌同意（他说子是被父生的）。
- 用「子是神的像」——阿里乌同意（他说子是最完美的像）。
- 用「子在万世以前存在」——阿里乌同意（他说子在时间之前被造）。
- 用「子是真神」——阿里乌同意（他说子是次等意义上的神）。

**每一个看起来够强的表述，阿里乌都能在里面找到位置。** 只有「本质同一」这个词他无法接受，因为它的含义是「子与父属于同一个不可分割的神性，没有程度差别，不是被产生的」。这就是为什么这个词被强行塞进信经——**它不是一个教学用语，而是一道封锁线。**

这也解释了一个后世反复出现的现象：**教义的精确性往往不是从「想说明白」来的，而是从「不想被误解」来的。** 每一句「受生而非被造」「出于光而为光」都是在堵一个特定的漏洞，读起来像法律条文，因为它本来就是法律条文。
:::

### 4.4 尼西亚之后：六十年更惨烈的混战

很多教科书把 325 年写成「问题解决了」。事实恰恰相反：**尼西亚之后才是真正的战争**。

**第一回合：亚他那修的五次流放（325–361）。**
328 年，亚历山大去世，{{亚他那修}} 继任主教。他比阿里乌年轻，但立场毫不妥协。此后：

- 335 年，第一次被流放（到特里尔），罪名是「阻止埃及的粮食运往君士坦丁堡」——一个政治罪名。
- 339 年，第二次流放（到罗马）。
- 346 年，返回。
- 356 年，第三次流放（到埃及沙漠），期间写下《圣安东尼传》，把修道运动推向整个帝国。
- 362 年，返回。
- 365 年，第四次流放。
- 366 年，返回，直到 373 年去世。

**为什么他总被流放**：因为皇帝换了好几任，而多数皇帝支持阿里乌一方或折中派。**教义的胜负，在这几十年里与皇帝的更替高度同步。**

| 皇帝 | 在位 | 宗教立场 | 对争论的影响 |
|---|---|---|---|
| 君士坦丁 | 306–337 | 倾向折中，晚年受优西比乌影响 | 召集尼西亚，后又召回阿里乌 |
| 君士坦提乌斯二世 | 337–361 | **明确支持阿里乌派** | 多次流放亚他那修；强迫西方主教接受阿里乌信条 |
| 尤利安（「叛教者」） | 361–363 | 复兴异教 | 召回所有被流放的主教，让基督徒自相残杀 |
| 约维安 | 363–364 | 尼西亚派 | 在位仅八个月 |
| 瓦伦斯 | 364–378 | 阿里乌派 | 迫害尼西亚派；376 年{{哥特人}}阿里乌化 |
| 狄奥多西一世 | 379–395 | **尼西亚派** | 381 年召集君士坦丁堡会议，最终定局 |

**第二回合：信经的繁殖（341–360）。**
这二十年间，各种会议不断通过新的信经，试图找到一个大家都能签的表述：

- **341 年安提阿会议**：通过一份不提「本体同一」的信经，被尼西亚派视为背叛。
- **343 年塞尔迪卡会议**（今索菲亚）：东西方主教公开决裂——西方坚持为亚他那修平反，东方（阿里乌派占多数）退场另开会议。**这是东西方教会第一次在教义会议上分裂。**
- **351 年西尔米乌姆会议**：通过极端阿里乌信条。
- **357 年**：出现了「本体相异」（*anomoeos*）的表述——比阿里乌更激进。
- **359 年阿里米努姆与塞琉西亚会议**：皇帝强推「相似」（*homoios*）表述， Jerome 后来评论说「整个世界都成了阿里乌派」（*ingemuit totus orbis et Arianum se esse miratus est*）。

**第三回合：{{半阿里乌派}} 的中间路线与它的失败。**
「本质相似」（{{本体相似}}，*homoiousios*）看起来是最合理的折中——与「同一」只差一个字母 iota。但正如 3.7 节所说，它不稳定：相似到什么程度？

**第四回合：加帕多家的三人组（370–381）。**
{{加帕多家教父}} 完成了三件关键工作：

1. **巴西流**（Basil of Caesarea）写《论圣灵》，证明圣灵也是神，不只是神的能力。
2. **拿先斯的格列高利**（Gregory of Nazianzus）写《神学演讲》五篇，划清了「神学」（关于神的内在生命）与「经世」（神对世界的作为）的界线，并提出：**父子之别在于「来源关系」，不在于「本性等级」**。
3. **尼撒的格列高利**（Gregory of Nyssa）用哲学语言系统化了整套结构（尤其《驳欧诺米》），并提出 {{互渗相寓}}。

:::why t="格列高利最精彩的一段话：为什么不能「全都一样」"
拿先斯的格列高利面对一个尖锐的挑战：如果父、子、圣灵都是神，而且完全相同，那么「父」「子」「圣灵」这三个名字到底在说什么？如果名字不表示任何真实区别，那三位一体就只是三个同义词（→ {{形态论}}）；如果它们表示区别，区别在哪里？

他的答案是：**区别在于「来源的关系」，而不在于「本性」**。

- 父：**非受生**（*agennēsia*）——不是从任何别的来的。
- 子：**受生**（*gennēsis*）——从父而来（不是被造）。
- 圣灵：**发出**（*ekporeusis*）——从父而出（约 15:26）。

**这三个词不是描述「神性」，而是描述「关系」。** 神性完全同一，关系彼此不同。这就是 {{位格}} 的最终定义：**位格不是「一块神性的三分之一」，而是「一个不可重复的关系」。**

这个答案极其优雅，但它也埋下了一颗炸弹：**如果「发出」是圣灵的专有属性，那么「从父和子发出」（{{和子句}}）就改变了这个关系——于是它不再是一个词的问题，而是三位一体的结构问题。** 第 7 章会看到，这颗炸弹在 1054 年爆炸。
:::

### 4.5 君士坦丁堡会议（381）与最终的语法

379 年，狄奥多西一世登基，明确支持尼西亚信仰。381 年，他在君士坦丁堡召集会议（约 150 位主教，全部来自东方——**西方没有参加**）。

会议成果：

1. **扩订信经**：在 325 年版本上补充了关于圣灵的条款（「赐生命的主，从父发出，与父子同受敬拜同受荣耀」），形成今天通行的《尼西亚—君士坦丁堡信经》。
2. **谴责 {{敌圣灵派}}**（否认圣灵神性者）、{{阿波利拿里主义}}（否认基督有完整人性者）、以及各种阿里乌变体。
3. **确认君士坦丁堡主教在荣誉上仅次于罗马主教**（第 3 条教规）——这条教规后来成为东西方争论的一个焦点。

:::note
一个必须注意的历史事实：**381 年的会议是「东方会议」，罗马主教没有派代表参加。** 而今天所有教会（天主教、东正教、多数新教）都在使用的《尼西亚信经》，正是这次会议的产物。这提醒我们：普世信经的「普世性」是事后追认的，会议当时只是地区性的。
:::

### 4.6 三位一体教义的最终语法（一张表讲完）

经过六十五年，教会最终确定的表述可以压缩成三句话：

1. **一个本质**（*mia ousia*）：父、子、圣灵共享同一个、不可分割的神性。不是三个「神性」拼在一起，也不是三个「部分」。
2. **三个位格**（*treis hypostaseis*）：三个真实有别的「谁」，区别仅在于关系（非受生／受生／发出）。
3. **不可混淆，不可分割**：位格不混合（反 {{形态论}}），本质不分割（反 {{三神论}}）。

| 要说「一」的地方 | 要说「三」的地方 | 绝对不能说的话 |
|---|---|---|
| 神性、全能、永恒、创造、旨意 | 「谁」：父、子、圣灵 | 「三个神」（三神论） |
| 三者的共同工作（一个动作，三个位格共同完成） | 关系：非受生、受生、发出 | 「一个位格三种面具」（形态论） |
| 敬拜的对象 | 名字、次序（*taxis*） | 「子比父低一级」（次位论） |
| 本质 | 位格 | 「子是被造的」（阿里乌主义） |

:::why t="为什么「一与三」不是算术矛盾"
这是所有质疑的核心。需要区分三件事：

**（1）「本质」与「位格」不在同一个逻辑层级上。**
「三个苹果」是「三个个体共享一个普遍（苹果性）」。三位一体**明确拒绝**这个模型——因为那确实是三神论。教父说的是：**在神里没有「普遍」与「个体」的区分**。神性不是一个可以被多个个体「分有」的抽象概念，因为神不是「一个类」。（见 {{本质}} 词条。）

**（2）类比必然失败，但失败的方式不同。**
- **水／冰／蒸汽**：这是 {{形态论}}，被明确判为异端。
- **太阳／光线／热**：容易变成 {{流溢}} 的等级结构，滑向阿里乌主义。
- **三个人的友谊**：变成三神论。
- **一个正方形有三条边**：有点用（一物三面，不可分割），但边与边只是关系，没有「来源」的区别。
- **奥古斯丁的心理类比**：记忆／理解／意志（一个心灵，三种能力）——但「能力」不是「位格」，容易滑向形态论。

**（3）正统的最终答案不是「解释清楚」，而是「划定边界」。**
教义说的是：**这就是教会的表述，你可以不理解它，但不能越过它。** 这不是反智，而是一种认识论上的谦卑：如果神是无限的，那么关于神的最精确陈述，必然在人类语言的能力边界上。**在这个边界上，语法必须极其小心，但语义必然残缺。**

一句常被引用的比喻：教义不是一张神的照片，而是**一道围栏**——它不告诉你围栏里有什么，但它告诉你哪里是悬崖。
:::

### 4.7 争议为什么会产生：五个层次的解释

回到本书的核心问题：**为什么这件事会让这么多人困惑、愤怒、分裂？** 答案不止一个，至少有五层。

**第一层：语言层。**
*ousia* 与 *hypostasis* 在希腊语里几乎同义（都是「存在、实在」），早期教父混着用。直到 4 世纪后期，「一个 ousia，三个 hypostasis」才成为固定公式。**在公式固定之前，任何一方的表述都能被对方读成异端。** 这不是他们笨，而是词汇本身还没有被磨出精度。

**第二层：解经层。**
如 4.2 节所示，双方都能引经。教义争论的实质是**「如何处理经文之间的张力」**，而这个问题没有中立答案。

**第三层：哲学层。**
希腊哲学提供了两套互不相容的直觉：柏拉图式的「一优先于多」（→ 容易滑向形态论）与亚里士多德式的「个体优先」（→ 容易滑向三神论）。选哪一套，会决定你读信经的方式。

**第四层：救恩层。**
「未被取用的，就未被医治」。如果基督不是真神，救恩就没有神性根基；如果基督不是真人，人性就没有被医治。**教义的精度被救恩的有效性逼出来。**

**第五层：政治层。**
皇帝需要宗教统一来维持帝国统一；主教需要皇帝的支持来压倒对手；城市的荣誉与主教的席位挂钩（亚历山大、安提阿、君士坦丁堡、罗马、耶路撒冷后来被称为「五大宗主教区」）。**教义斗争从来不是纯粹的神学，但也从来不只是权力。**

:::src t="一个著名的现场记录：君士坦丁堡街头的争吵"
尼撒的格列高利在《论神性》（*De deitate Filii et Spiritus Sancti*）里留下了一段极其生动的描述，讲 380 年前后君士坦丁堡的日常：

> 「如果你想换钱，有人会跟你讨论受生与非受生；如果你想问面包的价钱，回答是『父比子大』；如果你问洗澡水准备好了没有，回答是『子是從无中造的』。」

这段话常被用来嘲笑「神学争吵的荒谬」。但它也可以反过来读：**这说明教义问题已经渗透到市场、澡堂、面包店——它不再是精英的话题，而是普通人每天要面对的身份标记。** 当一个社会里每个人都在争论同一个技术问题，通常不是因为大家闲，而是因为**这个问题与「我是谁、我和谁是一伙的」直接相关**。
:::

### 4.8 反驳谱系：谁在反对三位一体，理由是什么

三位一体是基督教最容易被攻击的一条教义，因为它同时踩中了一神论、理性、与圣经三块地盘。下面按攻击者的身份分类。

#### 4.8.1 内部反驳：阿里乌派与一位论派

**阿里乌派的反驳**（已经详述）：若子与父同一本质，则父子之别被取消；若父子有别，则本质不同。他们认为尼西亚派在偷偷引入两个神，或者偷偷引入形态论。

**16 世纪的一位论派**（{{一位论派}}）：**米格尔·塞尔维特**（Michael Servetus，1511–1553）在《论三位一体的错误》中主张三位一体是 4 世纪哲学污染的结果，不是圣经教导。他同时被天主教与新教追捕，最终在日内瓦被加尔文当局烧死——这是宗教改革时代最臭名昭著的一桩处死案。**莱利奥·索齐尼**与**福斯图斯·索齐尼**叔侄在波兰建立「波兰兄弟会」，形成「索齐尼主义」，影响英国的一位论派，并在美国发展为「一位论普世教会」（Unitarian Universalism）。

**耶和华见证人**：主张耶稣是神所造的最高存在（「首先被造的」），不是全能神；圣灵是神的力量而非位格。**他们的基督论在结构上与阿里乌极为接近**，尽管他们自己通常不引用阿里乌。

#### 4.8.2 犹太教的反驳

核心论点（详见 3.8 节）：**三位一体是多神教的伪装。**

- 《示马》（申 6:4）不可让步。
- 圣经里神反复说「除我以外，没有别神」（赛 45:5）。
- 「一个本质三个位格」这个区分在希伯来圣经里没有任何基础，它是希腊哲学的产品。
- 耶稣自己是一个犹太人，他向「独一的真神」祷告（约 17:3）——如果他是第二位格，这场景无法理解。

**基督教的典型回应**：（1）「一」与「三」不在同一层次，因此不违反一神论；（2）旧约里有「神的灵」「神的话」「耶和华的使者」等表述，暗示神内部有区分；（3）「示马」本身在基督教里被保留（可 12:29 耶稣引用它）。

**犹太教对回应的再回应**：（1）「层次不同」是一个哲学补丁，圣经里没有人这样想过；（2）「神的灵」「神的话」在希伯来圣经里是**神的能力与作为的修辞**，不是独立的位格——把它们读成位格，正是希腊化的痕迹；（3）耶稣引用示马，恰恰证明他持守严格一神论。

#### 4.8.3 伊斯兰教的反驳

伊斯兰教的反驳比犹太教更系统，因为它是在与基督教的直接对话中形成的。《古兰经》有大量经文直接针对三位一体：

> 「**真主绝不收养儿子。**」（19:35, 19:92 附近）
> 「**你说：他是真主，是独一的主；真主是万物所仰赖的；他没有生产，也没有被生产；没有任何物可以做他的匹敌。**」（112 章「忠诚章」）
> 「**妄言真主就是麦尔彦之子麦西哈的人，确已不信道了。**」（5:17, 5:72）
> 「**你们不要说三位。**」（4:171）

核心概念是 **tawhid**（认主独一）：真主的独一性不仅是数量上的（只有一个），更是**存在论上的绝对单纯**——真主没有部分、没有构成、没有「位格」的复数性。在这个框架里，「三个位格」不是「深奥」，而是 **shirk**（以物配主，即把受造物与真主并列）——**伊斯兰教认为这是最严重的罪，且不可赦免**（4:48）。

**基督教对伊斯兰的核心回应**：（1）三位一体不是三个神，因此不是 shirk；（2）「真主没有儿子」的批评针对的是「生理意义上的生育」，而基督教也否认这一点（「受生而非被造」正是为了排除生理生育）；（3）古兰经对三位一体的描述（似乎把马利亚也当作三位之一，见 5:116）可能针对的是某个特定的异端群体（如 Collyridian 派，一个可能崇拜马利亚的阿拉伯基督教小派），而非正统表述。

**伊斯兰对回应的再回应**：（1）即使不是三个神，「三个位格」仍然违反真主的绝对单纯；（2）「受生而非被造」仍然是一个隐喻，而真主超越一切隐喻；（3）5:116 的经文确实提到「真主、麦西哈、麦尔彦」三者，但这被理解为对基督教过度崇敬的批评，而非对三位一体定义的精确引用。

:::why t="为什么这一组对话特别难"
因为它涉及一个**不可通约的前提**：

- 基督教的出发点是**历史事件**：我们遇见了这个人，我们向他祷告，我们被改变。教义是**对这个事件的追认**。
- 伊斯兰教的出发点是**启示的绝对单纯**：真主已透过先知清楚说明他是独一的。任何使神复杂化的说法都必须被拒绝。

**两者不是在同一层面上争论「三位一体对不对」，而是在争论「什么才算认识神的方式」。** 一个从事件出发，一个从启示出发。这就是为什么这场对话持续了 1400 年而没有结论。
:::

#### 4.8.4 无神论与哲学的反驳

**逻辑矛盾论**：1+1+1=3，不是 1。三位一体是自相矛盾，因此不可能为真。

**正统的回应**：（1）三位一体从不说「三个神」，而说「一个本质、三个位格」，因此「1+1+1」这个算式不适用；（2）「位格」与「本质」不是同类项，不能相加（就像不能说「一个苹果 + 一种颜色 = 两个东西」）；（3）**但正统也承认：这个教义不可被任何类比完整表达**——它是一道边界，不是一个模型。

**无意义论**（逻辑实证主义，20 世纪上半叶）：既然「位格」「本质」这些词在经验上无法检验，那么「一个本质三个位格」这句话没有认知意义，它不是假的，而是**不可理解**。

**正统的回应**：（1）可检验性标准本身无法被检验（自我否定）；（2）宗教语言的功能不是描述经验对象，而是规定一种生活形式（这是维特根斯坦式的回应）；（3）**但无意义论确实击中了一部分**：许多信徒说的「三位一体」其实只是三个名字的重复，没有任何内容。这一点，本书认为批评是对的。

**「为什么神需要这么复杂」论**：一个全能的神为什么不能简单地就是「一个」？为什么需要三个位格？这个结构看起来像是为了应付希腊哲学而发明的补丁。

**正统的回应**：三位一体的核心不是「复杂」，而是**「神内部有爱」**。如果神是绝对单一的，那么「爱」就只能指向受造物——神在创造之前没有爱的对象，爱就不是神的本性，而是他后来才有的行为。**三位一体保证了「神就是爱」（约壹 4:8）这句话在永恒里就成立。** 这是三位一体教义最有力的神学论证，也是它最动人的地方。

:::pit t="三个必须避免的误解"
**误解一：三位一体＝三个神。** 这是 {{三神论}}，是异端。正统明确否认。

**误解二：三位一体＝一个神演三个角色。** 这是 {{形态论}}，也是异端。父子不是「同一个人的不同阶段」——子向父祷告时，不是在自己跟自己说话。

**误解三：三位一体＝基督教从希腊哲学借来的发明。** 更准确的说法是：**这个词是希腊的，这个问题的压力是圣经的，这个答案是在论战中被迫精确化的。** 早期基督徒确实在向耶稣祷告（112 年小普林尼的证词），这个实践先于任何教义表述。教义不是发明了一个实践，而是为已有的实践寻找一个不自相矛盾的说法。
:::

### 4.9 尾声：这场争论留下了什么

- **一份信经**：至今每个主日，全球数亿基督徒仍在背诵它（西方另有一份更古老的{{使徒信经}}，没有使用「本体同一」这类哲学术语，因此常被主张「回到更圣经化信仰」的人引用）。
- **一套语法**：*ousia* / *hypostasis* / *persona* / *relatio*，这套词汇后来被用于基督论（第 5 章）、圣灵论、甚至现代哲学（「关系性人格」的概念）。
- **一个先例**：**皇帝召集会议、会议定义正统、正统由帝国执行。** 这个模式在西方随罗马帝国崩溃而失效，在东方（拜占庭）延续到 1453 年。
- **一个未愈的伤口**：{{和子句}}。381 年的信经说圣灵「从父发出」，而西方后来加上了「和子」——第 7 章会看到，这一个词贡献了基督教史上第二大分裂。
- **一个方法论遗产**：{{加帕多家教父}} 的「关系性位格」概念，是古代神学对现代思想最持久的一项贡献。今天社会学、心理学、伦理学里说的「人格是关系性的」，源头之一就在这里。

:::titre
**下一章：基督论之争（第 5 章）**

三位一体讲的是「神内部怎么是三个」，基督论讲的是「一个位格里怎么有两个」。前者花了六十五年，后者花了二十年就把教会劈成了两半——而且那道裂口至今没有愈合：埃及、叙利亚、亚美尼亚、埃塞俄比亚的教会，从 451 年起就再没有和罗马、君士坦丁堡共融过。
:::

## 第 5 章：基督论之争（428–681） {#ch-5}

### 5.0 为什么这个问题比三位一体更难

三位一体问的是：**神内部怎么既是三个又是一个？**

基督论问的是：**那一个人里面，怎么既是神又是人？**

这两个问题看起来同构，但难度不在一个量级。原因在于：三位一体讨论的是**神**（我们对他没有直接观察），基督论讨论的是**一个人**（我们有具体的历史人物：他会饿、会累、会害怕、会死）。一旦你有一个具体的、有血有肉的对象，「两个本性在一个位格里」这句话立刻会遇到大量具体的追问：

- 耶稣在十字架上死的时候，**谁死了**？如果神性不死，那死的只是那个人；如果神性也死了，那神怎么会死？
- 耶稣在客西马尼祷告说「不要照我的意思，只要照你的意思」——**这里面有几个意志**？如果只有一个意志，那他在跟谁对话？
- 耶稣说「子也不知道那日子」——**他的神性也不知道吗**？如果神性全知，那这句话怎么解释？
- 耶稣在母腹中成长、学会走路、学会木工、在圣殿里「渐渐长大」——**神性会成长吗**？
- 马利亚生的是谁？**她生的是神吗？** 如果说是，那岂不是说神有一个开始？如果说不是，那十字架上死的就不是神。

:::why t="这三个命题不可能同时成立——这就是全部的困难"
正统基督论要求同时成立三个命题：

1. **基督是完全的神**（否则救恩没有神性根基）
2. **基督是完全的人**（否则人性没有被医治）
3. **基督是一个主体，不是两个**（否则他不是「一个人」，而是一个神人组合体；而且「神在基督里与人和好」就变成了「神与另一个人和好」）

而这三个命题放在一起，会立刻产生一个几何式的困境：**任何一个「一」，都会吃掉一个「全」；任何一个「全」，都会撑破那个「一」。**

- 强调「一」→ 两个本性被压缩成一个（→ {{一性论}}）
- 强调「两个全」→ 主体被分裂成两个（→ {{聂斯脱里派}}）
- 让两性混合成一 → 结果是「既不是神也不是人」的第三种东西（欧迪奇的错误）

**整个 5 世纪的争论，就是在这个三角形里找出第四个点。** 而这个点（{{迦克墩}} 定义）不是靠「想通了」，而是靠**四个副词**（不混淆、不改变、不分割、不分离）把边界画出来。
:::

### 5.1 两种解经传统：亚历山大 vs 安提阿

要理解 5 世纪的争吵，必须先理解两个学派的气质差异。**这不是两个「观点」，而是两种读经、两种灵性、两种语言习惯。**

| | 亚历山大学派 | 安提阿学派 |
|---|---|---|
| 代表 | 亚他那修、{{区利罗}}、{{奥利金}} 传统 | 摩普绥提亚的狄奥多若、金口约翰、{{聂斯脱里}}、狄奥多勒 |
| 解经 | 偏{{寓意解经}}，重视字面之下的属灵意义 | 偏字面—历史义，重视文法与历史语境 |
| 基督论公式 | **道—肉**（*Logos-sarx*）：道取了肉身，重点在「合一」 | **道—人**（*Logos-anthropos*）：道取了完整的人，重点在「完整」 |
| 关键词 | 「道成了肉身」（约 1:14） | 「取了奴仆的形象」（腓 2:7）、「凡事与他的弟兄相同」（来 2:17） |
| 危险 | 容易忽略基督完整的人性（理性灵魂、意志） | 容易把基督说成「道 + 一个人」的组合 |
| 灵性气质 | 神秘合一、神化（*theōsis*） | 道德榜样、历史救恩 |

:::why t="这两种气质为什么无法调和"
因为它们对「救恩」的想象不同。

**亚历山大的想象**：救恩是**神化**（*theōsis*）——神取了人性，使人类能够「成为神」（彼得后书 1:4 的「与神的性情有分」）。这个想象要求神与人在基督里**极其紧密地合一**，最好是「一个本性」，否则神人之间的通道不够宽。

**安提阿的想象**：救恩是**顺服与替代**——一个人（真实的、有自由意志的人）完全顺服神，从而修复亚当的失败。这个想象要求基督**是一个真正的人**，有真实的人性、真实的意志、真实的挣扎，否则他的顺服就不是人的顺服。

**两边都觉得对方的方案会毁掉救恩。** 这不是学术分歧，而是两种宗教经验的对撞。
:::

### 5.2 第一轮：阿波利拿里的失败（约 360–381）

第一个尝试解决这个三角形的人是**阿波利拿里**（Apollinaris of Laodicea，约 310–390），{{亚他那修}} 的朋友与战友。他的方案非常简洁：

> 人 = 身体（*sarx*）+ 魂（*psychē*，生命力）+ 理性灵魂（*nous*）。
> 基督 = 人的身体 + 人的魂 + **神的逻各斯代替了理性灵魂**。

这样，基督有完整的人的身体与生命力，同时只有一个主体（逻各斯），两全其美。

**他的动机完全是敬虔的**：如果基督有一个会动摇的理性意志，那他还是无罪的救主吗？一个可能犯罪的人，怎么能替人赎罪？

**他为什么被判为异端**（381 年君士坦丁堡会议）：因为对手用了**他自己阵营的原则**来反驳他——「**未被取用的，就未被医治**」。如果基督没有人的理性灵魂，那么人的理性就没有被医治；而理性恰恰是罪最先出问题的地方（「你们心志上要更新而变化」罗 12:2）。

:::pit t="阿波利拿里案的教训"
这是教义史上最漂亮的一次「逻辑反噬」：一个为了保卫救恩而设计的方案，被同一条救恩原则推翻。

**它留下了一个此后永远适用的检验标准**：任何一个基督论方案，都要问——**它有没有让基督「取用」人性的全部？** 如果没有，那么被遗漏的那一部分就没有被拯救。这个标准后来依次否决了：阿波利拿里（无理性灵魂）、聂斯脱里（严格说：两个主体）、欧迪奇（人性被吞没）、单志论（无人的意志）。
:::

### 5.3 第二轮：聂斯脱里与「生神者」之争（428–431）

428 年，一位来自安提阿、口才极好、作风严厉的修士**聂斯脱里**（Nestorius）被任命为君士坦丁堡主教。上任不久，他的一位随行神父**阿纳斯塔修斯**在讲道中攻击当时流行的一个称呼：**「{{生神者}}」**（*Theotokos*，字面「生神的人」，中文常译「上帝之母」）。

阿纳斯塔修斯的理由是：马利亚生的是一个**人**，不是神；神是无形无体的，怎么可能被生？所以他主张称马利亚为「**生基督者**」（*Christotokos*）。

聂斯脱里支持这个立场。他的论证更进一步：

> 马利亚所生的那个人，与神的道是**联合**的，但神性并不从马利亚取得。所以严格说，马利亚生的是「与道联合的那个人」，而不是「道」。

:::why t="为什么一个称呼会引发大公会议"
「生神者」这个词看起来只是对马利亚的尊称，但它是一个**基督论的检验器**：

- 如果你说「马利亚生的是神」，你就在说：**那一位在伯利恒出生的人，就是永恒的道本身**。这坚持了主体的同一性（亚历山大派要的）。
- 如果你说「马利亚生的是一个人」，你就在说：**道与那个人是「联合」的两个东西**。这保住了完整人性（安提阿派要的），但代价是主体可能分裂。

换句话说：**「马利亚生了谁？」这个问题的答案，直接等于「基督是一个主体还是两个」。** 这就是为什么一个妇人的称谓，能炸掉整个帝国教会。
:::

**关键概念：属性相通**（{{属性相通}}，*communicatio idiomatum*）。这是安提阿与亚历山大之间的技术争点：

- 能否说「**神被钉死在十字架上**」？（亚历山大的回答：能，因为那一位是神；安提阿的回答：严格说不能，被钉死的是人性。）
- 能否说「**那婴孩创造了宇宙**」？（同上。）

这个问题的实质是：**一个位格的两个本性，其属性可以互相「归属」吗？** 正统后来的答案是：**可以归属给同一个位格，但不能归属给另一个本性。** 即：可以说「神受苦了（在人性中）」，不能说「神性受苦了」。

**431 年以弗所会议**：{{区利罗}}（亚历山大主教）在皇帝支持者尚未到齐的情况下抢先开会，谴责并罢免聂斯脱里；聂斯脱里的支持者（安提阿的约翰一派）随后另开一个会议，谴责区利罗。**两个会议互相罢免对方**。最终皇帝介入，聂斯脱里被流放（先到安提阿附近的修道院，后到埃及的沙漠，死于约 451 年）。

:::src t="关于聂斯脱里的历史修正"
20 世纪初，叙利亚文的《赫拉克利德斯的市场》（*Bazaar of Heracleides*，聂斯脱里本人的自辩书）被发现并出版。这份文献显示：

- 聂斯脱里**明确否认**自己主张「两个位格」；
- 他反对的是「神性从马利亚取得」这个说法，而不是「一个主体」；
- 他使用的 *prosōpon*（脸/角色）概念，与迦克墩的 *hypostasis* 未必不可通约。

因此现代学界（尤其东方教会传统的学者）普遍认为：**聂斯脱里被判为「两个位格」，很大程度上是他对手的建构。** 431 年以弗所会议的程序本身也极不规范（对手先开会、先判决）。但历史结果是既定的：他的追随者被逐，东迁波斯，形成了独立的教会。
:::

### 5.4 第三轮：欧迪奇与 449 年的「强盗会议」

以弗所之后，亚历山大派大胜，但胜得太彻底，反而催生了另一端的极端。

**欧迪奇**（Eutyches，约 380–456）是君士坦丁堡郊外一所修道院的院长，反聂斯脱里的急先锋。他的立场是极端的合一论：

> 道成肉身之后，基督**只有一个本性**。他的人性「像一滴蜜溶进大海」，被神性吞没了。

448 年，他在君士坦丁堡的一次地方会议上被谴责。但他有强大的后台——**皇帝狄奥多西二世**的宠臣、宦官**克里萨菲乌斯**，以及亚历山大主教**狄奥斯库若**（区利罗的继任者）。

449 年，皇帝召集以弗所会议。狄奥斯库若主持会议，用暴力与军队压制反对者：**罗马主教利奥的代表被拒之门外，他们的信根本没被宣读**。会议恢复欧迪奇、罢免他的对手。罗马主教**利奥一世**事后称这次会议为「**强盗会议**」（*Latrocinium*，即 Ephesus II）。

:::note
「强盗会议」这个名称提醒我们一件事：**大公会议的合法性，本身是一个争议对象。** 449 年以弗所会议在程序上是一次正式会议（皇帝召集、主教出席、有决议），但它被后世判定为不合法；而 431 年以弗所会议在程序上同样混乱，却被承认为第三次大公会议。**判定的标准不是程序，而是结果是否符合后来确立的正统。** 这一点，与第 2 章讲的「正统是事后追认的」完全一致。
:::

**利奥的《大卷》**（*Tomus ad Flavianum*，449 年）：利奥一世写给君士坦丁堡的弗拉维安一封著名的信，用极简洁的拉丁文表述了西方立场：

> 「同一个位格，既真正是神又是真正是人……他作为人饥饿，作为神用五个饼喂饱五千人；他作为人睡在船上，作为神平静风浪。」

这封信后来成为 {{迦克墩}} 定义的直接基础。它用一系列「作为……／作为……」的对照句，把「两个本性的活动都属于同一个主体」讲得非常清楚——这比希腊人的形而上学讨论更直观，也更难被曲解。

### 5.5 迦克墩会议（451）：四个副词

450 年，皇帝狄奥多西二世意外坠马身亡，无子。皇位由他的姐姐**普尔喀丽亚**与将军**马西安**继承，两人都倾向西方立场。局势逆转。

451 年，马西安在迦克墩（君士坦丁堡对岸）召集会议，约 500 位主教参加——**古代规模最大的一次教会会议**。会议过程极具戏剧性：狄奥斯库若被罢免，欧迪奇被谴责，利奥的《大卷》被宣读，全场高呼「这是使徒的信仰！」（据会议记录，这句话被喊了数十次）。

会议最终通过的定义，核心是这段话：

> 「我们一致教导，承认**同一个**子、我们的主耶稣基督，**同一个**是完全的神、**同一个**是完全的人，有理性灵魂与身体；按神性说，在万世之先为父所生，按人性说，在末后的日子为我们的救恩由**生神者**童贞马利亚所生；**同一个**基督、子、主、独生子，在**两个本性**中被认识，**不相混淆、不改变、不分割、不分离**；两个本性的区别不因联合而消失，反而各自的本性都得以保全，并汇合于**一个位格**（*hypostasis*）与**一个自立存在**（*prosōpon*）之中。」

请特别注意这段话的**结构**，它是一份精心设计的法律文件：

| 成分 | 作用 | 排除的对象 |
|---|---|---|
| 「同一个……同一个……同一个」（*ton auton*）反复四次 | 钉死主体的同一性 | {{聂斯脱里派}}（两个主体） |
| 「完全的神 / 完全的人，有理性灵魂与身体」 | 两个本性都完整 | 阿波利拿里主义（无理性灵魂）、欧迪奇（人性被吞） |
| 「在两个本性中被认识」（*en dyo physesin gnōrizomenon*） | 两性并存，不混合 | {{一性论}} |
| **不相混淆**（*asynchytōs*） | 不混合成一个 | 欧迪奇 |
| **不改变**（*atreptōs*） | 神性未变成人性，人性未变成神性 | 各种「转化论」 |
| **不分割**（*adiairetōs*） | 不切成两半 | 聂斯脱里 |
| **不分离**（*achōristōs*） | 不并排为两个 | 聂斯脱里 |
| 「一个位格、一个自立存在」 | 一个主体 | 聂斯脱里 |

:::why t="为什么用「四个副词」而不是「一个定义」"
因为**定义会立刻被追问，而边界不会**。

如果会议说「基督的人性是神性的器官」，那么「器官」是什么意思？如果它说「两性合成为一」，那么合成物是什么？任何正面的定义都会引出新的追问，而每一个追问都是一个新的分裂点。

四个副词是**否定性的**：它们不说「是什么」，只说「不是怎样」。这种写法看起来是逃避，其实是 5 世纪争论唯一可能的出路——**在人类语言无法正面描述这个联合的地方，只能把错误答案一个个划掉。** 这与 4.6 节讲的「教义是围栏不是照片」是同一个道理。

（顺便说：这四个副词在中文里读起来很像绕口令，但在希腊文里它们是四个精心挑选的副词，每个都以 *a-* 开头——即「非-」的否定前缀：*a-synchytōs*、*a-treptōs*、*a-diairetōs*、*a-chōristōs*。它们在希腊文里的音响效果，接近中文的「不混、不变、不分、不离」四字连读。）
:::

### 5.6 为什么迦克墩被东方拒绝（本书最重要的一节之一）

迦克墩在罗马、君士坦丁堡、安提阿（部分）被接受，但**埃及、叙利亚、亚美尼亚、埃塞俄比亚、努比亚、印度部分地区的教会拒绝接受**。这不是小规模的异议：这些地区是基督教最早、最密集的根据地，人口众多。**按人口计算，这是基督教史上最严重的一次永久分裂**——比 1054 年更早、更彻底。

为什么会这样？原因至少有五层，而且它们全部同时起作用。

#### 第一层：术语问题——*physis* 到底指什么

{{区利罗}}（迦克墩会议名义上尊崇的权威）有一句名言：**「一个成了肉身的本性」（*mia physis tou theou Logou sesarkōmenē*）**。这句公式在东方被广泛使用，甚至被写进礼仪。

迦克墩说「在两个本性中」——**在东方人听来，这等于把基督切成两半，等于聂斯脱里主义**。

问题在于：**「本性」（*physis*）这个词在亚历山大派用法里接近 *hypostasis*（具体的实在者），而在迦克墩的用法里接近 *ousia*（本性、性质）。** 同一个词，两种用法。所以：

- 东方人说「一个本性」，意思是「一个具体的、活生生的主体」——**他们以为自己在说迦克墩要说的话**。
- 迦克墩说「两个本性」，意思是「神性与人性两种性质都完整」——**它以为自己在说区利罗要说的话**。

**双方都在说同一件事，但用的词在对方的方言里是异端。** 这是整部教义史最典型的一次「翻译灾难」。

:::src t="现代学术与教会的共识：这确实主要是术语问题"
从 20 世纪 60 年代起，天主教、东正教与东方正统教会进行了多轮对话，签署了一系列基督论联合声明（1971 年、1988 年、1990 年代多份）。这些声明的核心结论是：

> 双方都承认「一个位格、完整的神性与完整的人性，不相混淆、不改变、不分割、不分离」。分歧在于「本性」一词的使用：东方用 *physis* 指「具体的、道成肉身后的存在方式」，迦克墩用 *physis* 指「性质」。

1994 年，教宗若望保禄二世与叙利亚正教会宗主教 Ignatius Zakka I Iwas 签署共同声明，明确表示双方在基督论上的分歧「不再构成教会分裂的理由」。**但正式的完全共融仍未恢复**——因为阻碍已经不再是基督论，而是两千年的分离所积累的制度、礼仪、圣统问题。

这提醒我们一个残酷的事实：**教义分歧可以被解决，但分裂一旦固化，就有了自己的生命。**
:::

#### 第二层：政治问题——帝国中心的崛起

451 年会议的第 28 条教规，把君士坦丁堡的荣誉地位提升到仅次于罗马，理由是「它是新罗马，皇帝与元老院所在之地」。

**亚历山大与安提阿的主教们对此极为愤怒。** 亚历山大（埃及）自认是第二把交椅（它的主教传统上被称为「教皇」，且是马可所立）；安提阿是彼得最初的主教座。现在一个「因为皇帝住在那里」的城市，要凌驾于它们之上？

于是迦克墩在东方被读成一件**帝国中心压制古老宗主教区**的事。教义与地方荣誉绑在一起，无法分开。

#### 第三层：文化问题——语言与民族

埃及的教会主要用**科普特语**（*Coptic*，古埃及语的最后阶段），叙利亚的教会用**叙利亚语**（*Syriac*，与耶稣的亚兰语同族），亚美尼亚用**亚美尼亚语**。这些教会的神学教育、礼仪、诗歌全部是本地语言的，而迦克墩的辩论是**希腊语**的。

这意味着：**迦克墩对东方而言，不只是一份教义，也是一份外语文件**。而语言背后是族群：埃及人、叙利亚人、亚美尼亚人在政治上是帝国的臣民，在文化上却有自己的认同。**拒绝迦克墩，同时是拒绝帝国中心的文化霸权。** 7 世纪阿拉伯征服时，这些地区之所以没有激烈抵抗，部分原因就是：换一个统治者，未必比君士坦丁堡更糟。

#### 第四层：神学直觉——「神化」需要极紧的合一

东方教会的灵修核心是 {{神化}}（*theōsis*）：**神成为人，是为了让人成为神**（亚他那修《论道成肉身》54）。这个救恩想象要求神与人性之间有尽可能紧密的通道。

如果强调「两个本性、各自保全」，东方人担心的是：**通道变窄了**。人性没有被「渗透」，那么人还能被神化吗？这个担心在希腊文语境里表达为：区利罗的「一个成了肉身的本性」听起来比「两个本性」更温暖、更彻底。

#### 第五层：会议的程序与暴力记忆

迦克墩会议上，狄奥斯库若被罢免、东方主教被迫签署、皇帝用军队与流放执行决议。对埃及与叙利亚的教会来说，这不是一次「普世会议」，而是一次**由皇帝强加的判决**。此后的镇压（查士丁尼时代的迫害尤为严酷）使伤口不断加深。

:::why t="这一节为什么值得写这么长"
因为它示范了一个贯穿全书的模式：**一次「教义分裂」的实际成因，几乎从不只是教义。**

教义是**导火索与语言**，但炸药是：地方荣誉、语言差异、族群认同、帝国政治、灵修气质、以及记忆中的暴力。这五样东西在 451 年恰好全部对齐，于是分裂固化了一千五百年。

**理解这个模式，比记住「迦克墩定义」的条文更重要。** 因为后面每一部（宗教改革、现代宗派、乃至今天的教会分裂）都会重演同一个配方：一个真实的神学分歧 + 一组非神学的利益与身份 + 一次无法回头的程序。
:::

### 5.7 后续四百年：一性论的内部谱系与两次新分裂

**（一）东方正统教会的内部差异**（见 {{东方正统教会}}）：它们并不是一个统一的「一性论」阵营，而是各有自己的表述：

- **科普特正教会**（埃及）：用区利罗的「一个成了肉身的本性」，强调「二性在不混淆的合一中」。
- **叙利亚正教会**（安提阿）：同样用「一个本性」，但明确谴责欧迪奇的「混合」。
- **亚美尼亚使徒教会**：从未参加迦克墩（451 年正处于与波斯的战争中），后来明确拒绝，但也拒绝欧迪奇。
- **埃塞俄比亚正教会**：与科普特共融，保留独特的礼仪与更宽的正典（含《以诺一书》《禧年书》）。
- **马兰卡拉教会**（印度）：传统上由使徒多马建立，长期与东方教会（聂斯脱里派）共融，17 世纪后分裂为多个支派。

现代学界因此更倾向于用 **miaphysite**（「一性—合一」）而不是 **monophysite**（「一性论」）来称呼它们，以区别于欧迪奇的极端立场。

**（二）三章之争与 553 年会议。**
查士丁尼皇帝试图用谴责「三章」（三位安提阿派神学家的著作）来讨好东方，结果在西方引起轩然大波（因为这些人在 451 年被承认为正统）。553 年第二次君士坦丁堡会议通过谴责，**但西方（尤其北非与意大利北部）长期不接受**，形成「三章分裂」（*Schism of the Three Chapters*），延续约一个半世纪。

**（三）单志论与 681 年会议——基督有几个意志？**

7 世纪，皇帝**希拉克略**为了收复被波斯占领的东方省份，需要一个能让一性论者与迦克墩派都接受的折中方案。**单志论**（{{单志论}}，*Monothelitism*）被发明出来：基督有两个本性，但只有**一个意志**（*thelēma*）——即神性的意志。

这个方案在神学上非常诱人：如果基督有两个意志，那么两个意志会不会冲突？如果会冲突，那基督岂不是可能犯罪？
