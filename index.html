:::note
**第五部的温度计有一个新特征**：几乎每一行都不是「教义对错」，而是「**权威与经验的冲突**」。

- 圣经是否无误 → 谁有权解释圣经？
- 圣灵是否还行神迹 → 谁的经验算数？
- 女性能否按立 → 谁有权决定？
- 其他宗教是否有救恩 → 谁是「我们」，谁是「他们」？

**这就是现代基督教的核心特征**：它不再是「一个教会如何定义正统」的问题，而是「**在一个多元、世俗、全球化的世界里，基督教凭什么说自己是真理**」的问题。
:::

## 第五部小结：从「欧洲的教会」到「世界的基督教」

1. **18 世纪**：复兴运动（敬虔主义、循道运动、大觉醒）使基督教从「国家的宗教」变成「个人的经验」。
2. **19 世纪**：现代学术（达尔文、历史批判）把基督教撕成自由派与保守派。
3. **20 世纪**：五旬节运动使基督教从「欧洲的」变成「全球的」；梵二使天主教从「堡垒」变成「对话」；巴特使神学从「自由派的乐观」回到「神是审判者与恩典的主」。
4. **21 世纪**：基督教的重心在非洲、亚洲、拉美；最激烈的分裂线是性议题；增长最快的形态是独立教会与灵恩派；而最深的挑战是「世俗化」与「后基督教」的处境。

:::titre
**下一部：外部批判（第 18–23 章）**

前五部讲的是基督教内部的自我分裂。最后一部要换一个视角：**从外面看**。犹太教说「你们拜的是偶像」；伊斯兰教说「你们篡改了启示」；无神论说「这一切都是人编的」；世俗主义说「宗教应当退回私人领域」。这四种批判，每一种都比任何内部异端更根本——因为它们不接受基督教的前提。**而理解这些批判，是理解基督教在 21 世纪处境的必要条件。**
:::

# 第六部：外部批判

## 从「家里吵架」到「房子被人拆」

前五部讲的全是**家庭内部的争吵**：三位一体怎么表述、基督有几个本性、人能不能自救、教宗还是会议、圣餐是饼还是身体。

这一部要换一个视角。**外面的人怎么看这座房子？**

- **犹太教**说：你们从我们的房子里搬走，然后在旁边盖了一栋奇怪的建筑，还说那是我们的房子。
- **伊斯兰教**说：你们把最纯粹的启示（真主独一）污染了，我们是来恢复它的。
- **无神论**说：整栋房子都不该存在，它是人自己搭的。
- **世俗主义**说：房子可以存在，但请把门关上，别让里面的人来管外面的事。

:::why t="为什么外部批判必须与内部论战同等分量"
三个理由：

1. **它们更根本**。内部论战共享前提（圣经是权威、耶稣是主、神存在）；外部批判**不接受这些前提**。所以它们不需要赢在解经上，它们可以直接质疑「为什么要解经」。
2. **它们更常见**。一个普通基督徒一生中真正会遇到的质疑，几乎全部来自这一部——「为什么神允许苦难」「为什么只有一个宗教对」「圣经里的暴力怎么解释」。而不是「基督有一个意志还是两个」。
3. **它们更有杀伤力**。第 5 章的一性论之争，迦克墩用了四个副词就基本解决了；而「恶的问题」已经争论了三千年，至今没有共识。

**本书的立场在这一部尤其重要**：**不替基督教辩护，也不替批判者站台。** 目标是把每一方的论证讲到它最强的版本，然后看对方的回应是否成立。**如果一个批判无法被回应，本书会明确说它无法被回应。**
:::

## 第 18 章：犹太教的反驳——最懂这本书的人不接受它 {#ch-18}

### 18.1 为什么犹太教的反驳最难回应

基督教与犹太教的关系有一个独特的结构：**它们共享同一部经典、同一个神、同一个民族历史、同一位耶稣（作为犹太人）。**

这意味着犹太教的批判不需要攻击基督教的前提，它只需要说：**「你们的结论推不出来。」**

- 无神论者说「神不存在」——基督徒可以说「你的前提错了」。
- 犹太教说「就算神存在，弥赛亚的标准你也没满足」——**这个批判在基督教的前提内部发作**。

第 3 章已经讲了基本的分歧（一神论、偶像崇拜、律法、弥赛亚标准）。这一章要讲得更深：**具体的解经争点、历史的债务、以及当代对话的现状。**

### 18.2 弥赛亚的「验收清单」：逐条对照

犹太传统的弥赛亚期待不是「一个感觉」，而是**一组可观测的指标**。下面是逐条对照：

| 犹太传统的期待 | 经文依据 | 耶稣的情况 | 基督教的解释 | 犹太教的回应 |
|---|---|---|---|---|
| 大卫的子孙 | 撒下 7:12–16；赛 11:1；耶 23:5 | 家谱符合（太 1；路 3） | 满足 | 两处家谱互相矛盾（约瑟的父亲是雅各还是希里？）；且若耶稣是童贞女所生，约瑟的家谱在法律上无效 |
| 以利亚先来 | 玛 4:5–6 | 耶稣说施洗约翰是「以利亚」（太 11:14） | 满足（象征性） | 玛拉基说以利亚「必来」，且他会「使父亲的心转向儿女」——施洗约翰并没有带来这种转变；且犹太传统认为以利亚本人会显现 |
| 重建耶路撒冷圣殿 | 结 40–48；亚 6:12–13 | 未实现 | 他将再来时实现 | 这是弥赛亚的核心任务之一，不能推迟到「第二次来」 |
| 聚集以色列的流亡者 | 赛 11:12；43:5–6；耶 29:14 | 未实现（罗马时代犹太人仍散居） | 将在再来时实现 | 同上 |
| 普世的和平 | 赛 2:4；弥 4:3；亚 14:9 | 未实现（战争持续） | 将在再来时实现 | 弥赛亚时代的标志就是和平；「已经来了但和平未到」是自相矛盾 |
| 万国认识神 | 赛 11:9；哈 2:14 | 部分实现（基督教传播） | 通过教会实现 | 世界仍有数十亿人不认识神；且「认识神」在先知书里指对以色列的神的敬拜 |
| 死人复活 | 但 12:2 | 耶稣复活（一个案例） | 他是「初熟的果子」（林前 15:20） | 弥赛亚时代是**普遍的**复活，不是一个人的复活 |
| 世界的更新（*olam ha-ba*） | 赛 65:17；66:22 | 未实现 | 将在再来时实现 | 同上 |

:::why t="「两次降临」为什么是关键的争点"
基督教的核心解经策略是：**弥赛亚来两次**——第一次是受苦的仆人（赛 53），第二次是审判的君王。

**这个策略解决了「耶稣没有做到」的问题，但代价是**：
1. 它在第二圣殿时期的犹太文献中**没有明确的先例**（虽然有些文本提到「弥赛亚 ben 约瑟」会受苦并死去，但那是另一个弥赛亚，不是同一个弥赛亚的两阶段）。
2. 它是**在失败之后**被构造的（这是犹太教的核心指控：**事后解释**）。
3. 它使弥赛亚的期待**不可证伪**——任何「未实现」都可以推到「第二次来」。

**基督教的回应**：（1）以赛亚书 53 章的「受苦仆人」确实存在，且犹太传统在**某些**文本（如塔木德中关于弥赛亚 ben 约瑟的讨论）中有受苦的弥赛亚概念；（2）但以理书 7:13–14 的「人子」同时有受苦与荣耀的面向；（3）「不可证伪」的批评也适用于犹太教自己的期待（如果弥赛亚来了但和平未到，犹太教怎么解释？）。

**犹太教的再回应**：犹太传统承认「弥赛亚 ben 约瑟」会死，但那是一个**预备性的**人物；真正的弥赛亚（ben 大卫）会完成所有指标。**基督教把两个人物合并成一个，并把完成推到了未来。**
:::

### 18.3 律法：永恒的还是临时的？

**基督教的立场**：律法的礼仪部分（割礼、饮食、献祭、圣日）已在基督里「成全」而不再要求外邦人遵守；道德部分（十诫）仍然有效。

**犹太教的批评**（这是最有力的一条）：

> 「**你们把妥拉切成三块，然后只保留你们喜欢的那块。**」

具体论证：
1. **妥拉（Torah）是一个整体**。圣经里没有任何地方说律法会分「礼仪」与「道德」两部分。这个区分是基督教的发明（主要来自中世纪经院神学）。
2. **圣经说律法是永远的**：出 12:14「你们要守这日为永远的定例」；利 23:14「这要为你们世世代代永远的定例」；申 4:40「使你和你子孙可以得福，并使你的日子在耶和华你神所赐的地上得以长久」。
3. **耶稣自己守律法**：他守安息日、上圣殿、守逾越节、吩咐大麻风病人去给祭司察看（利 14）。**如果律法已被废除，他为什么守？**
4. **保罗的立场在圣经内部就是矛盾的**：他说「人称义不靠律法的行为」（罗 3:28），又说「律法是圣洁的，诫命也是圣洁、公义、良善的」（罗 7:12），还说「我们坚固律法」（罗 3:31）。**这些句子怎么协调？**

**基督教的回应**：
1. **「成全」不等于「废除」**（太 5:17）。基督是律法的「目的」（*telos*，罗 10:4），律法的指向是他。
2. **礼仪律的「暂时性」有圣经依据**：耶利米书 31:31–34 预言「新约」；以西结书 36:26–27 预言神赐新心；希伯来书系统论证了献祭制度的「不能除罪」（来 10:4）与基督的「一次献上」（来 10:12）。
3. **外邦人从来不需要守全律法**：犹太教自己也承认「义人外邦人」（*ger toshav*，resident alien）有份于来世，不需要受割礼（《塔木德》的讨论）。

**犹太教的再回应**：（1）耶利米的新约是给「以色列家与犹大家」的，不是给一个新宗教的；（2）希伯来书是基督教文献，不能用来证明犹太教的问题；（3）「义人外邦人」不需要守全律法，但**犹太人**需要——而基督教要求犹太人放弃律法，这是问题的核心。

### 18.4 没有圣殿，赎罪怎么办？

这是一个非常具体的争点，也是最能说明「两个宗教如何分道」的地方。

**犹太教的答案**（圣殿被毁后，公元 70 年后发展）：
- **悔改**（*teshuvah*）
- **祈祷**
- **慈善**（*tzedakah*）
- **学习妥拉**
- **受苦**（部分传统）
- 《塔木德》的表述：何西阿书 14:2「我们就把嘴唇的祭代替牛犊献上」——**言语代替献祭**。

**基督教的答案**：基督是**终极的、一次的献祭**（来 9–10），圣殿的毁坏正是神对旧制度的终结。

**犹太教的批评**：基督教把「圣殿被毁」解释为「神废弃了献祭制度」，这是一个**事后神学**——而且它有一个道德问题：**罗马人毁了圣殿，基督教把它解释为神的审判，这等于为罗马的暴行提供神学辩护。**

**基督教的回应**：耶稣自己也预言了圣殿的毁坏（可 13:2），而且他为耶路撒冷哭泣（路 19:41）——这不是为暴行辩护，而是哀悼。

:::pit t="一个必须承认的历史事实"
**基督教对犹太教的「取代论」（{{取代论}}）负有真实的历史责任。**

从教父时代开始，「犹太人杀害了神」（*deicide*）的指控就成为基督教反犹主义的神学基础：
- 金口约翰（4 世纪）的八篇《驳犹太人讲道》极其恶毒，称犹太人是「杀基督的」「拜魔鬼的」。
- 中世纪：强迫改宗、驱逐（1290 年英国、1394 年法国、1492 年西班牙）、隔离区（ghetto）、血祭诽谤（blood libel）、焚烧塔木德。
- 宗教改革：路德 1543 年的《论犹太人与他们的谎言》呼吁烧毁犹太会堂、摧毁他们的房屋、没收他们的书——**这份文献被纳粹大量引用**。
- 20 世纪：大屠杀（600 万人），而多数教会沉默或配合。

**梵二《我们的时代》（1965）** 是天主教的正式转折：它宣布「犹太人不应被描绘为被神弃绝或受诅咒的民族」，并否定集体罪责。

**但基督教的悔改仍然不完整**：许多福音派的神学（尤其时代论中的「教会取代以色列」）仍然在实践上持取代论；而对犹太人的宣教（如「犹太人归主运动」Jews for Jesus）在犹太社群看来，仍然是一种精神上的消灭。
:::

### 18.5 犹太教对基督教释经的四个技术批评

**（一）预表论是循环论证。**
基督教的解经常常先假定耶稣是弥赛亚，然后在旧约里找对应。**任何一个人都可以用这种方法「预言」自己。** 例如：有人说肯尼迪是弥赛亚，因为「他被枪击在头」（亚 12:10）、「他的名被万人传扬」。这在方法上与基督教的预表论没有区别。

**（二）七十士译本的问题。**
基督教常引用的旧约经文，有时是**希腊文七十士译本**（LXX）的读法，而不是希伯来原文。例如：
- 赛 7:14：希伯来文 *almah* 是「年轻女子」；LXX 译为 *parthenos*（童女）。**马太福音 1:23 引用的是 LXX。**
- 诗 22:16：希伯来文是「像狮子」；LXX 译为「他们扎了我的手我的脚」。
- 赛 53 章的许多细节，LXX 与马苏拉文本有差异。

**犹太教的论点**：**你们用一个译本证明你们的结论，而那个译本是为了你们的结论而译的。**

**（三）「双重应验」的任意性。**
基督教常说一个预言「先在当代应验，再在基督身上应验」（如赛 7:14 先指以赛亚时代的某个孩子，再指耶稣）。**这个方法的危险是：它使任何预言都可以被「再应验」一次，从而使预言不可证伪。**

**（四）新约引用旧约的准确性。**
现代研究（如 Richard Hays 的《弥赛亚耶稣的回声》）显示，新约作者引用旧约时，常常**不是按照原文的上下文**，而是按照当时的犹太解经传统（midrash、pesher）。**这在犹太教看来是「曲解」，在基督教看来是「合法的解经传统」。**

### 18.6 基督教的回应，与犹太教的再回应

| 基督教的论证 | 犹太教的回应 |
|---|---|
| 耶稣的复活证明他是神子 | 复活不是弥赛亚的验收标准；且复活需要目击者，而我们只有信徒的记载（且记载互相矛盾：谁先到坟墓？几个天使？） |
| 以赛亚 53 章指向耶稣 | 该章在上下文中指「以色列」这个仆人（赛 41:8、44:1、49:3）；且犹太传统从未把它读成弥赛亚 |
| 但以理 9:24–27 的「七十个七」指向耶稣受难 | 这段数字有完全不同的算法（指向安条克四世或圣殿重建）；且但以理书的成书年代有争议（很可能在公元前 2 世纪） |
| 圣殿被毁证明旧约被废弃 | 这正是「事后神学」；而且它有一个道德问题（为罗马暴行辩护） |
| 基督教的传播证明它是普世宗教 | 传播不等于真理（伊斯兰教传播更快） |
| 数百万人的生命被改变 | 其他宗教也有圣徒；且「生命改变」可以用心理与社会因素解释 |

:::why t="这一章为什么让很多基督徒不舒服"
因为它把「最懂这本书的人」的反对摆在了最前面。

一个常见的反应是：「他们被蒙蔽了。」但本书要指出：**这个说法本身就是一个神学论断，不是一个论证。** 它等于说「凡是不同意我的人，都是被蒙蔽的」——这个结构可以用于任何立场，因此它不能区分真假。

**一个更诚实的立场**（许多当代基督教神学家，如 Kendall Soulen、R. Kendall Soulen、以及天主教与犹太教的对话文件）：
- 犹太教对弥赛亚的期待是**忠于圣经的**，不是「属灵的瞎眼」。
- 基督教对「弥赛亚已来」的宣告，是一个**信仰的跳跃**，不是一个可以靠解经证明的结论。
- **两者都在等**：基督教等「第二次来」，犹太教等「第一次来」。**从外面看，这两个等待是对称的。**

**本书不裁决谁对。但要强调：任何一方若说「对方只是不诚实或愚蠢」，就已经放弃了对话。**
:::

### 18.7 当代的对话：从对抗到承认

**（一）梵二与之后。**
- 1965 年《我们的时代》：否定集体罪责，承认犹太教是「活的信仰」。
- 1986 年：若望保禄二世访问罗马犹太会堂，称犹太人是「我们的长兄」。
- 1993 年：天主教与犹太教建立正式外交关系（以色列与梵蒂冈）。
- 2015 年：梵蒂冈文件《神的恩赐与召叫不可撤回》（*The Gifts and Calling of God are Irrevocable*）明确表示：**天主教不与犹太人传福音**，因为「神与以色列的约从未被废除」。

**（二）新教的转向。**
- 主流新教（WCC、路德宗世界联盟）在 1980–90 年代发表多份文件，否定取代论。
- **1994 年路德宗世界联盟**发表《致犹太人的声明》，明确否定路德的反犹著作。
- 但**福音派**（尤其美国的时代论与「以色列支持者」）的立场更复杂：他们支持以色列国（出于末世论理由），但同时也积极向犹太人传教。

**（三）犹太教的回应。**
- **正统派**：仍然认为基督教是偶像崇拜（部分极端立场甚至认为比伊斯兰教更严重）。
- **保守派与改革派**：参与对话，承认基督教是「神为万民安排的路径」（部分拉比文献支持），但仍拒绝耶稣是弥赛亚。
- **「犹太—基督教对话」的成就与限制**：成就在于双方不再互相诅咒；限制在于**核心的弥赛亚分歧从未被触及**——因为一旦触及，就必然有一方要让步。

## 第 19 章：伊斯兰教的反驳——最后一位先知之后 {#ch-19}

### 19.1 伊斯兰的基本框架（零基础最小包）

要理解伊斯兰对基督教的批判，必须先理解它的三个核心概念：

**（一）*Tawhid*（认主独一）。**
真主是**绝对独一**的。这不仅是「只有一个神」，而是**存在论上的绝对单纯**：真主没有部分、没有构成、没有「位格」的复数性、没有同伴、没有子嗣。

**（二）*Tanzih*（超越）。**
真主**超越一切受造的属性**。他不像任何东西（42:11「任何物不似象他」）。因此：
- 真主不会「成为」人（那是变化，而变化是受造物的特征）。
- 真主不会「受苦」（受苦意味着缺乏与被动）。
- 真主不会有「儿子」（生育意味着身体、配偶、时间中的事件）。

**（三）古兰经的地位。**
古兰经是**真主的话语，逐字降示，未被篡改**。穆罕默德是**封印的先知**（33:40）——之后不再有先知。所以任何「新的启示」（如摩门经）都是假的。

:::why t="为什么这三条使基督教成为「最难对话」的宗教"
因为伊斯兰的批判不是「你们的解经错了」，而是**「你们的神不是神」**。

- 对犹太教：基督教说「弥赛亚已经来了」——犹太教说「没有」，这是**同一个神**之下的分歧。
- 对伊斯兰教：基督教说「神有三个位格、神成为人」——伊斯兰说**「那不是神」**。这是**关于神本身**的分歧，不是关于神做了什么的分歧。

**所以伊斯兰与基督教的分歧，比犹太教与基督教的分歧更深一层**：它不在于「应验与否」，而在于「神能不能这样」。
:::

### 19.2 四个核心指控

#### 指控一：*Tahrif*（篡改）

**指控内容**：犹太人与基督徒**篡改了**真主赐给他们的经典。古兰经多次说：

> 「**他们篡改经文，忘却他们所被劝诫的一部分。**」（5:13，4:46）
> 「**哀哉！那些亲手写经，然后说「这是从真主降下的」，以便用它换取些微代价的人。**」（2:79）

**具体论点**：
1. 摩西与耶稣的原始启示被修改了（例如：关于穆罕默德将要来的预言被删除，见 7:157）。
2. 圣经有大量的抄本差异、编辑痕迹、以及历史错误（现代历史批判学**部分支持**这个论点）。
3. 所以圣经不能作为可靠的启示来源。

**基督教的回应**：
1. **文本批判学证明圣经的抄本传统极其可靠**（新约约有 5800 份希腊文抄本，最早的残片距今约 100 年；与荷马史诗相比，这个数量与时间差是压倒性的）。**没有证据表明核心教义被系统篡改。**
2. 古兰经本身**承认**讨拉特与引支勒（福音）是真主的经典（5:46–47、3:3），并命令基督徒「依他们所受的经典而判断」（5:47）——**如果这些经典已被篡改，这个命令就不成立。**
3. 「关于穆罕默德的预言被删除」这个说法，**在现存任何圣经抄本中都找不到证据**（约翰福音 14–16 章的「保惠师」*Paraklētos* 被某些穆斯林学者读作 *Periklytos*「受赞美的」= 穆罕默德，但这个读法没有任何抄本支持）。

#### 指控二：三位一体是 *Shirk*（以物配主）

**指控内容**：说神有「三个位格」，就是把受造物与真主并列。

> 「**妄言真主就是麦尔彦之子麦西哈的人，确已不信道了。**」（5:17、5:72）
> 「**你们不要说三位。**」（4:171）
> 「**真主绝不收养儿子。**」（19:35）

**为什么这是最严重的罪**：古兰经说「真主必不赦宥以物配主的罪恶」（4:48、4:116）——**这是唯一不可赦免的罪**。

**基督教的回应**：
1. **三位一体不是三个神**，因此不是 *shirk*。正统基督教明确谴责三神论。
2. **古兰经批评的可能是一个特定的异端**：5:116 提到「真主、麦西哈、麦尔彦」三者——这可能针对的是某个把马利亚当作神的阿拉伯基督教派别（Collyridian 派），而不是正统的三位一体。
3. **「真主绝不收养儿子」针对的是生理意义的生育**：基督教也否认神有配偶、有生理性的生育（「受生而非被造」正是为了排除这一点）。

**伊斯兰的再回应**：
1. 即使不是三个神，「三个位格」仍然违反真主的绝对单纯（*tanzih*）。
2. 5:116 的批评即使针对某个异端，也仍然代表古兰经对「把任何人/物与真主并列」的普遍否定。
3. 「受生而非被造」仍然是一个隐喻，而真主超越一切隐喻。

#### 指控三：道成肉身（真主不可能成为人）

**指控内容**：真主是超越的、不变的、不需要任何东西的。成为人意味着：
- 变化（从不变到有身体）；
- 缺乏（需要身体、需要食物、会死）；
- 受造性（人的身体是受造的）。

**这三条每一条都与 *tanzih* 冲突。**

**基督教的回应**：
1. **道成肉身不是「神变成了人」**（那会取消神性），而是「神取了人性，同时仍是完全的神」——**神性没有变化**。
2. 「神不能受苦」这个前提本身是一个**希腊哲学的前提**，不是圣经的前提。圣经说神「受苦」（赛 63:9）、「后悔」（创 6:6）、「忧伤」（弗 4:30）。
3. 爱必然包含脆弱性。一个不能受苦的神，能不能真正爱人？

**伊斯兰的再回应**：
1. 「取了人性而神性不变」是一个希腊化的区分（*ousia* / *hypostasis*），古兰经里没有这个框架。
2. 说神「受苦」是拟人化（*tashbih*），而古兰经明确说「任何物不似象他」。
3. 真主的爱不需要脆弱性——他的爱是**给予**（*rahmah*，慈悯），不是**需要**。

#### 指控四：十字架（4:157）

**指控内容**：

> 「**他们说：「我们确已杀死麦尔彦之子麦西哈·尔撒，真主的使者。」他们没有杀死他，也没有把他钉死在十字架上，但他们不明白这件事的真相。**」（4:157）

**主流伊斯兰的解释**：被钉死的不是耶稣本人，而是另一个人（或一个幻象），真主把耶稣提升到自己那里（4:158）。

**为什么伊斯兰必须否认十字架**：
- 真主必保护他的使者（3:55「我要使你寿终，要把你擢升到我那里」）。
- 一个被敌人处死的先知，在伊斯兰的神学里是不可接受的（这会被视为真主的失败）。
- 救赎不需要「血的代价」——伊斯兰的救恩是**真主的慈悯 + 人的顺服**，不需要代赎。

**基督教的回应**：
1. **十字架有罗马与犹太的双重史料**：塔西佗《编年史》15.44（「基督，在提比略统治期间，被总督本丢·彼拉多处死」）；约瑟夫斯《犹太古史》18.3.3（有部分篡改，但核心被认为可靠）；以及巴比伦塔木德的相关记载。
2. 伊斯兰的立场在结构上接近古代的 {{幻影说}}——而幻影说在 2 世纪就被基督教判为异端，理由是：若基督没有真死，救恩就是幻象。
3. **「使者必被保护」不是基督教的预设，而恰恰是基督教的核心悖论**：神的能力在软弱中显明（林后 12:9）；十字架不是失败，是「以失败的方式得胜」。

**伊斯兰的再回应**：
1. 塔西佗与约瑟夫斯都晚于事件，且依赖基督徒的信息来源。
2. 「神的能力在软弱中显明」在伊斯兰看来是把失败神圣化。
3. 古兰经的权威高于任何历史重建。

### 19.3 伊斯兰对保罗的指控

一个常见但少被中文读者知道的论点：**伊斯兰护教者认为，基督教是保罗发明的，不是耶稣的宗教。**

**论证**：
1. 耶稣是一个犹太先知，宣讲独一真主、呼召人悔改、遵守律法。
2. 保罗（一个从未见过耶稣的迫害者）改变了这一切：他取消了律法、把耶稣变成神、发明了「因信称义」与「代赎」。
3. 所以「基督教」是保罗的宗教，不是耶稣的宗教。

**基督教的回应**：
1. **保罗的书信是现存最早的基督教文献**（早于福音书），所以「耶稣的宗教」与「保罗的宗教」之间没有时间差可以插入一个「原始纯正的耶稣运动」。
2. 保罗与耶路撒冷的使徒有接触（加 1:18、2:9），且他的「因信称义」在使徒行传 15 章的耶路撒冷会议中得到承认。
3. 对观福音中耶稣的自我宣称（可 14:61–62 的「我是」、太 11:27、路 10:22）与保罗的基督论是连续的。
4. 但也要承认：**保罗确实做了重大的神学发展**（尤其「因信称义」与「在基督里」的框架），而这些发展的合法性，正是基督教与犹太教、伊斯兰教的核心分歧之一。

### 19.4 历史的互动：从共存到对抗到殖民

| 时期 | 情况 |
|---|---|
| 7–8 世纪 | 伊斯兰征服埃及、叙利亚、北非、西班牙。许多基督徒改宗（部分因税收与社会压力，部分因真诚信仰）。**注意**：伊斯兰对「有经人」（*ahl al-kitab*）实行「保护民」（*dhimmi*）制度——可以保留信仰，但须缴纳人丁税、不得传教、不得建新教堂、法律上低于穆斯林 |
| 8–13 世纪 | 共存与文化交流的高峰：翻译运动（希腊哲学经阿拉伯文传回欧洲）、医学、数学、天文学。**阿奎那的神学部分依赖阿拉伯哲学家（阿维森纳、阿威罗伊）** |
| 1096–1291 | 十字军 |
| 1453–1683 | 奥斯曼帝国：攻陷君士坦丁堡（1453）、围攻维也纳（1529、1683） |
| 19–20 世纪 | 欧洲殖民（法国在北非、英国在印度与埃及、意大利在利比亚）；传教运动（在伊斯兰世界收效甚微） |
| 1948– | 以色列建国；阿以冲突；石油政治 |
| 1979– | 伊朗革命；伊斯兰复兴运动；9/11（2001）；ISIS（2014） |
| 2000s– | 欧洲的穆斯林移民（法国约 600 万、德国约 550 万）；「伊斯兰恐惧症」与「基督教恐惧症」的双向增长 |

:::pit t="一个必须避免的简化"
**「伊斯兰与基督教一直敌对」是错的。** 在 8–13 世纪，伊斯兰世界是**保存与推进希腊学术的中心**，而基督教欧洲正处于学术低谷。阿奎那的神学没有阿拉伯哲学（阿维森纳、阿威罗伊、迈蒙尼德）是不可想象的。

**「伊斯兰与基督教必然冲突」也是错的。** 在奥斯曼帝国，东正教牧首区被保留（作为「米勒特」制度），希腊、亚美尼亚、犹太社群都有相当程度的自治。**冲突更多来自政治与领土，而不是神学本身。**

**但「它们的神学差异无关紧要」也是错的。** *Tawhid* 与三位一体的差异是真实的，而且双方都认为对方的核心教义是错的（甚至是对神的亵渎）。**这个差异不能被「我们都是亚伯拉罕的子孙」这类口号抹平。**
:::

### 19.5 当代的对话

**（一）梵二与之后。**
- 1965 年《我们的时代》：「天主教会尊重穆斯林，他们崇拜独一的、创造万物的、全能的天主。」
- 1985 年：若望保禄二世在卡萨布兰卡对穆斯林青年演讲。
- 2007 年：138 位穆斯林学者发表《共同之道》（*A Common Word Between Us and You*），以「爱神与爱邻」为共同基础邀请基督教对话；同年 300 位基督教领袖回应。

**（二）对话的成就与限制。**
- **成就**：双方在「一神论、创造、先知、道德、家庭价值」上找到共同点；在学术、医疗、救济上大量合作。
- **限制**：三位一体、道成肉身、十字架、圣经的可靠性——**这四项无法妥协**，因为它们各自是对方体系的核心或亵渎。

**（三）真正的困难不在神学，而在政治。**
- 中东的基督徒社群正在急剧萎缩（伊拉克的基督徒从 2003 年的约 150 万降到今天的不足 20 万；叙利亚、埃及的基督徒也大量流亡）。
- 欧洲的移民整合问题。
- 以色列—巴勒斯坦问题（这个问题把宗教、民族、土地绑在一起，几乎无解）。

:::note
**一个诚实的评估**：伊斯兰与基督教的神学对话，在可预见的未来不会有「合一」。但这不意味着对话无意义——**它的目标不是说服对方，而是让双方在同一个社会里共存而不互相屠杀。** 这个目标比「合一」现实得多，也重要得多。
:::

### 19.6 争议与反驳：这一章被质疑的地方

**（一）「古兰经批评的是异端，不是正统」这一回应的弱点。**

这个回应在学术上有依据（5:116 提到「真主、麦西哈、麦尔彦」三者，可能针对某个崇敬马利亚的阿拉伯派别）。但它有一个明显的弱点：**古兰经的其他经文明确针对「三位」（4:171）与「真主的儿子」（19:35、9:30）——这些不是某个小派别的说法，而是正统基督教的表述。**

**伊斯兰的再回应**：即使古兰经针对的是某个特定群体，它也代表了一种**普遍的神学立场**——任何使神「复杂化」或「人格化」的说法都必须被拒绝。

**（二）「十字架有罗马与犹太史料」这一回应的限制。**

塔西佗与约瑟夫斯确实提到耶稣被处死，但**他们都不提复活**，也不提任何神迹。所以这些史料证明的是「耶稣被钉死」，不是「基督教的核心宣告为真」。

**基督教的回应**：这正是基督教想要的——**十字架是一个公开的、可被外人记录的历史事件**；而复活是一个**启示性的事件**，只有信徒被赐予眼睛看见（林前 15:5–8 的目击者名单是保罗提供的，不是外人的记录）。

**伊斯兰的再回应**：那这就成了一个**循环**——只有信徒能看见的证据，对非信徒没有说服力。

**（三）历史互动的评价分歧。**

- **一种叙述**（某些基督教护教著作）：伊斯兰是「刀剑传播的宗教」，基督徒在中东一直是受迫害的少数。
- **另一种叙述**（现代史学）：在 8–13 世纪，伊斯兰世界是学术的中心，基督徒与犹太人在「保护民」（*dhimmi*）制度下有相当程度的自治；**真正的大规模迫害发生在 19–20 世纪**（奥斯曼晚期、以及现代的极端主义）。

**本书的立场**：两种叙述都抓住了部分事实，但都不完整。**「保护民」制度既是保护也是屈辱**（人丁税、不得建新教堂、法律上低一等）；而 20 世纪基督徒在中东的萎缩，主要原因是**政治动荡与战争**，不是单纯的神学敌对。

:::titre
**下一章：无神论的反驳（第 20–21 章）**

前面两个批判都接受「神存在」，只是不同意「神是谁」。无神论的批判更彻底：**它不接受这个前提。** 第 20 章处理哲学论证（恶的问题、神的隐晦、矛盾论、多重宗教），第 21 章处理历史与心理的批判（费尔巴哈、马克思、尼采、弗洛伊德、新无神论）。**这是全书最难写的部分**，因为这里的每一个论证都必须被讲到它最强的版本——否则就是稻草人。
:::

## 第 20 章：无神论的反驳（上）——哲学论证 {#ch-20}

### 20.0 先分清三种「无神论」

在中文语境里，「无神论」常被当作一个整体。但它至少有三层，混在一起讨论会毫无结果：

| 类型 | 主张 | 代表人物 | 与基督教的关系 |
|---|---|---|---|
| **经典无神论**（*positive atheism*） | 「神不存在」是一个可以被论证的命题 | 霍尔巴赫、罗素、麦基（J. L. Mackie） | 正面交锋：双方都接受「有神/无神」是一个事实问题 |
| **弱无神论 / 不可知论** | 不知道，或者「神」这个概念不够清楚，无法判断 | 赫胥黎、艾耶尔（早期）、部分维特根斯坦派 | 不否认，但认为问题无意义或无法回答 |
| **实践无神论 / 无宗教归属** | 不关心，不参与，不认为这问题重要 | 当代的「无宗教归属者」（nones） | 不是论证，是生活方式的转变 |

**本书重点讨论第一种**，因为只有它会提出可以被检验的论证。

:::why t="为什么无神论的批判与内部批判性质完全不同"
因为它**不接受前提**。

犹太教与伊斯兰教都说「神存在，但你们说错了」。无神论说「整个框架是空的」。

这意味着：**基督教不能靠解经、不能靠传统、不能靠大公会议来回应无神论**——因为那些对无神论者都没有权威。基督教只能靠**哲学论证**与**经验证据**来回应，而这两样恰恰是神学最不擅长的领域。

**这就是为什么 20 世纪的基督教护教学（apologetics）几乎全部转向哲学**（如普兰丁格、斯温伯恩、克雷格）。他们明白：与无神论者对话，必须用对方承认的工具。
:::

### 20.1 恶的问题：最古老、最顽强的论证

**（一）问题的形状。**

> 如果神是全能的，他能阻止恶。
> 如果神是全善的，他愿意阻止恶。
> 恶存在。
> 所以：神不是全能的，或不是全善的，或不存在。

这个论证的形式（「伊壁鸠鲁三难」）在古代就有，但现代版本由**麦基**（J. L. Mackie）在 1955 年的论文《恶与全能》中精确化，称为「**逻辑版恶的问题**」：

> 「全能」意味着能做一切逻辑上可能的事；「全善」意味着愿意消除一切恶。**一个全善全能的存在与恶的存在，在逻辑上不相容。**

**（二）基督教的回应：自由意志辩护（Free Will Defense）。**

**阿尔文·普兰丁格**（Alvin Plantinga）在 1974 年的《神、自由与恶》中给出了一个至今被广泛认为**成功**的回应：

> 一个包含「自由受造物」的世界，比一个不包含的世界更有价值。
> 但神不能**既**给予自由意志，**又**保证受造物不选择恶（这在逻辑上矛盾——被保证不选恶的自由，不是自由）。
> 所以：一个全能的神**不能**创造一个「有自由意志且从不作恶」的世界。
> 因此：恶的存在与全能全善的神**在逻辑上相容**。

**这个论证的力量**：它不解释「为什么有这么多的恶」，它只证明「恶与神不矛盾」。**在逻辑层面，这已经足够——因为逻辑版的论证声称的是「不相容」。**

**（三）但问题没有结束：证据版恶的问题。**

**威廉·罗**（William Rowe）在 1979 年提出一个更温和、也更难回应的版本：

> 即使恶与神在逻辑上相容，**世界上实际存在的恶的数量与性质**，仍然构成「神不存在」的证据。
> 例：一只小鹿在森林火灾中被烧了三天才死。**这个苦有什么价值能抵得上它？** 神完全可以创造一个没有这场火的世界。

**这个论证是「或然性」的（probabilistic），不是「逻辑」的**，因此不能靠「逻辑相容」来回应。

**（四）基督教的三种回应。**

| 回应 | 代表 | 内容 | 弱点 |
|---|---|---|---|
| **灵魂塑造**（soul-making） | 约翰·希克（John Hick） | 恶是「塑造灵魂」的必要条件：一个在温室里长大的孩子无法长出勇气、同情、忍耐 | 无法解释**动物**的苦（动物没有灵魂可塑造）；也无法解释**过量的**苦（一个孩子被折磨至死，塑造了什么？） |
| **怀疑论的有神论**（skeptical theism） | 斯蒂芬·威克斯特拉（Stephen Wykstra） | 我们**无法知道**神为什么允许这些恶——因为神的智慧远超我们。我们只看到一小片，不能据此判断整幅画没有意义 | 这个回应在逻辑上成立，但它使「神是善的」变成一个**无法被任何证据否定**的命题——这在认识论上是可疑的 |
| **更大的善**（greater good） | 各种神义论 | 每一个恶都服务于一个更大的善（自由、勇气、救赎、与神的关系） | 对**大屠杀**几乎无法使用：什么样的善能抵得上奥斯维辛？ |

:::why t="大屠杀之后，神义论发生了什么"
**二战之后，「神义论」（theodicy，为神辩护）这个词本身在犹太思想中变得可疑。** 一些思想家认为：**为大屠杀辩护的任何理论，都是对死者的侮辱。**

- **理查德·鲁宾斯坦**（Richard Rubenstein）：《奥斯维辛之后》（1966）——「我们生活在『神之死』的时代」；他放弃了「历史中有意义」的信念，回到「大地」与「共同体」。
- **埃米尔·法肯海姆**（Emil Fackenheim）：提出「**第 614 条诫命**」——犹太人不得把希特勒当作「最后的胜利者」，必须活下去、必须记住。
- **于尔根·莫尔特曼**（Jürgen Moltmann）：《被钉十字架的神》（1972）——**神不是在旁观苦难，他在十字架上与受苦者一同受苦**。这不是「解释」恶，而是「陪伴」受苦者。

**莫尔特曼的转向极其重要**：他放弃了「为神辩护」（theodicy），转向「**神的同情**」（*sympatheia*）。**这等于承认：恶的问题在理论上无解，只能在十字架上被「承受」，不能被「解释」。**

**一个诚实的评估**：恶的问题至今没有共识的解答。**自由意志辩护在逻辑层面基本成功，在存在层面完全失败。** 一个人可以在论证上被说服，同时在心里仍然问「为什么」。
:::

### 20.2 神的隐晦（Divine Hiddenness）

**约翰·希尔伦伯格**（J. L. Schellenberg）在 1993 年提出一个**比恶的问题更精巧**的论证：

> 如果有一个完全爱人的神，他应当**使所有真诚寻求他的人都能清楚地认识他**（就像任何爱人的人都希望对方知道自己）。
> 但事实上，有许多人**真诚地寻求神，却从未获得清楚的认知**（「非抵抗的怀疑者」，*non-resistant non-believers*）。
> 所以：这样的神不存在。

**这个论证的巧妙之处**：它不依赖「恶」这个有争议的概念，只依赖「爱」这个概念。**它把举证责任放在了「为什么神要隐藏自己」上。**

**基督教的回应**：

| 回应 | 内容 | 弱点 |
|---|---|---|
| **认识论的后果**（ Hick ） | 神必须保持一定的隐晦，否则人对他的「信」就变成了「知识」，自由的爱就变成了被迫的承认 | 这与「完全爱人的神希望被认识」冲突：一个爱人的人不需要「隐藏自己」来让对方自由地爱他 |
| **人的抗拒**（加尔文式） | 人不是「非抵抗的」——人天生抗拒神（罗 1:18「不虔不义的人阻挡真理」） | 这个回应把所有怀疑者都说成「抗拒」，在经验上不成立（许多怀疑者极其真诚） |
| **基督作为启示** | 神已经在基督里清楚地启示了自己（约 14:9「人看见了我，就是看见了父」） | 但历史中的基督只被一小部分人看见；对后世的人来说，「启示」仍然需要通过文本与社群，而这又回到了隐晦的问题 |
| **隐晦有其目的**（普兰丁格） | 神可能有一个我们不知道的理由（与「怀疑论的有神论」同构） | 同上：它使「神是爱」不可被证据检验 |

:::note
**希尔伦伯格的论证是当代无神论最强的论证之一**，因为它不需要「恶」这个有争议的概念，只需要「爱」这个双方都接受的概念。**它的力量在于：它把一个抽象的神学问题，变成了一个具体的、可观察的事实——「有许多人真诚地寻求，却什么也没找到」。**

**这也是为什么「为什么神不向我显现」这个问题，比「为什么有恶」更让信徒不安**：因为它指向的不是世界的状态，而是**我自己的经验**。
:::

### 20.3 矛盾论：教义本身是否自相矛盾

**（一）三位一体。**
- **指控**：1+1+1=3，不是 1。
- **回应**：三位一体从不说「三个神」；「本质」与「位格」不是同类项，不能相加。**但这个回应只能挡开「算术」的指控，不能解释这个教义到底是什么意思**（这正是正统自己承认的：它是「奥秘」）。
- **更尖锐的指控**：如果「一个本质三个位格」是不可理解的，那么它是否**有意义**？一个不能被理解的命题，与一个无意义的命题，如何区分？
- **回应**：可类比于「一个正方形有三条边」——不可想象，但可以理解其逻辑关系；或者「光的波粒二象性」——不可想象，但有精确的数学表述。**三位一体的「表述」是精确的（一个 ousia，三个 hypostasis），只是「想象」不可能。**

**（二）道成肉身。**
- **指控**：一个位格同时是全知的神与有限的人，这在逻辑上矛盾（例如：耶稣是否知道他几岁会死？如果知道，他的人性是否真实？）。
- **回应**：{{属性相通}} 的区分——「作为神他知道，作为人他不知道」。**但这个区分是否只是语言上的补丁？** 这是至今仍在争论的问题（见 5.10 节的「两个意志」难题）。

**（三）全能悖论。**
- **指控**：神能否创造一块他自己举不起来的石头？
- **回应**：这是**伪问题**——「举不起来的石头」本身是一个自相矛盾的描述，就像「一个方形的圆」。全能不包括「做逻辑上不可能的事」。
- **注意**：这个回应是标准的，但它有一个代价——**它把「全能」重新定义为「能做一切逻辑上可能的事」**，这就限制了神。一些神学家（如笛卡尔派）拒绝这个限制，主张神甚至可以违反逻辑（但那会使一切论证失效）。

**（四）预知与自由意志。**
- **指控**：如果神预先知道我会做什么，那么我的行为就是被决定的，我就没有自由意志；如果没有自由意志，那么「罪」与「审判」就不公义。
- **回应**：
  - **波爱修 / 阿奎那**：神的知识不在时间之内——他看到一切「同时」，就像我「现在」看到你在读这句话，但这不构成对你的强迫。
  - **开放有神论**（Open Theism）：神不预知未来的自由行为（他「冒风险」）。这是当代福音派内部的一个争议立场。
  - **加尔文主义**：接受这个推论——人的自由是「相容论」的自由（按自己的意愿行动），而不是「无因选择」的自由。
- **无神论的反驳**：波爱修的回答只是把问题推后了——如果神「同时看到」我的全部历史，那么这段历史对他来说就是**已定的**，而「已定」与「自由」的关系仍然不清。

### 20.4 宗教多样性与地理偶然性

**（一）论证。**

> 一个人信什么宗教，很大程度上取决于**他出生在哪里**。
> 一个在沙特出生的孩子几乎必然是穆斯林；在印度必然是印度教徒；在墨西哥必然是天主教徒；在泰国必然是佛教徒。
> 如果只有一个宗教是真的，那么**绝大多数人的永恒命运，取决于一个他们无法选择的偶然事实**。
> 这与「一个公正、爱人的神」不相容。

**（二）约翰·希克的多元主义。**
希克（John Hick）提出：所有宗教都是对同一个「终极实在」的不同文化回应（「**哥白尼式的革命**」：把神放在中心，把宗教放在周围）。他引用盲人摸象的比喻。

**（三）基督教的回应。**

| 立场 | 内容 | 代表人物 |
|---|---|---|
| **排他论**（exclusivism） | 只有信基督才能得救 | 传统立场（多数福音派、天主教保守派） |
| **包容论**（inclusivism） | 基督是唯一的救主，但救恩可以及于「不知道」的人（「匿名基督徒」） | 卡尔·拉纳（Karl Rahner）、梵二 |
| **多元论**（pluralism） | 所有宗教都是通向同一终极的不同路径 | 希克、保罗·尼特（Paul Knitter） |

**对多元论的批评**（不仅来自基督教，也来自无神论者）：
- **它抹平了差异**：佛教（无神）与基督教（一神）不是「同一个实在的不同回应」，它们是**互相矛盾的**主张。
- **它本身是一个西方自由主义的产物**：它假定「所有宗教本质相同」这个前提，而这个前提恰恰是大多数宗教**否认**的。
- **它在逻辑上自我否定**：如果所有宗教都是真的，那么「只有基督教是真的」这个主张也是真的——矛盾。

**对排他论的批评**：
- **它使神不公正**：一个在 12 世纪的中国农民，从未听过耶稣，就因此永远沉沦？
- **它使「真理」变成「地理彩票」**。

**包容论的困难**：
- 如果「不知道的人」可以通过别的途径得救，那么传教还有什么意义？
- 「匿名基督徒」这个概念，是否只是把「只有基督教得救」这个主张换了个说法（**所有得救的人，其实都是「匿名」的基督徒**）？

### 20.5 道德的批评

**（一）Euthyphro 困境（柏拉图《游叙弗伦篇》）。**

> 「虔诚是因为神喜爱它，还是因为它是虔诚的所以神喜爱它？」

**应用于基督教**：
- 若「善」是因为神命令它才是善，那么善就是**任意的**（神可以命令「恨你的邻舍」，那也是善）。
- 若「善」本身是独立的，那么神就不是善的最终标准，**道德可以独立于神**。

**回应**：
- **阿奎那**：善属于神的本性，不是任意的命令；神的命令与他的本性一致。
- **神命论**（divine command theory，普兰丁格）：「善」= 「神所命令的」，但神的命令反映他的善本性，因此不是任意的。
- **无神论的反驳**：这个回应只是把「任意」从命令转移到了本性——如果神的本性就是如此，那他也别无选择；如果他有选择，那还是任意的。

**（二）圣经的道德问题。**

这是当代最常见的批评，也是最难回应的：

| 经文 | 内容 | 批评 |
|---|---|---|
| 出 21:20–21 | 打奴仆「若过一两天才死，就可以不受刑」 | 变相允许奴仆制度 |
| 利 20:13 | 同性性行为可处死 | 残酷；今天被用来为歧视辩护 |
| 申 20:16–18 | 灭绝迦南七族，「凡有气息的没有留下一个」 | 种族灭绝 |
| 民 31:17–18 | 杀尽米甸的男丁与已嫁女子，留下处女 | 战争罪行 |
| 提前 2:11–12 | 「不许女人讲道」 | 性别歧视 |
| 弗 6:5 | 「你们作仆人的，要惧怕战兢……听从你们肉身的主人」 | 为奴隶制背书 |
| 诗 137:9 | 「拿你的婴孩摔在磐石上的，那人便为有福」 | 极端暴力 |

**基督教的回应（多种，不统一）**：

1. **渐进启示**：神在历史中逐步启示自己，容忍当时文化的某些制度（如奴隶制、多妻制），并在新约中开始废除（腓利门书；加 3:28）。**批评**：这使神显得像在「妥协」，而且渐进启示的终点由谁判定？
2. **文化处境**：许多命令是针对特定古代近东处境的（如迦南的偶像崇拜与婴孩献祭），不能直接移植。**批评**：这是「选择性处境化」——为什么同性性行为的禁令不能同样处境化？
3. **「经文的中心」**：不要用边缘经文去对抗中心（耶稣的爱、十诫、先知的社会公义）。**批评**：谁决定哪个是中心？这不正是自由派与保守派的分歧所在？
4. **「这是人的话，不是神的话」**：某些经文反映的是作者的局限，不是神的旨意（这是自由派的立场）。**批评**：这取消了圣经的权威。
5. **「已经废除」**：某些命令（如献祭、洁净礼、奴隶制）在新约中已被废除。**批评**：那为什么另一些没有？

:::pit t="本书对这一节的态度"
这一节的批评**大多数是成立的**，不能靠「当时的历史背景」完全开脱。

但有一个重要的区分：**「圣经记录了某件事」不等于「圣经赞同它」。** 圣经也记录了大卫的奸淫与谋杀、彼得的否认、以及以色列的偶像崇拜——记录不等于认可。

**然而**：有些经文确实是**命令**（如申 20 章的灭绝令），而不只是记录。对这些，任何辩护都必须面对一个尖锐的问题：**如果这是神的命令，那神的道德标准与我们的道德直觉之间，存在一个无法弥合的鸿沟。** 而如果我们的道德直觉是对的，那么这段经文就不是神的命令。

**这两个选项都让人不舒服。** 这可能是「圣经的道德问题」最重要的地方：**它不给一个可以安心的答案。**
:::

### 20.6 宇宙论与设计论证的复兴

必须提到：20 世纪后期，有神论的**哲学论证出现了复兴**（尤其在美国的分析哲学传统中）。

| 论证 | 内容 | 主要代表 | 主要反驳 |
|---|---|---|---|
| **卡拉姆宇宙论** | 一切有开始的事物都有原因；宇宙有开始；所以宇宙有原因 | 威廉·莱恩·克雷格（W. L. Craig） | 「宇宙有开始」依赖大爆炸模型，而大爆炸之前的「时间」是否有意义仍是问题；「原因」概念是否适用于宇宙之外？ |
| **精细调节** | 物理常数（宇宙学常数、强核力、引力）恰好允许生命存在，概率极低 | 罗宾·柯林斯、克雷格 | 多重宇宙（许多物理理论预言）；「观察者选择效应」（我们只能观察到允许生命的宇宙）；概率计算本身是否成立 |
| **道德论证** | 客观道德价值的存在，最好由神来解释 | 刘易斯、普兰丁格 | 道德可以自然主义地解释（演化、社会契约）；「客观道德存在」本身可被质疑 |
| **本体论论证** | 由「最完美者」的概念推出其存在 | 安瑟伦、普兰丁格（模态版） | 「存在」不是谓词（康德）；这个论证可以证明任何「最完美」的东西 |

:::note
**一个重要的历史事实**：哲学界对「神存在」的讨论，在 20 世纪后期**从「已解决（无神论胜）」变成了「仍在争论」**。1970 年代，多数分析哲学家认为有神论已被驳倒；今天，无神论与有神论的比例大致相当（PhilPapers 2020 年的调查：无神论约 67%，有神论约 18%，但这是在哲学专业内部，且偏向分析传统之外）。

**这不意味着有神论赢了**，但它意味着：**「神存在」这个问题，不是一个已经被科学解决的问题。** 它是一个活的哲学问题。
:::

### 20.7 争议与反驳：哪些批判成立，哪些不成立

| 批判 | 评估 |
|---|---|
| 逻辑版恶的问题（「恶与神不相容」） | **基本失败**（自由意志辩护已足够回应） |
| 证据版恶的问题（「恶的数量构成反证」） | **成立但未定论**：有神论有回应（怀疑论有神论、更大的善），但没有共识的解答 |
| 神的隐晦 | **最强的一个**：它不需要「恶」这个概念，只需「爱」；基督教的回应大多依赖「我们不知道神的理由」 |
| 三位一体/道成肉身的「矛盾」 | **算术层面失败**（不是 1+1+1），**意义层面仍开放**（不可理解 vs 无意义） |
| 宗教多样性与地理偶然性 | **成立且严重**：它把「真理」与「出生地」绑在一起，任何排他论都必须面对 |
| 圣经的道德问题 | **成立且严重**：多数辩护只能做到「部分解释」，不能完全开脱 |
| 宇宙论/设计论证 | **不构成决定性的证明**，但也不像 20 世纪初那样被视为已被驳倒 |

:::why t="为什么这一章必须写得这么「不给结论」"
因为本书的读者需要的是**看清每一个论证的形状**，而不是被告知「谁赢了」。

一个具体的理由：**大多数基督徒与大多数无神论者，都在与对方的稻草人争论。** 基督徒常反驳「恶的问题」（那已经被回应了），而无神论者常反驳「设计论证」（那不是基督教的核心）。**真正的战场在「神的隐晦」与「圣经的道德」——而这两处，双方都很少认真交手。**

**本书的立场**：恶的问题在理论上可以被回应，在存在上不能被回应；神的隐晦是最强的批判，且没有决定性的回应；圣经的道德问题需要「渐进启示」或「经文降级」这类有代价的方案。**如果你要一个结论：基督教不是不理性的，但它需要承担一些真实的重担。**
:::

## 第 21 章：无神论的反驳（下）——投射、鸦片与怨恨 {#ch-21}

### 21.1 费尔巴哈：神是人的投射

**路德维希·费尔巴哈**（Ludwig Feuerbach，1804–1872）在《基督教的本质》（1841）中提出：

> **不是神创造了人，而是人按照自己的形象创造了神。**

他的论证：
1. 人意识到自己有一种「无限的」意识——人能思考无限、真理、爱、正义。
2. 但个体的人是有限的（会死、会错、会失败）。
3. 于是人把「自己的无限属性」投射到一个外部的存在者身上，称它为「神」。
4. **神的属性，就是人被异化了的属性**：神的全知 = 人对自己理性的理想化；神的全善 = 人对自己道德的理想化；神的爱 = 人对自己的情感的理想化。

**他的结论**：「神学就是人类学。」宗教的终结不是消灭这些属性，而是**把它们还给人**——人应当认识到，那些他以为是神的属性，其实是他自己的。

**基督教的回应**：
1. **这个论证是「解释」，不是「反驳」**。它解释了「为什么人会信神」，但它没有证明「神不存在」。一个信念的心理起源，与它的真假，是两个问题（这是「**起源谬误**」*genetic fallacy*）。
2. **反向论证同样成立**：如果人投射了一个神，为什么投射出的是**一个反对人的神**——一个要求人舍己、禁止人骄傲、审判人的罪的神？**这不是人想要的神。** 费尔巴哈的投射论解释不了一个「不合人意」的神（这是 C. S. Lewis 与弗洛伊德派争论的核心）。
3. **但费尔巴哈的批判有真实的力量**：许多人的「神」确实是自己的投射（一个支持自己政治立场的神、一个惩罚自己讨厌的人的神、一个保证自己成功的神）。**这一点，基督教自己也应当承认**（这是「偶像崇拜」的现代形式）。

### 21.2 马克思：宗教是「人民的鸦片」

**卡尔·马克思**（1818–1883）在《黑格尔法哲学批判导言》（1844）中写道：

> 「**宗教是被压迫生灵的叹息，是无情世界的感情，正像它是没有精神的制度的精神一样。宗教是人民的鸦片。**」

**必须准确理解这句话**。常见的误读是「宗教是统治者用来麻痹人民的工具」。但马克思的原意更复杂，也更有同情心：

- **「鸦片」在 1844 年不是「毒品」，而是「止痛药」**（鸦片酊 *laudanum* 是当时常用的镇痛剂）。
- 所以这句话的意思是：**宗教是受苦者的止痛药**——它真实地缓解了痛苦，但它**掩盖了痛苦的真正原因**（社会结构），使人不去改变世界，而只等待来世。
- 马克思接着说：「**废除作为人民幻想的幸福的宗教，也就是要求实现人民的现实的幸福。**」——他要的不是消灭幸福，而是把幻想换成现实。

**基督教的回应**：
1. **马克思的批判在历史上有大量证据**：教会确实常与权力结盟（君士坦丁之后的国教、中世纪的教宗国、19 世纪欧洲教会对工人运动的敌视、南非的荷兰改革宗为种族隔离提供神学）。**这些不是例外，是模式。**
2. **但「宗教是鸦片」不能解释宗教的另一面**：教会在历史上也是**社会变革的推动者**（废奴运动、劳工权利、民权运动、解放神学、以及当代的扶贫与医疗）。**如果宗教只是鸦片，为什么它也会成为抗议的源泉？**
3. **马克思的「投射」与费尔巴哈同构**：他把宗教解释为社会经济结构的反映，但这同样是一个「解释」，不是一个「反驳」。**一个信念的社会功能，与它的真假，是两个问题。**

### 21.3 尼采：怨恨与奴隶道德

**弗里德里希·尼采**（1844–1900）的批判是最尖刻、也最深刻的。

**（一）「上帝死了」。**
《快乐的科学》第 125 节：「疯子」在市场里喊「上帝死了，是我们杀了他」——这不是一个无神论的胜利宣言，而是一个**灾难的宣告**：**没有了神，道德的基础、价值的秩序、以及人的自我理解，都崩塌了。**

**（二）奴隶道德的反转（《道德谱系学》）。**
尼采的论证：
1. 古代贵族的价值是「**好/坏**」（*gut/schlecht*）：好 = 强大、高贵、创造；坏 = 软弱、低贱。
2. 被压迫者无法在力量上取胜，于是发明了「**善/恶**」（*gut/böse*）的反转：他们把贵族的「强大」重新命名为「恶」，把自己的「软弱」重新命名为「善」。
3. **基督教的「爱」与「谦卑」，是这种怨恨（*Ressentiment*）的产物**：它不是因为爱而宽恕，而是因为无力报复而把报复重新命名为「宽恕」。

**（三）「基督教是柏拉图主义为大众准备的版本」。**
尼采认为基督教与柏拉图主义共享同一个错误：**贬低此世，抬高彼岸**。而他要的是「**忠实于大地**」（*Treue zur Erde*）。

**基督教的回应**：
1. **尼采的谱系学是一个假设，不是历史**。它没有文献证据（他没有研究过早期基督教的社会构成），而是从「权力意志」的理论推出的。
2. **「怨恨」的解释不适用于耶稣**：耶稣不是被压迫者的复仇幻想，他是被处死的**加害者的宽恕**（「父啊，赦免他们」）。尼采自己也承认：「**基督教史上只有一个基督徒，而他死在十字架上。**」——这句话是他的批评中最锋利、也最接近承认的一句。
3. **但尼采的批判有真实的力量**：许多「基督教道德」确实是怨恨的伪装（「我原谅你」其实是「我拿你没办法」；「谦卑」其实是「我不敢争取」）。**这是对信徒的良心说的，不是对论证说的。**

### 21.4 弗洛伊德：宗教是强迫症与父亲投射

**西格蒙德·弗洛伊德**（1856–1939）在两本书里处理宗教：

- **《图腾与禁忌》（1913）**：宗教源于「原始弑父」的记忆——原始部落的儿子们杀了专制的父亲，然后产生罪疚感，于是把父亲神化为图腾，并设立禁忌。
- **《一个幻觉的未来》（1927）**：宗教是「**人类最古老的、最强烈的、最迫切的愿望的幻觉**」——对保护的渴望（父亲）、对死亡的否认、对不公正的补偿。
- **《摩西与一神教》（1939）**：摩西是埃及人，一神教来自埃赫那吞的宗教改革。

**他的类比**：宗教仪式（强迫性的重复、洁净礼、对微小过失的恐惧）与**强迫症**（*Zwangsneurose*）在结构上相似——宗教是「**人类的普遍强迫症**」。

**基督教的回应**：
1. **《图腾与禁忌》的人类学已被完全推翻**：没有证据表明存在「原始弑父」的事件，这是弗洛伊德的推测（他自己承认这是「科学神话」）。
2. **《摩西与一神教》的历史基础也很薄弱**：埃及起源说没有文献支持。
3. **心理学解释的有效性不决定命题的真假**：一个人因为「渴望父亲的保护」而信神，与「神存在」这个命题的真假，是两个问题。
4. **但弗洛伊德的批判有真实的力量**：宗教确实可以成为强迫症（**scrupulosity**，宗教性的强迫症是临床心理学的一个真实诊断）；确实可以成为对父亲的投射（许多人的「神」确实是一个严苛的、需要讨好的父亲形象）。**这一点，牧养心理学必须面对。**

### 21.5 涂尔干：宗教是社会对自己的崇拜

**埃米尔·涂尔干**（Émile Durkheim，1858–1917）在《宗教生活的基本形式》（1912）中，通过研究澳洲原住民的图腾制度，提出：

> **宗教的核心不是「神」，而是「社会」。** 图腾是氏族自身的象征；宗教仪式是社会集体情感的集中表达；「神圣」与「凡俗」的区分，本质上是「社会」与「个人」的区分。

**他的结论**：宗教的功能是**社会整合**——它创造共同体的团结、共同的道德、以及面对死亡的意义。

**基督教的回应**：
1. **功能解释不等于虚假**：一个信念有社会功能，与它是否真实，是两个问题（水能解渴，不代表水不存在）。
2. **涂尔干的论证依赖一个已被质疑的人类学**：他对澳洲原住民的研究，后来被证实有大量误读（这是人类学史上的著名案例）。
3. **但涂尔干的洞见极其重要**：它解释了为什么**教会的分裂常常与族群、阶级、地域重合**（本书第 5 章的一性论分裂、第 7 章的东西方分裂、第 17 章的全球南方 vs 西方，都可以用这个框架重新读一遍）。**宗教确实常常是社会身份的表达——这不需要否认它的真理性，但必须承认它的社会学维度。**

### 21.6 新无神论（2004–）

2004–2007 年，四本书成为畅销书，开启了「新无神论」运动：

| 作者 | 书 | 核心论点 |
|---|---|---|
| **理查德·道金斯** | 《上帝的错觉》（2006） | 宗教是「**错觉**」（delusion）；信仰是「不需要证据的信念」；宗教是「**儿童虐待**」（把小孩标签为「天主教徒的孩子」） |
| **克里斯托弗·希钦斯** | 《上帝不伟大》（2007） | 宗教「**毒害一切**」；他主要攻击的是宗教的**实践后果**（暴力、虚伪、压制） |
| **萨姆·哈里斯** | 《信仰的终结》（2004） | 宗教信念缺乏证据；伊斯兰极端主义是「信仰本身」的逻辑结果 |
| **丹尼尔·丹尼特** | 《破除魔咒》（2006） | 用演化心理学解释宗教的起源（「**迷因**」*memes*） |

**新无神论的特点**：
- **不是哲学论证，而是道德与政治批判**：他们主要说「宗教是有害的」，而不是「神不存在」。
- **语气激烈**：这既是他们的力量（畅销），也是他们的弱点（被批评为「原教旨主义无神论」）。
- **学术上的地位不高**：专业哲学家（包括无神论哲学家如 William Lane Craig 的对手、以及无神论者如 Graham Oppy）普遍认为他们的论证过于简化。

**基督教的回应**：
1. **「宗教有害」不等于「神不存在」**。这是两个不同的问题（一个命题的后果，与它的真假无关）。
2. **他们选择性地引用宗教的暴力**，忽略了宗教在废奴、民权、医疗、教育上的贡献。
3. **但他们的批评有真实的力量**：宗教的暴力是真实的（十字军、宗教裁判所、三十年战争、北爱尔兰、9/11），不能靠「那是政治不是宗教」完全开脱。

### 21.7 现代研究：宗教与健康、道德、暴力

这些是**经验问题**，可以用数据讨论（虽然数据常被双方选择性引用）：

| 问题 | 研究倾向 |
|---|---|
| 宗教与健康 | 多数研究显示**宗教参与与更好的心理健康、更低的抑郁、更长的寿命相关**（但有混杂变量：社群支持、健康生活方式、较低的冒险行为） |
| 宗教与道德 | 宗教徒与非宗教徒在**日常道德行为**上没有显著差异（一些研究甚至显示宗教徒略低，但那受「内群体/外群体」效应影响）；但宗教徒在**慈善捐赠**上显著更高（包括对非宗教机构的捐赠） |
| 宗教与暴力 | 宗教与暴力**没有简单的因果关系**；但「宗教 + 政治 + 领土」的组合是历史上最暴力的组合之一。**世俗的意识形态（纳粹、斯大林主义）在 20 世纪的暴力规模更大**——这一点常被双方忽略 |
| 宗教与智力 | 元分析显示**负相关但效应很小**（且受测量方式影响）；在宗教性高的社群中，这个相关性会反转 |

:::pit t="一个必须避免的双向简化"
**无神论者常犯的错**：把宗教的暴力归因于「宗教本身」，忽略政治、经济、族群的因素；把「宗教徒更不宽容」当作结论，而数据远比这复杂。

**基督徒常犯的错**：用「斯大林与希特勒也是无神论者」来反驳（希特勒不是无神论者，他自称基督徒；斯大林受的是神学院教育但不是无神论哲学家）；用「宗教做了很多慈善」来抵消宗教的暴力（两者都是真的，不能互相抵消）。

**本书的立场**：这些是**经验问题**，应当用数据讨论，而不是用意识形态站队。**而数据通常显示：宗教既不是纯粹的善，也不是纯粹的恶——它是一个放大器。** 它放大了一个社群既有的善与恶。
:::

### 21.8 争议与反驳：投射论批判的成就与限制

| 批判 | 成立的成分 | 不成立的成分 |
|---|---|---|
| 费尔巴哈（投射） | 许多人的「神」确实是自我理想化的投射 | 「所有宗教都是投射」这个全称命题无法被证明；且投射论无法解释「反人性」的神 |
| 马克思（鸦片） | 宗教确实常与权力结盟，确实起麻痹作用 | 宗教也常是抗议与变革的源泉；「鸦片」原意是止痛药，不是麻醉剂 |
| 尼采（怨恨） | 许多「基督教道德」确实是怨恨的伪装 | 耶稣本人不是怨恨的形象（尼采自己承认）；谱系学是推测，不是历史 |
| 弗洛伊德（强迫症） | 宗教确实可以成为强迫症；「神」确实常是父亲投射 | 人类学基础已被推翻；心理起源不决定命题真假 |
| 涂尔干（社会） | 宗教确实常常是社会身份的表达 | 功能解释不等于虚假；人类学基础被质疑 |
| 新无神论（有害论） | 宗教的暴力是真实的 | 「有害」不等于「不真」；论证过于简化 |

:::why t="为什么这一整章对信徒与无神论者都有用"
**对信徒**：这些批判揭示了信仰的**心理与社会维度**。一个信徒如果承认「我的信仰可能部分来自我的需要」，他的信仰反而更稳固——因为它不再需要假装自己没有心理动机。

**对无神论者**：这些批判大多是**「解释」而非「反驳」**。它们解释了「为什么人会信」，但没有证明「所信的是假的」。**一个信念的起源与功能，与它的真假，是两个不同的问题**——这个区分（起源谬误）是本章最重要的一句话。

**而最深的一点**：所有这些批判者（费尔巴哈、马克思、尼采、弗洛伊德）都**不是冷静的旁观者**——他们都有自己的「信仰」（费尔巴哈的「人」、马克思的「历史」、尼采的「权力意志」、弗洛伊德的「科学」）。**批判宗教的人，也需要被批判。**
:::

:::titre
**下一章：其他宗教的反驳（第 22 章）**

无神论说的是「没有神」。但世界上还有十几亿人，他们的问题不是「你说错了神」，而是**「为什么一定要有一个神？」**——佛教根本不设创造主，印度教的神多到不需要「唯一」，儒家说道德不需要神，道家说「道可道，非常道」。**这一章要把这些传统对基督教的批评讲到最强，包括那个最让中国读者心里一动的问题：一个一生行善、只是没信耶稣的人，凭什么被定罪？**

**再下一章（第 23 章）才是最后一种批判：世俗主义。**

它说的不是「神不存在」，而是「神不重要」——宗教可以存在，但应当退回私人领域；公共生活应当按世俗的理性来组织。**这是当代西欧与部分东亚的现实**，也是基督教在 21 世纪最根本的处境。
:::

## 第 22 章：其他宗教的反驳——印度教、佛教、中国宗教与其余 {#ch-22}

### 22.0 为什么这一章必须存在

犹太教、伊斯兰教、无神论都认真对待「神」这个范畴：它们要么说「你们的弥赛亚错了」，要么说「你们的独一论被污染了」，要么说「根本没有神」。

但世界上还有另外十几亿人，他们的问题不是「哪个神」，而是**「为什么一定要有一个神？」**

- **佛教**（约 5 亿人）根本不设一个创造主，它有自己完整的「苦—集—灭—道」体系，并且认为「神」这个概念本身就是**{{轮回}}中的一种存在状态**（天道众生），不是解脱的依据。
- **印度教**（约 12 亿人）有神，但它的神是**多**的、可化身的、可被无数种方式接近的；它的终极目标不是「与神和好」，而是**从轮回中解脱**（*moksha*）。
- **中国宗教**（儒家、{{道家}}、民间信仰，覆盖十几亿人）有一套完全不同的框架：**天、道、祖先、{{报应}}、修身**——它不需要一个「三位一体」或「道成肉身」的问题。

**这几种传统对基督教的批判，与前面四类都不同。** 它们不否认神的存在（佛教甚至不需要神），而是**质疑基督教的问题设定本身**。

:::why t="这一章对零基础读者最有价值"
因为大多数中文读者生活在三种传统的交界处：**儒家的人伦、道家的自然、佛教的因果**，加上民间信仰的「天」「祖宗」「报应」。

当你听到「基督教说人靠信得救」，一个中国读者的第一反应往往不是「这个论证有问题」，而是：**「那我爷爷一辈子行善、从没做过坏事，就因为没信耶稣要下地狱？」**

**这个问题不是逻辑问题，是框架问题。** 而它恰恰是基督教在中国传播时最常遇到的第一个障碍，也是最多人心里真正的疑问。这一章要把这个疑问的各个版本讲清楚，以及基督教怎么回答（以及哪些回答是不成立的）。
:::

### 22.1 佛教的批判：苦的问题，与「神」的不必要性

**（一）佛教的基本框架（最小包）。**

佛教的起点不是「神」，而是**苦**（*dukkha*）。**四圣谛**：

1. **苦谛**：生、老、病、死、爱别离、怨憎会、求不得——存在本身带着不满足。
2. **集谛**：苦的原因是**贪爱**（*taṇhā*，渴爱）与**无明**（*avijjā*，不了解无常、无我）。
3. **灭谛**：苦可以止息（**{{涅槃}}**，*nirvāṇa*）。
4. **道谛**：止息的方法是**八正道**（正见、正思惟、正语、正业、正命、正精进、正念、正定）。

**核心洞见是「三法印」**：**诸行无常**（一切因缘和合的事物都会变化）、**诸法无我**（没有任何东西有恒常不变的「自我」）、**涅槃寂静**。

**（二）佛教对基督教的四个批评。**

| 批评 | 内容 | 基督教的典型回应 | 佛教的再回应 |
|---|---|---|---|
| **「神」不解决苦** | 即使有一个创造主，他也**不能替你止息苦**——苦的根源在你自己的贪爱与无明。祈祷不能代替修行。 | 基督教也强调生命的改变（成圣），不只是「信一下」。 | 但你们的核心是「基督替我承担」，而佛教的核心是「我自己看清」。**代受与自证，是两条相反的路。** |
| **「我」是幻觉，所以「谁得救」这个问题不成立** | 基督教问「我死后去哪里」，预设了一个连续的「我」。但佛教说「无我」——没有一个从今生走到来世的实体。 | 基督教传统也反对「灵魂是独立实体」的希腊化说法，强调**复活是身体性的、关系性的**（不是「灵魂飞走」）。 | 但你们仍然需要一个「承受救恩的主体」，而这个主体在佛教看来是**被建构的**。 |
| **一个永恒的创世主与「无常」矛盾** | 如果一切因缘和合的事物都是无常的，那么一个**非因缘和合、永恒不变、又与世界互动**的创造主，在逻辑上很可疑。 | 神不是「诸行」之一，他不属于「因缘和合」的范畴（这正是 {{否定神学}} 的要点：神不是「一个存在者」）。 | 那你们说的「神与世界互动」（道成肉身、垂听祷告、审判）又怎么理解？一个不变化的存在如何「回应」？ |
| **「只有信才能得救」是残忍的** | 一个人一生的善恶，被一个「信/不信」的瞬间决定，这在因果（*karma*）的框架里是不公正的。 | 基督教也讲审判「照各人所行的」（启 20:12；太 16:27），不是「信了就可以为所欲为」。 | 但「信」仍然是决定性的条件——而一个人的「信」很大程度上取决于他出生在哪里。 |

**（三）最关键的分歧：代赎 vs 自证。**

把两种救恩观并排：

| | 基督教 | 佛教 |
|---|---|---|
| 问题的诊断 | 罪（关系断裂、悖逆） | 苦（贪爱、无明） |
| 解决者 | 神（在基督里） | 自己（依佛法修行） |
| 方法 | 信靠、恩典、与神和好 | 戒、定、慧；八正道 |
| 目标 | 与神同在（复活、新天新地） | 涅槃（止息轮回） |
| 时间 | 一次性的历史事件 + 终末 | 多生多世的累积 |

:::pit t="一个常见的误解：佛教是「无神论」"
严格说，佛教**不否认神的存在**（它承认天道众生、梵天、帝释等），但**不承认一个创造主**。所以更准确的说法是「**非有神论**」（non-theistic），而不是「无神论」。

**这个区别很重要**：一个佛教徒不需要「证明神不存在」，他只需要说「神的存在与我的解脱无关」。**这比无神论的论证更难回应**，因为它不进入论证的战场，而是换了一个战场。
:::

### 22.2 印度教的批判：解脱、化身与「太多神」

**（一）印度教不是「一个宗教」。**
「印度教」（Hinduism）是 19 世纪英国人给南亚次大陆各种传统起的统称。它内部包括：

- **六大正统哲学**（*ṣaḍdarśana*）：数论、瑜伽、正理、胜论、弥曼差、吠檀多。
- **三大主神**：梵天（创造）、毗湿奴（维持）、湿婆（毁灭）。
- **无数的地方神、女神、以及「化身」（*avatāra*）**。
- **两条主要的神学路线**：**不二吠檀多**（Advaita，只有一个是真实的——梵，世界是幻象 *māyā*）与**有神论的吠檀多**（Viśiṣṭādvaita，神是真实的、世界是他的身体）。

**（二）印度教对基督教的三个批评。**

**批评一：道成肉身不是独一无二的。**
印度教有**化身**（*avatāra*）的概念：毗湿奴多次降世（鱼、龟、野猪、人狮、侏儒、罗摩、黑天……），目的是恢复达摩（*dharma*）。**所以「神成为人」在印度教听来不是新闻，而是常规。**

**基督教的回应**：化身是**反复的、周期性的、宇宙性的**；道成肉身是**一次的、历史性的、终末性的**（来 9:26「在这末世显现一次」）。化身的目的是「恢复秩序」，道成肉身的目的是「承担罪」。

**印度教的再回应**：那为什么只能有一次？如果神是无限的，他的显现为什么必须被限制在一个巴勒斯坦的木匠身上？

**批评二：基督教的排他性是暴力的根源。**
「除他以外，别无拯救」（徒 4:12）在一个有约 3.3 亿神明（印度传统说法是 *33 crore*，*crore* 为一千万，故为 3.3 亿）的传统里，听起来不是「真理」，而是「不容忍」。印度教内部有「**所有道路都通向山顶**」（*sarva-dharma-samanvaya*）的传统，以及现代的改革者（如辨喜 Vivekananda、甘地）明确主张宗教多元。

**基督教的回应**：多元主义本身也是一个排他性的主张（「所有宗教都同等有效」这个命题，排除了「只有一个宗教有效」这个可能）。而且印度教的宽容在实践中也有边界（历史上佛教在印度几乎消失、伊斯兰与印度教的长期冲突）。

**（附）先解释两个词，因为后面要反复用到。**

- **{{业}}**（*karma*）：梵文「行为」。每一个有意的行为都在宇宙中留下痕迹，并在今生或来世结果。**注意它是自动的、非位格的因果**——不需要一个审判者。
- **{{轮回}}**（*saṃsāra*）：众生依业力在六道中不断生死流转，没有起点，直到解脱（{{涅槃}}）。

**这两个词合起来，构成了印度教与佛教对「为什么有人受苦」的答案**：不是因为他犯了罪，而是因为他前世的行为。**这个答案有它的力量**（它解释了先天的不平等），**也有它的代价**（它容易把受害者说成「活该」——这正是种姓制度被合理化的一条思路）。

**批评三：「只有一个生命」使救恩变成赌博。**
印度教（与佛教）的框架是**轮回**（*saṃsāra*）：一个灵魂有无数次机会。基督教的框架是**一次生命、一次审判**（来 9:27）。在轮回的视角里，「一生决定永恒」是极不公正的。

**基督教的回应**：一次性的生命使**每一个当下的选择都有重量**；轮回则可能使「当下的不义」被稀释（反正还有下辈子）。

**印度教的再回应**：但一次性的生命使「出生在哪里」变成命运的彩票——这正是我们前面讲过的「地理偶然性」问题。

### 22.3 中国宗教的批判：天、道、祖先与报应

这是中文读者最需要的一节，因为它是**最贴近你生活的一套框架**，往往在你意识到之前就已经在影响你的判断。

**（一）儒家：道德不需要神。**

儒家不否认「天」，但它的重心是**人伦**：仁、义、礼、智、信；五伦（君臣、父子、夫妇、兄弟、朋友）；修身、齐家、治国、平天下。

**它对基督教的批评是「不需要」**：
- 人可以通过**学习与修养**成为君子（「人皆可以为尧舜」——孟子）。
- 道德的基础在**人心**（恻隐之心、羞恶之心），不在神的命令。
- 「未知生，焉知死」（论语·先进）——**先把此生做好，不必急着谈来世**。
- 「敬鬼神而远之」（论语·雍也）——不必否认鬼神，但不必依赖它们。

**基督教的典型回应**：「人皆可以为尧舜」在实践上从未实现；儒家的「修身」缺少一个**赦免**的机制——当你做不到时怎么办？

**儒家的再回应**：那正是「**过则勿惮改**」与「**改过迁善**」的意义。人不需要一个外部的代赎，需要的是**知耻与自省**。

:::why t="这一节为什么戳中要害"
因为儒家提出了一个基督教很难回答的问题：**如果一个人一生行善、孝顺父母、扶助乡邻，只是没有信耶稣，他凭什么要被定罪？**

基督教的传统答案（「因为全人类在亚当里都有罪」）在中文语境里几乎无法被听进去——因为它把一个**关系的、历史的**问题（亚当是谁？我跟他有什么关系？），说成了一个**法律的、遗传的**问题。

**这就是为什么「原罪」是基督教在华传播最难的教义**，比三位一体还难。三位一体只是「听不懂」，原罪是「听了不舒服」。
:::

**（二）道家：道不可言，何必道成肉身。**

道家（老子、庄子）的核心是**道**：「道可道，非常道」（老子·一章）；「道生一，一生二，二生三，三生万物」（四十二章）。

**它对基督教的批评**：
- **道是「无为」的**（「道常无为而无不为」，三十七章）——它不干预、不说教、不审判。
- **道不可被固定、不可被命名**——而基督教说「道成了肉身」，住在我们中间，有一个具体的名字（耶稣）。**在道家看来，这是把不可说的「道」缩小成了一个可以被指认的对象。**
- **「反者道之动」**（四十章）——道通过柔弱、退让、不争来运作。这与「神用大能审判世界」的形象相反。

**基督教的回应**：约翰福音 1:1 用 *logos*（道）来指基督，这个翻译让中文读者以为基督教在讲「老子的道」。**但两者是不同的**：希腊的 *logos* 是**理性的秩序**（可被言说、可被理解），老子的「道」是**不可言说的根源**。

**一个有意思的对照**：{{否定神学}} 说「神不是任何我们可以命名的东西」——这与「道可道，非常道」惊人地相似。**但基督教同时说「道成了肉身」**，这是道家不会说的。**分歧就在这一句上。**

**（三）民间信仰：报应、祖先与「灵验」。**

中国民间信仰的核心不是教义，而是**实践**：
- **报应**（「善有善报，恶有恶报」）——一个道德的宇宙秩序，不需要一个审判者。
- **祖先崇拜**——家族的连续性，死者在关系中被记念。
- **「灵验」**（*ling*）——神明的有效性由「是否应验」来检验（求雨得雨、求子得子）。

**它对基督教的批评**：
- **「不拜祖先就是不孝」**——这是明清以来「礼仪之争」的核心（见下）。
- **「信耶稣只是为了上天堂，太功利」**——而民间信仰的功利是**公开的、可检验的**（灵不灵），基督教的「永生」是**不可检验的**。
- **「一个神管不了所有事」**——民间信仰有分工（财神、土地、灶君、妈祖），一个全能的神在功能上反而「不方便」（不能只求财而不改行为）。

:::src t="礼仪之争（1610–1939）：一次真正的文化冲突"
这是基督教在华史上最重要的争议，也是「中国宗教如何看基督教」的活标本。

- **耶稣会**（利玛窦等）主张：祭祖与祭孔是**社会礼仪**，不是宗教崇拜，中国基督徒可以参加。
- **多明我会与方济各会**主张：这是**偶像崇拜**，必须禁止。
- **1704 年**，教宗克雷芒十一世禁止中国基督徒祭祖祭孔；**1715 年**重申。
- **1724 年**，雍正禁教。
- **1939 年**，教宗庇护十二世才正式允许中国天主教徒参加祭祖与祭孔（《众所周知》*Plane compertum*）。

**这场争论的代价**：两百多年的禁令，使天主教在中国失去了一次本土化的机会。**而它争的其实是一个更深的问题：基督教的边界在哪里？一个信徒可以保留多少本文化？**

**新教的类似问题**：19 世纪来华传教士同样禁止祭祖；今天多数华人教会仍然不参与祭祖，但在实践中发展出折中（如「追思礼拜」——用基督教仪式纪念先人，不烧香不跪拜）。
:::

### 22.4 其余传统：锡克教、耆那教、琐罗亚斯德教、巴哈伊

| 传统 | 规模 | 与基督教的关键分歧 |
|---|---|---|
| **锡克教**（Sikhism） | 约 2600 万 | 一神（*Ik Onkar*，「唯一的神」），但**否认神的化身与偶像**，也**否认种姓**；经典是《古鲁·格兰特·萨希卜》；强调**服务与平等**。批评：基督教的三位一体与道成肉身是「把神人格化」；而锡克教认为神可以通过**古鲁（导师）的教导**被认识，不需要一个救主。 |
| **耆那教**（Jainism） | 约 500 万 | 极端的**非暴力**（*ahiṃsā*）与**苦行**；宇宙是永恒的、无始的，**没有创造主**。批评：基督教的神「创造并毁灭世界」在耆那教看来是无必要的；而基督教的「正义战争」与「肉食」都违反非暴力。 |
| **琐罗亚斯德教**（Zoroastrianism） | 约 10–20 万 | 古老的波斯宗教，**善恶二元**（阿胡拉·马兹达 vs 安格拉·曼纽），**末日审判、身体复活、救主（Saoshyant）**。**它对犹太教与基督教的影响是学界长期争论的题目**（复活、末日、天使、二元论是否从波斯传入）。批评：基督教的三位一体破坏了「善神的单纯」；而二元论更诚实地解释了恶的来源。 |
| **巴哈伊**（Bahá'í） | 约 800 万 | 19 世纪由巴哈欧拉创立。主张**所有宗教同源**、**渐进启示**（每个时代有一位「显圣者」：亚伯拉罕、摩西、佛陀、琐罗亚斯德、耶稣、穆罕默德、巴孛、巴哈欧拉）、**人类一体**。批评：基督教的「唯一性」是把一个时代性的启示绝对化了；巴哈伊把耶稣放在**显圣者的序列**里，而不是终点。 |

### 22.5 一个总问题：基督教的「排他性」如何面对多元

把所有传统放在一起，它们对基督教有一个**共同的批评**：

> **你们把「一个特定历史中的事件」当成了「宇宙性的、唯一的、决定所有人命运的」真理。**

这个批评有几种形式：

- **佛教**：解脱不需要神，所以基督教的整个框架是**多余的**。
- **印度教**：神有无数次显现，所以那一次不是唯一的。
- **儒家**：道德不需要神，所以基督教的救恩是**不必要的**。
- **道家**：道不可言说，所以「道成肉身」是把无限缩小了。
- **巴哈伊**：启示是渐进的，所以基督教是**一个阶段**，不是终点。

**基督教的三种回应**（以及它们各自的代价）：

| 回应 | 内容 | 代价 |
|---|---|---|
| **排他论** | 只有基督是道路（约 14:6；徒 4:12） | 全球三分之二的人（约 50 亿）因此处于「未得救」状态；这与「神爱世人」的直觉冲突 |
| **包容论** | 基督是唯一的救主，但救恩可以及于「不知道的人」（「匿名基督徒」卡尔·拉纳；梵二《教会宪章》16） | 那传教还有什么意义？「匿名基督徒」是不是把别人偷偷算成了自己人？ |
| **多元论** | 所有宗教都是通向同一终极的不同路径（约翰·希克） | 它取消了所有宗教的自我理解（佛教不认为自己在通向上帝），而且它本身也是一个排他性的真理主张 |

:::pit t="一个诚实的判断"
**这三种回应都不完美。**

- 排他论在逻辑上最一致，但在道德直觉上最难接受。
- 包容论在牧养上最温和，但它在逻辑上是一个**补丁**（它需要解释「为什么有些人可以通过别的途径得救，而另一些人不行」）。
- 多元论在情感上最宽容，但它在学术上最站不住（它把不同宗教的核心主张都改写成「同一个东西的不同表达」，而这些宗教自己会拒绝这个改写）。

**本书不给答案。** 但要指出一个关键的事实：**这个问题的形状，与第 20 章「宗教多样性与地理偶然性」是同一个问题。** 无神论者用它来否定神的存在；其他宗教用它来质疑基督教的排他性。**而两者都指向同一个痛点：为什么真理的分配看起来像地理的彩票？**
:::

### 22.6 反向：基督教对其他宗教的批评

为了平衡，也必须列出基督教（尤其传统立场）对其他宗教的批评，以及这些批评是否成立：

| 对…的批评 | 内容 | 是否成立 |
|---|---|---|
| **佛教** | 「无我」与「轮回」矛盾：如果没有一个连续的自我，什么在轮回？ | **部分成立**：佛教内部为此争论了两千年（说一切有部的「补特伽罗」、犊子部的「不可说补特伽罗」、以及后来的唯识学），至今没有统一答案。但佛教有自己的解答（相续的识流，不需一个实体）。 |
| **印度教** | 轮回与种姓制度：如果一个人的低种姓是前世业力的果报，那么社会不义就被神圣化了 | **历史上成立**：种姓制度确实被业报论合理化过。但现代印度教改革者（如安贝德卡）明确反对这个用法，且印度宪法废除种姓歧视。 |
| **儒家** | 缺少「超越者」，所以无法批判现存的权力秩序 | **部分成立**：儒家确实更强调「和谐」而非「先知式的批判」。但「天」与「天命」在孟子那里是高于君主的（「民为贵，社稷次之，君为轻」）。 |
| **道家** | 相对主义与逃避：「齐物论」是否取消了所有道德判断？ | **部分成立**：庄子的相对主义确实难以支撑道德批判。但道家也有「天之道，损有余而补不足」的社会批判（老子·七十七章）。 |
| **民间信仰** | 功利主义与多神论：把神当成交易对象 | **成立**：但这也正是基督教在民间传播时的**实际竞争点**——人们求的是「灵验」，而基督教的「永生」在短期是不可检验的。**这既是基督教的弱点，也是它拒绝被功利化的地方。** |

:::note
**这一节的意义**：显示「批判」不是单向的。**每一个传统都有自己的盲点，而它们互相揭示对方的盲点。** 这不是相对主义（不是「大家都对」），而是说：**没有任何一个传统是从一个绝对中立的观察点看世界的。**
:::

### 22.7 常见误解

:::pit t="关于「其他宗教」的四个误解"
**误解一：「所有宗教都教人向善，所以本质上一样」。**
这是最常见的、也最不准确的说法。佛教不设创造主，基督教以道成肉身为中心，儒家不谈救恩，印度教有轮回——**它们对「人是什么」「问题是什么」「解法是什么」的回答完全不同。** 「都教人向善」只是把它们共同的社会功能抽出来，忽略了它们的核心主张。

**误解二：「佛教是无神论，所以和基督教是天然盟友」。**
佛教不否认神，只否认创造主。而且佛教的核心（苦、无我、涅槃）与基督教的核心（罪、位格、复活）几乎没有交集。**它们在某些伦理立场上可以合作（非暴力、慈悲、简朴），但在神学上并不亲近。**

**误解三：「中国人信的是儒释道三教合一」。**
「三教合一」是明清以后的一种**调和主义**（尤其在民间信仰层面），但它不是三个传统的自我理解。**一个儒者、一个僧人、一个道士，对「三教合一」的理解完全不同。** 把它当作「中国人的宗教」，会掩盖真实的分歧。

**误解四：「基督教的排他性在亚洲必然失败」。**
反例很多：韩国（基督教约占人口 28%，其中新教约 20%）、菲律宾（天主教约 80%）、中国（基督徒数千万）、印度（基督徒约 3000 万）。**排他性并没有阻止传播，反而常常是传播的动力之一**（一个「真的」的宗教，比一个「都行」的宗教更有吸引力）。**但这不证明它是对的，只证明它有效。**
:::

:::titre
**下一章：世俗主义与后基督教处境（第 23 章）**

最后一种批判不是「神不存在」，也不是「你们的神错了」，而是「神不重要」。世俗主义说：宗教可以存在，但它应当退回私人领域；公共生活应当按世俗的理性来组织。**这是当代西欧与部分东亚的现实**，也是基督教在 21 世纪最根本的处境。
:::

## 第 23 章：世俗主义与后基督教处境 {#ch-23}

### 23.0 最后一种批判：不是「神不存在」，而是「神不重要」

前面三种批判都还认真对待神：犹太教说「你们认错了弥赛亚」，伊斯兰教说「你们亵渎了独一」，无神论说「根本没有神」。

**世俗主义的批判不一样。它说：这个问题不重要。**

- 你可以信神，但请**不要在公共场合谈**。
- 你的信仰可以是你的「私人爱好」，但**不能成为公共政策的依据**。
- 教会的意见，在立法、教育、医疗、科研上，**没有特殊地位**。

**这个立场不需要论证「神不存在」，它只需要把宗教从公共领域挪走。** 而这恰恰是当代西欧与部分东亚的现实。

:::why t="为什么这是最深的一种批判"
因为前三种批判都还承认「宗教是一个需要回答的问题」。世俗主义把问题**取消**了。

一个基督徒可以回答无神论者（用论证）、可以回答穆斯林（用解经）、可以回答犹太人（用历史）。但当一个社会说「你的信仰是你的私事，请不要用它来影响公共决策」时，**基督徒能说什么？**

- 说「我的信仰是真的」？对方会说：「很好，那是你的私人意见。」
- 说「神要求社会公义」？对方会说：「那你可以用世俗的理由来论证社会公义。」
- 说「人需要神」？对方会说：「那是你的需要，不是我的。」

**这就是「后基督教」（post-Christian）处境的核心：不是基督教被驳倒，而是它被**边缘化**。**
:::

### 23.1 「世俗化」的三种含义

「世俗化」这个词至少有三个意思，混在一起讨论会完全跑偏：

| 含义 | 内容 | 是否发生 |
|---|---|---|
| **1. 宗教的衰退**（decline） | 信教的人变少，教会出席率下降，宗教的影响力减弱 | **在西欧发生，在美国部分发生，在全球没有发生** |
| **2. 宗教的私人化**（privatization） | 宗教从公共领域退到私人领域；它不再是社会的黏合剂 | **在多数发达国家发生** |
| **3. 制度的分化**（differentiation） | 社会的各个领域（政治、经济、科学、教育、医疗）脱离宗教的控制，按自己的规则运作 | **几乎在所有现代化社会发生，包括宗教很兴旺的社会** |

:::note
**第三个含义是最重要的，也是最不可逆的。**

即使一个社会很宗教（如美国、波兰、韩国、尼日利亚），它的**医院、大学、银行、法院、实验室**也是按世俗的规则运作的。一个医生不会因为病人的信仰而改变治疗方案；一个银行不会因为教义而拒绝贷款；一个物理学家不会引用圣经来解释引力。

**这就是「制度的分化」**：宗教可以很兴旺，但它不再是**社会的组织原则**。**这才是「世俗化」的真正含义**——不是「人不再信神」，而是「神不再是社会运转的轴心」。
:::

### 23.2 世俗化理论的兴衰

**（一）经典理论（1950–60 年代）。**
社会学家（韦伯、涂尔干、以及 1960 年代的世俗化理论家如彼得·伯格 Peter Berger、布莱恩·威尔逊 Bryan Wilson）普遍认为：**现代化必然导致宗教衰退**。理由：

- 理性化：世界被「祛魅」（*Entzauberung*），不再有神秘力量。
- 分化：宗教被赶出各个社会领域。
- 多元化：多种宗教并存，使任何一个都失去「理所当然」的地位。
- 安全感：现代福利国家取代了宗教的「保护功能」。

**（二）理论的崩塌（1980–90 年代）。**
三个事实摧毁了这个理论：

1. **美国的例外**：美国是**最现代化**的国家之一，同时也是**宗教参与率最高**的发达国家之一（1960 年代约 40% 每周上教堂，今天约 30%，仍远高于西欧的 5–10%）。
2. **全球南方的宗教复兴**：拉美的五旬节运动、非洲的基督教与伊斯兰教复兴、中东的伊斯兰革命（1979 伊朗）——**这些地区的现代化没有带来世俗化**。
3. **西欧的「例外」**：西欧的宗教衰退，可能不是「现代化」的结果，而是**西欧特有的历史**（国家教会、两次世界大战、福利国家）的结果。

**（三）伯格的自我修正。**
**彼得·伯格**是世俗化理论的主要提出者之一，也是最早公开修正它的人。他在 1999 年的《世界的祛魅》（*The Desecularization of the World*）中写道：

> 「现代世界的一个核心特征，是它**不是**世俗化的。除了几个例外（西欧、以及国际化的知识精英），世界仍然像从前一样宗教，有些地方甚至比从前更宗教。」

**（四）卡萨诺瓦与泰勒。**
- **何塞·卡萨诺瓦**（José Casanova）《现代世界的公共宗教》（1994）：宗教没有衰退，而是**从「私人化」转向「公共化」**——它在公共领域以新的形式出现（政治运动、身份认同、社会服务）。
- **查尔斯·泰勒**（Charles Taylor）《世俗时代》（2007）：世俗化不是「信仰的消失」，而是「**信仰的条件**变了」——今天我们生活在「**可选择**」的世界里，信仰不再是默认的，而是**一个选项**。他称之为「**自足的世俗性**」（*immanent frame*）。

:::why t="泰勒的「自足的内在框架」为什么是最精微的分析"
泰勒说：在中世纪，人**不可能**不信神——因为整个社会、宇宙观、日常语言都以神为中心。不信神不是一个「选项」，而是一个不可想象的状态。

今天，即使一个人信神，他也知道**别人可以不信**，而且那个「不信」是一个**合理的、有尊严的、可以理解的生活**。这就是「自足的内在框架」：**世界可以不需要神来解释，而且这样活得很好。**

**这不是「论证的胜利」，而是「想象力的转变」**：我们不再需要一个「超越者」来解释任何事情。**这是世俗化最深的一层，也是最难逆转的一层。**
:::

### 23.3 三个世界的对比

| | **西欧** | **美国** | **全球南方** |
|---|---|---|---|
| 教会出席率 | 5–10%（英国、法国、德国、北欧更低） | 约 30%（近年下降） | 很高（非洲、拉美、东南亚） |
| 宗教在公共生活 | 边缘化 | 高度政治化（宗教右派、福音派投票集团） | 核心（政治、教育、医疗） |
| 主要趋势 | 持续衰退、「无宗教归属」增长 | 极化（虔诚者更虔诚，无宗教者更多） | 快速增长（五旬节派、独立教会） |
| 「后基督教」 | 已是现实 | 正在争论 | 不是议题 |

:::pit t="一个必须避免的误判"
**「西方教会衰退 → 全球基督教衰退」是错的。**

- 欧洲的教会出席率在下降，但**非洲、亚洲、拉美的教会在增长**。
- 全球基督徒人数从 1900 年的 5.5 亿增长到 2020 年的 24 亿。
- **基督教的中心已经从欧洲移到全球南方。**

**但另一面也成立**：「全球南方在增长」**不能安慰欧洲的教会**——因为增长的教会与衰退的教会，在神学、礼仪、伦理上的差异极大。**「基督教在增长」与「我们认识的基督教在消失」，可以同时为真。**
:::

### 23.4 「无宗教归属者」：当代最重要的宗教现象

**（一）数据。**
「无宗教归属者」（*nones*，指回答「无宗教信仰」的人）在全球快速增长：

- 美国：从 1970 年代的约 5% 增长到 2020 年代的约 28–30%（Pew Research）。
- 西欧：英国约 50%，法国约 40%，北欧更高。
- 全球：约 16%（约 12 亿人）。

**（二）他们不是一种人。**
研究（如 Pew 的分类）显示，「无宗教归属者」至少分三类：

| 类型 | 特征 | 比例（美国） |
|---|---|---|
| **「无神论者/不可知论者」** | 明确不信神，或认为无法知道 | 约 1/3 |
| **「什么都不信」**（nothing in particular） | 不参与宗教，但相信某种更高的力量、或灵魂、或「能量」 | 约 2/3 |
| **「文化上的基督徒」** | 不去教会，但认同基督教的价值观与文化身份 | 一部分 |

**（三）为什么他们在增长。**
- **政治的反弹**：美国宗教右派的政治化，使许多年轻人（尤其千禧一代）把「宗教」与「保守政治」等同，因此离开。
- **代际传递的断裂**：不参加宗教活动的父母，其子女更可能不参加。
- **网络与选择**：不再需要「加入一个教会」才能获得社群与意义。
- **丑闻**：性侵、财务腐败、权力滥用（尤其天主教会的性侵危机）。

:::why t="「无宗教归属者」的崛起，比「无神论」更重要"
因为**无神论是一个论证，而「无宗教归属」是一个生活方式**。

一个人可以相信神，但仍然不参加任何教会（「相信但不归属」，*believing without belonging*）。一个人可以不信神，但仍然过一种「基督教式」的道德生活（诚实、慈善、家庭）。

**这意味着：基督教的挑战不再是「证明神存在」，而是「证明共同体是必要的」。** 一个可以独自在网上听讲道、看灵修视频、读圣经 App 的人，为什么还需要教会？

**这个问题，可能是 21 世纪教会最需要回答的问题。** 而目前的答案（「教会是基督的身体」「不可停止聚会」）对已经离开的人没有说服力——**因为他们不是在争论教义，他们是在选择生活方式。**
:::

### 23.5 世俗国家的三种模式

「政教分离」不是一个单一的模式。至少有三种：

| 模式 | 代表 | 内容 | 基督教的位置 |
|---|---|---|---|
| **严格分离**（*laïcité*） | 法国（1905 年政教分离法） | 国家在宗教上完全中立；公共领域不得有宗教标志（2004 年禁止公立学校戴头巾/十字架）；宗教退到私人领域 | 基督教被视为「众多传统之一」，没有特殊地位 |
| **自由行使**（free exercise） | 美国（宪法第一修正案） | 国家不建立宗教，但保障宗教的自由行使；宗教在公共领域活跃 | 基督教是公共生活的重要力量（但也必须与其他宗教平等） |
| **合作模式**（cooperation） | 德国、意大利、西班牙 | 国家与教会合作（征收教会税、宗教教育在学校、教会办医院与学校） | 基督教有制度性的地位（但与其他宗教有不同程度的协议） |

:::note
**中国的模式是第四种**：「**宗教事务管理**」——宗教团体必须登记、接受政府指导、在指定场所活动；宗教不得干预教育、司法、婚姻；对未成年人参加宗教活动有严格限制（2018 年《宗教事务条例》）。**这不是「世俗主义」意义上的政教分离，而是「国家对宗教的行政管理」。**

这个模式与法国的 *laïcité* 有相似之处（都限制宗教在公共领域），但目标不同：法国是为了「国家中立」，中国是为了「社会秩序与国家安全」。
:::

### 23.6 基督教对世俗主义的回应

**（一）接受分化，但拒绝私人化。**
梵二《论教会在现代世界》（*Gaudium et Spes*，1965）的立场是：教会承认「**世界的事有它自己的规律**」（科学、经济、政治有各自的自主性），但教会仍然要**对世界说话**——关于人的尊严、社会公义、和平、以及生命的意义。

**（二）公共神学（Public Theology）。**
当代神学家（如马丁·马蒂、于尔根·莫尔特曼、以及美国的 Stanley Hauerwas、Oliver O'Donovan）主张：基督教应当**用公共可理解的语言**参与公共讨论——不是要求别人接受圣经的权威，而是用「人的尊严」「公义」「共同善」这些所有人都能理解的概念来论证。

**（三）激进正统（Radical Orthodoxy）。**
约翰·密尔班克（John Milbank）等人主张：**世俗主义本身是一个神学产物**——「世俗」这个领域是基督教（尤其奥卡姆的唯名论）的发明；因此神学不需要向世俗理性低头，它可以**质疑世俗理性本身的前提**。

**（四）后世俗（post-secular）。**
哈贝马斯（Jürgen Habermas）在 2000 年代提出：世俗国家应当允许宗教语言进入公共讨论，因为**宗教可以提供世俗理性无法提供的「意义资源」**（如对弱者的团结、对生命的敬畏）。**这是世俗主义者对宗教的一次重要让步。**

### 23.7 「后基督教」意味着什么

「后基督教」（post-Christian）不是「反基督教」，而是「**基督教不再是默认的文化背景**」。

| 领域 | 前基督教/基督教社会 | 后基督教社会 |
|---|---|---|
| 日历 | 主日、圣诞节、复活节是公共节奏 | 商业化的节日，宗教含义淡化 |
| 道德 | 基督教道德是默认 | 多元道德（世俗人权、功利主义、德性伦理并存） |
| 语言 | 圣经典故是公共语言 | 圣经典故不再被理解（「好撒玛利亚人」「浪子回头」需要解释） |
| 教育 | 宗教教育是核心 | 宗教被移出核心课程 |
| 死亡 | 教会主持葬礼 | 世俗葬礼、临终关怀、安乐死辩论 |
| 意义 | 神是意义的来源 | 意义是个人建构的 |

:::why t="后基督教处境下，基督教还剩下什么"
**它剩下的，恰恰是它最初的东西**：一个自愿的、少数派的、与主流文化有张力的共同体。

这在历史上不是新情况：**基督教前 300 年就是这样的**（罗马帝国的一个小群体，被误解、被迫害、被嘲笑）。而它在那 300 年里增长最快。

**这带来一个悖论式的可能**：基督教的衰退（在西欧）可能使它**更接近它自己的起源**——一个没有政治权力、没有文化优势、只能靠共同体生活与爱来见证的群体。**许多当代神学家（如侯活士 Stanley Hauerwas）认为，这才是教会应有的样子。**

**但这也带来一个真实的风险**：一个失去文化土壤的宗教，可能不是「更纯洁」，而是「更边缘、更无关、更难以传递给下一代」。**两种可能都存在，而历史还没有给出答案。**
:::

### 23.8 争议与反驳

#### 22.8.1 世俗主义对基督教的批评

- **「宗教应当退回私人领域。」** 公共政策应当基于所有人都能接受的世俗理由，而不是某个宗教的教义。
- **「宗教的道德立场是压迫性的。」** 反对同性婚姻、反对堕胎、反对安乐死——这些立场把宗教的道德强加给不信的人。
- **「宗教教育是对儿童的思想灌输。」** 把小孩标签为「某某教徒的孩子」，是剥夺他们的选择权。

#### 22.8.2 基督教对世俗主义的批评

- **「世俗主义本身是一个信仰。」** 它预设了「只有可被科学检验的东西是真的」「个人自主是最高的善」——这些都不是科学结论，而是哲学立场。
- **「世俗主义无法提供意义。」** 它可以解释「如何」，不能回答「为什么」。一个纯世俗的社会，如何面对死亡、苦难、以及「为什么要有下一代」？
- **「世俗主义的历史充满了暴力。」** 20 世纪的世俗意识形态（纳粹、斯大林主义）造成的死亡，远超宗教战争。
- **「中立是不可能的。」** 任何公共政策都预设了某种关于人的理解（人是自主的个体？是社群的成员？是有尊严的受造物？）。**「世俗中立」只是把某一种理解当作默认。**

#### 22.8.3 一个诚实的评估

**双方都有真实的论点，也都有盲点。**

- 世俗主义正确地指出了宗教权力的危险（宗教裁判所、宗教战争、神权政治）。
- 基督教正确地指出了世俗主义的虚空（意义、死亡、共同体）与它的隐性形而上学。

**而最重要的一个事实是**：**这两者都无法消灭对方。** 宗教没有随着现代化而消失（伯格错了），世俗主义也没有因为宗教复兴而退却（西欧仍在世俗化）。

**所以我们面对的不是一个「谁赢」的问题，而是一个「如何共存」的问题。** 而这个问题的答案，可能比任何教义争论都更迫切。

## 争论的温度计：第六部 {#part6-thermometer}

前面五部的温度计，测的是「基督教内部哪根神经被碰到了」。这一部测的是**另一个东西**：外部批判击中在哪里，而基督教的回应是否站得住。

| 核心质疑 | 提出者 | 最强的形式 | 基督教的回应 | 回应的成色 |
|---|---|---|---|---|
| **弥赛亚的指标没有满足** | 犹太教 | 圣殿未重建、流亡者未归回、普世和平未到——「两次降临」是事后构造 | 以赛亚书 53 的受苦仆人；但以理书 7 章的人子；弥赛亚 ben 约瑟的受苦传统 | **未定论**：双方都在等（基督教等第二次来，犹太教等第一次来），从外面看是对称的 |
| **律法被取消了** | 犹太教 | 圣经说律法是「永远的定例」；耶稣自己守律法；保罗在罗马书 3–7 章自相矛盾 | 「成全」不等于「废除」（太 5:17）；耶利米书 31 章的新约；希伯来书的献祭论 | **部分成立**：基督教的「礼仪/道德」二分没有圣经依据，是后世的构造 |
| **三位一体是 shirk** | 伊斯兰教 | 真主的绝对单纯（*tanzih*）不容许任何「位格」的复数性 | 三位一体不是三个神；「受生」不是生理生育；古兰经 5:116 针对的是异端 | **未定论**：双方对「神能不能复杂」有不可通约的前提 |
| **道成肉身不可能** | 伊斯兰教 | 成为人意味着变化与缺乏，二者都与超越的神冲突 | 「取了人性而神性不变」；「神不能受苦」是希腊前提，不是圣经前提 | **较弱**：这个回应依赖 *ousia/hypostasis* 的区分，而这个区分本身是希腊的 |
| **十字架没有发生** | 伊斯兰教 | 古兰经 4:157：「他们没有杀死他，也没有把他钉死在十字架上」 | 塔西佗、约瑟夫斯、塔木德的史料；幻影说在 2 世纪已被判为异端 | **十字架事件成立，复活不可证**：史料证明他被处死，不证明他复活 |
| **恶与全能全善不相容** | 无神论 | 逻辑版（麦基）：恶与神在逻辑上不相容 | 自由意志辩护（普兰丁格）：一个有自由的世界比没有更有价值，而神不能既给自由又保证不犯罪 | **逻辑版基本成功**；但**证据版（罗威）未被解决** |
| **恶的数量构成反证** | 无神论 | 一只小鹿在森林火灾中烧三天才死——什么善能抵得上这个？ | 灵魂塑造（希克）／怀疑论有神论（威克斯特拉）／更大的善 | **无共识**：大屠杀之后，「神义论」在犹太思想中本身变得可疑 |
| **神为什么隐藏自己** | 无神论（希尔伦伯格） | 一个完全爱人的神应当使所有真诚寻求者都能认识他；但有许多「非抵抗的怀疑者」 | 认识论后果／人的抗拒／基督作为启示 | **最强的批判**：它不需要「恶」这个概念，只需「爱」；回应大多依赖「我们不知道神的理由」 |
| **教义自相矛盾** | 无神论 | 1+1+1=3；一个位格如何既全知又有限 | 「本质」与「位格」不同类项，不能相加；属性相通的区分 | **算术层面成功，意义层面开放**：不可理解 vs 无意义，界线不清 |
| **宗教取决于出生地** | 无神论 / 多元主义 | 一个人的永恒命运取决于他出生在哪里 | 排他论／包容论（匿名基督徒）／多元论 | **三种回应都不完美**：排他论逻辑一致但道德直觉难接受；包容论是补丁；多元论取消了各宗教的自我理解 |
| **圣经的道德问题** | 无神论 / 世俗主义 | 出 21:20–21 的奴仆；申 20:16–18 的灭绝令；诗 137:9 的婴孩 | 渐进启示／文化处境／「经文的中心」／「这是人的话」 | **部分成立**：多数辩护只能做到部分解释，不能完全开脱 |
| **信仰是投射** | 费尔巴哈 / 弗洛伊德 | 神是人的理想化或父亲形象的投射 | 起源谬误：信念的心理起源不决定其真假；且投射论无法解释「反人性」的神 | **不构成反驳，但构成诊断**：许多人的「神」确实是投射 |
| **宗教是鸦片** | 马克思 | 宗教缓解痛苦，却掩盖了痛苦的社会原因 | 宗教也是废奴、民权、解放神学的源泉 | **历史上部分成立**：教会与权力的结盟是模式，不是例外 |
| **基督教道德是怨恨** | 尼采 | 「爱」与「谦卑」是无力的报复被重新命名 | 耶稣不是怨恨的形象（尼采自己承认「只有一个基督徒，他死在十字架上」） | **对信徒的良心有效，对论证无效** |
| **解脱不需要神** | 佛教 | 苦的根源是贪爱与无明，解法是八正道——神是多余的 | 基督教也强调生命改变；但核心是「基督替我承担」 | **框架冲突**：代赎 vs 自证，是两条相反的路 |
| **那一次不是唯一的** | 印度教 | 神有无数次化身（*avatāra*），为什么这一次是决定性的？ | 化身是反复的、宇宙的；道成肉身是一次性的、终末的 | **未定论**：取决于你接受哪种时间观（循环 vs 一次性） |
| **道德不需要神** | 儒家 | 人皆可以为尧舜；未知生焉知死；过则勿惮改 | 「人皆可以为尧舜」在实践上从未实现；儒家缺少赦免机制 | **最戳中要害**：它提出了「一生行善的人凭什么被定罪」，而「原罪」的答案在中文语境里几乎听不进去 |
| **道不可言，何必成肉身** | 道家 | 道可道非常道；道常无为 | 否定神学与「道可道非常道」惊人相似——但基督教同时说「道成了肉身」 | **分歧就在这一句上**：这是把无限缩小，还是无限自愿进入有限？ |
| **神不重要** | 世俗主义 | 宗教可以存在，但应退回私人领域；公共政策须基于世俗理由 | 制度的分化是不可避免的，但「私人化」不等于「无关」；公共神学用可理解的语言参与 | **最难回应**：它不否认神，只是把问题取消 |
| **真理看起来像地理彩票** | 以上全部 | 出生地决定信仰，信仰决定命运 | 三种回应（见上） | **共同痛点**：这是所有外部批判的交汇处 |

:::why t="第六部的温度计与前面五部有什么不同"
前面五部的每一行，都是「两派基督徒在争同一件事」。这一部的每一行，都是「外面的人在问：你们凭什么」。

**而最值得注意的一列是「回应的成色」**——本书在这里第一次给评估，因为不评估就等于假装所有回应一样强。

评估的结果是：
- **逻辑层面，基督教基本站得住**（恶的逻辑版、三位一体的算术版、起源谬误）。
- **经验与道德层面，基督教有真实的重担**（恶的数量、神的隐晦、圣经的道德、地理偶然性）。
- **框架层面，无法对话**（佛教的苦、儒家的修身、世俗主义的「不重要」）——因为双方连「什么问题值得问」都不同。

**这就是本书最终想说的**：基督教不是不理性的，但它需要承担一些真实的重担；而它与外部世界的冲突，有一半不是论证的冲突，而是**问题设定的冲突**。
:::

## 附录一：两大主干教会速查 {#appendix-mainline}

前面二十三章按「分裂」组织，所以两大主干（天主教与东正教）反而没有一个集中的卡片。这个附录补上。**读法**：把它们当作「基准线」——书里所有其他派别，都是相对于这两条线（或相对于新教）来定位的。{{天主教}}与{{东正教}}的分裂，是全书唯一一次「两个主干各自带走一半」的分裂。

> [[k:天主教 | en:Catholic Church | 1 世纪至今 | 主干教会 | 现存约 13.9 亿]]
> **主张**：（1）**教宗首席权**——罗马主教是彼得的继承人，对普世教会拥有直接、普遍、最高的管辖权；（2）**教宗不可错误**（1870 年定义，仅限 *ex cathedra* 的信仰与道德定义）；（3）**七件圣礼**（洗礼、坚振、圣体、告解、终傅、圣秩、婚配）；（4）**变体论**——圣餐中饼酒的实体变为基督的身体与血；（5）**炼狱**与**圣徒相通**（为亡者祈祷、敬礼圣徒、圣髑、圣像）；（6）**圣经与传统**并列为启示的来源（1546 年特伦托会议）；（7）**马利亚**的四条信理：生神者（431）、终身童贞、无原罪（1854）、升天（1950）。
> **来历**：彼得与保罗在罗马的殉道 → 罗马主教在早期教会中的荣誉首位 → 11 世纪东西方分裂 → 中世纪教宗革命（1075）→ 特伦托会议（1545–1563，对宗教改革的系统回应）→ 梵一（1870，教宗不可错误）→ 梵二（1962–1965，礼仪本地化、宗教自由、对犹太教与伊斯兰教的正面表述）。
> **要解决的问题**：**「谁是教会最终的裁判者？」** 天主教的答案是：教宗。这个答案给了它极强的统一性（一个教义、一个圣统、一个法典），也给了它极强的可批评性（权力集中、性侵危机中的问责失灵）。
> **论敌**：东正教（首席权）、东方正统教会（迦克墩）、新教（称义、圣礼、教宗）、世俗主义（公共领域的角色）。
> **所受反驳**：（1）教宗首席权在古代教会没有依据（前七个大公会议里罗马是「第一个」，不是「唯一的裁判」）；（2）「教宗不可错误」是 1870 年的发明；（3）炼狱与赎罪券把救恩变成会计；（4）性侵危机的处理暴露了圣统制的结构性失灵；（5）女性按立与性伦理的立场被现代人权话语批评。
> **结局 / 现状**：全球约 13.9 亿，是最大的基督教共同体。**它的内部张力**：传统派（SSPX、以及部分非洲与亚洲主教）vs 改革派（德国「 Synodaler Weg」、亚马逊会议）；拉美与非洲的快速增长 vs 欧洲的急剧衰退。**2013 年本笃十六世主动退位**，是 600 年来第一次。

> [[k:东正教 | en:Eastern Orthodoxy | 1054 至今 | 主干教会 | 现存约 2.2 亿]]
> **主张**：（1）**共融的教会论**——每个地方教会（以主教为首）是完整的教会，彼此在信仰、圣礼、爱德中共融；罗马主教在**荣誉**上居首（*primus inter pares*），但无普遍管辖权；（2）**{{众议}}**（*symphonia*）——教会与国家协作，各在自己的领域；（3）**七次大公会议**是最高权威；（4）**{{神化}}**（*theōsis*）是救恩的目标；（5）**{{圣像敬礼}}**（787 年第二次尼西亚会议）；（6）**{{帕拉马斯}}**的「本质—能量」区分（1351）；（7）**{{和子句}}**拒绝接受。
> **来历**：1054 年与罗马分裂；1453 年拜占庭灭亡后重心北移莫斯科（「第三罗马」）；1589 年莫斯科设牧首区；1721 年彼得大帝设圣议会（国家控制）；1917 年后苏联迫害；1988 年受洗一千周年复兴。
> **要解决的问题**：**「教会如何在没有一个元首的情况下保持合一？」** 答案是：共融 + 大公会议 + 共同的礼仪与传统。**代价**：难以做统一决策；按民族分裂成十几个自主教会。
> **论敌**：天主教（首席权、和子句、炼狱、无原罪）、东方正统教会（迦克墩）、新教（圣礼、传统）、世俗主义。
> **所受反驳**：（1）没有元首的共融在实践中碎成民族主义（2016 年克里特会议有四个教会拒绝参加）；（2）「不变」被批评为把「习惯」当成「信仰」（旧礼仪派的分裂就是反例）；（3）国家教会传统在威权政权下容易变成附庸。
> **结局 / 现状**：全球约 2.2 亿。**最大的教会是俄罗斯正教会**（约 1 亿），但君士坦丁堡普世牧首仍保有荣誉首席。**2018 年乌克兰教会获得自主权**，导致俄罗斯与君士坦丁堡事实上的分裂（至今未修复）——这是 1054 年以来东正教内部最严重的一次裂痕。

:::note
**为什么这两张卡片放在最后**：因为「天主教」与「东正教」不是「一个派别」，而是**两条主干**。本书前二十三章讲的每一次分裂，都是从这两条主干（或者从它们共同的前身）上分出去的。**先读分裂，再回头看主干，会更容易理解「正统」是怎么被定义的。**
:::

## 附录二：容易漏掉的派别补遗 {#appendix-others}

「尽可能所有派别」是一个无法完成的目标——据 World Christian Encyclopedia 的统计，全球有数万个基督教宗派。这个附录补上几个**在前二十三章里没有独立成节、但在历史上很重要**的群体。

### 一、{{詹森主义}}（Jansenism，17–18 世纪，天主教内部）

- **主张**：奥古斯丁式的恩典论——人完全无能，恩典不可抗拒；只有被预定的人才能行真正的善；频繁领圣餐需要极高的道德准备。
- **来历**：得名于荷兰神学家**詹森**（Cornelius Jansen，1585–1638）的遗著《奥古斯丁》（1640）；中心是巴黎郊外的**皇港修道院**（Port-Royal）；帕斯卡的《致外省人信札》（1656–57）为它辩护，是法国文学的经典。
- **要解决的问题**：**天主教在 16 世纪特伦托会议之后，是否过度倒向了「人的合作」，从而失去了奥古斯丁的恩典论？** 詹森主义认为：是的。
- **论敌**：耶稣会（他们主张更宽和的道德神学与圣餐实践）、教宗（1653 年《机会主义》通谕、1713 年《独生子》通谕谴责）。
- **所受反驳**：（1）它的恩典论在实践中导致「只有极少数人能领圣餐」的严苛（「频繁领圣餐」之争）；（2）它被指为加尔文主义的伪装；（3）它对教会权威的抵抗（「沉默服从」*silence respectueux* 的策略）被视为不服从。
- **结局 / 现状**：1713 年后被镇压，皇港修道院 1709 年被拆毁。**但它的影响深远**：帕斯卡、拉辛、以及法国天主教的反现代主义气质；「詹森主义」在今天的法语里仍指一种严苛的道德主义。

### 二、{{普救论}}（Universalism，2 世纪至今）

- **主张**：所有灵魂最终都会得救（*apokatastasis*，万物复原）；地狱不是永恒的，而是**炼净的**；神的爱最终会胜过一切抗拒。
- **来历**：**奥利金**（约 185–254）是最早系统提出者（《论首要原理》）；19 世纪美国的**霍普金斯**（Hosea Ballou）与**普世教会**（Universalist Church，1793 年成立）把它变成一场运动；20 世纪**卡尔·巴特**（《教会教义学》中「神的恩典终将得胜」）与**汉斯·乌尔斯·冯·巴尔塔萨**（《我们敢希望什么》）以更谨慎的方式重提。
- **要解决的问题**：**如果神是全善全能的，永恒的地狱怎么可能存在？** 这与「恶的问题」同构，但方向相反：不是「恶的存在否证神」，而是「永刑的存在否证神的爱」。
- **论敌**：主流教会（奥利金主义在 553 年被谴责；奥古斯丁主张永刑；宗教改革后的信条大多明确肯定永刑）。
- **所受反驳**：（1）圣经明确说「永刑」（太 25:46）、「不灭的火」（可 9:48）；「永」的希腊文 *aiōnios* 是否可以理解为「一个时代」，是核心争点；（2）若人人最终得救，则传福音与悔改的紧迫性被削弱；（3）它似乎取消了人的自由（神「强迫」所有人得救）。
- **结局 / 现状**：作为一个宗派，普世教会 1961 年与一位论派合并为「一位论普世教会」。**但作为一种神学立场，它在 21 世纪迅速增长**——从巴特到「基督教普救论」的当代复兴（David Bentley Hart 的《一切都会好起来》，2019），越来越多的神学家公开持此立场。

### 三、{{普利茅斯弟兄会}}与{{时代论}}（1830s 至今）

- **主张**：**普利茅斯弟兄会**（Plymouth Brethren）——拒绝宗派、拒绝神职、每周擘饼纪念主；以**达秘**（John Nelson Darby，1800–1882）为核心。**时代论**（Dispensationalism）——历史被分为七个「时代」（dispensations），神在每个时代用不同的方式对待人；教会与以色列严格区分；末世论的核心是「**秘密被提**」（secret rapture，基督暗中来提走教会，然后地上有七年大灾难）。
- **来历**：1827–1830 年代在都柏林与普利茅斯兴起；达秘的《圣经概要》（*Synopsis*）与**司可福圣经**（Scofield Reference Bible，1909）把它传播到美国；20 世纪经**达拉斯神学院**（1924）系统化。
- **要解决的问题**：**如何把整部圣经读成一个连贯的「神的计划」？** 时代论的答案是：按「时代」分期，每一期有各自的规则与应许。
- **论敌**：改革宗（{{圣约神学}}认为只有一个约、教会是「真以色列」）、主流学术（历史批判学否定达秘的解经）、其他前千禧年派（历史性前千禧年派不承认「秘密被提」）。
- **所受反驳**：（1）「七个时代」的划分没有经文依据；（2）「秘密被提」在 1830 年之前没有教会传统（这是最致命的一条）；（3）它把以色列与教会切得太开，导致一种政治化的末世论（美国福音派对以色列的支持常以此为基础）。
- **结局 / 现状**：**普利茅斯弟兄会**今天约 100 万（分为「封闭」与「开放」两支）；**时代论**则通过司可福圣经、达拉斯神学院、以及《末日迷踪》（*Left Behind*，1995–2007，销量 6500 万册）深刻塑造了美国福音派的末世论想象。**它对美国政治的影响，远超它的人口比例。**

### 四、{{胡特尔派}}（Hutterites，1528 年至今）

- **主张**：重洗派的一支，实行**财产共享**（*Gütergemeinschaft*）——不是共产主义，而是「自愿的、以爱为基础的互助」；拒绝个人财产、拒绝参军、拒绝宣誓；集体农庄（*Bruderhof*，兄弟庄）组织生产与生活。
- **来历**：1528 年由**雅各布·胡特**（Jakob Hutter）在奥地利蒂罗尔建立；因迫害而迁徙（蒂罗尔 → 摩拉维亚 → 匈牙利 → 乌克兰 → 北美，1874–1879）；今天主要分布在美国（南达科他、蒙大拿）与加拿大（阿尔伯塔、马尼托巴）。
- **要解决的问题**：**「凡物公用」（徒 2:44–45）是否是基督徒生活的规范？** 胡特尔派的答案是：是，至少对愿意的人。
- **论敌**：路德宗、改革宗、天主教（都视之为激进异端）、以及现代国家（拒绝参军与义务教育）。
- **所受反驳**：（1）财产共享容易导致家长式的权威（领袖的绝对权力）；（2）拒绝现代技术（部分群体）使成员难以适应外部社会；（3）它与「个人责任」的现代伦理冲突。
- **结局 / 现状**：今天约 5 万，是**全球最成功的自愿共产主义实验**之一（经济上极为成功，人口增长迅速）。它与{{阿米什}}、门诺派并列为重洗派三大存续分支。

### 五、{{圣多马基督徒}}（St. Thomas Christians，1 世纪至今）

- **主张**：印度西南部（喀拉拉邦）的古老基督教群体，传统上认为由**使徒多马**于公元 52 年建立。礼仪属**叙利亚东方礼**；长期与东方教会（聂斯脱里派）共融；16 世纪葡萄牙人到来后分裂为多个支派。
- **来历**：传统说法见《多马行传》（3 世纪）；历史证据显示至少 6 世纪已有稳定的叙利亚语基督教社群；1498 年达伽马到达印度时，当地已有约 200 万基督徒。
- **要解决的问题**：**一个「本土的、古老的」教会，如何在殖民者的拉丁化压力下保持自己的身份？** 1653 年的「库南十字架誓言」（*Koonan Cross Oath*）是反抗葡萄牙拉丁化的标志。
- **论敌**：葡萄牙天主教（强制拉丁化）、以及后来的英国圣公会（19 世纪）。
- **所受反驳**：（1）「使徒多马建立」缺乏同时代史料；（2）它内部的多次分裂（天主教叙利亚-马拉巴礼、马兰卡拉叙利亚正教会、马兰卡拉东正教会、以及多个新教支派）削弱了它的统一性。
- **结局 / 现状**：今天约 **600–700 万**，分为六个以上支派，是**世界上最古老的基督教社群之一**，也是「基督教不是西方宗教」这句话最有力的证据。

:::note
**这个附录的意义**：它本身就是对「尽可能所有派别」这个要求的一个诚实回应——**不可能穷尽**。全球有数万个宗派，任何一本书都只能选择「有代表性的」与「影响大的」。**判断一本教会史是否合格，不在于它列了多少个名字，而在于它是否给了你一个可以自己继续定位新派别的框架。** 本书的框架就是六个部 + 六张温度计 + 47 张卡片。
:::

## 结语：为什么值得研究这两千年的分裂史 {#conclusion}

### 一、这本书讲了什么

把全书压缩成一张地图：

| 部 | 时间 | 核心问题 | 留下的裂口 |
|---|---|---|---|
| **一：诸根** | 1 世纪–313 | 耶稣是谁？外邦人要不要守律法？物质是好的吗？ | 「耶稣是主」与严格一神论的张力；希腊哲学与圣经的张力 |
| **二：古代教义大辩论** | 318–681 | 神怎么是三个又是一个？基督怎么是神又是人？人还能做什么？ | 阿里乌派（已消亡但结构延续）、东方正统教会（451 年至今）、东西方分裂（1054） |
| **三：东西方的两条路** | 700–1500 | 神能不能被画？神如何被认识？教会能否富有？ | 圣像破坏、帕拉马斯之争、卡特里派（被消灭）、瓦勒度派（存续）、胡斯派（存续） |
| **四：宗教改革** | 1517–1648 | 我怎么能确定神接纳我？教会由谁治理？谁有资格受洗？ | 路德宗、改革宗、圣公会、重洗派、浸信会、贵格会……数万宗派 |
| **五：现代与当代** | 1700–今天 | 圣经可靠吗？神迹可能吗？教会该不该改造社会？ | 自由派 vs 基要派、五旬节运动、独立教会、性议题的分裂 |
| **六：外部批判** | 始终 | 你们凭什么说这是真的？ | 犹太教、伊斯兰教、无神论、世俗主义——四种不接受前提的质疑 |

### 二、三个贯穿全书的机制

如果这本书只能留下三句话，它们是：

**（一）语言决定了争论的形状。**
*ousia* 的两种用法（柏拉图 vs 亚里士多德）制造了 4 世纪的战争；*physis* 的两种用法制造了 5 世纪的分裂；*processio* 与 *ekporeusis* 的差异制造了 1054 年；「位格」这个中文生造词至今仍在误导读者。

**这不是「文字游戏」**——因为语言是思想的边界。当两群人用同一个词指不同的东西时，他们**无法知道**自己在争论的是同一件事还是不同的事。**而他们通常假设是不同的事。**

**（二）权威问题比教义问题更难解决。**
教义可以靠学术对话解决（一性论的分歧在 1971 年基本解决，和子句在 1995 年获得相互承认）。但「谁有权决定」这个问题无法靠学术解决——**因为它是权力的定义本身。**

**这就是为什么：**
- 451 年的分裂至今未愈（因为障碍是教会论，不是基督论）。
- 1054 年的分裂至今未愈（因为障碍是教宗首席权，不是和子句）。
- 1517 年的分裂至今未愈（因为障碍是「谁有权解释圣经」，不是称义）。

**（三）非神学因素往往决定神学争论的结果。**
第 5 章的五层分析（术语、政治、语言、神学直觉、暴力记忆）、第 7 章的五层分析（语言、政治、礼仪、教义、权威）、第 4 章的五层分析（语言、解经、哲学、救恩、政治）——**每一次分裂，都是神学因素与非神学因素同时对齐的结果。**

**这不是说神学不重要**（那会陷入还原论），而是说：**神学提供了语言与理由，但让分裂「不可逆」的，往往是荣誉、族群、土地、以及记忆中的暴力。**

### 三、给读者的三个建议

**（一）读任何宗派史，先问「这是谁写的」。**
绝大多数「异端」的形象，是胜利者写的。诺斯替派在 1945 年之前只能通过对手的引用被认识；聂斯脱里的真实立场要到 20 世纪才被重新发现；卡特里派的形象主要由宗教裁判所的记录塑造。**本书尽力呈现每一方的自我理解，但本书本身也是一部有立场的著作——请同样对待它。**

**（二）区分「史实」「史料争议」「神学判断」。**
- 「尼西亚会议有多少位主教参加」是史实（传统说 318，现代估计约 250–300）。
- 「阿里乌是否真诚」是判断。
- 「三位一体是否符合圣经」是神学争论。

**三者不能混为一谈。** 混在一起，就会得出「因为尼西亚会议的人数不确定，所以三位一体是假的」这类荒谬推论（反过来也一样）。

**（三）不要急着站队，先学会把对方的论证讲到最强。**
这是本书最想传递的一种智识习惯。**一个只能反驳稻草人的人，其实没有信念——他只有一个立场。** 真正的信念，是能够承受对方最强的攻击而仍然站立的东西。

### 四、最后一个诚实的收尾

这本书讲了两千年里，人们为了「神是谁」而互相开除、流放、烧死、屠杀的历史。

有人会问：**这一切值得吗？**

本书不给一个安慰性的答案。它只指出三件事：

1. **这些争论的核心问题，都是真问题。** 「那个被钉死的人是谁」「我怎么能确定神接纳我」「为什么神允许苦难」——这些问题不是无聊的钻牛角尖，它们是人在面对存在时的真实提问。
2. **但人对这些问题的回答方式，常常是可耻的。** 用火刑回答神学问题，用屠杀回答圣礼问题，用绝罚回答权威问题——**这些不是「时代的局限」，这是人的罪**（如果读者不喜欢「罪」这个词，可以换成「人的暴力倾向」）。
3. **而最深的讽刺是**：那个被所有派别共同承认的耶稣，说过一句几乎被所有人引用、却几乎没有人真正做到的话——

> 「**你们若有彼此相爱的心，众人因此就认出你们是我的门徒了。**」（约翰福音 13:35）

**如果这句话是真的，那么两千年的分裂史，就是一份关于「失败」的记录。** 而这本书之所以值得写，不是因为它记录了失败，而是因为**它让读者看清：那些看起来不可调和的分歧，有多少是语言的误会、有多少是权力的争夺、有多少是真正的信仰**。

**看清之后，你才有资格选择站在哪里。**

**附录：怎么继续读下去**

本书是一部导览，不是一部专著。如果读者想深入，建议按以下顺序：

**入门（中文可读）**
- 冈萨雷斯（Justo L. González）《基督教思想史》（三卷）——最平衡的通史。
- 麦格拉思（Alister McGrath）《基督教神学导论》——概念清晰，术语准确。
- 奥尔森（Roger Olson）《基督教神学思想史》——对「异端」的叙述较宽容。

**专题**
- 关于三位一体：Lewis Ayres, *Nicaea and its Legacy*（最权威的现代研究）。
- 关于基督论：Aloys Grillmeier, *Christ in Christian Tradition*（标准著作，卷帙浩繁）。
- 关于宗教改革：Diarmaid MacCulloch, *The Reformation*（叙事极佳）。
- 关于东西方分裂：Henry Chadwick, *East and West: The Making of a Rift*。
- 关于无神论：Graham Oppy, *Arguing about Gods*（无神论哲学家最严谨的论证）。

**工具书**
- *Oxford Dictionary of the Christian Church*（第三版）——查任何术语、人物、派别的第一站。
- *Encyclopedia of Christianity*（Eerdmans）——比牛津更详细。
- 本书的术语库与年表（右上角「术语」「年表」按钮）——快速查阅。

**一个阅读建议**：遇到不认识的术语，先查本书术语库；如果本书没有，再查牛津词典。**不要跳过术语**——因为这本书的核心论点就是：**分裂往往是从一个词开始的。**
