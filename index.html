**反对者（最大声的是耶路撒冷的修士 sophronius 与后来的最大权威 大马士革的约翰）的回答是**：意志属于**本性**，不属于位格。人有人的意志，神有神的意志，二者在基督里**不冲突**，因为人性意志完全顺服神性意志。若只有一个意志，则基督的人性是不完整的（没有人的意志）——那么人的意志就没有被医治。

**680–681 年第三次君士坦丁堡会议**谴责单志论，确立「两个本性、两个意志、两个活动，不相违背、不相混淆，人性意志完全顺服神性意志」。这是第七次被天主教与东正教共同承认的大公会议。

:::pit t="单志论的教训：为什么教义越往后越细"
三位一体（4 世纪）→ 基督论（5 世纪）→ 意志论（7 世纪）→ 圣像论（8 世纪）。

**每一次都是在解决上一个定义留下的空白。** 迦克墩说「完整的人性」，那么「完整」包不包括意志？包括意志就必然有两个意志，两个意志就必然要解释它们为什么不冲突。**教义的精确化是一个被迫的、不断向细处推进的过程**——每一步都不是因为神学家爱钻牛角尖，而是因为上一步的措辞留下了一个真实的漏洞，而这个漏洞会被人用来推出不可接受的结论。

这个机制也解释了为什么新教后来会反抗：**当教义的细密程度超过了信徒能理解、能辨认其必要性的程度时，「过度定义」本身就成了分裂的理由。**
:::

**（四）玛若尼派与黎巴嫩**（{{玛若尼派}}）：一个有趣的案例。玛若尼派（Maronites）长期被指控为单志论者，但他们自己在 12 世纪十字军时代与罗马联合，成为天主教的一个东方礼仪教会。1182 年他们正式声明自己从未持单志论立场。今天黎巴嫩的玛若尼派是中东最大的基督教社群之一。

### 5.8 景教：一个被遗忘的全球教会

聂斯脱里的追随者被逐后东迁。他们在波斯（萨珊帝国）扎根，因为波斯与罗马是敌国，**接受「罗马的异端」正好是政治上的忠诚表现**。这个教会后来被称为「**东方教会**」（Church of the East），中国史书称之为「**景教**」。

它的事迹在中文世界几乎无人知晓，但极其惊人：

- **635 年**，叙利亚传教士**阿罗本**（Alopen）抵达唐朝长安，唐太宗派宰相房玄龄迎入宫中译经。**这是基督教第一次进入中国官方记录。**
- **781 年**，立《大秦景教流行中国碑》（此碑 1623 年在西安出土，现藏西安碑林），碑文用汉文与叙利亚文双语写成，记述景教在华 150 年的历史。
- 景教在唐代传播约 210 年，会昌五年（845 年）唐武宗灭佛，景教一并遭禁，在中原消失，但蒙古时期再度传入（元代的「也里可温」）。
- **它曾是世界最大的教会之一**：从美索不达米亚到中亚、印度、中国、蒙古，甚至有一份 13 世纪的文件记录了一位中国出生的主教（汪古部的马·雅巴拉哈三世，曾任东方教会宗主教）。

:::why t="景教为什么重要"
因为它彻底改写了「基督教史」的地理想象。

多数中文读者理解的基督教史是：耶路撒冷 → 罗马 → 欧洲 → 美洲。但实际上，**在 7 至 13 世纪，从巴格达到大都（北京），存在一个庞大的、说叙利亚语的基督教世界**，它的规模一度超过欧洲的教会。它的神学传统（安提阿学派）与欧洲的（奥古斯丁—经院传统）完全不同。

这意味着：**「基督教思想史」并不只有一条主流。** 本书后面讲的所有「正统 vs 异端」，其裁判席主要设在罗马与君士坦丁堡；而在这两个城市之外，还有大量基督教群体从未参与那些判决，也不承认那些判决。
:::

### 5.9 争议为什么会产生：四个层次的复盘

**第一层：语言的不可通约。**
*physis* 在两派方言里意思不同；*hypostasis* 与 *prosōpon* 的差别更是致命。这不是「不小心说错」，而是**两套神学方言的词汇表不对齐**。

**第二层：救恩想象的冲突。**
神化（东方）需要极紧的合一；顺服替代（安提阿）需要完整的人。**两种灵性经验都真实、都符合圣经、都产生了圣徒。**

**第三层：三角形的几何困境。**
一与全不可兼得（见 5.0）。任何表述都是在这三者之间的一次取舍，而每一次取舍都会被另一方指责为「牺牲了另一条」。

**第四层：政治、族群、语言、记忆。**
如 5.6 节所述，这四项在 451 年恰好对齐，于是本可以靠「澄清术语」解决的分歧，变成了永久的民族—宗教身份。

:::note
一个反事实的思考练习：如果 451 年的会议**没有**同时提升君士坦丁堡的地位、**没有**用军队执行决议、**并且**用两种语言（希腊文与科普特/叙利亚文）分别表述同一份定义——分裂还会发生吗？

历史不能重演，但这个练习说明：**教义分裂的「不可逆性」，往往不是由教义本身决定的，而是由围绕它的那些非神学因素决定的。** 这一点，在理解第 10 章之后的宗教改革时同样适用。
:::

### 5.10 反驳谱系

#### 5.10.1 各派互相的反驳（一张表）

| 派别 | 对正统（迦克墩）的指控 | 正统的回应 |
|---|---|---|
| {{一性论}}／东方正统教会 | 「两个本性」＝两个主体＝聂斯脱里主义；你们把基督劈开了 | 我们说的是「两个性质」不是「两个人」；我们的四个副词明确排除分割 |
| {{聂斯脱里派}}／东方教会 | 「一个位格」＝把神性与人性混成一锅；你们实际上取消了真实的人 | 我们明确说「不混淆、不改变」；我们保留了完整的人性，包括意志 |
| 欧迪奇派 | 你们不敢说「一个本性」，是因为你们怕承认神性的绝对主权 | 若人性被吞没，则人性未被医治，救恩落空 |
| {{单志论}} | 两个意志必然冲突，冲突的基督不能救你 | 意志属于本性；基督的人性意志完全顺服，故不冲突 |
| 阿波利拿里主义 | 一个会动摇的理性意志，怎么能是无罪的救主 | 若基督没有人的理性，人的理性就未被医治 |

#### 5.10.2 伊斯兰教的反驳

伊斯兰教对基督论的攻击，与对三位一体的攻击同样核心，但角度不同：

> 「**他们没有杀死他，也没有把他钉死在十字架上，但他们不明白这件事的真相。**」（古兰经 4:157）

**主流伊斯兰解释**：被钉死的不是耶稣本人，而是另一个人（或一个幻象），真主把耶稣提升到自己那里（4:158）。这个立场在结构上非常接近古代的 {{幻影说}}。

**为什么伊斯兰教要否认十字架**：因为「真主的使者被敌人处死」在伊斯兰的神学里是不可接受的——真主必保护他的使者。而基督教的整个救恩论都挂在十字架上。**这是两个体系最无法调和的点**：一个说「他死了，这是救恩」，一个说「他没死，你们搞错了」。

**基督教的回应**：（1）十字架有罗马与犹太的双重史料支持（塔西佗《编年史》15.44、约瑟夫斯《犹太古史》18.3.3 的「 Testimonium Flavianum」——后者有部分篡改但核心被认为可靠）；（2）「使者必被保护」不是基督教的预设，反而是基督教的核心悖论：**神的能力在软弱中显明**（林后 12:9）。

#### 5.10.3 犹太教的反驳

犹太教对道成肉身的反驳已在 3.8 节详述。这里补充一个专门针对基督论的论点：

> **如果神成为人，那么犹太教关于偶像崇拜的禁令就被违反了**——因为一个人（受造物）被当作神来敬拜，且这个敬拜是有组织的、全球性的。在犹太教看来，这不是「深奥的神学」，而是历史上最大规模的偶像崇拜。

**基督教的回应**：这不是「人上升为神」，而是「神下降为人」。敬拜的对象不是那个人性，而是那个人性所归属的位格。

**犹太教的再回应**：这个区分只有在你已经接受「位格」这套形而上学之后才成立；而圣经里没有这套形而上学。

#### 5.10.4 无神论与哲学的反驳

- **逻辑怪物论**：「一个位格两个本性」是一个无法想象的组合。它既不是一个人，也不是一个神，而是一个逻辑上的拼接物。
- **不可检验论**：这个命题没有任何可观察的后果。你无法设计一个实验来区分「一个位格两个本性」与「两个位格一个本性」。
- **「这只是措辞」论**：教义史证明这些定义不是从信仰经验推出来的，而是从政治斗争推出来的——449 年与 451 年的差别，是皇帝换了一个。

**正统的回应**：（1）不可检验不等于无意义——它规定了敬拜与祷告的对象（这是可观察的实践差别）；（2）**「这只是措辞」论有一半是对的**：5.6 节已经证明，东方与迦克墩的分歧确实主要是措辞。但「主要是措辞」不等于「措辞不重要」——**措辞决定了谁能与谁共融，而共融决定了教会的边界。**

:::pit t="一个诚实的提醒"
本节列出的反驳，有些非常有力。本书的立场是：**不替任何一方辩护，也不假装所有问题都有答案。**

一个具体的例子：**「两个意志不冲突」这个说法，在逻辑上需要解释「不冲突」是必然的还是偶然的。** 若是必然的，那么基督的人性意志就不是真正自由的（那它还是人的意志吗？）；若是偶然的，那么基督就有可能犯罪（那他还是无罪的救主吗？）。681 年的会议用了「完全顺服」这个词，但它究竟是「必然顺服」还是「自由顺服」，至今仍是讨论中的问题。

**这类「尚未解决的结」在教义史里非常多。** 它们不是教会的失败，而是「用有限语言描述无限对象」这件事的必然产物。
:::

### 5.11 常见误解

:::pit t="关于基督论的四个误解"
**误解一：基督是「半神半人」，像希腊神话里的英雄。**
完全不是。半神是「神与人的混合体」，而基督论说的是**两个完整本性在一位格中**，不是各取一半。这正是 {{迦克墩}} 四个副词要排除的。

**误解二：基督的人性只是「一层外衣」，神性才是真的。**
这是 {{幻影说}} 或 {{一性论}} 的方向，被判为异端。正统坚持人性是完整的：有身体、有理性灵魂、有意志、会饿、会哭、会死。

**误解三：基督会犯罪，只是他没有犯。**
这是一个非常微妙的说法。多数正统神学家会说：**基督不能犯罪**（*non posse peccare*），因为他的位格是神；但也有神学家（尤其受 19 世纪自由主义影响者）强调他「能犯罪而没有犯」，否则他的顺服不是真实的。这个分歧在今天仍然存在，且与「耶稣是否真的受过试探」直接相关（来 4:15「他也曾凡事受过试探，与我们一样，只是他没有犯罪」）。

**误解四：基督论只是古代的一场文字游戏，与现代信徒无关。**
它决定了三件非常实际的事：（1）**你祷告的对象是谁**；（2）**你的苦难有没有意义**（若基督没有真的受苦，则人的苦难没有被承担）；（3）**你死后会怎样**（若基督没有真死真复活，则死亡没有被击败）。
:::

### 5.12 尾声：这道裂口今天的样子

- **东方正统教会**约有 5000 万信徒（埃塞俄比亚正教会最大，约 3600 万），是世界上最古老的基督教群体之一。
- **东方教会（亚述）**约有 60 万信徒，主要分布在伊拉克、伊朗、叙利亚、印度、以及全球侨民中。他们的礼仪用叙利亚语，可以追溯到 3 世纪。
- **天主教与东方正统教会**自 1971 年起签署了多份基督论共识声明；**东正教与东方正统教会**在 1990 年代也就基督论达成共识。**神学上的分歧基本已经解决。**
- **但共融尚未恢复**：障碍已从基督论转为「教会论」——教宗的首席权、圣统的合法性、礼仪的差异、以及一千五百年分离所积累的互不信任。

**这是一个极其重要的教训**：教义分歧可以靠学术对话解决，但**分裂一旦成为身份，就会自己活下去**。第 7 章（东西方分裂）与第 10 章（宗教改革）会反复展示同一个机制。

:::titre
**下一章：奥古斯丁、伯拉纠与「人还能做什么」（第 6 章）**

从「神是谁」转向「人是谁」。这一章要处理的问题，可能比三位一体更贴近普通人的经验：**如果神预定了一切，我的努力还有意义吗？如果人靠自己完全不能行善，那「道德」还剩下什么？** 这场争论的双方是古代最伟大的拉丁神学家与一个不列颠修士，而它的余波一直延伸到今天的「宿命论」「自由意志」「原生家庭」与「社会改造」之争。
:::

## 第 6 章：奥古斯丁、伯拉纠与「人还能做什么」（354–529） {#ch-6}

### 6.0 一个不列颠修士，惹上了北非最聪明的人

公元 410 年前后，一位名叫**伯拉纠**（Pelagius）的不列颠修士来到罗马。他身材魁梧（据说绰号「海上的布列塔尼人」），生活极其严谨，是当时罗马贵族圈里颇有声望的灵修导师。

他在罗马听到一件事，让他极为愤怒：**一位著名的主教（据说就是奥古斯丁）在《忏悔录》里向上帝祷告说——「主啊，求你赐我贞洁，但不是现在。」**

对伯拉纠来说，这句话简直是道德上的投降。他的反应可以概括成一句话：**如果连基督徒都把「我做不到」当作借口，那基督教的道德教导还有什么用？**

于是伯拉纠开始讲一套非常朴素、非常严肃的道理：

> 神不会命令人做他做不到的事。既然神命令「你们要完全，像你们的天父完全一样」（太 5:48），那么人就**有能力**完全。罪不是一种遗传的病，而是**模仿坏榜样的结果**。恩典是神给人的帮助——他给了律法、给了基督的榜样、给了理性的能力。**人要做的，是努力。**

这套说法在今天听来几乎无可指摘。它肯定人的尊严、肯定道德努力、肯定教育的力量。**而它被判为异端。**

:::why t="为什么这一章比三位一体更贴近你的生活"
三位一体讨论的是神内部的结构，你没法验证。但这一章讨论的问题，每个人每天都在经历：

- **我明知该做某件事，为什么做不到？**（意志的撕裂）
- **如果我的性格、家庭、创伤都是被给定的，我还有多少「自由」？**
- **如果一个「好人」不做坏事，他需要神吗？**
- **「你生来就有罪」这个说法，是安慰还是压迫？**

奥古斯丁与伯拉纠之争，就是这些问题在 5 世纪的形式。**它没有过时，只是换了词汇**：今天的「结构性问题 vs 个人责任」「先天 vs 后天」「社会改造 vs 人心改造」，都是同一场争论的当代版本。
:::

### 6.1 奥古斯丁的来路：一个被自己的意志打败的人

要理解奥古斯丁为什么如此坚持「人无能」，必须看他的个人经历——这不是心理学的附会，因为他自己把整部《忏悔录》写成了这个论证的证据。

**第一阶段：摩尼教（约 373–382）。**
年轻的奥古斯丁被 {{摩尼教}} 吸引，原因很实在：摩尼教提供了一个**不用他负责**的解释。摩尼教是彻底的二元论——光与暗、善神与恶神、灵魂与物质。在这个体系里，**恶不是我的错，而是「暗」这个原理在我身上作祟**。「我犯罪，是因为我里面的恶质」——这对一个无法控制自己欲望的年轻人来说，是极大的解脱。

**第二阶段：怀疑派（约 383–386）。**
他逐渐发现摩尼教的宇宙论在理性上站不住（尤其天文学的计算），于是转向学院的怀疑主义：**既然什么都不确定，那就不必负责。**

**第三阶段：新柏拉图主义（386）。**
{{新柏拉图主义}} 给了他两件关键的工具：（1）**恶不是实体，而是善的缺失**（*privatio boni*）——这直接摧毁了摩尼教的二元论；（2）**非物质的实在**是可能的——这让他能够想象「神是灵」。

**第四阶段：皈依（386 年夏，米兰花园）。**
《忏悔录》卷八记载了那个著名场景：他在花园里痛哭，喊着「要到几时才到几时？」然后听见邻家孩子唱「拿起来读，拿起来读」（*tolle, lege*），他翻开保罗书信，读到罗马书 13:13–14，从此「所有的疑云都散了」。

:::why t="为什么这个故事是理解奥古斯丁的钥匙"
因为在皈依之前，奥古斯丁经历了一件让他终生难忘的事：**他明明想改变，却做不到。**

《忏悔录》卷八开头，他描述了一种近乎病态的经验：

> 「我恨自己，因为我知道该做什么，却做不到。我的意志里有两个意志，一个旧的、一个新的，彼此撕裂……**不是我做的，而是住在我里面的罪做的。**」

请注意这个结构：**他不是「不知道」善，他是「知道却做不到」。** 所以他后来所有的神学，都不是从「人太蠢」出发，而是从「人太弱」出发。而伯拉纠没有这个经验——伯拉纠是一个从小就守规矩、道德无瑕的人，他无法理解「知道却做不到」是什么样的。

**这就是这场争论的真正起点：不是两种理论，而是两种人生经验。**
:::

### 6.2 恶的问题，与自由意志的辩护（388–395）

在《论自由意志》（*De libero arbitrio*）里，奥古斯丁要回答一个非常尖锐的质疑：

> 如果神是善的、全能的，为什么世界有恶？

他的回答分三步：

**第一步：恶不是实体。** 恶不是被创造的某个东西，而是**善的缺失**（*privatio boni*）。这个回答直接针对摩尼教：你不需要一个「恶神」来解释恶，就像你不需要一个「暗的源头」来解释黑暗——黑暗只是光的缺席。

**第二步：恶的来源是自由意志。** 神给了人自由意志（*liberum arbitrium*），这是一种极大的善——因为**没有自由，就不可能有真正的爱**。一个被程序设定必须爱你的机器人，它的「爱」不是爱。所以自由的可能是恶的代价，但它是值得的。

**第三步：恶被神使用为善。** 这是奥古斯丁最深刻也最难接受的论点：神允许恶存在，是因为他能从恶中带出更大的善（《上帝之城》中的「连罪恶也服务于善」）。犹大的背叛、十字架的谋杀，都是最极端的例子。

:::pit t="一个必须承认的困难"
第三步在逻辑上是有力的，但在情感上是残酷的。当一个母亲失去孩子时，「神会从恶中带出善」这个回答几乎不可能被听进去。

**这是所有神义论（theodicy）的共同困境**：它能在概念上解决恶的问题，却无法在经验上安慰受苦的人。20 世纪之后，许多神学家（如 Levinas、Moltmann）因此放弃了「辩护」的进路，转而强调「神在苦难中与人一同受苦」——这实际上是回到了十字架，而不是回到奥古斯丁的论证。

本书不裁决。但要注意：**奥古斯丁的「恶是善的缺失」这个公式，在哲学上极强，在牧养上极弱。** 一个人可以同时认为它是对的、和它是无用的。
:::

### 6.3 伯拉纠的立场：一套非常「现代」的宗教

现在来看伯拉纠（约 354–420 后）究竟主张什么。他的体系可以压缩成四句话：

1. **人性本善，且现在仍然健全。** 亚当的罪对后代的影响只是「坏榜样」，不是「遗传的病」。人有能力不犯罪（*posse non peccare*）。
2. **罪是个别行为，不是状态。** 你犯罪是因为你选择了犯罪，不是因为你的本性坏了。
3. **恩典是外在的帮助。** 神赐下律法、基督的榜样、理性的能力、以及赦罪的恩典——这些帮助人**更容易**行善，但人本来就有能力行善。
4. **完美是可能的。** 伯拉纠甚至主张历史上有一些义人从未犯罪（他列举了亚伯、以诺、约伯等）。

**他的支持者**：**科埃勒司提乌**（Coelestius，一位律师，比他更激进，主张「婴儿生来无罪」）、**茹利安**（Julian of Eclanum，一位意大利主教，成为反奥古斯丁最锋利的笔杆）。

**他的社会基础**：罗马的贵族基督徒。这一点非常重要——**{{伯拉纠主义}}是一种精英的道德主义**：你有能力做到，只是你不够努力。它对有钱、有闲、受过教育的人极有吸引力。

:::why t="伯拉纠的直觉为什么至今不死"
因为它在三个方面极其正确：

1. **它保卫了人的尊严。** 如果人完全无能，那人与一块石头有什么差别？道德还有意义吗？
2. **它保卫了神的公义。** 如果神命令人做他做不到的事，然后因他做不到而定罪，这公平吗？
3. **它保卫了道德努力。** 一个「反正我做不到，全靠恩典」的说法，很容易变成懈怠的借口——而伯拉纠正是看到了这一点。

**这就是为什么伯拉纠主义从未消失。** 它在 16 世纪的人文主义者（伊拉斯谟与路德之争几乎完全重演了这场对话）、在 19 世纪的自由主义神学（「基督教是耶稣的崇高道德」）、在今天的「自我提升」文化、在「原生家庭不能成为借口」的论述里，反复出现。

**每一个说「你不能什么都怪环境」的人，都站在伯拉纠这一边。**
:::

### 6.4 奥古斯丁的反驳：三层论证

奥古斯丁（在 412–430 年间的系列著作：《论功德与赦罪》《论本性》《论恩典与自由意志》《论预定》《论坚忍的恩赐》）给出了三层反驳。

#### 第一层：原罪的传递

{{原罪}}（*peccatum originale*）：亚当的罪不只是坏榜样，而是**一种传给全人类的败坏状态**。人不是「生病了但还能走」，而是「**死了**」（奥古斯丁最爱用的比喻：以弗所书 2:1「你们死在过犯罪恶之中」）。

**关键经文**：罗马书 5:12。拉丁译本作 *in quo omnes peccaverunt*（「在亚当里众人都犯了罪」），希腊原文是 *eph' hō pantes hēmarton*，这个 *eph' hō* 可以译为「因为」（*because*）或「在他里面」（*in whom*）。奥古斯丁据拉丁译本读作「在亚当里」——即**全人类在存在论上参与了亚当的罪**。

:::src t="一个翻译引发的神学"
这一点极其重要：**奥古斯丁的原罪论，在相当程度上依赖一个拉丁译本的歧义。**

希腊原文 *eph' hō* 更可能是「因为」（因为众人都犯了罪，即各人自己犯罪，所以死临到众人）；奥古斯丁的读法把它变成「在亚当里」（众人因亚当的罪而成为罪人）。现代译本（包括许多天主教译本）多采用「因为」。

**这不意味着奥古斯丁错了**——他的论证还有别的支柱（诗 51:5「我是在罪孽里生的」、罗 5:12–19 的整体对照、婴儿受苦的经验）。但它提醒我们：**教义史上有大量争论，起点是一个语法歧义。** 这跟第 4 章的 *homoousios*、第 5 章的 *physis* 是同一类现象。
:::

#### 第二层：恩典的绝对先在性

奥古斯丁的关键区分：

- **「创造的恩典」**：神赐给人自由意志的能力。伯拉纠承认这个。
- **「预先的恩典」**（*gratia praeveniens*）：神在人还没想要行善之前，就**先**在人心里创造出「想要」本身。这是伯拉纠不承认的。

用一个比喻（这是奥古斯丁自己的思路）：**伯拉纠认为恩典像一副拐杖，人用它走得更稳；奥古斯丁认为恩典像一次心脏复苏，人本来没有呼吸。**

由此得出他最著名的表述：人**不能**不犯罪（*non posse non peccare*），除非恩典使他能够（*posse non peccare*）。而恩典是**不可抗拒的**（*gratia irresistibilis*）——不是因为人被迫，而是因为神改变人的意志，使他**自愿地**选择善。

:::why t="「不可抗拒的恩典」为什么不是暴政"
这是奥古斯丁最难解释、也最容易被误解的一点。

批评者说：如果恩典不可抗拒，那人就是被神操纵的木偶，他的「信」不是他的。

奥古斯丁的回答是：**恩典不强迫意志，而是治愈意志。** 一个病人被治好，他的行动是自由的，但「被治好」不是他做到的。同样，恩典不是压住人的意志，而是**把人的意志从「只能选恶」变成「能够选善」**。所以恩典越强，自由越真实——这与「恩典越强，自由越少」的直觉正好相反。

这个回答成立吗？**它成立，但前提是你接受「自由＝按本性行动的能力」，而不是「自由＝在选项间无因选择的能力」。** 这两种自由观的分歧，就是整场争论的核心，也是今天「决定论 vs 自由意志」争论的核心。
:::

#### 第三层：预定

如果恩典是绝对先在且不可抗拒的，那么「谁得到恩典」就不能取决于人自己的功德——否则功德就成了恩典的条件。于是：**神在永恒中已经预定了谁将得救。**

奥古斯丁晚年（尤其《论坚忍的恩赐》，428 年）越来越明确地主张：**拣选是无条件的**，甚至可以说被弃绝者也是被预定的（虽然他对这一点极为谨慎）。见 {{预定论}}、{{双重预定}}。

### 6.5 判决：从迦太基到奥兰治

| 时间 | 事件 | 结果 |
|---|---|---|
| 411 | 迦太基会议 | 谴责科埃勒司提乌 |
| 415 | 耶路撒冷与狄奥波利会议 | 伯拉纠被审，但处理模糊 |
| 416 | 迦太基与米莱乌会议 | 明确谴责伯拉纠与科埃勒司提乌 |
| 418 | 迦太基会议（16 条教规） | 谴责伯拉纠主义；教宗佐西穆发通谕确认 |
| 431 | 以弗所会议 | 把伯拉纠主义列入谴责名单（与聂斯脱里并列） |
| 529 | 奥兰治会议（*Concilium Arausicanum II*） | 谴责**半伯拉纠主义**；确认恩典先在、无条件拣选 |

:::note
一个必须注意的细节：**418 年与 529 年的谴责，都是「西方」会议**（北非、高卢），东方的教会从未以同样的力度接受奥古斯丁的恩典论。

**东方教会对原罪的理解一直更温和**：罪是「必死的病」而不是「罪咎的遗传」；婴儿不受永刑；人的意志受伤但仍真实存在；救恩是「医治与神化」而不是「法庭宣告」。这也是为什么后来的东正教对{{加尔文主义}}有一种本能的不信任——**在他们看来，加尔文是奥古斯丁的极端化，而奥古斯丁本人已经太西方了。**
:::

### 6.6 半伯拉纠主义：最合理的中间路线，为什么也被判

**半伯拉纠主义**（{{半伯拉纠主义}}，Semi-Pelagianism）不是一个派别，而是现代学者给一组立场的命名（19 世纪才造的词）。代表是法国南部的**马赛派**（Massilians）：约翰·卡西安（John Cassian）、文森特·勒兰。

他们的立场听起来最合理：

> 恩典是**先**的——人不能靠自己开始信。但人的意志必须**同意**恩典；这个同意本身是人的自由行为。所以得救 = 恩典的启动 + 人的同意。

**为什么被 529 年奥兰治会议谴责**：因为它仍然把「同意」算作人的贡献，于是（按奥古斯丁的逻辑）得救就有一小部分是我的功劳。

:::why t="这个判决为什么重要，以及为什么它让人不安"
奥兰治会议的立场（「恩典先在，且人连同意恩典的能力也来自恩典」）在逻辑上是奥古斯丁主义的彻底化。但它带来一个非常尖锐的后果：

**如果连「同意」都来自恩典，那么「拒绝恩典」的责任在谁？**

奥古斯丁的回答是：**在拒绝者自己。** 但这个回答的对称性很可疑：若接受的能力是恩典给的，拒绝的能力是本性的，那么「恩典」与「本性」就在同一个行为里扮演了不对称的角色。

**这个不对称至今没有被解决。** 加尔文主义接受它（并推到双重预定），{{阿米念主义}}拒绝它（并回到某种半伯拉纠式的方案），天主教在 16 世纪与 17 世纪打了一场「恩典之争」（*de auxiliis*，1582–1607），最后教宗下令双方停止争论、不得再互相定罪——**也就是说，天主教会官方承认这个问题无法裁决。**

这可能是全书最诚实的一处：**一个核心的救恩问题，在 1600 年后被官方宣布「不可裁决」。**
:::

### 6.7 奥古斯丁的遗产：他决定了西方的一切

奥古斯丁（354–430）是西方拉丁神学的总开关。他死后的每一个西方神学家都在与他对话（或者与他争吵）。

| 领域 | 奥古斯丁的立场 | 后世影响 |
|---|---|---|
| **原罪与恩典** | 人完全无能，恩典绝对先在、不可抗拒 | 加尔文主义、路德的「唯独恩典」 |
| **教会与圣礼** | 圣礼的有效性来自基督，不来自施行者 | 天主教圣事神学的基础（见 {{多纳图派}}） |
| **教会与国家** | {{两城}}：上帝之城与地上之城，二者混杂于今世 | 中世纪政教关系、路德的「两个国度」、现代世俗主义的神学源头之一 |
| **正义战争** | {{正义战争}}：在爱中、由合法权威、为纠正不义而战 | 整个西方的战争伦理传统（从阿奎那到联合国宪章） |
| **性与婚姻** | 性欲本身与伊甸园中的性不同；原罪通过性传递 | 中世纪的婚姻神学、天主教的性伦理、以及大量对奥古斯丁的现代批评 |
| **强迫入教** | 引用路 14:23「勉强人进来」为镇压多纳图派辩护 | 宗教强制的经典依据（最受现代批评的一点） |
| **预定** | 无条件拣选；坚忍的恩赐 | 加尔文主义五点、多特会议 |
| **时间与永恒** | 时间是神的创造；神在永恒的「现在」中 | 整个西方的时间哲学（海德格尔、维特根斯坦都在与他对话） |
| **内在性** | 「不要向外，回到你自身；真理住在人的内心」 | 笛卡尔以来的现代主体哲学的先声 |

:::pit t="关于奥古斯丁的两个极端误解"
**误解一：「奥古斯丁是厌女者、厌身者，把性视为罪」。**
部分正确但不完整。他确实认为性欲（*concupiscentia*）在堕落之后失控，并把原罪与性传递联系起来；但他也明确说婚姻是善的、生育是善的、夫妻之爱是善的。他反对的是**欲望的失控**，不是身体本身。把他读成「恨身体」的人，通常忽略了他对复活身体的坚持（《上帝之城》卷二十二）。

**误解二：「奥古斯丁主义就是加尔文主义」。**
差别很大。奥古斯丁**没有**发展出「有限赎罪」（基督只为选民死），也没有明确主张「双重预定」的完整体系，且他坚持婴儿洗礼的实际必要性（这在他的体系里其实是一个逻辑困难）。加尔文把他彻底系统化了。**奥古斯丁是一口深井，加尔文是从井里打水的人——但打上来的水已经不是井水。**
:::

### 6.8 反驳谱系

#### 6.8.1 伯拉纠派的反驳（茹利安的六个论点）

茹利安（Julian of Eclanum）是反奥古斯丁最锋利的对手。他的论点至今有力：

1. **奥古斯丁让神成为恶的作者。** 如果人完全无能、且被预定，那么人的罪最终要追溯到神。
2. **奥古斯丁让婚姻成为恶的通道。** 如果原罪通过性传递，那么婚姻、生育都被玷污——这与创世记「生养众多」的祝福矛盾。
3. **奥古斯丁让神不公。** 因一个人的罪而定全人类的罪，这是暴政。
4. **奥古斯丁取消了道德努力。** 如果一切靠恩典，那劝人向善就没有意义。
5. **奥古斯丁的恩典是「强迫的爱」。** 一个不可抗拒的恩典，不是爱，是操纵。
6. **奥古斯丁的「恶是善的缺失」无法解释真实的痛苦。** 一个缺失不会让人痛。

**奥古斯丁的回应**（在《驳茹利安》中）：（1）神不创造恶，只是允许它；（2）婚姻是善的，传递原罪的是**欲望的失控**而非婚姻本身；（3）全人类在亚当里是「一个整体」，如同一个身体犯罪；（4）恩典不是取消努力，而是**使努力成为可能**；（5）强迫的爱不是爱，但**治愈**可以违背病人的意愿；（6）痛苦的实在性来自爱的失落，而不仅是「缺失」。

#### 6.8.2 东方教会的反驳

东正教从未接受奥古斯丁的原罪论与预定论。核心差异：

| | 奥古斯丁／西方 | 东方教会 |
|---|---|---|
| 原罪 | 罪咎的遗传；人「在亚当里」都犯罪 | 死亡的遗传；人继承了必死性与败坏，但不继承罪咎 |
| 婴儿 | 未受洗的婴儿受某种刑罚（奥古斯丁的困难） | 婴儿不受刑罚；夭折的婴儿在天国 |
| 意志 | 完全无能（*non posse non peccare*） | 受伤但仍有真实能力，需要医治 |
| 恩典 | 法庭式的宣告与不可抗拒的更新 | 医治性的能量（*energeia*），可与人的合作 |
| 救恩 | 称义（法庭）＋成圣 | 神化（本体性的医治与提升） |

**东方对奥古斯丁最尖锐的批评**（近代如罗曼尼迪斯、弗洛罗夫斯基）：**奥古斯丁把「罪」从一个医学问题变成了一个法律问题**，于是整个西方神学都在讨论「罪咎如何被抵消」，而东方一直在讨论「人性如何被医治」。

#### 6.8.3 现代的反驳

- **人道主义／启蒙**：原罪论是「使人自我贬低的教义」，它让人从小相信自己本质败坏，是一种精神虐待。**回应**：奥古斯丁的「败坏」指的是**能力**，不是**价值**；他说人是「被造的善、被损伤的善」，而不是「垃圾」。
- **心理学**：罪恶感是病理，不是本体状态。**回应**：奥古斯丁会同意罪恶感可以致病，但他会说**真实的罪咎**不等于**病态的罪恶感**。
- **社会学**：把问题归于「人心败坏」，会使人忽视制度性的恶（种族主义、贫富结构）。**回应**：这确实是对奥古斯丁主义的一个真实批评——它容易把一切问题私人化。20 世纪的「结构性罪」（structural sin）概念（拉丁美洲解放神学、以及 1971 年世界主教会议的表述）正是对它的修正。
- **决定论 vs 自由意志**：现代神经科学对「自由意志」的挑战，反而使奥古斯丁显得更「现代」——他本来就认为意志是被「爱」所驱动的，而不是无因的自主选择。

#### 6.8.4 无神论的反驳

最有力的一条：**「你生来有罪，而且你自己无法修复，只有通过一个无辜者的死才能平息神的愤怒」——这个叙事在道德上是可怕的。** 它把爱描述成需要血偿的，把人的出生描述成欠债。

**基督教的回应**（多种，不统一）：
- **经典回应**：这不是「神需要血」，而是「神自己付了代价」——十字架不是神向人索取，而是神自己承担。
- **现代回应**：许多当代神学家（如 J. Denny Weaver、Miroslav Volf）明确拒绝「刑罚代替」模型，转向「克胜死亡」的模型（*Christus Victor*），认为前者是西方司法文化的产物（见 {{救赎}} 词条的五种模型）。
- **最诚实的回应**：**这个批评击中了某些版本的基督教，但不一定击中所有版本。** 一个把十字架理解为「神在基督里自己承受了人的苦难」的版本，与一个理解为「神要求血的代价」的版本，在道德上完全不同——而圣经材料支持两者（对照罗 3:25 与 林后 5:19）。

:::why t="这一节为什么必须包括无神论的反驳"
因为本书的第六部要专门处理外部批判，但如果前面只在「内部吵架」，读者会以为这些质疑是外行话。

**事实是：最尖锐的批评往往来自外部，而且往往击中了要害。** 奥古斯丁主义的「原罪—预定—代赎」链条，在逻辑上自洽，但在道德直觉上让现代人极不舒服。**这个不舒服不是「世俗化的堕落」，而是一个真实的道德直觉在抗议。** 正统神学的任务不是否认这个直觉，而是解释为什么它会被冒犯，以及是否必须被冒犯。
:::

### 6.9 常见误解

:::pit t="关于原罪与恩典的四个误解"
**误解一：原罪＝性。**
不是。原罪是「人与神的关系断裂后的整体状态」，包含必死性、无知、意志的偏向、以及社会的败坏。性只是奥古斯丁用来解释「为什么这状态会传给后代」的一个机制（而且这一点在今天看来是他最薄弱的一环）。

**误解二：奥古斯丁说人完全像石头一样被动。**
不是。他说人**自愿地**犯罪，也**自愿地**接受恩典——只是「自愿」的方向被罪扭曲了。他的公式是：**「能够不犯罪」（*posse non peccare*）是起初的状态；「不能犯罪」（*non posse peccare*）是最终的状态；「不能不犯罪」（*non posse non peccare*）是堕落之后的状态。**

**误解三：预定论让人不必传福音。**
在逻辑上确实有这个危险。但历史上加尔文主义者是传教最积极的群体之一（威廉·克里、爱德华兹、现代福音派的宣教运动）。他们的理由是：**神预定了「结局」，也预定了「手段」（传讲）**——所以传福音是神实现拣选的途径，而不是多余的。

**误解四：天主教不接受奥古斯丁。**
天主教接受他为「恩典的博士」，但在 16 世纪特伦托会议上，它同时谴责了新教的「双重预定」与「因信称义的归算说」。**天主教的位置一直在奥古斯丁与半伯拉纠之间**：恩典绝对必要，但人的自由合作是真实的。
:::

### 6.10 尾声：这一章的余波，就是整个现代

如果把第 6 章压缩成一句话：

> **奥古斯丁赢了 5 世纪的争论，但伯拉纠赢了现代。**

- 现代的教育、法律、心理治疗、社会政策，几乎全部建立在「人可以通过努力、环境、帮助而改变」这个前提上——这就是伯拉纠式的直觉。
- 但现代的文学、精神分析、以及对「人性幽暗」的深刻认识（从陀思妥耶夫斯基到弗洛伊德到莱因霍尔德·尼布尔），又不断回到奥古斯丁：**人有善意，但善意不足以自救。**

**这两者都对。** 这正是这一章最难的地方，也是它最有价值的地方：**它不给你一个可以安心的答案，它给你一个必须终身面对的问题。**

:::titre
**下一章：东西方大分裂（第 7 章）**

从「一个人能做什么」转向「一个词能做什么」：圣灵是「从父发出」，还是「从父和子发出」？这一个词（{{和子句}}）加上教宗的首席权，在 1054 年把一个教会劈成两半，并在 1204 年用十字军的刀把伤口变成血仇。这一章会解释：为什么一个连东方都承认「在神学上可以接受」的表述，最终成了不可逾越的界线。
:::

## 第 7 章：东西方大分裂（1054 与更长的七百年） {#ch-7}

### 7.0 一个下午，一张纸

1054 年 7 月 16 日，星期六下午，君士坦丁堡的圣索菲亚大教堂。

正当礼仪进行到一半，三位拉丁人走进教堂，径直走向祭坛。为首的是**宏伯特**（Humbert of Silva Candida），罗马教宗利奥九世派来的使节。他把一份文书放在祭坛上，转身离开，在出门时抖了抖长袍上的灰尘，说了一句：「愿神鉴察。」

那份文书是**绝罚书**（*anathema*），绝罚的对象是君士坦丁堡牧首**色路拉里乌斯**（Michael I Cerularius）及其支持者。文中列举的罪状包括：允许有酵饼在圣餐中使用、在四旬期吃带血的肉、重新为已受洗的人施洗、以及**删去了信经中的「和子」一句**。

四天后，牧首召开会议，反手绝罚了宏伯特与另外两位使节。

**这就是通常所说的「{{东西方教会大分裂}}」。**

:::pit t="关于 1054 年的三个常见误解"
**误解一：1054 年把教会劈成了两半。**
实际上，当时几乎没人认为这是一次永久分裂。双方都认为这只是一次外交冲突，可以修复。**君士坦丁堡的市民更关心的是政治，牧首与皇帝的矛盾才是当天的头条。** 1204 年十字军洗劫君士坦丁堡，才是真正让伤口无法愈合的事件。

**误解二：分裂是「因为一个词」。**
{{和子句}} 确实是一个核心争点，但它只是五层累积矛盾中最容易被写下来的一层。真正的原因包括语言、政治、礼仪、权威、以及数百年的互相误解。

**误解三：双方一直敌对。**
在 1054 年之前的七百年里，东西方教会**多次**在教义上合作（七次大公会议全部有双方参与），也多次互相绝罚又和解（例如 484–519 年的「阿卡修分裂」持续 35 年后修复）。**分裂不是常态，而是失败。**
:::

### 7.1 五层累积的矛盾

要理解 1054 年，必须理解在此之前的七百年里，两个世界已经慢慢变成了两个文明。

#### 第一层：语言

- 东方教会的神学语言是**希腊语**——新约的语言，七十士译本的语言，教父（亚他那修、加帕多家、金口约翰）的语言。
- 西方教会的神学语言是**拉丁语**——从特土良、居普良、安波罗修到奥古斯丁。
- **奥古斯丁不懂希腊文，区利罗不懂拉丁文。** 这不是夸张：奥古斯丁在《忏悔录》里承认自己希腊文很差；而 431 年以弗所会议上，双方的文件需要翻译，而翻译本身就是误解的来源。

**后果**：两边读的教父不是同一批，用的术语不是同一套，争论时的「常识」不是同一个。**当两个传统各自独立发展了六百年，「同一个信仰」这句话本身就需要翻译。**

#### 第二层：政治

- 330 年，君士坦丁把首都迁到拜占庭，改名**君士坦丁堡**（「新罗马」）。
- 476 年，西罗马帝国灭亡。此后西方进入「蛮族王国」时代，罗马主教成为唯一稳定的权威中心——**教宗的政治地位是帝国崩溃的副产品。**
- 东方则延续了罗马帝国（拜占庭）直到 1453 年，皇帝（*basileus*）是教会的实际首脑，形成 {{众议}}（*symphonia*，「和谐」）的理想：皇帝管身体，牧首管灵魂，二者协作。

**后果**：在东方，教会是一个帝国的一部分；在西方，教会**取代了**帝国。这两个模型对「教会的最高权威在哪里」有完全不同的答案。

#### 第三层：礼仪与实践

| 项目 | 西方（拉丁） | 东方（希腊） |
|---|---|---|
| 圣餐饼 | **无酵饼**（*azyma*） | **有酵饼**（*artos*） |
| 十字架手势 | 四指，从左到右 | 三指合拢，从右到左 |
| 神职人员 | 独身（强制） | 已婚可（主教须独身） |
| 圣餐杯 | 平信徒只领饼（后来） | 饼酒同领 |
| 洗礼 | 浸水或洒水 | 三次浸水 |
| 坚振 | 主教施行（与洗礼分开） | 神父施行（洗礼后立即） |
| 炼狱 | 有（{{炼狱}}） | 无（但有中间状态与祈祷） |
| 圣像 | 雕像与画像 | 只允许平面圣像（{{圣像敬礼}}） |
| 修士的须 | 剃须 | 蓄须 |

:::why t="为什么礼仪差异会变成教义争议"
因为在一个以「正确敬拜」为核心的社会里，**礼仪不是风格问题，而是真理问题**。

以无酵饼为例：西方用无酵饼，理由是最后的晚餐发生在逾越节，而逾越节用无酵饼；东方用有酵饼，理由是「酵」象征复活的生命，且基督是「从天上来的真粮」。**双方都能引经**。但当争执升级时，无酵饼被东方指责为「犹太化」，有酵饼被西方指责为「引入腐败的象征」——**一个面包的做法，变成了对基督身体的两种理解。**

这与第 4 章的 *homoousios*、第 5 章的 *physis* 是同一个模式：**当分歧需要被表达时，任何具体细节都可以承载它。**
:::

#### 第四层：教义差异（在 1054 年时已经存在的）

- **{{和子句}}**（最重要，见 7.2）
- **炼狱**：西方发展出「为亡者祈祷以缩短炼狱刑期」的完整体系，东方认为这是把「神秘的中间状态」变成了可计算的账本。
- **马利亚无原罪**：西方后来（1854）定为信条，东方认为这是把马利亚从人类中孤立出去（东方的表述是「她是纯洁的，但仍是一个人」）。
- **圣像**：787 年第二次尼西亚会议为圣像敬礼辩护，但西方更倾向雕像，东方更严格。
- **圣餐的本质**：西方后来发展出 {{变体论}}（1215），东方保留了「奥秘的转化」而不定义机制。

#### 第五层：权威——最根本的一层

这是所有矛盾的汇聚点。**问题的形式是：教宗是「首席」还是「元首」？**

- **东方的模型**：**共融的教会论**（*communion ecclesiology*）。每个地方教会（以主教为首）是完整的教会，彼此在信仰、圣礼、爱德中共融。罗马主教在**荣誉**上居首（*primus inter pares*，同侪之首），有**首席权**（*primacy*），但没有对全体教会的**直接管辖权**（*universal jurisdiction*）。
- **西方的模型**：**君主式的教会论**。罗马主教是彼得的继承者，是基督在世的代表（*Vicarius Christi*），对全体教会拥有**直接、普遍、最高的**管辖权。

:::src t="两份著名的伪造文献"
西方教宗权威的强版本，在中世纪很大程度上建立在两份伪造文献之上：

**（1）《君士坦丁赠礼》（Donatio Constantini）**：声称君士坦丁大帝把罗马城、意大利、以及西方全境的政治统治权赠给了教宗西尔维斯特一世。这份文献在 8 世纪被伪造，**1440 年被洛伦佐·瓦拉（Lorenzo Valla）用文献学方法证明为伪造**（他指出文中的拉丁文是 8 世纪的，不是 4 世纪的）。

**（2）《伪伊西多尔教令集》（Pseudo-Isidorian Decretals）**：9 世纪的伪造汇编，包含大量伪造的早期教宗书信，主张主教不受地方大主教审判、而可直接上诉罗马。这份文献在 9–12 世纪成为强化教宗权力的关键工具。

**这两件事的意义**：它们不证明「{{教宗首席权}}」本身是伪造的（东方也承认某种首席权），但它们证明：**中世纪教宗权威的具体形式，有相当一部分是政治建构的产物。** 这一点连 15 世纪的天主教内部都不否认。
:::

### 7.2 和子句：一个词的来龙去脉

这是全书最值得细看的一个「词」。它的历史极其具体，而且能说明「教义争议」的每一个机制。

#### 7.2.1 原本说了什么

381 年《尼西亚—君士坦丁堡信经》关于圣灵的条款，希腊原文是：

> 「**τὸ Πνεῦμα τὸ Ἅγιον, τὸ κύριον, τὸ ζωοποιόν, τὸ ἐκ τοῦ Πατρὸς ἐκπορευόμενον**」
> 「圣灵，主，赐生命者，**从父发出**（*to ek tou Patros ekporeuomenon*）……」

**「从父」**（*ek tou Patros*）直接来自约翰福音 15:26：「但我要从父那里差保惠师来，就是从父出来（*ekporeuetai*）真理的圣灵。」

注意：原文只有「从父」，**没有「和子」**。

#### 7.2.2 这个词是怎么加进去的

| 时间 | 事件 |
|---|---|
| 4 世纪 | 西方一些拉丁教父（如奥古斯丁）在解释三位一体时，已用「从父和子」来说明圣灵的共同发出（《论三位一体》卷五、卷十五） |
| **589 年** | 西班牙**托莱多第三次会议**（*Concilium Toletanum III*）的决议中加入 *Filioque*——**这是最早的文字记录**，但会议性质是地方会议，且原文是否原本就有此句至今有争议（可能是后来抄本插入） |
| 796–809 | 查理曼帝国推动「和子」的传播；809 年亚琛会议请求教宗认可 |
| **809 年** | **教宗利奥三世明确拒绝**把「和子」加入信经，理由是：**信经是普世会议的产物，没有普世会议不能修改**。他甚至让人把信经原文（无和子）刻在银牌上，放在圣彼得墓前 |
| 1014 年 | **罗马**在亨利二世的加冕礼上**首次正式**在弥撒中咏唱带「和子」的信经——**这一步是分裂的直接导火索之一** |
| 1054 年 | 宏伯特的绝罚书指控东方「删去了和子」（实际上是东方保留了原文） |
| 1274 / 1439 | 里昂与佛罗伦萨合一会议试图解决，失败 |
| 1995 | 教宗若望保禄二世《东方之光》（*Orientale Lumen*）承认：东方可以保留不带「和子」的原文表述，双方在神学上可以互相承认 |

:::note
**最反讽的一点**：809 年拒绝修改信经的，是**教宗本人**；而 1014 年把「和子」正式加入罗马礼仪的，也是教宗。**西方内部对这个问题从来不是一致的**——这正是东方最有力的论点：你们连自己都没有共识，怎么能单方面改普世信经？
:::

#### 7.2.3 神学争点：这一个词到底改变了什么

**西方的论证**（以奥古斯丁为基础）：

1. 圣灵是「父与子的爱」（*vinculum caritatis*）。既然父与子之间的爱是相互的，那么圣灵作为这爱，就应当从二者共同发出。
2. 圣灵是「赐予者」所赐的恩赐。父赐予、子也赐予（约 16:7「我若不去，保惠师就不来」；约 20:22「耶稣吹一口气说：受圣灵」）——**若子能差遣圣灵，则圣灵必也与子有关。**
3. 若圣灵只从父发出，那么圣灵就只与父有关，与子无关——这会削弱「子与父同一本质」的意义，甚至暗示子不如父（这恰是 {{阿里乌主义}} 的方向）。

**东方的论证**：

1. **单一本源原则**（*monarchia*，单一起源）：父是神格中唯一的「源头」（*pēgē*，*aitia*）。若圣灵从父和子发出，则神里有**两个源头**，破坏了一神论的结构。
2. **位格的区别会被取消**：若父子共同发出圣灵，那么父与子在「发出」这个关系上就没有区别了——他们变成了「同一作用的两端」，这是 {{形态论}} 的方向。
3. **圣经只说了「从父」**。若可以加「和子」，那为什么不能加别的？
4. **程序问题**（这一条东方认为最重要）：**信经是普世教会的财产，不能由任何一个地方教会单方面修改。** 即使「和子」在神学上可以接受，**单方面的修改本身就是教会论上的错误**——它等于宣称罗马有权不经普世会议就定义信仰。

:::why t="为什么这条最难解决"
因为它同时涉及三个层次，而且三层的解决方式互相冲突：

- **教义层**：可以解决。1995 年天主教官方承认东方表述的正当性；许多东正教神学家（如 Lossky、Zizioulas）也承认西方表述在拉丁语境中可以是正统的。
- **程序层**：难以解决。因为「单方面修改」这件事已经发生了一千年，无法撤回——撤回意味着承认罗马曾经做错，而这与「教宗不可错误」的教义（1870）冲突。
- **权威层**：无法解决。因为「谁有权修改信经」这个问题，就是「谁是教会最高权威」的问题，而那正是分裂本身。

**换句话说：和子句既是原因，也是症状。** 表面上争的是圣灵的来源，实际上争的是**谁能替全体教会说话**。
:::

### 7.3 教宗首席权：从荣誉到管辖的历史曲线

要理解这条曲线，必须知道它**不是一条直线**。

**第一阶段（1–4 世纪）：荣誉与见证。**
罗马教会因为彼得与保罗的殉道、以及首都的地位，享有特殊荣誉。1 世纪末的《革利免一书》显示罗马曾介入哥林多教会的纷争，但语气是劝勉，不是命令。**当时没有「罗马主教管辖全体教会」的观念。**

**第二阶段（4–7 世纪）：首席权的发展与东方的不满。**
- 罗马主教在多次教义争论中扮演关键角色（利奥一世在 451 年的作用尤其重要）。
- 但 381 年君士坦丁堡会议第 3 条教规把君士坦丁堡的地位提到「仅次于罗马」，理由是「它是新罗马」——**这等于说教会的地位可以因为政治地位而变动**，罗马对此长期不接受。
- 451 年迦克墩第 28 条教规重申这一点，罗马代表当场反对。

**第三阶段（8–11 世纪）：伪造文献与权力的扩张。**
《君士坦丁赠礼》与《伪伊西多尔教令集》（见上）在这一时期被大量使用，把罗马的权威从「荣誉」推向「管辖」。

**第四阶段（11–13 世纪）：十字军与暴力。**
**1204 年第四次十字军**本应去埃及，却在威尼斯的总督与流亡的拜占庭皇子的操纵下转向君士坦丁堡，攻陷并**洗劫**了这座城市三天。圣索菲亚大教堂被抢掠，圣物被运回西方，妓女被安置在牧首座上唱歌。

**这一次事件，比 1054 年的绝罚严重得多。** 对东方来说，1054 年是「一个傲慢的使节」，1204 年是「拉丁基督徒屠杀了我们」。东正教至今有一句流行的话：**「我们不是拒绝 1054 年的绝罚，我们是不接受 1204 年的屠刀。」**

**第五阶段（14–15 世纪）：合一的失败。**
1274 年里昂第二次会议、1439 年佛罗伦萨会议都宣布「合一成功」，但两次都被东方的教会与民众拒绝——因为那些签字的主教是在政治绝境（拜占庭快要亡国）中签的，回国后被当作叛徒。**佛罗伦萨合一（1439）在 1453 年君士坦丁堡陷落时彻底作废。**

**第六阶段（19–20 世纪）：新的分歧。**
- **1870 年第一次梵蒂冈会议**定义「教宗不可错误」（*ex cathedra*）与「普遍直接管辖权」。**这使合一变得比以前更难**，因为东方可以说：你们在 1870 年又加了一条我们从未接受的定义。
- **1964 年 1 月**，教宗保罗六世与君士坦丁堡牧首 Athenagoras 在耶路撒冷会面——这是 1439 年佛罗伦萨会议以来罗马主教与君士坦丁堡牧首的第一次会面。**1965 年 12 月 7 日**，两人在罗马（梵二闭幕礼）与伊斯坦布尔同时宣读共同声明，撤销 1054 年的绝罚。这是 911 年来第一次。
- **1965 年之后**：天主教与东正教展开了「国际神学对话」（1979 年起），在圣礼、圣职、教会论上取得大量共识，但**教宗首席权**始终是最后一道坎。2016 年克里特泛东正教会议、以及近年来的多份文件（如 2016 年《共融与首席权》拉文纳文件后续），都还在这道坎前。

### 7.4 今天的差异清单（一张表看完）

| 项目 | 天主教 | 东正教 |
|---|---|---|
| 信经 | 带「和子」 | 不带（原文） |
| 教会最高权威 | 教宗（普遍管辖权 + 不可错误） | 普世会议 + 各地方教会共融（无单一元首） |
| 圣餐 | 无酵饼；平信徒通常只领饼 | 有酵饼；饼酒同领（用匙） |
| 炼狱 | 有明确定义 | 无（但有中间状态与为亡者祈祷） |
| 马利亚 | 无原罪（1854）、升天（1950）为信条 | 承认她是「生神者」、极尊崇，但无这两条信条 |
| 圣像 | 雕像与画像并用 | 只允许平面圣像（二维） |
| 神职人员 | 强制独身（东方礼仪天主教除外） | 已婚神父（主教须独身） |
| 坚振 | 主教施行，与洗礼分开 | 神父施行，洗礼后立即 |
| 告解 | 向神父告解，有固定程式 | 向神父告解，更强调灵修指导 |
| 离婚 | 原则上不可，但有婚姻无效程序 | 允许有限度的「经济宽免」（*oikonomia*） |
| 十字架手势 | 从左到右 | 从右到左 |

:::note
注意最后一项：**十字架手势的方向**。看起来最琐碎，但它示范了一个重要事实：**当两个传统分开足够久，任何细节都会变成身份标记。** 一个东正教徒在胸前画十字的方向，与一个天主教徒不同——而这个不同，足以让他在人群中认出「谁是自己人」。**这就是分裂的最终形态：不是教义，而是身体记忆。**
:::

### 7.5 争议为什么产生：四个层次的复盘

**第一层：语言与术语。** 拉丁的 *processio*（发出）与希腊的 *ekporeusis*（发出）不是同一个概念：拉丁的 *processio* 更宽（可以指任何一种来源关系），希腊的 *ekporeusis* 专指圣灵从父的独特来源。**当西方说「从父和子 processio」时，它用的词在希腊文里对应的是另一个更宽的概念。** 这是一次翻译灾难（与第 5 章的 *physis* 完全同类）。

**第二层：教会论。** 「谁有权定义信仰」——这是最深的一层。

**第三层：政治与暴力。** 1204 年的记忆，使任何神学对话都背负着血债。

**第四层：身份。** 一千年后，「东正教徒」与「天主教徒」已经不只是神学立场，而是族群、语言、文化、家族记忆。**一个希腊人说「我是东正教徒」，他同时说的是「我不是土耳其人」「我不是拉丁人」「我属于这个民族」。**

:::why t="为什么这一章对理解后面的宗教改革至关重要"
因为 1054 年提供了一个**模板**：教义分歧 + 权威冲突 + 政治利益 + 身份固化 = 永久分裂。

1517 年之后发生的事，用的是同一个模板，只是换了主角（路德 vs 罗马）、换了争点（称义 vs 恩典）、换了政治背景（德意志诸侯 vs 皇帝）。**如果你理解了为什么 1054 年无法修复，你就理解了为什么 1517 年也无法修复。** 而这两次分裂的共同点，恰好不是「教义太难」，而是**「没有人有资格裁决，而每一方都认为自己是受害者」**。
:::

### 7.6 反驳谱系

#### 7.6.1 东方对西方的批评（要点）

1. **你们单方面修改了普世信经。** 这是程序上的越权，无论内容对错。
2. **你们的教宗首席权没有古代依据。** 前七个大公会议里，罗马的主教是「第一个」，不是「唯一的裁判」。而且彼得在安提阿也做过主教，为什么安提阿没有首席权？
3. **你们的「教宗不可错误」是 1870 年发明的。** 这使合一在结构上不可能——除非我们接受一个我们从未承认的定义。
4. **你们的炼狱与赎罪券把救恩变成了会计。**
5. **你们在 1204 年屠杀了我们。** 这一条不是神学论证，但它是最有说服力的一条。

#### 7.6.2 西方对东方的批评（要点）

1. **你们把「不变」变成了偶像。** 拒绝任何发展，等于否认圣灵在历史中的引导。
2. **你们的「共融」在实践中变成了民族主义。** 东正教按民族分成希腊、俄罗斯、塞尔维亚、罗马尼亚、保加利亚等教会，互相承认但彼此竞争——**这恰恰证明了「没有元首的共融」会碎成一地。**
3. **你们没有能力召开一次真正的普世会议。** 2016 年的克里特会议，有四个教会（俄罗斯、安提阿、格鲁吉亚、保加利亚）拒绝参加。
4. **你们的「和子」反对，在神学上不能成立**：若子不参与发出圣灵，则圣灵与子的关系就说不清，而这会削弱三位一体的合一。

#### 7.6.3 新教对两者的批评

新教（尤其改革宗与{{浸信会}}）通常认为：

- **教宗首席权完全没有圣经依据**（马太 16:18 的「磐石」指的是彼得的认信，不是彼得本人——这是改革宗的标准解读）。
- **「和子」争议是「过度定义」的典型**：信经没有说，就不该加；但反过来，把它当成分裂的理由，也说明双方都把信经当成了比福音更高的东西。
- **两边的礼仪都过于繁复**，偏离了新约的简单性。

#### 7.6.4 无神论与世俗主义的批评

最锋利的一条：**你们为了一个词（而且双方都承认对方「在神学上可以接受」）分裂了一千年，期间互相绝罚、互相屠杀。这不正说明宗教的本质是权力与身份，而不是真理吗？**

**诚实的回应**：（1）这个批评在很大程度上是对的——**7.2.3 节已经说明，「和子」在教义上可以解决，在权威上不能解决**，这恰好证明权威与身份才是真问题；（2）但它也过于简化：**分裂的代价主要是由普通信徒承担的**，而他们往往比精英更愿意合一（1965 年的撤销绝罚在东正教基层获得了广泛欢迎）；（3）最后一点最尖锐：**如果基督教的核心是「爱」与「合一」，那么这场分裂本身就是对其核心的最有力反证。** 这一点，任何护教都无法回避。

### 7.7 常见误解

:::pit t="关于东西方分裂的四个误解"
**误解一：「1054 年之前双方是一样的」。**
不是。语言、礼仪、神学风格、政教关系在 1054 年之前已经分化了六百年。1054 年只是把既成事实写成了文书。

**误解二：「分裂是因为教义，所以教义解决了就能合一」。**
反了。教义基本已经解决了（和子问题在 1995 年获得官方层面的相互承认），但合一没有发生——**因为障碍是权威与记忆，不是教义。**

**误解三：「东正教是天主教的一个分支」。**
两者都是古代教会的直接继承者，互为「姐妹教会」（1970 年代教宗保罗六世的表述）。东正教不是「分裂出去的少数派」，它在 1054 年时比罗马更富有、更庞大、更有文化。

**误解四：「东正教没有教宗，所以没有权威」。**
东正教有权威，但形式不同：**普世牧首**（君士坦丁堡）在荣誉上居首，各地方教会的宗主教/都主教在各自区域内拥有完整权威，全体以「共融」相连。**这不是「没有权威」，而是「分布式权威」**——代价是难以做统一决策（这正是西方批评的要点）。
:::

### 7.8 尾声：这一章留下的三个教训

1. **教义可以靠学术解决，分裂不能。** 因为分裂的粘合剂是身份、记忆、与制度利益。
2. **程序问题往往比内容问题更难。** 「和子」的内容可以互相承认，但「谁有权加」这个问题无法互相承认。
3. **暴力的记忆无法用神学抵消。** 1204 年的洗劫，在东方记忆里的分量，远超任何一份合一文件。

:::titre
**第二部完。下一部：东西方的两条路（第 8–9 章）**

第二部讲完了教义的三次大爆炸（三位一体、基督论、恩典）。第三部转向**制度与灵修**：东方教会在迦克墩之后如何发展出自己的传统（圣像、静修、神化）；西方教会在罗马权威之下如何走向中世纪（修道院、教宗革命、经院神学）；以及那些在东西方之间被挤压的群体——保加利亚的{{波格米勒派}}、法国的卡特里派、意大利的瓦勒度派、波希米亚的胡斯派。**中世纪不是「黑暗时代」，而是异端最丰富的时代。**
:::

## 第二部派别档案（卡片速查）

第二部涉及的群体比第一部多得多，因为教义越精细，可分裂的方向就越多。下面十张卡片按「三位一体之争 → 基督论之争 → 恩典之争」的顺序排列。

> [[k:阿里乌派 | en:Arians | 4 世纪 | 异端 | 已消亡（结构延续）]]
> **主张**：父是唯一无始的真神；子是被生的、有起点的、本质受造的（虽为最高受造物）；圣灵更低。「曾有一时子不存在。」
> **来历**：318 年亚历山大城长老阿里乌与主教亚历山大冲突；325 年尼西亚会议谴责；此后六十年间其变体多次在帝国境内占上风。
> **要解决的问题**：如何保住神的绝对超越性与独一性？若子与父同等，神是否被「分成两份」？
> **论敌**：亚他那修、加帕多家教父、尼西亚派。
> **所受反驳**：（1）若子是可变的受造物，救恩就来自受造物；（2）早期基督徒已在向耶稣祷告（112 年小普林尼证词）；（3）「受生」不等于「被造」。
> **结局 / 现状**：381 年后在帝国内失势，但日耳曼诸族多先接受阿里乌信仰。今天耶和华见证人的基督论在结构上极为接近。

> [[k:半阿里乌派 | en:Homoiousians | 4 世纪中期 | 折中派 | 已消亡]]
> **主张**：子与父「本质相似」（*homoiousios*），不是「同一本质」。理由：若完全相同，父子之别被抹掉，落入撒伯里乌主义。
> **来历**：尼西亚之后的折中阵营，代表包括巴西尔·安西拉、老底嘉的乔治。人数在 350 年代一度占多数。
> **要解决的问题**：如何在「不冒犯一神论」与「不取消父子之别」之间找到可签字的表述？
> **论敌**：亚他那修派（指其不稳定）、阿诺莫派（指其不够彻底）。
> **所受反驳**：相似到什么程度？若有限则子非真神，若无限则等于同一——「相似」是一个不稳定的中间站。
> **结局 / 现状**：362 年亚历山大会后大量转向「同一本质」，381 年被完全边缘化。它是教义史上「最合理却最不持久」的立场的典型。

> [[k:阿诺莫派 | en:Anomoeans / Eunomians | 4 世纪 | 异端 | 已消亡]]
> **主张**：子与父「不相似」（*anomoios*）。神的本性就是「非受生」，既然子是被生的，他与父在一切方面都不同。
> **来历**：埃提乌斯与欧诺米（约 335–394）创立，是阿里乌主义最激进的一支。
> **要解决的问题**：如果承认任何「相似」，就等于承认父子有共同点，那就还没有彻底保住神的独一。
> **论敌**：巴西流、尼撒的格列高利（写专文驳欧诺米）、拿先斯的格列高利。
> **所受反驳**：欧诺米认为神可以被「非受生」这个定义完全把握，加帕多家教父反驳说神的本质不可穷尽——**这场辩论直接塑造了东方神学的「否定神学」气质**。
> **结局 / 现状**：381 年后被禁，但其「神可以被概念穷尽」的理性主义倾向，在后来各种「神学即科学」的尝试中反复出现。

> [[k:马其顿派 / 敌圣灵派 | en:Pneumatomachi | 4 世纪后期 | 异端 | 已消亡]]
> **主张**：接受子与父同一本质，但否认圣灵的神性，认为圣灵是受造的、次等的存在（或只是神的一种能力/活动）。
> **来历**：常被联系到君士坦丁堡主教马其顿尼乌（Macedonius）。是 4 世纪后期东方最有影响力的反对阵营之一。
> **要解决的问题**：圣灵在圣经里既不被称作「受生」，也不被称作「非受生」，只被称作「发出」——这个第三类的来源方式该怎么归类？
> **论敌**：巴西流（《论圣灵》正是为此而写）、拿先斯的格列高利。
> **所受反驳**：若圣灵不是神，则洗礼公式（「奉父、子、圣灵的名」）中的第三位就不是神，而人却被「奉他的名」受洗——这不合理；且「与父子同受敬拜同受荣耀」在礼仪中早已存在。
> **结局 / 现状**：381 年君士坦丁堡会议在信经中加入完整的圣灵条款，正是为了排除这一立场。

> [[k:阿波利拿里派 | en:Apollinarians | 4 世纪后期 | 异端 | 已消亡]]
> **主张**：基督有人的身体与生命力（*psychē*），但**没有人的理性灵魂**（*nous*）——神的逻各斯取代了它的位置。
> **来历**：老底嘉主教阿波利拿里（约 310–390），亚他那修的朋友与战友。
> **要解决的问题**：如果基督有一个会动摇的理性意志，他还能是无罪的救主吗？一个可能犯罪的人，怎么能替人赎罪？
> **论敌**：加帕多家教父、381 年君士坦丁堡会议。
> **所受反驳**：**「未被取用的，就未被医治」**——若基督没有人的理性灵魂，人的理性就没有被医治，而理性恰是罪最先出问题的地方。**他的对手用了他自己阵营的原则推翻了他。**
> **结局 / 现状**：381 年被谴责后消亡。但它提出的问题（基督的意志是否会挣扎）在 7 世纪的单志论争论中再次爆发。

> [[k:聂斯脱里派 / 东方教会 | en:Church of the East | 5 世纪至今 | 被定异端（学界有修正） | 现存约 60 万]]
> **主张**：基督里神性与人性的联合是「位格性的联合」（*prosōpon*），马利亚生的是「与道联合的那个人」，因此严格说不应称她为「生神者」。明确否认两个位格。
> **来历**：聂斯脱里 428 年任君士坦丁堡主教，431 年被以弗所会议罢免流放；其追随者东迁波斯，在萨珊帝国庇护下建立独立教会。
> **要解决的问题**：如何保住基督完整的人性，同时不把神性说成「由马利亚取得」？
> **论敌**：区利罗、亚历山大派、以弗所会议。
> **所受反驳**：若神性与人性的联合只是「位格性的联合」（两个 *prosōpon*），那基督就是两个人；而「神在基督里与人和好」就变成了神与另一个人和好。
> **结局 / 现状**：成为古代最成功的传教教会之一——635 年传入唐朝长安（**景教**），781 年立《大秦景教流行中国碑》，一度是世界最大的教会之一。今天主要分布在伊拉克、伊朗、叙利亚、印度与全球侨民中。**20 世纪发现的《赫拉克利德斯的市场》显示，聂斯脱里本人可能被误解。**

> [[k:一性论 / 东方正统教会 | en:Oriental Orthodox | 5 世纪至今 | 被迦克墩判为异端 | 现存约 5000 万]]
> **主张**：道成肉身之后，基督只有**一个本性**（*mia physis*）——但这个「一个」是指「一个具体的存在者」，神人二性在其中不相混淆地合一。明确拒绝欧迪奇的「混合/吞没」。
> **来历**：拒绝 451 年迦克墩会议。包括科普特（埃及）、叙利亚、亚美尼亚、埃塞俄比亚、厄立特里亚、印度马兰卡拉等教会。
> **要解决的问题**：如何在保住「一个主体」的同时，不把基督切成两半？区利罗的公式「一个成了肉身的本性」是他们的旗帜。
> **论敌**：迦克墩派（罗马、君士坦丁堡、安提阿部分）、以及欧迪奇派（他们也谴责）。
> **所受反驳**：若只有一个本性，人性就被吞没了；而「两个本性」的表述在你们自己的教父区利罗那里也能找到另一种读法。
> **结局 / 现状**：基督教史上按人口最严重的一次永久分裂。1971 年以来与天主教、东正教签署多份基督论共识声明，**神学分歧已基本解决**，但共融尚未恢复（障碍转为教会论与圣统）。

> [[k:欧迪奇派 | en:Eutychians | 5 世纪 | 异端 | 已消亡]]
> **主张**：道成肉身之后基督只有一个本性；他的人性「像一滴蜜溶进大海」，被神性吞没。
> **来历**：欧迪奇（约 380–456），君士坦丁堡郊外修道院院长，反聂斯脱里的急先锋。448 年被地方会议谴责，449 年「强盗会议」恢复其名誉，451 年迦克墩会议定罪。
> **要解决的问题**：如何彻底排除「两个主体」的可能？答案是：只留一个本性。
> **论敌**：利奥一世（《大卷》）、弗拉维安、迦克墩会议。
> **所受反驳**：若人性被吞没，则基督的人性不是完整的，人性未被医治，救恩落空；且「吞没」使基督既不是神也不是人，而是第三种东西。
> **结局 / 现状**：451 年后消亡。但它的名字成了后世指控东方正统教会的标签——**这是「一性论」这个贬义标签的由来，而东方正统教会明确拒绝欧迪奇的立场。**

> [[k:单志论 | en:Monothelites | 7 世纪 | 异端 | 已消亡（玛若尼派曾被指为此）]]
> **主张**：基督有两个本性，但只有**一个意志**（神性的意志），或只有一个「活动/能量」。
> **来历**：7 世纪由皇帝希拉克略与君士坦丁堡牧首塞尔吉乌斯推动，目的是让一性论者与迦克墩派都能接受，以团结帝国对抗波斯与阿拉伯。
> **要解决的问题**：如果基督有两个意志，它们会不会冲突？会冲突的基督还能是无罪的救主吗？
> **论敌**：耶路撒冷的索夫罗尼乌、大马士革的约翰、罗马的玛尔定一世。
> **所受反驳**：意志属于**本性**而非位格；若基督没有人的意志，则人性不完整，人的意志没有被医治。而两个意志并不冲突——人性意志完全顺服神性意志。
> **结局 / 现状**：680–681 年第三次君士坦丁堡会议定罪。黎巴嫩的玛若尼派长期被指为此派，1182 年与罗马联合时否认。**它留下一个至今未决的哲学难题：必然顺服的意志还是自由的吗？**

> [[k:伯拉纠派 | en:Pelagians | 5 世纪 | 异端 | 已消亡（直觉延续）]]
> **主张**：人性本善且仍健全；亚当的罪只是坏榜样；罪是个别行为不是状态；恩典是外在帮助；完美是可能的。
> **来历**：不列颠修士伯拉纠（约 354–420 后）在罗马传播，支持者包括律师科埃勒司提乌与意大利主教茹利安。
> **要解决的问题**：如果人完全无能，道德努力还有什么意义？如果神命令人做他做不到的事，神还公义吗？
> **论敌**：奥古斯丁、耶柔米、迦太基会议（411、416、418）、以弗所会议（431）。
> **所受反驳**：若人本来有能力，基督何必死？且经验与圣经都显示「知道却做不到」（罗 7 章）——人的意志是被捆绑的。
> **结局 / 现状**：组织消亡，但**伯拉纠的直觉从未消失**：16 世纪伊拉斯谟与路德之争、19 世纪自由主义神学、当代的「自我提升」文化与「不能全怪环境」论述，都是它的后裔。

> [[k:半伯拉纠派 | en:Semi-Pelagians / Massilians | 5–6 世纪 | 被判异端 | 已消亡（立场延续）]]
> **主张**：恩典是先在的，人不能靠自己开始信；但人的意志必须**同意**恩典，而这个同意本身是人的自由行为。
> **来历**：法国南部的马赛派——约翰·卡西安、文森特·勒兰等。「半伯拉纠」是 19 世纪学者造的词，当时并无此名。
> **要解决的问题**：如何在保住「恩典必要」的同时，不取消人的自由与责任？
> **论敌**：奥古斯丁晚年著作、529 年奥兰治会议。
> **所受反驳**：若「同意」是人的贡献，得救就有一小部分是我的功劳，恩典就不是恩典。
> **结局 / 现状**：529 年被谴责，但**天主教的官方立场实际上长期在这条线上**（恩典必要 + 自由合作真实）。1582–1607 年的「恩典之争」中，教宗最后下令双方停止争论——**等于官方承认这个问题无法裁决。**

## 争论的温度计：第二部 {#part2-thermometer}

## 第二部小结：教义的三次爆炸

1. **第一次爆炸（4 世纪）问的是「神是谁」**：一个本质、三个位格。它留下了《尼西亚信经》，以及一套至今仍在使用的形而上学语法。
2. **第二次爆炸（5 世纪）问的是「基督是谁」**：一个位格、两个本性。它留下了《迦克墩定义》，以及一道至今未愈的裂口（东方正统教会）。
3. **第三次爆炸（5 世纪，与第二次同时）问的是「人是谁」**：完全无能，还是仍有能力？它没有留下信经，只留下了奥古斯丁——以及一个 1600 年后被官方宣布「不可裁决」的问题。

而在这三次爆炸之间与之后，还有一条更慢、更安静的分裂在进行：**东西方两个文明，用七百年时间，慢慢长成了两个教会。**

:::titre
**下一部：东西方的两条路（第 8–9 章）**

第三部要讲中世纪的基督教——但**不是**「黑暗时代」的故事。你会看到：东方的静修传统如何在圣山上把「神化」变成一套可操作的方法；西方的修道院如何保存了文明并催生了大学；以及那些被两边同时镇压的群体——保加利亚的波格米勒派、法国的卡特里派、意大利的瓦勒度派、波希米亚的胡斯派。**他们提出的问题（教会是否应该贫穷？平信徒能否读经？暴力是否可以是神圣的？）在宗教改革时全部重新出现，而且至今没有答案。**
:::

# 第三部：东西方的两条路

## 1054 年之后，两个教会变成了两个文明

第 7 章讲的是分裂的**事件**。这一部要讲的是分裂的**后果**：从 11 世纪到 15 世纪，东方与西方各自发展出一套完整的基督教文明，而它们的差别远远超过「和子」这一个词。

一个直观的对照：

- 在**东方**，教会生活的中心是**礼仪与修道**。神学不是一门学科，而是一种祈祷的方式；最权威的神学家是修士（大马士革的约翰、西奈的格列高利、帕拉马斯），最权威的文本是礼仪书与教父集，最受尊崇的地方是**阿索斯山**——一个只有修士的半岛。
- 在**西方**，教会生活的中心逐渐变成**法律与大学**。神学成为一门可以用逻辑方法研究的「科学」（*scientia*），最权威的神学家是大学教授（阿奎那、司各脱、奥卡姆），最权威的文本是《语录》（*Sententiae*）与《神学大全》，最受尊崇的地方是**大学**与**教廷法庭**。

:::why t="这个差别的后果，比任何一条教义都深远"
因为它决定了**「神学争论」在两种文明里意味着什么**。

在东方，一个神学争论会被问：**它是否符合教父的教导？它是否与礼仪一致？它是否能被修士在祈祷中验证？** 神学的裁判者是**传统与祈祷**。

在西方，一个神学争论会被问：**它的论证是否有效？它的定义是否清晰？它能否被分解为命题并逐一检验？** 神学的裁判者是**理性与权威**。

**同一次分裂，两套完全不同的「什么叫有道理」。** 这就是为什么后来新教与天主教能互相争论（它们共享西方的辩论规则），而东正教与西方常常「说不到一起去」（它们连「什么叫论证」都不同）。

这一部要把这两条路各走一遍。**读的时候请记住：本书不是在做优劣判断，而是在解释为什么同一个信仰会长出两个如此不同的身体。**
:::

## 第 8 章：东方——礼仪、圣像与静修 {#ch-8}

### 8.1 拜占庭：皇帝、牧首与「和谐」

拜占庭的教会结构，可以用一个词概括：**{{众议}}**（*symphonia*，和谐）。

它的理想图景是这样的（见于查士丁尼的《新律》与 9 世纪的《埃帕纳戈格》）：

> 帝国由**祭司职**（*sacerdotium*）与**王权**（*imperium*）两部分构成。皇帝负责身体的事、战争与法律；牧首负责灵魂的事、圣礼与教导。二者如同灵魂与身体，应当**和谐协作**，各在自己的领域内。

**但「和谐」在实践中意味着什么？** 这里必须非常直白：

- **皇帝召集大公会议**（325 年尼西亚、381 年君士坦丁堡、431 年以弗所、451 年迦克墩、553、680、787——**全部由皇帝召集**）。
- **皇帝任命与罢免牧首**（查士丁尼、利奥三世、以及后来的皇帝都行使过这个权力）。
- **皇帝定义教义**（查士丁尼亲自写神学论文，680 年的会议决议由君士坦丁四世推动）。
- **皇帝的画像进入教堂**，与基督、圣母、圣徒并列（这在东方是常态，在西方曾引发巨大争议）。

:::pit t="一个常见的误解：东正教是「政教合一」"
更准确的说法是：**东正教发展出了「国家教会」模型，而不是「教权高于政权」或「政教分离」**。

- 它**不是**「政教合一」（教会与国家是两个机构，各有自己的法律与职分）。
- 它**也不是**「教会独立于国家」（皇帝对教会有巨大的实际权力）。
- 它是一个**协作但不对等**的模型：在理论上平等，在实践中皇帝通常占上风。

**代价**：当皇帝支持异端时（如君士坦提乌斯二世支持阿里乌派、利奥三世支持圣像破坏），教会的抵抗非常困难。**优点**：教会与国家不会为了「谁更高」打几百年的仗（这是西方中世纪的核心剧情）。

**这个差别在今天的痕迹**：东正教在民族国家里常常与国家关系密切（希腊、俄罗斯、塞尔维亚），而天主教有一套独立于任何国家的全球行政体系（梵蒂冈）。
:::

**五大宗主教区**（{{五角体制}}，*pentarchia*）：古代教会形成了五个荣誉性的中心——罗马、君士坦丁堡、亚历山大、安提阿、耶路撒冷。理论上，**普世教会的最高权威是这五者的一致**（后来东方的表述是「五个宗主教区 + 普世会议」）。1054 年之后，东方把罗马从名单里划掉，剩下四个；俄罗斯在 1589 年获得第五个位置（「莫斯科牧首区」）。

### 8.2 修道运动：东方的真正心脏

如果只能用一个现象概括东方基督教，那就是**修道**。

**（一）安东尼与独修传统。**
约 251 年，埃及人**安东尼**（Antony the Great）听到福音书中「你若愿意作完全人，可去变卖你所有的」（太 19:21），于是变卖家产，走进沙漠。他在沙漠中住了约 80 年，活到 105 岁。他没有建立任何组织，没有写任何书——但他的存在本身成了一种号召：**成千上万的人跟着走进埃及的沙漠**。

**（二）帕科缪与集体修道。**
**帕科缪**（Pachomius，约 292–348）做了另一件事：他建立了**共同的修道院**（*koinonia*），有会规、有院长、有劳动分工、有固定的祈祷时间。这是「集体修道」（*cenobitic*）的开端，也是后来所有西方修道院制度的祖先。

**（三）巴西流会规。**
{{加帕多家教父}} 中的**巴西流**（Basil of Caesarea）写了两部《会规》（*Regulae*），把修道生活整合进教会生活：修士不是逃离教会的英雄，而是教会内部的**顺服者**；修道院要办医院、孤儿院、学校。**巴西流会规至今仍是东正教修道院的基本规范**，他因此被称为「修道院立法者」。

**（四）阿索斯山。**
{{阿索斯山}}（Mount Athos）是希腊北部的一个半岛，自 963 年大拉伏拉修道院建立以来，**一千多年来从未停止过修士生活**。它被称为「圣山」（*Hagion Oros*），实行自治，禁止任何女性进入（这一禁令至今有效，欧盟也予以尊重）。今天约有 20 所主要修道院，约 2000 名修士。

:::why t="为什么修道在东方是「核心」而不是「补充」"
在西方，修道是教会内部的一种**特殊呼召**（"宗教生活"，与世俗信徒并列）。在东方，修道被理解为**基督徒生活的完满形态**——不是「更高级」，而是「更专注」：修道是把洗礼所要求的全部彻底活出来。

这带来一个后果：**东方的神学主要不是在大学里产生的，而是在修道院里产生的。** 大马士革的约翰、西奈的格列高利、尼科迪默斯、帕拉马斯——全部是修士。而他们的神学方法，不是「论证」，而是**「净化—光照—合一」**：先悔改、洁净心，然后才能认识神。

这就是为什么东方的神学读起来不像论证，而像祈祷。**它认为，一个没有祈祷的人，无法真正理解神学**——这不是反智，而是一种不同的认识论：**关于神的认识，需要认识者自身的转化。**
:::

### 8.3 圣像破坏运动（726–843）：道成肉身的最直接推论

这是东方教会最重要的一次内部危机，也是「道成肉身」教义最实际的一次应用。

**背景**：
- 7 世纪伊斯兰教兴起，占领了埃及、叙利亚、北非。伊斯兰严格禁止图像（虽然古兰经没有明文禁令，但圣训传统很强）。
- 拜占庭在军事上节节败退，一些人认为这是神在惩罚基督徒的偶像崇拜。
- 帝国内部有来自亚美尼亚、叙利亚的「反图像」传统（这些地区受犹太教与伊斯兰影响较深）。
- 726 年，皇帝**利奥三世**下令拆除教堂中的圣像，并颁布诏令禁止敬礼圣像。

**双方论证**：

| 破坏圣像派 | 拥护圣像派 |
|---|---|
| 出埃及记 20:4「不可为自己雕刻偶像」——这是**绝对的**禁令 | 出 20:4 的上下文是禁止**敬拜别神**；且神自己也命令制造基路伯的像（出 25:18） |
| 基督是「不可见的神的像」（西 1:15），若他被画出来，就等于把神性限制在木头上 | 若神真的成了人（{{道成肉身}}），他**就**可以被描绘——**这是道成肉身的直接推论** |
| 敬拜图像就是敬拜木头，是偶像崇拜 | 区分**敬礼**（*proskynēsis*，对像的尊敬）与**崇拜**（*latreia*，唯独对神）；敬礼越过图像归于原型 |
| 基督的神性与人性不可分，所以画基督就是画神，而神不可画 | 可以画基督的**人性**（那正是他取了的部分）；「不可见的道」不可画，但「成了肉身的道」可以画 |

**过程**：

- 726–787：第一阶段破坏。大量圣像、壁画、马赛克被毁。**大马士革的约翰**（在哈里发统治下，皇帝管不到他）写了三篇《驳斥毁坏圣像者》，成为拥护圣像的神学基础。
- 787 年：**第二次尼西亚会议**（第七次大公会议）恢复圣像敬礼，并作出「敬礼 vs 崇拜」的区分。
- 813–843：第二阶段破坏（利奥五世、狄奥斐卢斯）。
- 843 年：摄政皇后**狄奥多拉**恢复圣像，东正教把这一年的第一个主日定为「**正统主日**」（*Triodion* 的第一个主日），至今每年庆祝。

:::why t="为什么这场争论如此重要"
因为它把「道成肉身」从一个抽象教义变成了一件具体的事：**你能否用颜料画出神？**

- 如果答案是「不能」，那么道成肉身就没有真正发生——神仍然距离远到无法被描绘。
- 如果答案是「能」，那么物质（颜料、木头、墙面）就能承载神性的临在——而这正是 {{圣礼}}、{{神化}}、以及整个东方灵修的物质基础。

**这就是为什么东方教会对圣像的坚持，不是「迷信」，而是基督论的一个必然推论。** 787 年会议的决议里有一句极著名的话：

> 「**圣像的尊荣归给原型**」（*hē timē eis to prōtotypon diabainei*）。

这句话是巴西流说的，被会议引用。它的意思是：敬礼的对象不是颜料，而是颜料所指向的那一位。**这个区分极为精微，但它一旦成立，整个物质世界就成了神的透明媒介。**
:::

### 8.4 神秘神学：伪狄奥尼修斯与「否定之路」

东方神学的另一个支柱，是**否定神学**（{{否定神学}}，*via negativa*）。

它的经典文本是《{{伪狄奥尼修斯}}》（*Corpus Areopagiticum*）——一组 6 世纪的作品，作者假托使徒保罗在雅典所归信的「亚略巴古的丢尼修」（徒 17:34）。这些作品包括《论神的名》《神秘神学》《天阶体系》《教阶体系》，构成了整个东方（以及部分西方）神秘神学的骨架。

它的核心方法有三条路：

1. **肯定之路**（*via positiva*）：神是善、是光、是爱、是全能——用受造界最好的词来说神。
2. **否定之路**（*via negativa*）：神不是善（因为我们的「善」太有限）、不是光、不是爱、不是存在——把每一个词都否定掉，因为神超越一切范畴。
3. **超越之路**（*via eminentiae*）：神是「超越善的善」「超越存在的存在」——用「超越」来同时保留与取消前两条路。

:::why t="为什么「否定神学」不是「怀疑论」"
很多人第一次听到「神不是善、不是光、不是存在」时会震惊：这不就是在拆毁信仰吗？

不是。它的逻辑是：**我们所有的词都来自受造界，而神不是受造物，所以任何词用在神身上都必然是「不准确」的。** 否定神学不是否认神是善，而是否认**我们的「善」这个概念能装下神的善**。

一个比喻：你可以用「像火」来形容爱（热烈、燃烧），但火会烧尽、会熄灭，而爱不会。所以严格说，爱「不是火」。**否定神学就是把这个「不是」系统化。**

**它的实践后果极其重要**：如果神彻底不可知、不可言说，那么**任何把神等同于某个概念、某个制度、某个民族的做法，都是偶像崇拜**。这一点使否定神学成为一种持续的批判力量——包括对教会自身的批判。
:::

### 8.5 静修主义与耶稣祷文

在阿索斯山与西奈的修道传统中，发展出一种特殊的祈祷方法：**{{静修主义}}**（*Hēsychasmos*，来自希腊文 *hēsychia*，「静默、安宁」）。

它的核心是**耶稣祷文**（{{耶稣祷文}}）：

> 「**主耶稣基督，神的儿子，怜悯我。**」（*Kyrie Iēsou Christe, huie tou Theou, eleēson me*）

这句话被反复念诵，配合呼吸与坐姿，目的是让心「下降」到自身，达到一种持续的、不需要语言的祈祷状态。保罗「不住地祷告」（帖前 5:17）被理解为这个实践的圣经依据。

**关键人物**：**西奈的格列高利**（Gregory of Sinai，13 世纪）把这套方法从西奈传到阿索斯山；**尼科迪默斯·阿约里特**（Nicodemus of the Holy Mountain，18 世纪）编纂《爱善集》（*Philokalia*），把这套传统系统化，成为东正教灵修的核心文本。

:::note
**《爱善集》**（*Philokalia*）是一部从 4 世纪到 15 世纪的灵修著作选集，由尼科迪默斯与科林斯的马卡里乌斯在 1782 年在威尼斯出版。它在 20 世纪通过俄国的《朝圣者之路》（*The Way of a Pilgrim*）影响了整个西方——包括托马斯·默顿、以及「归心祈祷」（Centering Prayer）运动。**这是东方灵修对现代西方最实质的一次输出。**
:::

### 8.6 帕拉马斯之争（1337–1351）：东方最后一次大教义争论

这是东方教会史上最后一次被定为「大公性」的教义争论，也是最少被中文读者了解的一次。它极其重要，因为它**决定了东正教与天主教在「神如何被人认识」上的根本分歧**。

**（一）争论的起点。**
一位来自意大利卡拉布里亚的修士**巴拉姆**（Barlaam of Calabria）在阿索斯山遇到静修者，看到他们声称在祈祷中「看见非受造的光」（即耶稣在变像山上显现的那种光）。巴拉姆是受西方经院教育的人，他认为这是幻觉、是感官的错觉、是把受造物当神。

**（二）帕拉马斯的回应。**
**格列高利·帕拉马斯**（Gregory Palamas，1296–1359），阿索斯山修士、后来的帖撒罗尼迦主教，给出了一个极为大胆的答案：

> 神有**本质**（*ousia*）与**能量**（*energeia*）的区分。神的**本质**完全不可知、不可分有、不可参与。但神的**能量**——他的生命、他的光、他的恩典——是**非受造的**，并且**可以被分有**。

所以静修者看见的光，不是受造的光，也不是神的本质，而是**神非受造的能量**。

**（三）为什么这个区分是必须的。**

这是全书最精微的一个论证，值得慢慢拆：

- 如果神**完全**不可分有（只有本质）→ 那么 {{神化}} 不可能，人永远无法与神真正联合。整个东方的救恩论崩塌。
- 如果神**完全**可分有（本质也可分有）→ 那么人就能「变成神的本体」，这是泛神论，且神被分割、被受造物吞没。
- 所以必须有一个中间项：**非受造、但可分有的「能量」**。它既保住了神的超越（本质不可知），又保住了神化（能量可分有）。

**（四）结果。**
1341、1347、1351 年的三次君士坦丁堡会议确认帕拉马斯的立场，谴责巴拉姆。帕拉马斯被封为圣徒，东正教把大斋期第二个主日定为「帕拉马斯主日」。

:::why t="为什么这场争论是东西方最深的裂缝（比和子句更深）"
因为它触及了「神与世界的关系」这个最底层的问题：

- **东方的答案**：神在**能量**中真实地临在于世界（尤其在圣礼、圣像、以及修士的祈祷中），但他的**本质**永远不可知。这使世界成为「神的透明媒介」，也使神秘经验成为神学的核心。
- **西方的答案**（尤其经院神学）：神的**恩典**是受造的（*gratia creata*，被造在灵魂里的品质），而神本身是绝对超越的。这个方案保住了神的绝对自由与超越，但代价是：**神与世界之间有一个本体论的距离，而恩典是「受造的桥梁」**。

**1351 年之后，两边在这一点上彻底分道。** 天主教至今没有正式接受「本质—能量」的区分（虽然 20 世纪的一些天主教神学家，如 von Balthasar，对此持开放态度）；东正教则认为这是「正统信仰的试金石」。

一句常被引用的话（出自帕拉马斯派的批评者所总结的立场）：**「如果神没有能量，他就只是一个抽象的概念；如果神的本质可以被分有，他就不是神。」**
:::

### 8.7 1453 之后：俄罗斯与「第三罗马」

1453 年 5 月 29 日，奥斯曼帝国攻陷君士坦丁堡。拜占庭帝国终结，牧首区虽然保留（奥斯曼把它作为「米勒特」制度的一部分），但已失去政治依托。

**东正教的重心北移。** 莫斯科大公国在 1480 年摆脱蒙古统治，逐渐把自己看作东正教的新中心。16 世纪初，普斯科夫的修士**菲洛费伊**（Philotheus of Pskov）提出了著名的「**第三罗马**」理论：

> 「两个罗马已经倒了，第三个正立着，而第四个将不会出现。」

意思是：第一罗马（罗马城）因异端（和子句、教宗首席权）而堕落；第二罗马（君士坦丁堡）因被异教徒攻陷而终结；**莫斯科是第三个、也是最后的罗马**。

**后续发展**：
- 1589 年，莫斯科设立牧首区（第五个宗主教区）。
- 1650 年代，牧首**尼康**推动礼仪改革（统一与希腊原文一致），引发**{{旧礼仪派}}**（*Raskol*，「分裂」）的剧烈反抗。旧礼仪派的领袖**阿瓦库姆**（Avvakum）被流放、最终在 1682 年被烧死。旧礼仪派至今存在（俄罗斯正教旧礼仪派），分为「教士派」与「无教士派」。
- 1721 年，彼得大帝废除牧首制，设立「**圣议会**」（*Most Holy Synod*），由皇帝任命的总检察官实际控制——**东正教在俄罗斯成为国家的一个部门**，直到 1917 年。
- 20 世纪：苏联的迫害（1917–1939 与 1959–1964 两波最烈），数以万计的神职人员死亡；同时出现流亡教会（ROCOR）与「巴黎学派」（以弗洛罗夫斯基、布尔加科夫、洛斯基为代表，把东方的教父传统带入现代西方神学）。
- 1988 年：俄罗斯受洗一千周年，教会复兴。今天俄罗斯正教会是东正教中最大的教会。

### 8.8 东方内部的三大家族（一张表）

| | 东正教（Eastern Orthodox） | 东方正统教会（Oriental Orthodox） | 东方教会（Church of the East） |
|---|---|---|---|
| 与罗马的关系 | 1054 年分裂 | 451 年分裂（拒绝迦克墩） | 431 年分裂（拒绝以弗所） |
| 基督论 | 一位格，两本性（迦克墩） | 一个成了肉身的本性（区利罗式） | 一个位格，两个本性，但联合于一个 *prosōpon* |
| 主要分布 | 希腊、俄罗斯、罗马尼亚、塞尔维亚、保加利亚、格鲁吉亚 | 埃及、埃塞俄比亚、亚美尼亚、叙利亚、印度 | 伊拉克、伊朗、叙利亚、印度、全球侨民 |
| 礼仪语言 | 希腊语、斯拉夫语、罗马尼亚语等 | 科普特语、叙利亚语、亚美尼亚语、吉兹语 | 叙利亚语（以及各地语言） |
| 规模 | 约 2.2 亿 | 约 5000 万 | 约 60 万 |
| 与天主教的关系 | 1965 年撤销绝罚，对话中 | 1971 年起达成基督论共识 | 1994 年起达成基督论共识 |

:::pit t="中文里最容易混淆的一对名词"
**「东正教」**＝Eastern Orthodoxy（接受迦克墩，1054 年与罗马分裂）。
**「东方正统教会」**＝Oriental Orthodox（**拒绝**迦克墩，451 年就分裂了）。

这两个中文名几乎一样，但它们是**两个不同的、互不共融的**教会群体。前者有 2.2 亿人，后者有 5000 万人。很多中文资料把它们混为一谈，这是阅读时最需要小心的地方。

一个记忆法：**「东正教」的「正」指「正统信仰」（*orthodoxia*）；「东方正统教会」的「正统」是同一个词的另一个译法——所以两个名字都是 *orthodox* 的翻译，只是分裂的时间点不同。**
:::

### 8.9 东方的共同特征（十个关键词）

| 关键词 | 含义 | 与西方的对照 |
|---|---|---|
| **礼仪**（*leitourgia*） | 神学的首要场所；「礼仪神学」是东正教神学的核心方法 | 西方更重视讲道与命题陈述 |
| **神化**（*theōsis*） | 救恩的目标是「成为神（分有神的生命）」 | 西方更强调称义（法庭宣告）与成圣（道德更新） |
| **圣像**（*eikōn*） | 物质世界可以承载神性临在 | 西方更警惕图像（尤其新教） |
| **否定神学** | 神超越一切概念 | 西方更信任类比与理性推论（阿奎那的 *analogia entis*） |
| **静修**（*hēsychia*） | 内在的静默与不住的祈祷 | 西方发展出各种默想方法与灵修操练 |
| **众议**（*symphonia*） | 教会与国家协作 | 西方发展出政教冲突与「两把刀」理论 |
| **共融教会论** | 地方教会是完整的教会，彼此共融 | 西方发展出普世管辖与教阶制 |
| **教父传统** | 教父是活的权威，不是历史材料 | 西方经院把教父变成「论证的引文」 |
| **本质与能量** | 神可分有的「能量」与不可知的「本质」 | 西方拒绝这个区分，用「受造恩典」 |
| **复活节**（*Pascha*） | 全年的中心；礼仪年围绕它展开 | 西方同样重要，但教会年历的细节不同 |

### 8.10 争议与反驳

#### 8.10.1 西方对东方的批评

1. **「你们把神学变成了神秘主义。」** 若神不可知、只能被体验，那教义就失去了公共可检验性——任何人都可以说「我在祈祷中看见了」。
2. **「你们的『本质—能量』区分是把神分割了。」** 若神有本质与能量两部分，那么神就不是绝对单纯的——这违反了神的单纯性（*simplicitas Dei*），而那是古典有神论的基石。
3. **「你们的『众议』让教会变成国家的部门。」** 俄罗斯的圣议会、希腊的国家教会，都是这个模型的产物。
4. **「你们的共融在实践中碎成了民族主义。」** 东正教按民族分裂为十几个教会，互相承认却彼此竞争（2016 年克里特会议有四个教会拒绝参加）。
5. **「你们没有能力做决定。」** 没有元首的共融，在需要统一决策时会瘫痪。

#### 8.10.2 东方对西方的批评

1. **「你们的经院神学把神变成了一个可以被论证的对象。」** 阿奎那的「五路证明」在东方看来是把神放进逻辑的笼子。
2. **「你们的『受造恩典』使人永远无法真正与神联合。」** 若恩典是受造的，那么人与神的联合永远是「隔着东西」的。
3. **「你们的教宗是教皇，不是主教。」** 普遍管辖权与不可错误，在古代教会没有依据。
4. **「你们的和子句是单方面篡改普世信经。」** 程序问题比内容问题更严重。
5. **「你们的圣像太物质化，雕像近乎异教。」** 东方坚持二维圣像。

#### 8.10.3 无神论与世俗主义对两者的批评

- **「一个把七百年花在争论一个词（和子）、一个把三百年花在争论一幅画（圣像）的宗教，其核心不可能是真理，只可能是身份。」**
- **「修道主义是逃避世界。」** 一群最健康的人躲进沙漠与半岛，不事生产，靠捐赠生活——这是社会资源的浪费。
- **「神化是危险的。」** 「你们要成为神」这个说法，在世俗伦理看来是人类傲慢的极致。

**东方的回应**（这里只给最有力的几条）：
- 关于修道：**修士提供的是「另一种可能性」**——一个不以生产与消费为轴心的生活。这在任何时代都是对主流价值的批判。而且修道院在历史上承担了教育、医疗、保存文献、农业技术传播的功能（西方尤其明显，见第 9 章）。
- 关于神化：**「成为神」不是「取代神」，而是「被神的生命充满」**。它要求的是极度的谦卑（因为你必须承认自己不是神，才能被神充满），而不是傲慢。
- 关于争论：**教义争论之所以激烈，恰恰因为参与者相信它是真的。** 一个什么都不值得分裂的宗教，也不会值得相信。

### 8.11 常见误解

:::pit t="关于东方教会的四个误解"
**误解一：「东正教就是天主教加一点香火气」。**
差得远。救恩论（神化 vs 称义）、神学方法（礼仪 vs 经院）、权威结构（共融 vs 教宗）、恩典观（能量 vs 受造恩典）全部不同。

**误解二：「东正教不重视圣经」。**
相反。东正教的礼仪中圣经的篇幅极大（全年读经循环、大量诗篇），而且**礼仪本身就是圣经的编排**。它反对的不是圣经，而是「用圣经反对教会传统」这个方法。

**误解三：「东正教没有神学，只有礼仪」。**
它有的是**另一种神学**：不是命题体系，而是「在礼仪与祈祷中被认识的神学」。帕拉马斯之争证明它完全有能力做极精微的形而上学论证。

**误解四：「圣像就是画像，敬礼就是拜」。**
「敬礼」（*proskynēsis*）与「崇拜」（*latreia*）的区分是 787 年会议的核心定义。东正教徒会明确说：我们不拜木头，我们敬礼那位被画出来的。
:::

## 第 9 章：西方——教宗、大学、十字军与异端（1046–1517） {#ch-9}

### 9.0 1077 年 1 月，卡诺莎城堡外的雪地

一个国王在雪地里站了三天。

他是**亨利四世**，神圣罗马帝国皇帝。他穿着苦衣、赤脚，站在意大利北部的卡诺莎城堡门外，请求教宗**格里高利七世**赦免他的绝罚。三天后，教宗让他进来，撤销了绝罚。

**这是西方历史上最有名的一幕权力戏。** 它被后世反复引用（「去卡诺莎」*going to Canossa* 成为「屈辱求和」的代名词），也常被讲成「教权战胜王权」的标志。

但真实的历史比这个画面复杂得多：亨利四世在获得赦免后立刻重整旗鼓，几年后带兵攻入罗马，把格里高利七世赶出城，另立了一个教宗。**格里高利七世死在流亡中，而亨利四世最终保住了皇位。**

:::why t="为什么这一幕是理解西方中世纪的钥匙"
因为从 1075 年到 1300 年，西方的核心政治问题就是：**教宗与皇帝，谁有最终权威？**

这个问题在东方从未出现（因为皇帝明显在上），在西方却撕裂了整个中世纪。而它对基督教的后果极其深远：

- 它迫使西方发展出一套**独立的教会法律体系**（教会法 *ius canonicum*），使教会成为一个「国家中的国家」。
- 它使「世俗权力」与「属灵权力」成为两个可以互相制衡的领域——**这是现代西方「权力分立」「有限政府」「公民社会」概念的一个远祖**（哈罗德·伯尔曼、查尔斯·泰勒等人都论证过这一点）。
- 它也使西方教会成为一个**高度法律化、行政化、司法化**的机构——而这正是后来宗教改革攻击的对象（「罗马的法庭」「教会的律法主义」）。

**同一个特征，既是西方自由的来源，也是西方分裂的原因。** 这就是本章要讲的全部。
:::

### 9.1 教宗革命（1046–1122）：从「罗马的贵族傀儡」到「欧洲的最高法庭」

**（一）10 世纪的教廷有多糟。**

10 世纪的教廷是罗马贵族家族的玩物。这一段历史有一个不太好听的名称：「**娼妇政治**」（*pornocracy*，18 世纪学者造的贬义词），指 904–964 年间罗马的实际权力掌握在几个贵族妇女手中（最著名的是玛洛齐亚与她的女儿）。这一时期的教宗由地方家族推举，许多人私生活混乱，职位可以买卖。

**两个核心弊端**：

- **买卖圣职**（{{买卖圣职}}，*simonia*）：用钱买教会职位。名字来自行邪术的西门（徒 8:18–24）。
- **平信徒授职**（*lay investiture*）：世俗领主（国王、贵族）把戒指与牧杖授予主教，象征职位由他授予。这在实践上意味着**主教是领主的附庸**，而不是教会的牧者。

**（二）改革的动力：修道院。**
910 年，阿基坦公爵威廉建立**克吕尼修道院**（Cluny），并做了一件关键的事：**把它直接置于教宗的保护之下，不受任何地方领主与主教的管辖。** 这个安排使克吕尼获得了独立性，也让它在两个世纪内发展成一个拥有上千所分院的网络。

克吕尼的改革者提出的口号是「**教会的自由**」（*libertas ecclesiae*）——不是「信仰自由」（这是现代概念），而是**教会不受世俗权力控制**。

**（三）格里高利七世与《教宗训令》。**
1073 年，希尔德布兰（Hildebrand）成为教宗**格里高利七世**。1075 年，他发布了《**教宗训令**》（*Dictatus Papae*）——27 条简短的命题，其中最惊人的几条是：

> - 罗马教会由主独自建立。
> - 唯有罗马主教可以正确地被称为「普世的」。
> - **唯有他有权罢免主教，或在必要时将他们调任。**
> - **他可以罢免皇帝。**
> - 所有君王应当亲吻他的脚。
> - 他可以被任何人上诉，但他自己不能被审判。
> - **罗马教会从未犯错，也永远不会犯错（依据圣经）。**
> - 教宗可以解除臣民对不义君主的效忠誓言。

**这份文件不是一份教义定义，而是一份政治宣言。** 它把「教宗首席权」从荣誉性的第一位，推到了「普世君主」的位置。

**（四）授职礼之争（1076–1122）与卡诺莎。**
亨利四世拒绝接受，召集德国主教会议罢免教宗；教宗则绝罚皇帝、解除其臣民效忠。德意志的诸侯趁机反叛（他们本来就想削弱皇权），亨利四世被迫在 1077 年去卡诺莎求和。

**1122 年的《沃尔姆斯协约》**（*Concordat of Worms*）是妥协：主教由教会的教士团自由选举，但选举须在皇帝或其代表面前进行；皇帝放弃属灵的授职（戒指与牧杖），但保留对主教世俗财产与职权的授予（权杖）。**这是「两把刀」理论的一次实际分割。**

:::why t="「教宗革命」这个说法的分量"
历史学家**哈罗德·伯尔曼**（Harold Berman）在《法律与革命》里提出：1075–1122 年的教宗革命，是**西方现代法律体系的真正起源**。他的论证是：

1. 教廷为了与皇帝斗争，发展出一套**独立的、成文的、系统的教会法**（格拉提安的《教令集》，约 1140 年）。
2. 这套法律体系的存在，迫使世俗君主也发展出自己的成文法（以竞争管辖权）。
3. 于是西方出现了**多个并存的司法管辖权**（教会法、王室法、商法、城市法、庄园法），而多元管辖意味着**任何一方都不是绝对的**——这就是「法治」与「有限政府」的结构性起源。

这个论证极具争议，但它指出了一个重要事实：**西方教会的高度法律化，不是「腐败」的产物，而是「与世俗权力斗争」的产物。** 而这份遗产，后来被宗教改革反过来攻击（「罗马的律法主义」），又被现代世俗国家继承（「法治」）。

**一个机构为了自由而变成法庭，然后因为变成法庭而失去人心。** 这条线索贯穿整个中世纪后期。
:::

### 9.2 修道院、大学与经院神学：西方理性的诞生

**（一）本笃会规（约 530）。**
**本笃**（Benedict of Nursia，约 480–547）在意大利的蒙特卡西诺写下了《会规》（*Regula Benedicti*），共 73 章，核心是「**祈祷与工作**」（*ora et labora*）。它的特点是**极度务实**：规定修士每天几时起床、读多少诗篇、吃多少面包、穿什么衣服、如何接待客人、如何纠正过失。它废除了极端的苦修（不鼓励无节制的禁食与自残），强调**稳定**（*stabilitas*，终身留在同一所修道院）与**顺服**。

**为什么它是西方文明的基石之一**：本笃会修士抄写古籍、开垦荒地、改进农业技术、办学校。**中世纪的许多古典文献，是因为修士抄写才留存下来的。** 而「按钟点祈祷」的制度（*horarium*）训练出了一种**可计量时间**的习惯——一些历史学家（如兰德斯）认为这是机械钟与近代时间观念的先声。

**（二）克吕尼（910）与西多（1098）。**
- **克吕尼**：改革派，强调礼仪的庄严与繁复（大量弥撒、长时间祈祷），一度极盛，后因财富积累而松懈。
- **西多会**（Cistercians）：1098 年由莫莱姆的罗伯特建立，主张**回到本笃会规的字面**：简朴、劳动、拒绝装饰。**伯尔纳·克莱尔沃**（Bernard of Clairvaux，1090–1153）是它最著名的代表，也是 12 世纪欧洲最有影响力的人物（他能让国王与教宗都听他的）。

**（三）托钵修会（13 世纪）：一次革命。**
- **方济各会**：**方济各**（Francis of Assisi，1181/82–1226），富商之子，放弃全部财产，赤脚传道，主张**绝对贫穷**与对一切受造物的爱（《太阳颂》）。1209 年获教宗批准。
- **多明我会**：**多明我**（Dominic de Guzmán，约 1170–1221），卡斯蒂利亚神父，为了对抗卡特里派（见 9.4）而建立，主张**用讲道与学术**对抗异端，因此极度重视教育——**多明我会士几乎垄断了中世纪的大学神学教席**（阿奎那、大阿尔伯特、埃克哈特都是多明我会）。

:::why t="托钵修会为什么是一次革命，也是一次危机"
**革命的部分**：他们彻底拒绝了「修道院拥有财产」这个千年惯例。方济各会甚至争论「是否可以有共同财产」（*usus pauper* 之争）。他们不住在乡间修道院，而在城市里乞讨、讲道、照顾病人。**这是中世纪第一次有「自愿的、彻底的贫穷」成为一种群众运动。**

**危机的部分**：一个绝对贫穷的修会，直接质疑了教会自身的财富。**当方济各说「基督与使徒一无所有」时，他实际上是在说：教宗与主教们的富有不符合福音。** 这就是为什么方济各会内部很快分裂（「属灵派」*Spirituals* 主张绝对字面的贫穷，被教宗判为异端），也是为什么 14 世纪的「使徒兄弟会」与后来的宗教改革都在同一个问题上爆发。

**方济各本人从未攻击教会**——他极其顺服，甚至说「如果教宗是魔鬼，我也要顺服他」。但他所代表的那个直觉，是无法被制度吸收的。
:::

**（四）大学的诞生与经院方法。**

| 时间 | 大学 | 特点 |
|---|---|---|
| 1088 | 博洛尼亚 | 以**法律**闻名（学生行会管理，学生雇佣教授） |
| 约 1150 | 巴黎 | 以**神学**闻名（教师行会，后来成为「巴黎大学」） |
| 1167 | 牛津 | 从巴黎分离出来（英法冲突导致英国学者回国） |
| 1209 | 剑桥 | 从牛津分离 |
| 1218 | 萨拉曼卡 | 西班牙 |

**经院方法**（{{经院神学}}）的核心是三步：

1. **诵读**（*lectio*）：读一段权威文本（圣经、教父）。
2. **提问**（*quaestio*）：提出一个问题（例如「神是否只有一个？」）。
3. **辩论**（*disputatio*）：列出正反双方的论证（*videtur quod*……*sed contra*……），然后用「**我回答**」（*respondeo dicendum*）给出解决方案，最后逐一回应反方论证。

:::why t="为什么这个方法本身就是一场革命"
因为它在形式上**预设了「反方也有道理」**。

一个经院论著的标准结构是：先列出所有**反对**自己结论的论证（而且要用最强的形式表述），然后才给出自己的答案。这意味着：**你必须先公正地表述你的对手，才有资格反驳他。**

这在教义史上是极其罕见的。古代教父的论著（如亚他那修的《驳阿里乌》）通常是**先给对手定罪，再讲理由**；而经院方法要求**先给对手最强的论证**。这是一种知识伦理上的进步——它使「异端的论证」得以被保存与讨论，而不是被销毁。

**代价**：它使神学变得极度技术化，只有受过训练的人才能参与。**当神学变成一门专业，平信徒就被排除在外**——而这正是宗教改革要攻击的（「一个普通信徒凭什么不能读懂圣经？」）。
:::

**（五）阿奎那与「信仰与理性的和谐」。**
**托马斯·阿奎那**（Thomas Aquinas，1225–1274）的《神学大全》（*Summa Theologiae*）是西方神学的最高成就。它的基本立场是：

> **恩典不摧毁本性，而是成全本性**（*gratia non tollit naturam, sed perficit*）。

由此推出：**理性与信仰不冲突**。理性可以证明一些事（神存在、神唯一），但另一些事只能靠启示（三位一体、道成肉身、创造）。理性不能证明的信条，也不能被理性驳倒。

他的「五路证明」（*Quinque Viae*）——从运动、因果、偶然性、完善等级、目的性推出神的存在——至今仍是自然神学的标准范本。

**（六）唯名论的反弹。**
14 世纪，**邓斯·司各脱**（Duns Scotus，约 1266–1308）与**奥卡姆的威廉**（William of Ockham，约 1287–1347）对托马斯主义发起攻击：

- **司各脱**：神的意志优先于神的理性；「善」不是因为符合某种理性秩序，而是因为神如此命令。这被称为**唯意志论**（voluntarism）。
- **奥卡姆**：**{{唯名论}}**——「共相」（如「人性」）不是真实的实体，只是名称（*nomina*）。真实存在的只有个别事物。

**为什么唯名论重要**：如果只有个别事物是真实的，那么「本质」「本性」「实体」这些词就都失去了形而上学的重量。**而整个三位一体与基督论的语法，正是建立在这些词上的。** 所以唯名论在逻辑上会侵蚀教义的基础——奥卡姆本人是虔诚的信徒（他说三位一体不能靠理性证明，只能靠信仰接受），但他开启的路线，最终导向了宗教改革对「经院神学」的全面否定（路德是奥卡姆派的学生）。

:::note
**一条重要的思想线索**：教宗革命（法律化）→ 大学（专业化）→ 经院神学（技术化）→ 唯名论（解构）→ 宗教改革（反叛）。

每一步都是对前一步的反动，而每一步都在加深同一个问题：**神学越来越精确，也越来越远离普通信徒。** 1517 年的爆发，不是因为这栋建筑不结实，而是因为它太高了——高到大多数人已经看不见它在说什么。
:::

### 9.3 十字军：当朝圣变成圣战

**（一）1095 年 11 月，克莱蒙。**
教宗**乌尔班二世**在法国克莱蒙的会议上发表了一篇演说（原文有多个版本，措辞不同，但核心一致）：号召西方骑士去东方，帮助拜占庭皇帝对抗塞尔柱突厥人，并**解放耶路撒冷**。他给出的承诺是：

> 凡参加者，**罪得赦免**。

**这句话是十字军的核心机制**：它不是「一场战争」，而是**一次替代性的朝圣**。朝圣本身就是一种赎罪行为（去圣地、去圣徒墓），而武装朝圣把「走路的功德」变成了「打仗的功德」。

:::why t="为什么「赎罪」这个机制如此危险"
因为它把**暴力的功德化**制度化了。

- 在奥古斯丁的 {{正义战争}} 理论里，参战者的动机必须是爱（保护无辜者），且必须是不得已的最后手段。战争本身是**悲剧**。
- 而在十字军的赎罪承诺里，参战本身就是**功德**——你杀的人越多（在正确的目标上），你的罪赦免得越彻底。

**这个转变在神学上是一次断裂**，虽然当时的人并不觉得。**它也为后来的赎罪券提供了原型**：用某种行为（捐款、朝圣、参战）换取罪的赦免。1517 年路德攻击的，正是这个机制的成熟形态。
:::

**（二）主要十字军（简表）**

| 次序 | 时间 | 结果 |
|---|---|---|
| 第一次 | 1096–1099 | 攻占耶路撒冷（1099 年 7 月 15 日），**屠杀城中穆斯林与犹太人**（编年史记载血流没膝） |
| 第二次 | 1147–1149 | 失败 |
| 第三次 | 1189–1192 | 萨拉丁 1187 年收复耶路撒冷；狮心王理查与萨拉丁达成协议（基督徒可朝圣） |
| **第四次** | **1202–1204** | **攻陷并洗劫君士坦丁堡**（见第 7 章） |
| 阿尔比十字军 | 1209–1229 | **对内的十字军**，镇压法国南部的卡特里派 |
| 儿童十字军 | 1212 | 传说中数万儿童前往，多数死于途中或被卖为奴（史料有限，真实性有争议） |
| 第五至第九次 | 1217–1272 | 均失败；1291 年阿卡陷落，十字军国家终结 |

**军事修会**：圣殿骑士团（1119）、医院骑士团（约 1113）、条顿骑士团（1198）。它们把「修士的誓愿」与「骑士的战斗」结合——**这是「神圣暴力」最纯粹的体制化形态**。

### 9.4 中世纪的异端：三个群体

中世纪的异端与古代的异端有本质区别：**古代的异端主要争教义（三位一体、基督论），中世纪的异端主要争教会本身（财富、权力、圣礼的有效性、平信徒的地位）。**

#### 9.4.1 波格米勒派（Bogomils，10 世纪，保加利亚）

- **主张**：物质世界是魔鬼所造；基督与撒但是「兄弟」（一个善、一个恶）；拒绝圣礼、十字架、圣像、教堂建筑；反对教会的财富与等级。
- **来历**：10 世纪在保加利亚兴起，可能受了保罗派（Paulicians，7 世纪亚美尼亚的二元论派别）的影响。
- **为什么在保加利亚流行**：农民对贵族与教会压迫的反抗。它是一个**社会运动**，不只是神学。
- **扩散**：通过巴尔干—意大利的商路传到西欧，被认为是卡特里派的源头之一（但现代学者对此有争议）。
- **结局**：被拜占庭与保加利亚教会镇压，但残余延续到 15 世纪奥斯曼征服。

#### 9.4.2 卡特里派 / 阿尔比派（Cathars，12–13 世纪，法国南部）

这是中世纪最著名、也最惨烈的异端。

**主张**：
- **彻底的二元论**：善神创造灵界，恶神（撒但）创造物质世界。物质、身体、食物、性、婚姻都是恶的。
- **否认道成肉身**：基督不可能有真正的肉身（{{幻影说}}）；他只是一个「显现」。
- **否认圣礼**：物质的东西不能传递恩典，所以洗礼、圣餐都无效。
- **拒绝旧约的大部分**（因为旧约的神创造物质世界，是恶神）。
- **唯一的圣礼是「consolamentum」**（安慰礼，按手礼），通常在临终时施行。
- **两级信徒**：**完美者**（*perfecti*，完全禁欲、不吃肉、不杀生、不撒谎）与**信者**（*credentes*，可以过普通生活，临终再受安慰礼）。

**为什么它有吸引力**：
1. 它**直接攻击教会的财富与腐败**——完美者赤贫、圣洁，与富有的主教形成鲜明对比。
2. 它**给了女性一个位置**——女性可以成为「完美者」，可以讲道、可以主持礼仪。这是中世纪唯一一个给予女性宗教权威的群众运动。
3. 它**简洁**：没有繁复的礼仪、没有圣像、没有炼狱、没有赎罪券。对一个厌倦了教会机器的人来说，这是一种解放。
4. 它**解释了恶的问题**（与 {{摩尼教}} 完全同构）。

**镇压**：
- **1209–1229 年的阿尔比十字军**：教宗英诺森三世发动，由法国北方的贵族执行。**贝济耶城（Béziers）1209 年 7 月陷落，全城约 2 万人被杀**（包括天主教徒）。据传教宗使节阿尔诺·阿马尔里克说：「杀吧，神知道谁是祂的人。」
- **蒙特塞居尔（Montségur）围城（1243–1244）**：约 200 名「完美者」拒绝认罪，被集体烧死在火刑场上。
- **宗教裁判所**（1231 年起，见 9.5）系统性地清除残余。

**结局**：14 世纪初基本消失。**它是中世纪唯一一个被彻底消灭的群众性异端**——而其手段（十字军 + 宗教裁判所）成为后世镇压的模板。

#### 9.4.3 瓦勒度派（Waldensians，1170 年代，里昂）

- **主张**：**彼得·瓦勒度**（Peter Waldo，一个富商）在 1173 年经历了一次信仰转变，变卖家产分给穷人，然后：
  - 坚持**平信徒讲道**（不需要神职授权）；
  - 坚持**绝对贫穷**；
  - 坚持**用白话（普罗旺斯语）读圣经**——他出钱请人翻译了新约。
- **为什么被禁**：1179 年教宗亚历山大三世口头允许他们的贫穷誓言，但**禁止他们未经授权讲道**。瓦勒度派拒绝服从——**他们认为「传福音」是每个基督徒的义务，不需要主教批准。**
- **1184 年被绝罚**，此后被镇压，但**没有消失**。
- **它存续至今**：意大利的「瓦勒度教会」（*Chiesa Valdese*）是唯一一个从中世纪存续到今天的「前宗教改革」运动。1532 年它加入了新教阵营，今天约有 3 万信徒，是意大利最重要的新教教会。

:::why t="瓦勒度派为什么是宗教改革的真正预演"
它提出的三个主张，正好是 1517 年之后新教的核心：

1. **唯独圣经**：白话圣经、平信徒可以自己读。
2. **平信徒的祭司职分**：讲道不需要神职授权。
3. **反对教会财富**：贫穷是福音的要求，不是「劝告」。

**它比路德早了 340 年。** 而它的命运也预示了宗教改革的命运：**被绝罚、被镇压、但活下来。**

一个重要的对比：**胡斯（见 9.6）被烧死，但他的运动在波希米亚活了下来；瓦勒度派被镇压，但活到了今天；卡特里派被彻底消灭。** 三者的差别不在教义，而在**是否有地方贵族的军事保护**（波希米亚贵族保护胡斯派，法国南方的贵族保护不了卡特里派，阿尔卑斯山谷的地形保护了瓦勒度派）。
:::

### 9.5 宗教裁判所：一台为「思想」设计的机器

**（一）中世纪宗教裁判所（1231 年起）。**
由教宗**格里高利九世**建立，最初是为了对付卡特里派。它的关键创新是：**把「异端」从一个「行为」变成了一个「身份」。**

- **告发**：任何人都可以告发，告发者身份保密。
- **审讯**：被告不知道原告是谁，无法对质。
- **酷刑**：1252 年教宗英诺森四世允许使用酷刑（但有严格限制：一次不得致死、不得见血）。
- **判决**：认罪者轻罚（朝圣、穿十字衣）；不认罪但被认定有罪者，交给**世俗权力**执行火刑（教会不「杀人」，但「交出」——这是一个技术性的责任规避）。
- **没收财产**：告发者与审判者可以分得一部分。**这是整个系统最腐败的部分。**

**（二）西班牙宗教裁判所（1478 年起）。**
由西班牙国王斐迪南与女王伊莎贝拉请求设立，**由王室控制，而不是教廷控制**。它的主要对象是**改宗者**（*conversos*，被迫改宗的天主教徒犹太人）与**摩里斯科人**（改宗穆斯林），目的是查明他们是否「暗中仍守旧俗」。它更政治化、更官僚化，也更残酷。

**（三）关于数字。**
一个必须澄清的常见夸张：**宗教裁判所烧死的人数，远少于流行印象。** 现代研究（如亨利·凯门、爱德华·彼得斯）估计，西班牙宗教裁判所在 300 多年间处死约 3000–5000 人（不是数十万）。中世纪宗教裁判所处的死刑人数更少（数千人量级）。

:::pit t="关于宗教裁判所的三个误解"
**误解一：「宗教裁判所杀了数百万人」。**
没有史料支持这个数字。它是一个**低效率、程序繁琐、依赖地方合作**的机构，其实际处死人数远小于现代战争或同期世俗法庭。**但它的可怕之处不在于数量，而在于原则**：它第一次建立了一套**以「思想正确」为罪名的司法程序**，且这套程序后来被世俗国家继承（20 世纪的极权审判与此有结构上的亲缘）。

**误解二：「宗教裁判所是中世纪黑暗的象征」。**
它主要活跃于 **13 世纪之后**（即中世纪的「高峰期」，不是「黑暗期」），而且它的程序（书面记录、上诉权、辩护人）在当时是相对「先进」的。它的黑暗不在于「不守法」，而在于**它守的是一部把思想定为罪的法律**。

**误解三：「新教没有宗教裁判所」。**
新教也处死异端：加尔文在 1553 年处死塞尔维特（反三位一体论者），茨温利在 1527 年处死再洗礼派，英国在 16–17 世纪处死天主教徒与清教徒。**宗教不宽容是那个时代的共性，不是天主教的专利。**
:::

### 9.6 公会议主义与胡斯：宗教改革的彩排

**（一）西方大分裂（1378–1417）：三个教宗。**
1378 年，枢机团选出意大利人乌尔班六世，法国枢机不满，另选克雷芒七世（驻阿维尼翁）。此后出现**两个教宗互相绝罚**，1409 年比萨会议又选出第三个。**三个教宗同时声称自己是彼得的继承人**，而每个都有世俗君主支持（法国支持阿维尼翁，英国支持罗马，等等）。

**这是「教宗首席权」神学最尴尬的时刻**：如果教宗是教会的元首，而三个教宗互相绝罚，那么谁在领导教会？

**（二）公会议主义（{{公会议主义}}）。**
为了解决这个危机，巴黎大学的学者（让·热尔松、皮埃尔·戴利）提出：**普世会议的权威高于教宗**（*concilium est supra papam*）。理由是：教宗不是一个「君主」，而是教会的一个「职分」；当职分本身出问题时，教会（通过大公会议）有权纠正它。

**康斯坦茨会议（1414–1418）** 执行了这个理论：废黜三个教宗，选出马丁五世，结束分裂。**这是公会议主义的巅峰，也是它的终点**——因为新教宗立刻反悔，1460 年教宗比约二世发布《Execrabilis》通谕，禁止「向普世会议上诉」。**1870 年第一次梵蒂冈会议正式定义教宗不可错误，等于彻底埋葬了公会议主义。**

:::why t="公会议主义的失败为什么是宗教改革的直接原因"
因为它在 1415 年**烧死了胡斯**——而胡斯是带着「安全通行证」来的。

**这件事摧毁了「教会可以自我纠正」的信用。** 一百年后，路德面对同样的处境时，他说的话几乎是胡斯的重演：「我要向普世会议上诉。」而罗马的回答也是一样的：**没有可以上诉的会议，只有教宗。**

**换句话说：如果康斯坦茨会议没有烧死胡斯、如果公会议主义成功了，那么 1517 年的路德可能就不需要脱离罗马。** 因为一个「可以召开会议纠正教宗」的教会，有内部修复的可能；而一个「教宗不可错误」的教会没有。
:::

**（三）约翰·{{威克里夫}}（约 1330–1384）。**
牛津大学教授，被称为「宗教改革的晨星」。他的主张：

- **否认教宗的首席权**（他说教宗可能是被预定下地狱的人）。
- **否认变体论**（他认为圣餐中基督是「象征性」临在）。
- **主张圣经是唯一权威**，并推动把圣经译成英文（**威克里夫圣经**，1382–1395，从拉丁文武加大译本译出）。
- **反对教会的财富**，主张教会应回到使徒的贫穷。
- **预定论**：教会由被预定的人组成，而不是由可见的制度组成（这与多纳图派的「真教会」直觉同构）。

**他的影响**：他的思想传到波希米亚（通过布拉格大学），直接影响了胡斯。1415 年康斯坦茨会议谴责他，1428 年他的遗骨被掘出焚烧、骨灰撒入河中。

**（四）扬·胡斯（约 1369–1415）与波希米亚。**
布拉格大学校长、伯利恒礼拜堂的讲道者。他接受威克里夫的许多主张，并加上了一个本地的火药桶：**他是捷克人，而布拉格的大主教与许多德意志商人、教士是德意志人。** 于是他的神学争论与**民族冲突**完全缠绕在一起。

**胡斯的「四条款」**（布拉格四条款，1420）：
1. 神的道应自由传讲。
2. 圣餐应以饼和酒两种形式分给所有信徒（**「圣杯」**成为胡斯派的标志）。
3. 神职人员应放弃财富与世俗权力。
4. 一切重罪都应依法惩罚，不论其身份。

**1415 年 7 月 6 日，胡斯在康斯坦茨被烧死。** 他被告知：只要撤回主张就可以活命。他回答（据记载）：

> 「我若撤回，就是背弃我所引用的圣经与教父。**我不能违背我的良心。**」

**后果**：
- 波希米亚贵族叛乱，**胡斯战争（1419–1434）**爆发。这是一场以农民与市民为主体的军事革命，胡斯派甚至发展出「战车堡垒」战术，多次击败十字军。
- 胡斯派内部分裂：**圣杯派**（*Calixtines*，温和，主要是贵族与市民）与**塔博尔派**（*Taborites*，激进，主张{{千禧年}}与社会平等）。
- **1436 年巴塞尔协定**（*Compactata*）：圣杯派与罗马达成妥协（允许平信徒领杯），塔博尔派被孤立并在 1434 年的利帕尼战役中被自己人击败。
- **胡斯派存续**：1458–1471 年波希米亚国王乔治·波德布拉德是胡斯派；1620 年白山战役后波希米亚被强制重新天主教化，但**摩拉维亚教会**（Moravian Church，1457 年由胡斯派中的「波希米亚弟兄会」发展而来）存续至今，是全球性的新教宗派。

:::note
**路德在 1519 年的莱比锡辩论中说了一句著名的话**：「我们全都是胡斯派，而保罗与奥古斯丁也是。」这句话在当时是极大的挑衅（胡斯是被公会议烧死的异端），但它准确地指出了一个事实：**胡斯所争的问题（圣经的权威、平信徒的地位、教会的财富、圣餐的形式）正是路德所争的问题。** 一百年的间隔，没有改变问题的形状。
:::

### 9.7 萨沃纳罗拉（1452–1498）：一个先于路德的改革者，却烧在同一个城市

**吉罗拉莫·萨沃纳罗拉**（Girolamo Savonarola）是多明我会修士，1491 年起在佛罗伦萨讲道，猛烈攻击教宗亚历山大六世（罗德里戈·波吉亚，以腐败与家族野心著称）与美第奇家族的财富。

他的讲道极具煽动性：他宣称神审判将至，呼吁悔改、烧毁奢侈品与「虚妄的书画」（**「虚荣的篝火」**，1497 年，波提切利据说亲手烧了自己的画作）。1494 年美第奇家族被驱逐，他实际上成为佛罗伦萨的领袖，建立了一个神权共和国。

**1497 年他被绝罚，1498 年被捕、以异端与分裂罪审判，与两名同伴一起在佛罗伦萨的领主广场被绞死并焚烧。**

:::why t="萨沃纳罗拉为什么重要：他证明了同一套批评可以走向完全不同的方向"
萨沃纳罗拉与路德有许多相似：都攻击教宗的腐败、都强调圣经、都预言审判、都获得民众支持。

但他们的方向**完全相反**：
- 萨沃纳罗拉是**苦修主义**的：他要求更严格的禁欲、更频繁的斋戒、更彻底的道德净化。他的理想是「一个更纯洁的中世纪」。
- 路德是**反苦修主义**的：他攻击的正是「靠苦修与功德称义」这个体系，主张人只能靠恩典。

**这个对比说明：对教会的批评本身没有固定方向。** 「教会太腐败了」可以推出「回到更严格的律法」（萨沃纳罗拉、清教徒的一部分），也可以推出「律法本身做不到，只能靠恩典」（路德）。**这就是为什么宗教改革不是一个运动，而是十几个互相冲突的运动。**
:::

### 9.8 争议与反驳

#### 9.8.1 东正教与东方教会对西方中世纪的批评

- **「教宗把自己变成了君主。」** 1075 年的《教宗训令》与 1870 年的「不可错误」，在古代教会没有依据。
- **「十字军是福音的反面。」** 一个说「爱你的仇敌」的宗教，发动了两百年的「圣战」，并在 1204 年洗劫了另一个基督教城市。
- **「你们的经院神学把信仰变成了辩论。」** 用亚里士多德去论证神，是把神放进逻辑的笼子。
- **「你们的宗教裁判所是制度化的不宽容。」** 东方没有宗教裁判所（虽然也有对异端的镇压，但没有这样的司法机器）。

#### 9.8.2 新教对西方中世纪的批评（这是最重要的一组）

- **「教宗制度是一个政治建构，不是圣经的教导。」**
- **「赎罪券是把救恩变成商品。」** 十字军的赎罪承诺是它的原型。
- **「经院神学用哲学取代了福音。」** 路德称亚里士多德为「那个该死的异教徒」。
- **「公会议主义失败了，说明这个体系没有自我修复的能力。」** 康斯坦茨烧死胡斯，就是证据。
- **「教会法取代了圣经，成为实际的权威。」** 路德烧掉了《教令集》。

#### 9.8.3 无神论与世俗主义对中世纪的批评

- **「一千年的历史，最好的一面是修道院抄书，最坏的一面是火刑柱。」**
- **「教宗与皇帝的斗争，本质是两个权力集团争夺税收与土地，神学只是口号。」**
- **「十字军证明：一神论宗教必然走向暴力。」** 这个论证（从一神论的排他性推出暴力）在当代很有影响（如 Jan Assmann 的「摩西的区分」）。
- **「宗教裁判所证明：任何声称拥有绝对真理的机构，都会发展出镇压的机制。」**

**诚实的回应**（本节只列最有说服力的几条）：
- **关于十字军**：现代中世纪史学（如 Jonathan Riley-Smith、Christopher Tyerman）普遍认为，十字军参与者的**宗教动机是真实的**（不是纯粹的掠夺），而这一点反而使问题更严重——**真实的敬虔可以驱动暴行**，这比「坏人做坏事」更值得深思。
- **关于一神论与暴力**：Jan Assmann 的论点受到大量批评（多神教社会也有大规模暴力，如罗马的角斗、亚述的屠城）。**更准确的说法是：任何把「我们 vs 他们」绝对化的体系（宗教的、民族的、意识形态的）都会产生暴力，一神论只是其中一种形式。**
- **关于「黑暗时代」**：中世纪不是黑暗的。大学、医院、银行、机械钟、眼镜、风车、哥特式建筑、以及现代法律体系的许多要素都产生于这一时期。**「黑暗时代」这个说法本身是文艺复兴的人文主义者发明的贬义词**（用来抬高自己）。

### 9.9 常见误解

:::pit t="关于西方中世纪的四个误解"
**误解一：「中世纪的人以为地球是平的」。**
这是 19 世纪的发明（Washington Irving 在写哥伦布传记时编造的）。中世纪的大学普遍教授地球是球形的（托勒密与亚里士多德的地理著作是中世纪的标准教材），托马斯·阿奎那明确说地球是圆的。

**误解二：「教宗与皇帝一直在打仗」。**
两者更多是**合作与谈判**，冲突集中在几个特定时期（1076–1122、1300 前后、14 世纪）。日常状态下，主教既是教会的牧者也是皇帝的封臣，双方都从这个安排中获益。

**误解三：「宗教裁判所是教宗控制全欧洲的恐怖机器」。**
它依赖地方政权与告发者的合作，效率低下，且在多数地区存在时间有限。**真正系统性、官僚化的，是 15 世纪之后的西班牙宗教裁判所（由王室控制），不是中世纪的教廷裁判所。**

**误解四：「中世纪的异端都是「原始的新教徒」。**
卡特里派不是。他们的二元论、否认物质世界、否认道成肉身，与任何新教宗派都相距极远。**把他们说成「新教的先驱」，是 16 世纪新教论战者与 19 世纪浪漫主义共同制造的误读。** 真正与宗教改革有直接血脉关系的，是**瓦勒度派**与**胡斯派**。
:::

**下一章：宗教改革（第 10 章）**

1517 年 10 月 31 日，一个奥古斯丁修会的修士在维滕堡教堂门口贴出了一份拉丁文的《九十五条论纲》，讨论「赎罪券的效力」。他以为这只是一次学术辩论的邀请。

三十年后，欧洲的地图被重新画过，数以万计的人死去，一个新的文明形态（「新教」）诞生，而基督教从一个统一的教会，变成了一个拥有数万个宗派的家族。

**下一章要讲的，不是「路德反对腐败」这个简化版故事，而是一个更令人不安的问题：为什么一个关于「人称义」的技术性争论，会导致整个欧洲的分裂？**
:::

## 第三部派别档案（卡片速查）

第三部的「派别」有两种：一种是**神学立场**（圣像破坏派、帕拉马斯派），一种是**社会运动**（卡特里派、胡斯派）。后者尤其要注意：它们不只是「信错了」，而是**一群人对教会权力结构的具体反抗**。

> [[k:圣像破坏派 | en:Iconoclasts | 726–843 | 被定为异端 | 已消亡]]
> **主张**：教堂中不得有圣像，敬礼圣像就是偶像崇拜。基督的神性与人性不可分割，因此画基督就是把神性限制在木头上。
> **来历**：726 年皇帝利奥三世下令拆除圣像；813–843 年第二次破坏运动。可能受伊斯兰与犹太教反图像传统、以及帝国内亚美尼亚/叙利亚背景的影响。
> **要解决的问题**：出埃及记 20:4 的绝对禁令如何与「道成肉身」协调？如果神成了人，人能画他吗？
> **论敌**：大马士革的约翰、大马士革的狄奥多尔、787 年第二次尼西亚会议、843 年的皇后狄奥多拉。
> **所受反驳**：出 20:4 的上下文是禁止敬拜别神，且神自己命令造基路伯的像；若神真的成了肉身，他就可以被描绘——**这是道成肉身的直接推论**。且「敬礼」与「崇拜」有严格区分。
> **结局 / 现状**：843 年被彻底击败，东正教把那一年的第一个主日定为「正统主日」至今庆祝。**但破坏派的担忧从未消失**：新教宗教改革在 16 世纪进行了欧洲史上最大规模的圣像破坏（「清教圣像破坏」），理由几乎与 8 世纪完全相同。

> [[k:帕拉马斯派 / 静修派 | en:Palamites / Hesychasts | 14 世纪 | 东正教正统 | 现存]]
> **主张**：神有**本质**（不可知、不可分有）与**能量**（非受造、可分有）的区分。修士在祈祷中看见的「光」是神非受造的能量，不是受造物，也不是神的本质。
> **来历**：阿索斯山的静修传统；格列高利·帕拉马斯（1296–1359）在 1337–1351 年间回应巴拉姆的批评，1341/1347/1351 年三次君士坦丁堡会议确认其立场。
> **要解决的问题**：如果神完全不可分有，则 {{神化}} 不可能（东方救恩论崩塌）；如果本质可分有，则神被分割（泛神论）。必须有一个中间项。
> **论敌**：巴拉姆（Barlaam of Calabria）、阿金迪诺斯、尼基弗鲁斯·格雷戈拉斯；以及后来的天主教经院神学。
> **所受反驳**：若神有本质与能量两部分，则神不是绝对单纯的，违反神的单纯性（*simplicitas Dei*）——这是古典有神论的基石。且「非受造的能量」在逻辑上如何区别于「神自己」？
> **结局 / 现状**：1351 年后成为东正教的官方教义，帕拉马斯被封圣，大斋期第二个主日为「帕拉马斯主日」。**这是东正教与天主教至今最深的教义裂缝之一**，比和子句更难对话。

> [[k:波格米勒派 | en:Bogomils | 10–15 世纪 | 异端 | 已消亡]]
> **主张**：物质世界是魔鬼所造；基督与撒但是「兄弟」（一善一恶）；拒绝圣礼、十字架、圣像、教堂建筑；反对教会财富与等级。
> **来历**：10 世纪保加利亚，神父**波格米尔**（Bogomil，「蒙神怜爱者」）发起，可能受 7 世纪亚美尼亚保罗派影响。
> **要解决的问题**：如果神是善的，为什么世界这么坏、教会这么富？它的答案是：世界不是善神造的，而教会已经背叛了福音。
> **论敌**：保加利亚与拜占庭教会、皇帝亚历克修斯一世（曾烧死其领袖巴西尔）。
> **所受反驳**：彻底的二元论使道成肉身与圣礼失去意义；拒绝婚姻与肉食否定了创造的美好；其「两个神」的立场与 {{摩尼教}} 同构，早已被古代教会判为异端。
> **结局 / 现状**：被镇压，残余延续到 15 世纪奥斯曼征服。它被认为是西欧 {{卡特里派}} 的思想源头之一（但现代学者对传播路径有争议）。

> [[k:卡特里派 / 阿尔比派 | en:Cathars / Albigensians | 12–14 世纪 | 异端 | 已被消灭]]
> **主张**：彻底二元论——善神造灵界，恶神（撒但）造物质。物质、身体、婚姻、食物都是恶的。否认道成肉身（基督只是「显现」）、否认圣礼、拒绝旧约的大部分。唯一圣礼是「安慰礼」（*consolamentum*）。分「完美者」（*perfecti*，严格禁欲）与「信者」（*credentes*）两级。
> **来历**：12 世纪在法国南部（朗格多克）与意大利北部兴盛，中心是阿尔比城。社会基础是地方贵族与市民对北方法国与罗马教会的双重反抗。
> **要解决的问题**：恶从何而来？教会为什么这么富？如果物质是恶的，那么教会的财富、圣像、圣物、土地就都是恶的。
> **论敌**：教宗英诺森三世、多明我会（为对抗它而创立）、{{宗教裁判所}}。
> **所受反驳**：若物质是恶的，则创造主是恶的，则道成肉身不可能，则圣礼无效，则复活无意义——整个基督教被拆掉。且「完美者」的禁欲在实践中无法普遍化（若人人不生育，人类就断绝）。
> **结局 / 现状**：**被彻底消灭**——阿尔比十字军（1209–1229，贝济耶屠城约 2 万人）、蒙特塞居尔围城（1244，200 名完美者被集体烧死）、宗教裁判所（1231 起）系统清除。它是中世纪唯一被完全消灭的群众性异端。

> [[k:瓦勒度派 | en:Waldensians / Vaudois | 1170 年代至今 | 被绝罚 | 现存约 3 万]]
> **主张**：平信徒有权讲道（不需神职授权）；绝对贫穷是福音的要求；用白话读圣经（瓦勒度出资翻译新约）；后来接受 {{预定论}} 与 {{圣礼}} 的简化形式。
> **来历**：里昂富商**彼得·瓦勒度**（Peter Waldo）约 1173 年变卖家产分给穷人，开始传道。1179 年教宗允许其贫穷誓言但禁止其讲道，他拒绝服从。
> **要解决的问题**：福音要求贫穷，而教会富有——这矛盾怎么解决？且「传福音」是每个基督徒的义务，为什么要主教批准？
> **论敌**：里昂大主教、教宗、{{宗教裁判所}}。
> **所受反驳**：未经授权的讲道会导致教义混乱（教会的确有此担忧，且历史上多次被证实）；绝对贫穷若成为普遍要求，则教会无法维持其教育、慈善、礼仪功能。
> **结局 / 现状**：**唯一一个从中世纪存续至今的「前宗教改革」运动。** 阿尔卑斯山谷的地形保护了它。1532 年加入新教阵营。今天意大利的瓦勒度教会（*Chiesa Valdese*）约有 3 万信徒，是意大利最重要的新教教会，以社会公义与政教分离的立场著称。

> [[k:罗拉德派 | en:Lollards | 14–16 世纪 | 被定为异端 | 已消亡]]
> **主张**：跟随威克里夫——否认教宗首席权、否认变体论、主张圣经是唯一权威、反对教会财富与修道制度。核心是**用英文读圣经**。
> **来历**：威克里夫在牛津的追随者，14 世纪末开始在农村巡回讲道。名字可能来自中古荷兰语 *lollaerd*（「喃喃念经者」）。
> **要解决的问题**：为什么普通人不能读圣经？为什么圣经是拉丁文，而人民说的是英语？
> **论敌**：英国教会、亨利四世（1401 年《焚杀异端法》*De heretico comburendo*）、康斯坦茨会议（1415 年谴责威克里夫）。
> **所受反驳**：平信徒自行解经会导致无穷的派别（这一点后来被宗教改革的历史「证实」）；且译本的准确性无法保证。
> **结局 / 现状**：1401 年后被镇压，1414 年的「老城堡叛乱」（Oldcastle's Revolt）失败后基本消失。**但{{罗拉德派}}的英文圣经为 1611 年钦定本铺路。**但**威克里夫圣经**（1382–1395）是第一部完整的英文圣经，为 1611 年钦定本铺路。

> [[k:胡斯派 | en:Hussites | 15 世纪 | 被绝罚 | 演变为摩拉维亚教会等]]
> **主张**：布拉格四条款——（1）神的道自由传讲；（2）平信徒领杯（饼与酒）；（3）神职人员放弃财富与世俗权力；（4）重罪依法惩罚，不论身份。**「圣杯」是他们的标志。**
> **来历**：扬·胡斯（约 1369–1415）在布拉格接受威克里夫的思想，加上捷克民族对德意志教士的反抗。1415 年在康斯坦茨被烧死（尽管有安全通行证）。
> **要解决的问题**：教会腐败与民族压迫如何同时解决？平信徒在圣餐中是否被剥夺了基督的血？
> **论敌**：康斯坦茨会议、教宗、神圣罗马帝国、以及胡斯派内部的激进派（塔博尔派）。
> **所受反驳**：圣餐只领饼是教会的古老惯例（其实东西方不同）；否认教宗的权威会导致无政府；用武力建立「神的国度」（塔博尔派）会导致暴政。
> **结局 / 现状**：胡斯战争（1419–1434）击败五次十字军；1436 年巴塞尔协定让圣杯派与罗马妥协；塔博尔派在利帕尼战役（1434）被自己人消灭。1620 年白山战役后波希米亚被强制重新天主教化。**但摩拉维亚教会（1457）存续至今**，是全球性新教宗派。路德 1519 年说：「我们全都是胡斯派。」

> [[k:旧礼仪派 | en:Old Believers, Raskol | 17 世纪至今 | 分裂派 | 现存约数百万]]
> **主张**：拒绝 1650 年代尼康的礼仪改革（划十字用两指而非三指、阿利路亚唱两次而非三次、行列方向、圣像风格、拼写「耶稣」的方式等）。**他们不是反对教义，而是反对「改变」。**
> **来历**：1653 年起牧首尼康为统一俄罗斯礼仪与希腊原文而改革；1666–67 年大会议谴责反对者。领袖阿瓦库姆（Avvakum）被流放，1682 年被烧死。
> **要解决的问题**：如果教会的礼仪是神圣的，谁能改变它？如果希腊人改了，俄罗斯该跟吗？**「第三罗马」若也堕落了，正统在哪里？**
> **论敌**：俄罗斯正教会、沙皇（索菲亚摄政、彼得大帝）。
> **所受反驳**：礼仪形式不是教义，统一有利于普世共融；拒绝一切改变等于把「习惯」当成「信仰」。
> **结局 / 现状**：数百万人存续至今，分为「教士派」（有主教传承）与「无教士派」（无神职，自行主持礼仪）。**它是「礼仪即身份」这一机制最纯粹的案例**：一个划十字用几根手指的问题，造成了三百多年的分裂。

> [[k:东方礼天主教会 | en:Eastern Catholic Churches | 16 世纪至今 | 与罗马联合的东方教会 | 现存约 1800 万]]
> **主张**：保留东方礼仪、圣像传统、已婚神父（多数）、以及自己的法典（*Codex Canonum Ecclesiarum Orientalium*），同时承认罗马主教的首席权与教义。共 23 个「自治教会」（*sui iuris*），包括马龙派、乌克兰希腊礼天主教会、梅尔基塔礼、加色丁礼、叙利亚-马拉巴礼、叙利亚-马兰卡拉礼等。
> **来历**：从 16 世纪起，一批东方教会因政治与文化压力（奥斯曼统治、拉丁传教士的活动）与罗马联合。关键事件：1596 年布列斯特联合（乌克兰）、1701 年马龙派正式联合、1552 年马拉巴礼分裂。
> **要解决的问题**：**东方基督徒能否既保留自己的礼仪传统，又与罗马共融？** 这是「合一」的一个具体实验。
> **论敌**：东正教与东方正统教会（视之为「挖墙脚」）；天主教内部的拉丁化派（要求他们放弃东方礼仪）。
> **所受反驳**：（1）东正教认为这些联合是政治压力下的产物，不是真正的神学共识（「联合主义」*uniatism* 是一个贬义词）；（2）1993 年 Balamand 文件承认「联合主义」不再是合一的模式；（3）它们内部长期存在「拉丁化」与「去拉丁化」的拉锯（梵二后多数回归东方礼仪）。
> **结局 / 现状**：约 1800 万信徒，是梵二「合一运动」的重要成果，也是东正教对天主教最不满的一点。{{东方礼天主教会}}示范的「不同礼仪 + 同一信仰 + 一个首脑」路径，正是今天东正教与天主教对话的核心争点。**它示范了一条「不同礼仪 + 同一信仰 + 一个首脑」的合一路径——而这条路是否可行，正是东正教与天主教对话的核心争点。**

> [[k:公会议派 | en:Conciliarists | 14–15 世纪 | 被教宗否决 | 已消亡]]
> **主张**：**普世会议的权威高于教宗**（*concilium est supra papam*）。当教宗本身出问题（异端、分裂）时，教会有权通过大公会议纠正他。
> **来历**：1378–1417 年「西方大分裂」（三个教宗）迫使巴黎大学的学者（热尔松、戴利）提出这个理论。康斯坦茨会议（1414–18）执行了它，废黜三个教宗、选出马丁五世。
> **要解决的问题**：如果教宗是元首，而三个教宗互相绝罚，谁在领导教会？**必须有高于教宗的机制。**
> **论敌**：教宗马丁五世及其继任者、后来的教宗至上论者。
> **所受反驳**：若会议高于教宗，那么谁召集会议、谁监督会议？会议本身也会犯错（康斯坦茨烧死胡斯就是一个例子）；且会议的代表性无法保证（投票权、派系操纵）。
> **结局 / 现状**：1460 年教宗比约二世《Execrabilis》通谕禁止「向会议上诉」；1870 年梵一会议定义「教宗不可错误」，彻底埋葬公会议主义。**它的失败是宗教改革的直接原因之一**：一个无法自我纠正的体系，只能靠外部冲击改变。

## 争论的温度计：第三部 {#part3-thermometer}

|---|---|---|---|

| **神如何被人认识** | 1337 年巴拉姆在阿索斯山见到「非受造的光」 | 巴拉姆（这是幻觉，神不可分有）／帕拉马斯（本质不可知，能量可分有） | 东正教与天主教最深的教义裂缝；「神秘经验能否验证」的现代问题 |
| **教会能否拥有财富** | 10 世纪克吕尼改革；1173 年瓦勒度变卖家产；1209 年方济各 | 修道理想（贫穷是完满）／教会现实（财富是必要）／卡特里（物质即恶） | 一切「简朴教会」运动；解放神学的「优先选择穷人」； prosperity gospel 的反面 |
