| **教宗与皇帝谁更高** | 1075 年《教宗训令》；1077 年卡诺莎 | 教宗（两把刀，可罢免皇帝）／皇帝（神授君权） | 西方的政教分立、有限政府、法治；也解释了为什么东方没有这个问题 |
| **教宗能不能被审判** | 1378–1417 年三个教宗 | 公会议派（会议高于教宗）／教宗至上派 | 1460 年禁令、1870 年「不可错误」；宗教改革的「无法上诉」困境 |
| **暴力能否是神圣的** | 1095 年克莱蒙的赎罪承诺；1204 年洗劫君士坦丁堡 | 正义战争（悲剧性必要）／圣战（功德性行为）／和平主义（拒绝一切暴力） | 十字军的历史记忆；今天「正义战争」与「正义和平」之争 |
| **异端该不该用暴力清除** | 1209 年阿尔比十字军；1231 年宗教裁判所 | 镇压（保护灵魂与社会）／宽容（麦子与稗子同长） | 宗教宽容的诞生（洛克、伏尔泰）；今天「言论自由 vs 仇恨言论」的同构问题 |
| **礼仪能不能改** | 1653 年尼康改革；1666 年大会议 | 改革派（统一与理性）／旧礼仪派（礼仪即信仰） | 旧礼仪派三百年分裂；今天礼仪之争（梵二后的拉丁弥撒、当代的敬拜风格之争） |

:::note
**第三部的温度计有一个共同点**：几乎每一行都不是「神学命题之争」，而是**「谁有权决定」之争**。能不能画圣像、能不能讲道、礼仪能不能改、异端该不该镇压——这些问题的背后都是同一个问题：**权威在哪里？**

这正是第三部到第四部的桥梁。**1517 年的问题，本质上就是这一整张表的总结：「谁有权说这是福音？」**
:::

## 第三部小结：两条路，同一个问题

- **东方**把权威放在**礼仪与传统**里：不改，因为礼仪是神圣的；不定义，因为神超越定义；不集中，因为共融不需要元首。代价是难以决策，优点是极少分裂（东正教两千年只有几次大分裂）。
- **西方**把权威放在**法律与教宗**里：定义、裁决、立法、审判。代价是不断的分裂与暴力，优点是有自我修正的可能（大学、公会议、以及最终的宗教改革）。
- **但两条路最后都撞上同一堵墙**：**当权威本身成为问题时，谁能裁决？**
  - 东方：帕拉马斯赢了，但赢了之后就没有再争论的余地（1351 年之后东正教几乎没有新的教义争论）。
  - 西方：公会议主义输了，于是问题被推到了 1517 年——而这一次，没有会议可以召开，只有决裂。

:::titre
**下一部：宗教改革及其后裔（第 10–13 章）**

这是全书最长、也最暴力的一部。你会看到：一个关于「人称义」的技术性争论如何变成一场欧洲战争；路德、加尔文、茨温利、重洗派、英国国教如何在彼此之间也打得不可开交；三十年战争如何杀死三分之一的中欧人口；以及为什么「新教」从来不是一个教会，而是几万个互相指责的教会。
:::

# 第四部：宗教改革及其后裔

## 1517 年 10 月 31 日，一扇教堂的门

维滕堡是德意志东部一座小城，人口约 2000。它的「城堡教堂」（*Schlosskirche*）门上有一块告示板，按当时的惯例，大学的神学辩论通知就贴在这里。

1517 年 10 月 31 日（万圣节前夕），一位 33 岁的奥古斯丁修会修士、维滕堡大学的神学教授**马丁·路德**（Martin Luther）贴出了一份拉丁文的文件，题为《**关于赎罪券效力的九十五条论纲**》（*Disputatio pro declaratione virtutis indulgentiarum*）。

他用的语言是**拉丁文**——学术语言，不是给普通人看的。他的意图是**邀请学术辩论**，不是发动革命。他一共提出了 95 条命题，其中大部分是给同行看的、技术性的、关于「赦免的确定性」与「教宗权柄的界限」的讨论。

**他没有想到的是**：有人把它译成德文、印成传单，几周内传遍德意志，几个月内传遍欧洲。四年后他被开除教籍，五年后他被帝国通缉，三十年后欧洲一半的国家脱离罗马，一百年后一场战争杀死了中欧三分之一的人口。

:::why t="为什么这一章是全书最长的一部"
因为宗教改革是基督教史上**规模最大、影响最广、宗派最多**的一次分裂。今天世界上约 9 亿新教徒，分布在数万个宗派里，全部可以追溯到 16 世纪这几十年的几个决定。

但更重要的原因是：**宗教改革是「本书所有主题的总汇」**。

- 第 4 章的三位一体之争 → 神学的语法（*ousia*、*hypostasis*）在这里被重新使用（「基督的神人二性」如何与「圣餐的临在」相关）。
- 第 5 章的基督论 → 直接决定了圣餐之争（路德 vs 茨温利）。
- 第 6 章的奥古斯丁与伯拉纠 → 就是路德与伊拉斯谟之争的剧本。
- 第 7 章的权威问题（谁说了算）→ 在这里变成「教宗 vs 圣经」。
- 第 9 章的公会议主义失败 → 直接导致「没有可以上诉的法庭」。

**换句话说：宗教改革不是一个新问题，而是把过去一千五百年的所有问题同时引爆。** 这就是为什么它如此惨烈，也如此重要。
:::

## 第 10 章：路德与德国宗教改革（1517–1555） {#ch-10}

### 10.1 赎罪券：一台成熟的机器

要理解《九十五条论纲》，必须先理解它攻击的东西——**{{赎罪券}}** 的运作机制。

**（一）神学的骨架。**
中世纪晚期的赎罪理论是这样的：

1. 罪得赦免（*culpa*，罪咎）靠告解圣事（认罪 + 神父赦罪）。
2. 但罪的**暂罚**（*poena temporalis*）仍然存在——你仍然需要在今生或{{炼狱}}中承受惩罚。
3. 教会有「**功德宝库**」（*thesaurus meritorum*）：基督与圣徒多余的功德，由教宗管理。
4. 教宗可以把这份宝库中的功德，以「赎罪券」的形式分配给信徒，**免除暂罚**。

**（二）这台机器在 1517 年为什么开足马力。**
- 教宗**利奥十世**（出身美第奇家族）需要钱建**圣彼得大教堂**（一个极度昂贵的工程）。
- 美因茨大主教**阿尔布雷希特**（Albrecht of Brandenburg）为了获得这个职位，向教廷支付了一大笔「**圣职费**」（*pallium*），并向**富格尔银行**（Fugger）借了巨款。
- 教宗允许他在自己的教省推销赎罪券，收入对半分——**一半还富格尔的贷款，一半给罗马建教堂**。
- 推销员中最著名的是多明我会士**台策尔**（Johann Tetzel），他的广告词（据传，未必原话）是：

> 「**钱币在箱中一响，灵魂就从炼狱里跳出来。**」

:::why t="为什么这句话（不管真假）是致命的"
因为它把「救恩的确定性」变成了「可购买的确定性」。

而这正好击中了路德最深的焦虑。路德后来回忆说，他年轻时最大的恐惧是：**「我怎么知道我做的够不够？」** 他守斋、禁食、彻夜祷告、频繁告解——但他从未获得确定感。他恨的不是「教会贪婪」（虽然他也恨），而是**「用行为换取赦免」这个结构本身**——因为只要救恩取决于我的表现，我就永远无法确定。

所以《九十五条论纲》的真正锋刃不在「腐败」，而在于它第 27、28、32 条那样的句子：

> 「他们（赎罪券的推销者）传讲说，灵魂一旦从炼狱中出来，就不再有罪咎与刑罚……**这是人的说法，不是福音。**」
> 「那些相信可以用赎罪券换取救恩确定性的人，将永远与他们的教师一同被定罪。」

**换句话说：路德攻击的不是「卖得太贵」，而是「这个交易本身不可能成立」。**
:::

### 10.2 路德的神学突破：一个被翻译问题困住的人

路德（1483–1546）的个人经历是理解他神学的钥匙，但必须小心：他自己的回忆（尤其晚年《桌边谈话》）经过美化与重塑，不能完全当作史实。

**（一）《塔上经验》（约 1513–1518）。**
路德在维滕堡修道院的塔楼书房里，反复思考罗马书 1:17：「**因为神的义正在这福音上显明出来；这义是本于信，以至于信。如经上所记：义人必因信得生。**」

他遇到的困难是：**「神的义」**（*iustitia Dei*）如果指「神那惩罚罪人的公义」，那福音就不是好消息——它只是宣判坏消息。他恨这个词。

然后他有了那个著名的转折（他的原话）：

> 「我终于明白了：**神的义，是指义人靠神的恩赐（即信）而活的那一个义**……就是神的怜悯，借以在信心中称我们为义。于是我觉得自己完全重生了，天堂的门为我敞开。」

**这就是「因信称义」的发现**：神的义不是**要求**我们的标准，而是**赐给**我们的礼物。

**（二）《称义》的机制：归算 vs 注入。**

这是宗教改革最核心的技术分歧，必须讲清：

| | 天主教（特伦托会议，1547） | 路德宗／新教 |
|---|---|---|
| 称义是什么 | **使**人成为义（*iustificatio* 是「使之正义化」） | **宣告**人为义（法庭式的 *forensis*） |
| 义从哪来 | 恩典**注入**人心（*gratia infusa*），人真的变好 | 基督的义**归算**给信徒（*iustitia imputata*），人本身仍是罪人 |
| 信徒的状态 | 逐渐被更新，变得更公义 | **「同时是义人与罪人」**（*simul iustus et peccator*） |
| 信心的作用 | 是称义的起点与根基 | 是**接受的器官**（*organum*），不是功德 |
| 行为的作用 | 称义之后的行为是称义的**表现与增长** | 行为是称义的**果子**，不是原因 |

:::pit t="一个几乎所有人都误会的点：路德不是说「不用做好人」"
这是最常见、也最不公正的指控。

**路德的立场是**：善行是得救的**必然结果**，但不是得救的**条件**。一个好树必然结好果子（太 7:17），但树不是因为结果子才成为好树。他说：「信心是活的，它会行善；但使它称义的不是它的善行。」

**他的担忧**：如果善行是称义的条件，那么我就永远无法确定自己得救了——因为总有更多该做的，而且我的动机永远不纯。**「唯独信心」的核心不是「轻视道德」，而是「给良心一个确定的落脚点」。**

**批评者的回应**（天主教、以及后来的很多思想家）：这个「确定感」是靠把「义」变成外部的、法律性的东西换来的。代价是：**人被宣告为义，但并没有真的变好**——而这在伦理上是危险的（「反正神已经算我为义了」）。路德的回答是：真正接受这恩典的人，不可能不想变好；但这仍然是**经验上的期望**，不是**逻辑上的保证**。
:::

**（三）律法与福音。**
路德最重要的解经框架：圣经里有两类话语——**律法**（命令、要求、定罪）与**福音**（应许、赐予、赦免）。

- 律法的功能是**揭露罪**（把镜子举到人面前），不是**使人得救**。
- 福音的功能是**赐予义**。
- **两者不能混**：把福音变成「新律法」（「你必须相信得够虔诚」）是最常见的讲道错误。

**（四）十字架神学 vs 荣耀神学。**
1518 年的《海德堡辩论》里，路德提出：**神是在苦难与十字架的「反面」中启示自己的**（*theologia crucis*）。人凭本性想找的是一个「荣耀的、符合我们期待的神」（*theologia gloriae*）——一个奖赏好人、惩罚坏人的神。但真正的神在十字架上**隐藏**了自己，以软弱与羞辱的方式显现。

这个论点极其深刻：它意味着**神不能被人的道德直觉直接把握**。凡是我们觉得「神应该这样」的，很可能只是我们的投射。

**（五）两个国度。**
路德区分「属灵的国度」（用福音、恩典、爱来治理）与「属世的国度」（用法律、刀剑、强制来治理）。基督徒同时属于两者：作为个人，他「不抵抗恶人」（太 5:39）；作为官员，他必须用刀剑维持秩序。**这个区分后来成为西方政教关系的一个基本框架**，但也带来了问题（见 10.4）。

**（六）圣餐：同体论。**
路德拒绝 {{变体论}}（饼酒的实体变成基督的身体），但**拒绝**茨温利的「纯纪念说」。他主张：基督的身体与血**真实地**临在于饼与酒「之中、之下、连同」（*in, mit, unter*），而饼仍然是饼。他的依据是字面解经：「这是我的身体」（*hoc est corpus meum*）。

:::why t="为什么圣餐问题比「称义」更让人分裂"
因为称义是「个人与神的关系」，而圣餐是「共同体的边界」。

如果你认为圣餐只是纪念，那么任何基督徒都可以一起领；如果你认为饼真的是基督的身体，那么「谁有资格领」就成了一个生死攸关的问题（林前 11:27「不按理吃喝的，就是吃喝自己的罪」）。**这就是为什么路德与茨温利在 1529 年的马尔堡会谈中，可以为「称义」达成一致，却因为圣餐而分手**——而这场分手直接导致了两个新教阵营（路德宗与改革宗）的永久分离。

**一个更深的层面**：圣餐之争其实是**基督论之争的延续**。路德坚持「基督的身体在饼中」，依据是「位格合一」——基督的神性与人性不可分，所以他的身体可以在任何地方（*ubiquitas*，遍在）。茨温利与加尔文则认为「坐在父右边」意味着身体有处所限制，因此临在只能是属灵的。**这是 451 年迦克墩的「属性相通」问题，在一千年后以圣餐的形式重演。**
:::

### 10.3 决裂的过程（1518–1521）

| 时间 | 事件 | 后果 |
|---|---|---|
| 1518 | 海德堡辩论；路德被召到奥格斯堡见教宗使节卡耶坦 | 路德拒绝撤回 |
| 1519 | **莱比锡辩论** vs 埃克（Johann Eck） | 路德被迫承认：**胡斯的部分主张是符合圣经的**；并质疑「教宗与公会议皆不能错误」 |
| 1520 | 三篇纲领性著作：《致德意志基督教贵族书》《教会被掳于巴比伦》《论基督徒的自由》 | 三篇分别攻击：教阶制的墙、圣礼的数量（从七减到二）、以及「靠行为」的捆绑 |
| 1520 年 6 月 | 教宗利奥十世发布《主，请起》（*Exsurge Domine*），限 60 天撤回 | 路德 12 月在维滕堡城门烧掉通谕与教会法典 |
| 1521 年 1 月 | 路德被**绝罚** | |
| 1521 年 4 月 | **沃尔姆斯帝国议会**：皇帝查理五世要他撤回 | 路德：「**除非用圣经的见证或明白的理由说服我，我不能也不愿撤回任何东西。因为违背良心是既不安全也不正当的。**」 |
| 1521 年 5 月 | 《沃尔姆斯敕令》：路德为帝国公敌 | 萨克森选侯腓特烈把他藏在瓦特堡 |
| 1522 | 在瓦特堡把新约译成德文（11 周） | 德语的标准文本由此奠定 |

:::pit t="「我站在这里，我别无选择」（Here I stand）——这句话路德说过吗"
**很可能没有。** 沃尔姆斯会议的现场记录有多个版本，最可靠的版本只记录了他用德语说的一段话（大意是：除非被圣经说服，否则不能撤回）。「我站在这里，我别无选择，愿神帮助我，阿们」这句戏剧性的台词，最早出现在 16 世纪后期的版本中，是现代印刷与爱国主义传说共同塑造的形象。

**这不影响事件的真实性**：路德确实拒绝撤回，确实被通缉，确实改变了历史。但它提醒我们：**宗教改革的历史记忆本身，是被反复重写的。** 每一个宗派都塑造了自己的英雄形象，而那个形象往往比史实更简洁、更有力、更适合挂在墙上。
:::

**《论基督徒的自由》（1520）** 是路德最优美的小书，它的两个命题看起来矛盾：

> 「**基督徒是全然自由的众人之主，不受任何人管辖。**
> **基督徒是全然顺服的众人之仆，受所有人管辖。**」

他的意思是：在**属灵层面**（面对神），人因信而自由，不需要任何行为来换取称义；在**肉身层面**（面对邻舍），人因爱而成为仆人，自愿服事所有人。**自由不是为了自己，而是为了服事。** 这可能是整个宗教改革最动人的一段文字，也是最少被实践的一段。

### 10.4 德国的社会革命：当神学撞上农民

路德的神学一旦被传播，就无法控制它的用途。

**（一）骑士暴动（1522–1523）。**
低等贵族**济金根**（Franz von Sickingen）与**胡滕**（Ulrich von Hutten）以「福音」为旗帜，攻击教会的领地与诸侯的权力。路德起初同情，但当他们使用暴力时，他立刻谴责。济金根战死，胡滕逃亡而死。

**（二）德国农民战争（1524–1525）。**
这是 16 世纪欧洲最大的民众起义，约 30 万人参与，估计死亡 10 万人以上。农民提出了《十二条款》，其中把「福音的自由」与「废除农奴制、限制地租、恢复公共林地」联系起来：

> 「基督用自己的血救赎了所有人，无论牧人还是农夫……因此我们应当是自由的。」

**他们真诚地以为路德会支持他们**——因为路德说「基督徒的自由」。

**路德的回答**是 1525 年 5 月的《**驳杀人越货的农民暴徒**》（*Wider die räuberischen und mörderischen Rotten der Bauern*）：

> 「让每一个能打的人去打、去杀、去刺这些农民，公开或秘密，就像必须打死一条疯狗一样……**这时候杀农民，比杀强盗更合乎神的心意。**」

**（三）托马斯·闵采尔（1489–1525）。**
{{闵采尔}} 是这场运动中最激进的神学家。他比路德更彻底：他主张**圣灵直接对每个信徒说话**（不需要圣经的书面权威、也不需要神学训练），主张**用武力建立神的国度**，攻击一切「不敬虔的统治者」。他在缪尔豪森建立了一个「神的选民」共同体，1525 年在弗兰肯豪森战役中被诸侯军队击败，被俘、受刑、斩首。

:::why t="为什么这一段是宗教改革最黑暗的部分"
因为它暴露了一个无法回避的问题：**「唯独圣经」与「信徒皆祭司」这两条原则，在逻辑上会释放出什么？**

- 如果圣经是唯一权威，那么**任何人**都可以读出自己的意思（闵采尔读出了社会革命）。
- 如果每个信徒都是祭司，那么**任何人**都可以讲道（闵采尔就成了先知）。
- 如果得救不靠行为，那么**世俗秩序**（农奴制、地租、领主特权）就不再具有神圣的正当性（农民读出了平等）。

**路德的回应是：用刀剑把这个逻辑关回笼子里。** 他站到了诸侯一边，而且用的是极其暴烈的语言。

**这不是偶然的妥协，而是必然的结构**：一个反对「靠行为得救」的运动，如果同时否认一切制度性的权威（教宗、公会议、主教），那么它就只能依靠**世俗权力**来维持秩序。**这就是为什么路德宗最终变成了「诸侯的教会」**（*Landeskirche*）——教会的最高管理者是诸侯，而不是教宗。

一个残酷的对照：**路德反对「靠行为得救」，但他的运动必须靠刀剑来维持。** 这一点，是后世所有「抗议」运动都要面对的困境。
:::

### 10.5 从信条到战争（1530–1555）

| 时间 | 事件 |
|---|---|
| 1530 | **《奥格斯堡信条》**（*Confessio Augustana*）：路德宗的核心信条，由**梅兰希顿**（Philipp Melanchthon）起草，语气极其温和（试图证明路德宗就是大公信仰），但仍被天主教方面拒绝 |
| 1531 | **施马尔卡尔登联盟**：新教诸侯组成军事同盟 |
| 1537 | 《施马尔卡尔登条款》：路德最后的信条，语气比奥格斯堡强硬得多 |
| 1546 | 路德去世（2 月 18 日，艾斯莱本） |
| 1546–1547 | **施马尔卡尔登战争**：查理五世击败联盟，但无法彻底压服 |
| 1555 | **《奥格斯堡和约》**：确立「**谁的领地，谁的宗教**」（*cuius regio, eius religio*） |

:::why t="《奥格斯堡和约》是欧洲历史的一个转折点"
它做了三件前所未有的事：

1. **承认了「分裂」的合法性**：帝国正式承认路德宗诸侯可以保留其信仰。这是自 1054 年以来，第一次有一个政治体系承认「教会可以不是唯一的」。
2. **把宗教归属变成领土属性**：每个领地的臣民必须跟随领主的信仰，不服从者可以迁走（*ius emigrandi*）。**这不是宗教自由，而是「宗教的领土化」。**
3. **埋下了三十年战争的种子**：它没有解决加尔文派（当时未列入），也没有解决主教区归属的争议，而且「谁的领地谁的宗教」在实践中意味着**改宗等于改领土**——于是宗教归属成了政治军事目标。

**一句话总结**：1555 年不是「宗教宽容的胜利」，而是「宗教分裂的军事僵局被制度化」。而僵局只维持了 63 年。
:::

### 10.6 路德宗内部的第二次分裂：信条之争

一个常被忽略的事实：**路德宗在路德死后立刻陷入了自己的教义内战**，而且激烈程度不亚于它对天主教的攻击。

主要争点：

| 争点 | 一方 | 另一方 |
|---|---|---|
| **「中间事」（*adiaphora*）** | 梅兰希顿派（腓力派）：礼仪中一些无关信仰的事（祭衣、蜡烛、圣像）可以为了和平而保留 | 格内西奥-路德派（Gnesio-Lutherans，「纯正路德派」）：任何让步都是背叛 |
| **圣餐** | 腓力派：可以与改革宗妥协（「属灵临在」） | 纯正派：基督的身体必须真实临在 |
| **基督论** | 腓力派：淡化「遍在」 | 纯正派：基督的人性也分有神的属性（*communicatio idiomatum* 的强版本） |
| **原罪与自由意志** | 腓力派：人有某种「被动接受」的能力 | 纯正派（弗拉齐乌斯）：原罪是**实体**，人完全无能 |
| **善行与称义** | 腓力派：善行是称义的必要条件（*necessitas*） | 纯正派：善行与称义完全无关 |

**1577 年《协和信条》**（*Formula Concordiae*）试图调和，成为路德宗的最后信条。但它没有真正解决——**今天路德宗内部仍然有「保守派」与「温和派」的张力**，而德国路德宗在 19 世纪甚至因为「是否与改革宗联合」而分裂出「老路德宗」（Old Lutherans），一部分迁往美国、澳大利亚。

:::note
**这个现象值得记住**：**新教不是「从天主教分裂出来」，而是「不断分裂」。** 路德宗在路德死后 30 年就有了一次内战；加尔文派在 80 年内因为阿米念争议开了多特会议；英国国教在 100 年内被清教徒革命推翻；重洗派自己分裂成门诺派、哈特派、阿米什。**「唯独圣经」+「人人都是祭司」= 无穷的解释权竞争。** 这是新教的结构性特征，不是偶然的事故。
:::

### 10.7 争议与反驳

#### 10.7.1 天主教的反驳（特伦托会议，1545–1563）

- **「你们取消了称义的实在性。」** 若人称义只是「被宣告为义」，而本身仍是罪人，那么恩典就没有真正改变人——这是把救恩变成了法律虚构。
- **「你们取消了自由意志。」** 若人完全无能，那么罪的责任在哪里？
- **「你们取消了善行的价值。」** 若行为与称义无关，那么修道、慈善、苦修还有什么意义？
- **「你们取消了圣礼。」** 七件减到两件，圣餐、告解、终傅、婚配、圣秩的恩典作用被取消。
- **「你们取消了教会的权威。」** 「唯独圣经」在实践中意味着「每个人都是自己的教宗」——而历史证明这会带来无穷的分裂（这一点被 500 年的历史强烈支持）。

#### 10.7.2 路德宗对天主教的反驳

- **「你们的『注入的义』使人永远无法确定得救。」** 若义是逐渐增长的，那么「够不够」永远是个未知数——这正是路德最深的恐惧。
- **「你们的功德宝库没有圣经依据。」** 「基督与圣徒多余的功德」这个概念在圣经里找不到。
- **「你们的教宗不是圣经里的职分。」**
- **「你们的礼仪把福音变成了新的律法。」** 当「参加弥撒」「守斋」「朝圣」成为得救的条件，福音就变成了负担。

#### 10.7.3 激进改革派对路德的批评（最重要的内部批评）

- **「你只改了一半。」** 你取消了教宗的权威，却把它交给了诸侯。你取消了修院的誓愿，却保留了国家教会。
- **「你的教会仍然包含不悔改的人。」** 因为它是「全民教会」（*Volkskirche*），所有领地里的人自动是成员——这不是「信徒的教会」。
- **「你用刀剑维持福音，这就是否认福音。」** 农民战争中的「杀农民如杀疯狗」这句话，是重洗派永远无法原谅的。

#### 10.7.4 无神论与世俗主义的批评

- **「一个关于『人称义』的技术性争论，导致了 10 万人死亡（农民战争）、欧洲分裂、以及此后两百年的宗教战争。」** 这不正说明宗教的本质是权力与暴力？
- **「路德站在诸侯一边，说明宗教改革的真正受益者是世俗君主。」** 教会财产被没收、教会土地被诸侯占有、教会的管辖权被国家接管——**「宗教改革」同时是一次大规模的财产再分配。**
- **「『唯独信心』取消了道德动机。」** 这在理论上被路德否认，在实践上却难以反驳：新教地区的社会纪律（work ethic）后来反而更严，但那是靠世俗法律与加尔文式的纪律实现的，不是靠「因信称义」。

**诚实的回应**：（1）路德的立场确实容易被误解为「反道德」，但他本人的伦理要求极其严格（《大教理问答》对十诫的解释非常严厉）；（2）宗教改革的暴力是真实的，但**16 世纪的所有政治运动都是暴力的**（同时期的意大利战争、法国宗教战争、奥斯曼扩张），把暴力归因于「新教神学」是过度的；（3）最重要的一点：**路德的核心问题——「我怎么能确定神接纳我」——是一个真实的人类问题，不是一个学术游戏。** 任何批评都必须先承认这个问题是真的。

### 10.8 常见误解

:::pit t="关于路德与宗教改革的五个误解"
**误解一：「路德反对赎罪券，是因为它腐败」。**
更准确地说：他反对的是「用任何行为（包括捐款）换取救恩确定性」这个结构本身。腐败只是这个结构的症状。

**误解二：「路德是一个人对抗整个教会」。**
他有一整套支持网络：萨克森选侯腓特烈（政治保护）、维滕堡大学（学术平台）、梅兰希顿（系统化者）、以及**印刷术**（1517–1520 年间《九十五条》印了数十版，是史上第一次「媒体事件」）。

**误解三：「路德翻译的德文圣经让普通人第一次读到圣经」。**
不完全对。中世纪已有德文译本（至少 14 种完整的、以及大量部分译本），但它们是手抄的、昂贵的、且被教会限制。**路德的贡献是：用印刷术、用通俗而优美的德语、并以「唯独圣经」的神学赋予它权威。** 这是「量变到质变」的典型。

**误解四：「路德是宗教自由的先驱」。**
他不是。他支持用世俗权力镇压重洗派与农民，主张「不宽容」是政府的职责。**宗教自由（宽容）是 17–18 世纪才发展出来的观念**，而且很大程度是**宗教战争打累了之后的产物**（见第 13 章的威斯特伐利亚）。

**误解五：「新教 = 现代性」。**
这是一个流行的简化。新教确实与印刷资本主义、识字率、个人主义、以及（按韦伯的论证）资本主义伦理有关联，但**现代性是一个多源头的过程**（文艺复兴、科学革命、启蒙运动、民族国家、殖民贸易）。把新教当成现代性的唯一源头，既高估了它，也忽略了它与现代性之间的持续冲突（例如美国福音派与进化论的斗争）。
:::

:::titre
**下一章：茨温利、加尔文与改革宗（第 11 章）**

路德解决了「我怎么能确定神接纳我」，但没有解决「教会应该怎么组织」。而这个问题在苏黎世与日内瓦得到了两个完全不同的答案：一个短命而激进（茨温利），一个持久而系统（加尔文）。下一章会看到：为什么圣餐能让人分手，为什么预定论会成为现代社会的隐秘骨架，以及为什么一个 26 岁的法国流亡者写的书，会成为此后四百年最有影响力的新教文本。
:::

## 第 11 章：茨温利、加尔文与改革宗（1519–1648） {#ch-11}

### 11.0 两个城市共和国，两种改革

路德的宗教改革发生在**诸侯领地**里，因此它的形态是「诸侯的教会」（*Landeskirche*）：领主决定信仰，教会由领主管辖，牧师是领主的官员。

但同一时期的瑞士，政治结构完全不同。瑞士联邦是由一批**城市共和国**与**乡村州**组成的松散联盟，苏黎世、伯尔尼、巴塞尔、日内瓦都是自治城市，由市议会（由行会与市民选举）治理。

**这个差别决定了改革宗的形态**：教会的最高权威不是君主，而是**市议会 + 牧师团 + 长老团**的复杂组合。这既是「共和主义」的产物，也是它后来能扩散到法国、荷兰、苏格兰、英国（这些地方有议会传统）的原因。

**一句话对比**：

| | 路德宗 | 改革宗 |
|---|---|---|
| 政治土壤 | 德意志诸侯领地 | 瑞士、荷兰的城市共和国与议会 |
| 教会治理 | 诸侯兼任「最高主教」（*summus episcopus*） | 长老制（牧师 + 长老的议会） |
| 神学重心 | 称义（个人与神） | 神的主权（神与历史） |
| 圣餐 | 基督身体真实临在（同体论） | 真实的属灵临在（靠圣灵） |
| 礼仪 | 保留较多（祭衣、圣像、音乐） | 大幅简化（白墙、讲道为中心） |
| 扩散 | 北欧（瑞典、丹麦、挪威）、部分德国 | 法国、荷兰、苏格兰、英格兰、部分德国、匈牙利 |

### 11.1 茨温利与苏黎世：一个短命而彻底的改革

**乌尔里希·茨温利**（Huldrych Zwingli，1484–1531）与路德同年成为神父（1506），但两人的气质完全不同：路德是修士，充满罪咎与挣扎；茨温利是人文主义者，读伊拉斯谟、懂希腊文、关心公民道德。

**（一）1519 年：开始讲道。**
茨温利在苏黎世大教堂（Grossmünster）获得「人民神父」（*Leutpriester*）的职位。他做了一个在当时极其激进的决定：**放弃按教会年历的经课，从马太福音第一章开始，逐章逐节地讲完整卷福音书。** 这被称为「**讲道式解经**」（*lectio continua*），意味着圣经本身（而不是教会的节期安排）决定了讲什么。

**（二）1522 年：香肠事件。**
四旬期（禁食期）中，苏黎世的一个印刷商家里，几个人公开切开了香肠——**故意违反教会的斋戒规定**。茨温利在场（他本人没吃），但他在随后的讲道《论饮食的选择与自由》中为这个行为辩护：**禁食是教会的规矩，不是神的命令；把人的规矩当作神的命令，就是捆绑良心。**

这个事件的意义：**它把「唯独圣经」从一句神学命题变成了一个政治行动。** 如果圣经没有规定，那教会凭什么强制？

**（三）1523–1525：市政改革。**
在市议会的支持下，苏黎世废除弥撒、移除圣像与管风琴（**注意：这与第 8 章的圣像破坏派在神学上完全同构**——「圣经没有命令，就是禁止」）、解散修道院、把教会财产用于教育与救济、建立新的婚姻法庭。

**（四）圣餐之争：一个词的解读。**
茨温利对「这是我的身体」（*hoc est corpus meum*）的解释是：**「是」（*est*）在这里的意思是「表示/象征」（*significat*）。** 所以「这是我的身体」等于「这代表我的身体」。他的依据：

- 约翰福音 6:63「**叫人活着的乃是灵，肉体是无益的**」——若肉体无益，怎么能在圣餐中吃它？
- 基督「坐在父的右边」（可 16:19）——身体有处所，不可能同时在千万个祭坛上。
- 「记念我」（路 22:19）——这是纪念，不是重复献祭。

**路德的依据**：

- 字面解经：「这是我的身体」没有「表示」的意思。
- **{{属性相通}}**：基督的神性与人性在一个位格中不可分，所以他的身体可以「遍在」（*ubiquitas*）——神性的属性（无所不在）可以归属于人性。
- 若圣餐只是纪念，那么「不按理吃喝的就是吃喝自己的罪」（林前 11:29）就无法理解。

**（五）1529 年马尔堡会谈。**
黑森伯爵菲利普（Philipp of Hesse）为了政治统一，把路德与茨温利请到马尔堡。会谈的结果是：**在 15 条中的 14 条达成一致，第 15 条（圣餐）失败。**

路德据说在桌上用粉笔写下「**Hoc est corpus meum**」（这是我的身体），并拒绝与茨温利握手。**这就是新教第一次大分裂的时刻**——不是为了「称义」，而是为了一个介词。

**（六）1531 年：茨温利之死。**
瑞士的天主教州与改革宗州爆发战争（卡佩尔战争）。茨温利作为随军牧师上阵，10 月 11 日在卡佩尔战役中战死。**他的尸体被天主教方面找到，判为异端，分尸、焚烧、骨灰撒入风中。**

:::why t="茨温利的死为什么改变了改革宗的性格"
因为它证明了**改革宗从一开始就是一个「少数派、受迫害、需要政治保护」的运动**。

- 路德宗在德意志有诸侯的军事保护，因此可以「稳定下来」，发展出正统神学与教会制度。
- 改革宗在瑞士、法国、尼德兰、苏格兰、英格兰都是**少数派或受迫害者**（法国的胡格诺、英格兰的清教徒、苏格兰的誓约派、尼德兰的加尔文派都打过仗）。

**这个处境塑造了改革宗神学的两个特征**：（1）**强烈的「神的主权」意识**——因为人的权力不可靠，只有神可靠；（2）**「抵抗权」理论**——当统治者违背神的律法时，低层官员（*ephors*、*inferiores magistratus*）有权抵抗。这个理论后来成为现代政治思想的重要源头（从《温莎堡辩护》到洛克的《政府论》到美国《独立宣言》）。

**一个反讽**：路德宗反对抵抗（路德在 1530 年明确说基督徒不可反抗皇帝），而改革宗发展出了抵抗理论。但两者都声称自己忠于同一部圣经。
:::

### 11.2 加尔文与日内瓦：一个流亡者的系统

**约翰·加尔文**（John Calvin / Jean Cauvin，1509–1564）生于法国努瓦永（Noyon），父亲是主教座堂的财务官。他受过极好的法律训练（奥尔良、布尔日），精通拉丁文、希腊文、希伯来文。

**（一）皈依与《要义》的诞生。**
1533–34 年间他经历了一次「突然的归正」（他自己只说「神使我归服」*subita conversione*，没有细节）。由于法国对「路德派」的迫害，他逃离巴黎，1535 年到巴塞尔。

**1536 年，26 岁的加尔文出版了《基督教要义》第一版**——只有 6 章，是一本为普通读者写的信仰手册（他在序言里把它献给法国国王弗朗索瓦一世，希望国王能公平对待新教徒）。此后他不断扩写：1539 年（17 章）、1543 年、1559 年（**80 章，拉丁文定本**）。**这本书成为此后四百年最有影响力的新教神学著作。**

**（二）日内瓦：三次进出。**

| 时间 | 事件 |
|---|---|
| 1536 | 路过日内瓦，被**法雷尔**（Guillaume Farel）威胁「神会咒诅你的学业」，留下 |
| 1538 | 与法雷尔一起被驱逐（因为他要求教会对市议会拥有绝罚权） |
| 1538–1541 | 在斯特拉斯堡牧会，受**布塞尔**（Martin Bucer）影响（礼仪、教会论） |
| 1541 | 被请回日内瓦，制定《教会法规》（*Ordonnances ecclésiastiques*） |
| 1541–1555 | 长期斗争：与市议会、与反对派（「自由派」*Libertins*）、与（前）同僚 |
| 1553 | 塞尔维特被处死 |
| 1555 | 反对派被彻底击败，加尔文的地位确立 |
| 1559 | 建立**日内瓦学院**（Académie de Genève），成为改革宗牧师的训练中心 |
| 1564 | 去世（5 月 27 日），享年 54 岁 |

**（三）教会治理：四职分。**
加尔文把教会的职分分为四类（依据弗 4:11）：

1. **牧师**（*pasteurs*）：讲道与施圣礼。
2. **教师**（*docteurs*）：教义与教育（在学院里）。
3. **长老**（*anciens*）：纪律与治理（平信徒，由市议会选出）。
4. **执事**（*diacres*）：慈善与照顾穷人。

**牧师与长老组成「长老会」（*consistoire*，教会法庭）**，负责监督信仰与道德，有权施行「教会惩戒」（从私下劝诫到开除圣餐）。**这是「长老制」（{{长老制}}）的起源**——今天长老会（Presbyterian）、改革宗（Reformed）、以及许多华人教会采用这种治理形式。

:::why t="为什么加尔文要建立「纪律」这套机器"
因为他的核心神学问题是：**如果教会是「被拣选者的共同体」，那怎么知道谁是拣选的？**

他的答案不是「查看神的名册」（那是不可知的），而是：**用纪律来维持一个「可辨认的、有秩序的」共同体**。纪律不是为了制造纯洁（那是多纳图派的错误），而是为了「保护圣餐的尊严」与「使罪人悔改」。

**代价**：日内瓦的长老会拥有极大的权力，可以传唤市民、审查衣着、禁止跳舞、惩罚「不敬虔」的言论。1550 年代，日内瓦的日常生活受到极其严密的道德监督（加尔文本人对此负有责任，虽然具体程度仍有争议）。

**这个模型的两面性**：（1）它创造了一个高度纪律化、高识字率、高工作伦理的社会（韦伯的「新教伦理」论述主要基于此）；（2）它也被批评为「把教会变成警察」——而 20 世纪极权主义的批评者（如阿伦特）曾指出这种「道德监视」与极权主义的某种结构相似性。**评价一个历史制度，往往取决于你看的是它的一面还是两面。**
:::

**（四）塞尔维特之死（1553）：一个无法回避的污点。**

**米格尔·塞尔维特**（Michael Servetus，约 1511–1553）是西班牙医生、神学家，发现了**肺循环**（这一发现早于哈维）。他也是一位**反三位一体论者**，写了《论三位一体的错误》（1531）。

他同时被天主教与新教追捕。1553 年，他在日内瓦被捕（他在那里是路过，本来打算去意大利）。加尔文提供了对他不利的证据。10 月 27 日，塞尔维特因「否认三位一体与婴儿洗礼」被市议会判处**火刑**——而且用的是**慢火**（据记载，他活活烧了半小时才死）。

:::pit t="关于塞尔维特案的两种立场"
**辩护方**（加尔文的支持者）：（1）处死异端是 16 世纪所有欧洲政权（天主教与新教）的普遍做法，加尔文只是执行了当时的法律；（2）加尔文曾请求市议会改用斩首（较仁慈），但被拒绝；（3）加尔文与塞尔维特的关系极其复杂（塞尔维特曾写信挑衅他，且早年在维也纳被天主教判死刑、越狱逃走）。

**批评方**（从 16 世纪的卡斯特里奥到现代的几乎所有世俗史家）：（1）加尔文确实提供了证据，且他在事后写了《为三位一体辩护》，**论证了「处死异端是正当的」**——这比「执行法律」严重得多，因为它是一个神学的辩护；（2）**塞尔维特不是无神论者，他比大多数基督徒更敬虔**——他相信耶稣是神的儿子，只是否认「三位一体」这个希腊化的表述；（3）**这是新教用自己的原则（唯独圣经）杀死了一个用同一原则读出不同结论的人。**

**本书的立场**：这件事不能被「当时的普遍做法」完全开脱，也不能被简化成「加尔文是个暴君」。**它最深的教训是结构性的**：一个拒绝承认任何外部权威（教宗、公会议）的运动，当它获得政权时，只能用自己的权力来镇压异见——**而它镇压的理由，与它当年被镇压的理由完全相同。**
:::

### 11.3 加尔文神学的结构（一张图看懂）

加尔文的神学常被简化为「预定论」，这是严重的误读。他的《要义》结构是：

| 卷 | 主题 | 关键内容 |
|---|---|---|
| 卷一 | **认识神**（创造者） | 自然启示的不足；圣经的必要；三位一体；神的护理 |
| 卷二 | **认识人**（被造者与罪人） | 神的形像；原罪；自由意志的捆绑；律法的三重功用 |
| 卷三 | **领受恩典** | **信心**；**重生**；**称义**；**祈祷**；**预定论**（在这一卷的后半） |
| 卷四 | **外在的媒介** | **教会**；**圣礼**；**民事政府** |

**注意预定论的位置**：它在**卷三的末尾**，是在讲完信心、重生、称义之后才讨论的。加尔文的逻辑是：**你先经历了恩典，然后你回头看，才明白这是神在永恒中的拣选。** 预定论不是「出发点」，而是「反思的结论」。

**（一）预定论的具体内容。**
- 神在永恒中预定谁得救（**拣选**）与谁被弃（**弃绝**）。
- 拣选是**无条件的**（不基于预知的功德或信心）。
- 恩典是**不可抗拒的**（*gratia irresistibilis*）。
- 圣徒**永蒙保守**（*perseverantia sanctorum*）。
- 基督的赎罪是**有限的**（只为选民，*redemptio particularis*）——**这一点与奥古斯丁不同，是加尔文派特有的**。

**（二）圣餐：属灵临在。**
加尔文的立场介于路德与茨温利之间：**基督的身体与血真实地被领受，但方式是「属灵的」，靠圣灵的工作，而不是物质的（不是「在饼里」）。** 他用「**仰望**」（*sursum corda*，向上举心）来描述：信徒的心被圣灵提升到天上，在那里与基督的身体联合。

**（三）天召（*vocatio*）与「入世禁欲」。**
加尔文强调每个基督徒的**职业/天召**（{{天召}}）：农夫、鞋匠、法官都是神的呼召，都能荣耀神。这与修道主义的「出世」形成对立：**不需要进修道院才能服事神，你在你的工作里就能。**

**韦伯的论证**（《新教伦理与资本主义精神》，1905）：加尔文主义的「预定论」带来一个心理后果——你无法知道自己是否被拣选，于是你在世俗职业中的**勤奋、节俭、自律**成为「我可能是被拣选的」的心理证据。这套「入世禁欲」的伦理，恰好与早期资本主义的积累逻辑吻合。**韦伯的论证远比流行版本复杂**（他自己也承认因果关系是双向的），但它指出了一个真实的关联。

### 11.4 扩散：改革宗如何成为一支国际力量

| 地区 | 时间 | 情况 |
|---|---|---|
| **法国** | 1550s– | {{胡格诺派}}（Huguenots，约 10% 人口，多为贵族与城市中产）。**1572 年 8 月 24 日圣巴多罗买日大屠杀**：巴黎及各省约 5000–30000 名胡格诺被杀。1598 年《南特敕令》给予有限宽容，1685 年被路易十四撤销，约 20 万胡格诺流亡（普鲁士、荷兰、英国、南非） |
| **尼德兰** | 1560s– | 反抗西班牙（天主教）的独立战争，最终成立荷兰共和国（1648）。**阿米念争议就发生在这里**（见 11.5） |
| **苏格兰** | 1559–1560 | **约翰·诺克斯**（John Knox）领导宗教改革，1560 年苏格兰议会废除天主教，建立长老制。后来因「主教制 vs 长老制」反复冲突（1638 年全国誓约、1688 年革命） |
| **英格兰** | 1550s– | 清教徒（{{清教徒}}）希望进一步改革英国国教（废除主教制、简化礼仪、严格纪律）。17 世纪移民北美（「五月花号」1620，马萨诸塞湾 1630） |
| **德国普法尔茨** | 1560s | 选侯腓特烈三世改宗改革宗，**1563 年《海德堡要理问答》**（今天改革宗最通用的教理问答） |
| **匈牙利、波兰-立陶宛** | 1550s– | 一度极盛，后因反宗教改革而衰落；波兰的「波兰弟兄会」（索齐尼派）成为反三位一体论的中心 |

### 11.5 阿米念争议与多特会议（1610–1619）：改革宗的第一次内战

**（一）阿米念。**
**雅各布斯·阿米念**（Jacobus Arminius，1560–1609）是莱顿大学的教授，本人是严格的加尔文主义者出身（他受命去反驳一位反对预定论的学者，结果自己被说服了）。他的立场：

- 拣选基于**预知**的信心（*fide praevisa*），不是无条件的。
- 基督为**所有人**死（无限赎罪）。
- 恩典**可以被抗拒**。
- 真信徒**可能失落**。

**（二）抗辩派（1610）。**
阿米念死后，他的追随者（**抗辩派**，*Remonstrants*）向荷兰议会提交《抗辩书》，提出五点。**这五点是「反对加尔文五点」的版本**——而后来加尔文派的「TULIP」正是对这五点的逐条回应。

**（三）多特会议（1618–1619）。**
荷兰议会在多特（Dordrecht）召开国际会议（有英国、德国、瑞士等地的代表参加），谴责抗辩派，制定「**多特信条**」（*Canons of Dort*），即后来的**TULIP**：

| 字母 | 英文 | 中文 | 含义 |
|---|---|---|---|
| **T** | Total depravity | {{全然败坏}} | 罪影响人的每一部分，人不能自救 |
| **U** | Unconditional election | 无条件拣选 | 拣选不基于预知的行为或信心 |
| **L** | Limited atonement | 有限赎罪 | 基督只为选民死 |
| **I** | Irresistible grace | 不可抗拒的恩典 | 神有效的呼召不能被最终拒绝 |
| **P** | Perseverance of the saints | 圣徒永蒙保守 | 真信徒不会最终失落 |

:::why t="多特会议不只是神学事件"
它同时是一场政治清洗。

抗辩派的政治领袖是荷兰大议长**奥尔登巴内维尔特**（Johan van Oldenbarnevelt），他与拿骚的莫里斯亲王长期对立（关于省权 vs 中央权、以及战争与和平）。多特会议之后，奥尔登巴内维尔特以叛国罪被**斩首**（1619 年 5 月 13 日），格劳秀斯（Hugo Grotius，国际法之父）被判终身监禁、后越狱流亡。

**换句话说：一次关于「拣选是否无条件」的神学争论，同时是一次政变。** 这与 4 世纪（皇帝介入三位一体之争）、5 世纪（皇帝介入基督论）、16 世纪（诸侯介入宗教改革）完全同构。**教义争论从来不只是教义。**
:::

**（四）TULIP 的现代误用。**
必须说明：**这五点不是加尔文自己写的，而是多特会议对阿米念五点的回应**；而且它们的排列顺序会造成误解（「全然败坏」在最前，但加尔文的《要义》是从「认识神」开始的）。更重要的是：**「有限赎罪」是最受争议的一点**，许多自称加尔文主义者的人（「四点加尔文主义者」）拒绝它。

### 11.6 威斯敏斯特会议（1643–1649）：改革宗信条的最高峰

英国内战期间，议会召集了一次神学会议（约 120 位神学家，主要在威斯敏斯特教堂），目的是改革英国国教的教义与治理。成果：

- **《威斯敏斯特信条》**（*Westminster Confession of Faith*，1646）：改革宗信条中最精细、最系统的一份，至今仍是长老会（PCA、OPC 等）的教义标准。
- **《威斯敏斯特大/小要理问答》**：小要理问答（107 问）是英语世界流传最广的教理问答之一。
- **《公共礼拜指南》**：规定崇拜的形式（**只允许唱诗篇**，不允许乐器——这是「规范原则」*regulative principle* 的极端应用）。

**一个历史的讽刺**：这次会议是议会召集的，但 1649 年议会处死了国王查理一世，随后克伦威尔建立共和（1653–1660），再然后王朝复辟（1660），英国国教重新掌权，**威斯敏斯特信条从未成为英国国教的信条**——它成了苏格兰长老会与全球长老会的信条，而不是英格兰的。

### 11.7 为什么改革宗特别容易分裂

改革宗的三个特征，使它天生容易分裂：

1. **「规范原则」**（*regulative principle*）：敬拜中只允许圣经明确命令的事。这个原则一旦被严格执行，就会不断发现「还有什么是圣经没命令的」（乐器？圣诞？主日学？），于是不断有人要求进一步「纯洁化」。
2. **长老制的分散结构**：没有教宗，没有主教，每个堂会/区会都可以自己判断。**这使分裂的成本极低**（不需要脱离一个庞大的机构，只需要退出一个区会）。
3. **「神的真教会」意识**：改革宗（尤其清教徒）常常认为自己是「更纯洁的教会」，于是与「不够纯洁」的教会分离（separation）。**「分离主义」（separatism）是新教内部最强大的分裂引擎。**

**结果**：今天改革宗谱系下有长老会、改革宗、荷兰改革宗、清教徒后裔（公理会、浸信会部分）、以及各种「新加尔文主义」群体。仅美国就有数十个长老会宗派（PCUSA、PCA、OPC、EPC、RPCNA……），它们的神学差别极小，分裂的理由往往是历史事件（南北战争、自由主义争议、按立女性）。

### 11.8 争议与反驳

#### 11.8.1 路德宗对改革宗的批评

- **「你们的圣餐是空的。」** 若基督的身体只是「属灵地」临在，那么「这是我的身体」这句话就被取消了。
- **「你们的预定论越界了。」** 加尔文把「弃绝」也说成预定，这使神成为恶的作者（路德宗接受预定，但拒绝「双重预定」的完整体系）。
- **「你们把教会变成了法庭。」** 长老会的纪律机器，与福音的赦免精神冲突。

#### 11.8.2 天主教对改革宗的批评

- **「你们的『神的主权』取消了人的责任。」** 若一切都被预定，人的努力与罪咎都成了幻象。
- **「你们的『有限赎罪』使福音变成坏消息。」** 「神爱世人」若只爱选民，那还是爱吗？
- **「你们的分裂证明了『唯独圣经』的失败。」** 一个只有圣经、没有权威的教会，必然碎成几万片。

#### 11.8.3 无神论与世俗主义的批评

- **「预定论是一种宇宙级的宿命论，它使一切努力变得无意义。」** （回应：加尔文主义者是历史上最积极的社会行动者之一——他们办学校、建医院、推动废奴、改革监狱。这个矛盾本身值得研究。）
- **「日内瓦是一个道德警察国家。」** （回应：部分成立。但要注意，16 世纪的所有城市都有严格的行为规范，日内瓦的独特之处是**由教会而非市政官来执行**。）
- **「韦伯的论证证明新教只是资本主义的意识形态。」** （回应：韦伯的论证比这个复杂得多，而且它被大量误读——韦伯不是要说「新教产生了资本主义」，而是要说「新教的伦理气质与资本主义的『精神』有选择性亲和」。）

### 11.9 常见误解

:::pit t="关于加尔文与改革宗的五个误解"
**误解一：「加尔文主义 = 预定论」。**
预定论只是《要义》四卷中卷三的一小部分。加尔文的核心关切是「**认识神与认识自己**」，以及「**神的主权如何在人的生活中被信靠**」。

**误解二：「加尔文是日内瓦的独裁者」。**
他不是。他没有政治职位，只是牧师之一；他与市议会斗争了十几年，多次处于下风；1553 年塞尔维特的判决是市议会下的（虽然加尔文支持）。他的实际影响力来自他的**著作与学院**，不是他的职位。

**误解三：「加尔文主义反对艺术与娱乐」。**
加尔文允许（甚至鼓励）音乐、舞蹈（在特定场合）、以及世俗职业。真正严厉的是后来的清教徒（尤其英格兰与北美），他们禁止戏剧、圣诞庆祝、以及大部分娱乐。**加尔文与清教徒不是一回事。**

**误解四：「TULIP 是加尔文写的」。**
它是 1618–19 年多特会议对抗辩派的回应，晚了 50 多年。

**误解五：「改革宗是『更严格的新教』」。**
它只是**不同的新教**。它在圣餐上比路德宗「更弱」，在教会治理上比路德宗「更共和」，在纪律上比路德宗「更严」，在礼仪上比路德宗「更简」。**没有「更严格」或「更纯正」，只有不同的取舍。**
:::

:::titre
**下一章：激进改革与英国（第 12–13 章）**

路德与加尔文都想要「一个领地的教会」——所有人都属于它，所有人都受它管教。但有一批人说：**不，教会必须是自愿的、纯洁的、由真正信的人组成的。** 他们被称为「重洗派」，被路德宗、改革宗、天主教**三方同时**迫害。他们的后裔是今天的门诺派、阿米什、浸信会、以及整个「信徒教会」传统。同时，英国走了一条完全不同的路——一条由国王的婚姻案开始的路。
:::

## 第 12 章：激进改革——重洗派与被三方追杀的「第三支」 {#ch-12}

### 12.0 1525 年 1 月 21 日，苏黎世的一个小圈子

苏黎世郊外的佐利孔（Zollikon），一间房子里，一群人聚在一起。

他们是茨温利的追随者中最激进的一批：**康拉德·格列伯**（Conrad Grebel）、**费利克斯·曼茨**（Felix Manz）、**尤尔格·布劳罗克**（Jörg Blaurock）。他们原本支持茨温利，但认为他停在了半路——**他取消了弥撒，却保留了婴儿洗礼。**

他们的结论是：**婴儿洗礼没有圣经依据。** 婴儿不能自己认信，而新约里的洗礼都是「信而受洗」（可 16:16；徒 2:41，8:12，16:31–33）。所以，**洗礼必须是自愿的、由本人认信的、在成年后施行的。**

那一晚，**布劳罗克请求格列伯为他施洗**。格列伯用水为他施洗，然后布劳罗克为其他人施洗。

**这就是「重洗派」（Anabaptists）的诞生。** 他们不认为自己是在「重新受洗」——他们认为婴儿洗礼根本不算洗礼，所以这是**第一次**真正的洗礼。但对手给了他们一个贬义的名字：**再洗礼者**（*Wiedertäufer*，Anabaptists）。

:::why t="为什么这件事比路德的《九十五条》更危险（在当时的统治者看来）"
因为路德与茨温利攻击的是**教会的教义**，而重洗派攻击的是**教会与社会的边界**。

在中世纪的欧洲，**洗礼是社会成员资格的标志**。一个人受洗，意味着他是基督徒、是某个教区的成员、是国家的臣民、是要纳税与服兵役的人。**洗礼 = 公民身份。**

所以「拒绝婴儿洗礼」意味着：
1. **教会的成员是自愿加入的**（而不是出生即成员）→ 教会不再是「全民教会」，而是「**自愿的共同体**」。
2. **人可以不属于教会** → 这在 16 世纪等同于「人可以不属于社会」。
3. **信仰是个人的选择** → 这与「整个领地属于一个信仰」的政治秩序根本冲突。

**这就是为什么重洗派被三方同时追杀**：天主教杀他们（异端）、路德宗杀他们（*Wiederäufer* 在 1529 年帝国法令中被定为死刑）、改革宗也杀他们（茨温利在 1527 年同意把曼茨淹死在利马特河里）。

**一个残酷的细节**：曼茨（Felix Manz）是 1527 年 1 月 5 日在苏黎世被**溺死**的——这是对「重洗派」的**讽刺性刑罚**（他们「用水」重洗，就用「水」处死他们）。这是宗教改革史上第一个被新教政权处死的「异端」。
:::

### 12.1 重洗派的核心主张

重洗派不是一个统一的运动（它至少有瑞士弟兄会、南德/奥地利的灵修派、荷兰的门诺派、以及明斯特的暴力派），但共享以下几条：

| 主张 | 内容 | 与主流新教的冲突 |
|---|---|---|
| **信徒的教会**（*Gemeinde*） | 教会是自愿聚集的信徒群体，不是地域性的全民机构 | 路德宗与改革宗都保留「领地教会」 |
| **信徒洗礼** | 只有自己认信的人才能受洗；婴儿洗礼无效 | 所有主流派都坚持婴儿洗礼 |
| **门徒训练**（*Nachfolge*） | 跟随耶稣是具体的、代价高昂的生活方式，包括「教会纪律」（对不悔改者开除） | 主流派强调「因信称义」而不强调「作门徒的代价」 |
| **非暴力**（多数，但非全部） | 不可起誓、不可参军、不可担任 Magistrates（官员）、不抵抗恶人 | 路德宗与改革宗都接受「正义战争」与基督徒从政 |
| **政教分离** | 教会与国家是两个领域，教会不用刀剑 | 主流派都依赖世俗权力 |
| **共产式互助**（部分群体） | 早期瑞士弟兄会与哈特派实行财产共享（不是共产主义，而是自愿的互助） | 主流派无此实践 |

:::pit t="关于重洗派的一个必要澄清：他们不是「现代意义上的自由主义者」"
很多现代人把重洗派读成「宗教自由的先驱」——这不完全错，但要小心。

**他们确实主张**：信仰不能强迫，教会必须是自愿的，国家无权决定信仰。

**但他们不是**：（1）不宽容的反对者——他们自己的群体内部纪律极其严格，不悔改者会被「交付撒但」（开除并断绝交往）；（2）世俗主义者——他们的政教分离不是「宗教私人化」，而是「教会不应使用刀剑」，这恰恰是一种**更严格的宗教立场**；（3）女权主义者——多数重洗派群体极其保守，强调妇女顺服。

**更准确的说法**：他们的「宗教自由」是**为了保护教会的纯洁**，而不是为了保护个人的选择权。**这与现代自由主义的目标相反，但产生了相似的制度结果。**
:::

### 12.2 明斯特叛乱（1534–1535）：一次毁掉整个运动名声的事件

重洗派的历史上有一个灾难：**明斯特（Münster）**。

1534 年，重洗派在德意志西北部的明斯特城取得了多数，驱逐了主教，宣布建立「**新耶路撒冷**」。来自荷兰与德国的重洗派涌入该城。领导层逐渐激进：

- **扬·马提斯**（Jan Matthys）宣称自己是**以诺**（创 5:24），后来在一次出击中被杀。
- **扬·范·莱顿**（Jan van Leiden）自立为「**新耶路撒冷的王**」，实行**多妻制**、财产共享、以及恐怖统治（反抗者被处死）。
- 1535 年 6 月，城市被围困一年后陷落。**扬·范·莱顿与两名同伴被处死，尸体被装在铁笼里挂在圣兰伯特教堂的塔上**——那些铁笼至今仍挂在那里。

:::why t="明斯特事件为什么是重洗派的灾难"
因为**它给了所有对手一个完美的宣传武器**。

此后一百年，所有反对重洗派的文献都会引用明斯特：**「看，这就是重洗派真正想要的东西——多妻、暴力、狂热、共产。」** 而事实上，绝大多数重洗派（瑞士弟兄会、门诺派）**明确谴责**明斯特，认为它完全违背了他们的非暴力原则。

**这个事件的教训具有普遍性**：一个边缘运动中最极端的一支，往往会定义整个运动在主流记忆中的形象。**而温和派无论怎么澄清，都无法抹去那个形象。**

**对本书的启示**：读任何宗派史时，都要问一句——**这个形象是谁塑造的？** 是它自己的文献，还是对手的文献？**绝大多数「异端」的形象，都是胜利者写的。**
:::

### 12.3 门诺·西蒙斯与门诺派

明斯特之后，重洗派在荷兰与北德由一个前天主教神父重整：**门诺·西蒙斯**（Menno Simons，1496–1561）。

他的贡献是：
1. **明确拒绝明斯特的暴力**，回到非暴力与门徒训练。
2. **系统化荷兰重洗派的神学**（《基督教教义的基础》）。
3. **建立巡回的「隐蔽教会」**（*schuilkerk*），在迫害下维持组织。

他的追随者被称为**门诺派**（Mennonites），今天全球约 210 万人，主要分布在荷兰、德国、俄罗斯、美国、加拿大、刚果、埃塞俄比亚、印度尼西亚。

**阿米什人**（Amish）是门诺派的一个分支：1693 年，瑞士裔门诺派领袖**雅各布·阿曼**（Jakob Ammann）主张更严格的「回避」（*Meidung*，对开除者的社交隔绝），导致分裂。阿米什人后来移民北美（18–19 世纪），今天约 37 万人，主要分布在宾夕法尼亚、俄亥俄、印第安纳。**他们至今不用汽车、不用电网、穿着 18 世纪的服装**——这不是「落后」，而是**有意识的文化隔离**（他们认为现代技术会瓦解共同体）。

**哈特派**（Hutterites）是另一支：源于 1528 年奥地利蒂罗尔的**雅各布·胡特**（Jakob Hutter），实行**财产共享**（*Gütergemeinschaft*）。今天约 5 万人，分布在北美（美国、加拿大）的集体农庄（*Bruderhof*，兄弟庄）里。

### 12.4 重洗派的遗产：整个「信徒教会」传统

重洗派本身是一个小群体（今天全球约 200 万人），但它的**神学直觉**扩散到了整个新教世界：

| 后裔 | 时间 | 关系 |
|---|---|---|
| **英国浸信会** | 1609（约翰·史密斯在阿姆斯特丹） | 接受「信徒洗礼」与「政教分离」，但神学上属加尔文派或阿米念派，不完全是重洗派的后裔（有独立起源） |
| **贵格会**（Quakers） | 1650s（乔治·福克斯） | 「内心之光」、无圣礼、无神职、和平主义、反奴隶制 |
| **门诺派/阿米什/哈特派** | 16 世纪至今 | 直接后裔 |
| **弟兄会**（Brethren） | 1708（德国施瓦岑瑙） | 重洗派与敬虔主义的混合 |
| **{{五旬节派}}**（部分） | 20 世纪 | 强调「自愿的、经验的、圣灵充满的」群体，与「信徒教会」直觉相合 |
| **当代的「简单教会」运动** | 20–21 世纪 | 反制度、强调门徒训练与共同体 |

:::why t="为什么重洗派的直觉如此持久"
因为它回应了一个真实的问题：**如果教会包含所有出生在其中的人，那「作门徒」还有什么意义？**

路德与加尔文的答案是：**教会是「麦子与稗子的混合体」，审判留给神**（太 13:24–30）。这个答案在神学上极强，但在实践上带来一个问题：**教会纪律无从执行**（因为不能分辨谁是麦子）。

重洗派的答案是：**教会是自愿的、可辨认的、有纪律的共同体**。这个答案在实践上极强（共同体感、委身度、互助），但在神学上带来一个问题：**你凭什么判断谁是真信徒？** 而历史证明，一旦开始判断，就会走向「纯洁化」的无穷分裂（这一点在清教徒与后来的各种「真教会」运动中反复出现）。

**这两个答案，就是「大公教会」与「信徒教会」两种教会论的永久对立。** 今天的天主教、东正教、路德宗、圣公会站在前者；浸信会、门诺派、五旬节派、以及大部分华人独立教会站在后者。
:::

### 12.5 争议与反驳

#### 12.5.1 主流新教对重洗派的批评（16 世纪）

- **「你们的婴儿洗礼否定是异端。」** 洗礼是「新约的割礼」（西 2:11–12），割礼是给婴儿的，所以洗礼也应当给婴儿。
- **「你们的『自愿教会』会导致无政府。」** 若人可以不属于任何教会，社会秩序就失去了基础。
- **「你们的非暴力是不负责任。」** 若人人不抵抗恶人，恶人就会统治世界（这是路德对重洗派的直接批评）。
- **「明斯特证明了你们会走向暴力。」** （虽然绝大多数重洗派谴责明斯特。）

#### 12.5.2 重洗派对主流的批评

- **「你们的教会不是教会，是国家的部门。」** 一个由出生决定的成员资格，不是新约的教会。
- **「你们的『因信称义』取消了作门徒的代价。」** 路德说「信心必然结出果子」，但你们的教会从不执行纪律，所以果子从不需要被检验。
- **「你们用刀剑维持福音，这就是否认福音。」** 路德在农民战争中的立场，是重洗派最不能接受的。

#### 12.5.3 无神论与世俗主义的批评

- **「你们的共同体是压迫性的。」** 阿米什的女性、儿童、以及离开群体的人（*shunning*，社交隔绝）承受了巨大的心理代价。
- **「你们的非暴力是寄生性的。」** 你们享受国家提供的不被侵略的保护，却拒绝参军——这是搭便车。
- **回应**：（1）关于共同体压迫：这一点是真实的，且近年有大量前阿米什人的证词（如《阿米什人的出走》类回忆录）；（2）关于非暴力：门诺派在历史上确实付出了代价（16 世纪被处死数千人，20 世纪在苏联、纳粹德国都受迫害），所以「搭便车」的指责并不完全公平。

### 12.6 常见误解

:::pit t="关于重洗派的四个误解"
**误解一：「重洗派是宗教改革的极左派，追求社会革命」。**
多数重洗派（门诺派、哈特派）**极其保守**：他们不参与政治、不参军、不使用现代技术（阿米什）。明斯特的暴力派是少数，且被其他重洗派谴责。

**误解二：「重洗派 = 浸信会」。**
浸信会与重洗派在「信徒洗礼」上相同，但在起源与神学上不同：浸信会源于 17 世纪英国分离派（受加尔文主义或阿米念主义影响），有独立的起源；重洗派源于 16 世纪瑞士与荷兰。**两者都强调「信徒教会」，但浸信会不继承重洗派的非暴力与财产共享。**

**误解三：「重洗派反对一切制度」。**
他们反对的是**教会与国家的合一**，不是一切制度。哈特派的集体农庄有极其严密的制度（生产计划、分配规则、教育体系）。

**误解四：「重洗派是『原始基督教』的复原」。**
这是他们自己的说法，不是史实。他们的许多实践（非暴力、政教分离、财产共享）在古代教会中并不普遍（早期基督徒参军、拥有财产、且有主教制）。**他们不是「恢复原貌」，而是「重新诠释」——而这个诠释本身是 16 世纪的产物。**
:::

## 第 13 章：英国宗教改革与三十年战争（1527–1648） {#ch-13}

### 13.1 亨利八世的婚姻案：一场由离婚开始的国家革命

英国宗教改革的起点，与路德完全不同：**它不是神学问题，而是婚姻问题。**

**（一）问题的形状。**
**亨利八世**（Henry VIII，1491–1547）娶了西班牙公主**凯瑟琳**（Catherine of Aragon）。他们只有一个女儿玛丽存活，没有男嗣。亨利需要男性继承人（都铎王朝刚结束玫瑰战争，王位继承极其敏感）。

他的解决方案是：宣布这段婚姻**从来无效**。理由：凯瑟琳曾嫁给他的哥哥亚瑟（1502 年去世），而利未记 20:21 说「人若娶弟兄之妻，这本是污秽的事」。所以这段婚姻违背了神的律法，教宗当初的豁免是无效的。

**（二）为什么教宗不能答应。**
教宗**克雷芒七世**在 1527 年正被神圣罗马帝国皇帝**查理五世**控制（「罗马之劫」刚发生，教宗实际上是皇帝的囚徒）。而凯瑟琳是查理五世的**姑母**。所以教宗既不能承认自己前任的豁免无效（那会损害教宗的权威），也不敢得罪皇帝。

**（三）亨利的解决方案：把教宗赶出英国。**
- 1531 年：英国教士会议承认国王是「英国教会唯一的最高首脑」（*Supreme Head*，附「就基督的律法所允许的范围而言」的限定）。
- 1532 年：《首年圣职捐法》（*Act in Restraint of Annates*）禁止把教会的首年收入交给罗马。
- 1533 年：《上诉法》（*Act in Restraint of Appeals*）：宣布一切属灵案件最终由英国法庭裁决，**不得上诉罗马**。这道法案的序言里有一句极其重要的话：**「英国是一个帝国」（*This realm of England is an empire*）**——即英国是一个独立的主权体，不受任何外国权威管辖。
- 1533 年 1 月：亨利与**安妮·博林**（Anne Boleyn）秘密结婚。5 月，新任坎特伯雷大主教**克兰麦**（Thomas Cranmer）宣布亨利与凯瑟琳的婚姻无效。6 月安妮加冕。9 月伊丽莎白出生。
- 1534 年：《**至尊法案**》（*Act of Supremacy*）：正式确认国王为英国国教最高首脑。
- 1535 年：**托马斯·莫尔**（Thomas More，人文主义者、《乌托邦》作者、前任大法官）与**约翰·费舍尔**（罗切斯特主教）因拒绝承认至尊法案被处死。

**（四）解散修道院（1536–1541）。**
亨利解散了约 800 所修道院，没收其土地与财产（价值约相当于王室年收入的数倍）。这些土地被出售给贵族与乡绅——**这创造了一个「有既得利益的新教地主阶层」**，他们此后成为英国新教的坚定支持者（因为恢复天主教意味着失去土地）。

:::why t="英国宗教改革的独特性：它是一场「国家主权革命」"
把它与德国对比：

- **德国**：神学问题（称义）→ 引发政治后果（诸侯脱离罗马）。
- **英国**：政治问题（王权 vs 教宗）→ 引发神学后果（英国国教逐渐新教化）。

**这个顺序的差别，决定了英国国教的性格**：它从诞生起就是一个**国家机构**，其合法性来自国王，而不是来自某个神学突破。所以它的神学可以很宽（从接近天主教到接近加尔文主义），但它的**治理结构**极其明确：**国王是最高首脑，主教由国王任命。**

**这条线索一直延伸到今天**：英国国教（圣公会）是唯一一个「以君主为最高首脑」的全球性教会（虽然实际治理已高度分权），而它的神学光谱从「高教会派」（Anglo-Catholic，接近天主教）到「低教会派」（Evangelical，接近新教）都有。
:::

### 13.2 英国国教的独特路线：「中间道路」

**（一）爱德华六世（1547–1553）：新教化。**
亨利死后，年幼的爱德华六世继位，实际权力在萨默塞特公爵与诺森伯兰公爵手中，两人都倾向新教。**克兰麦**（坎特伯雷大主教）推动改革：

- 1549 年《公祷书》（*Book of Common Prayer*，第一版）
- 1552 年《公祷书》第二版（更明确的新教倾向）
- 1553 年《四十二条信条》（后改为《三十九条》）

**（二）玛丽一世（1553–1558）：天主教复辟。**
爱德华早逝，玛丽（凯瑟琳的女儿，虔诚的天主教徒）继位。她恢复了天主教、废除了新教法案，并烧死了约 280 名新教徒（包括克兰麦）。她被后世称为「血腥玛丽」（*Bloody Mary*）——**这个称号是她的新教对手给的**，而实际上她的处死人数远少于她父亲亨利八世（亨利处死约 7 万人，包括大量的修道院修士与叛乱的农民）。

**（三）伊丽莎白一世（1558–1603）：妥协的定型。**
伊丽莎白（安妮·博林的女儿）继位后，需要在两个极端之间找到平衡：天主教（国内保守派与西班牙支持）与新教（清教徒要求彻底改革）。

**1559 年的《至尊法案》与《统一法案》** 确立了「**伊丽莎白的宗教安置**」（*Elizabethan Settlement*）：

- 国王（女王）是教会最高「治理者」（*Supreme Governor*，注意改成了「治理者」而不是「首脑」，因为女性不能当教会「首脑」）。
- 《公祷书》恢复（1559 年版）。
- **《三十九条信条》**（1571）成为英国国教的教义标准。**注意它的措辞极其模糊**：它在新教与天主教之间刻意留下空间（例如关于圣餐，它只说「基督的身体被赐予、领受」，不定义机制）。

**这就是「中间道路」**（*via media*）：不是「一半天主教一半新教」，而是**刻意的不精确**——为了容纳尽可能多的人。

:::pit t="「中间道路」是神学还是政治？"
两者都是，但政治成分更重。

**神学上**：它确实有一个实质立场——「圣经 + 传统 + 理性」的三重权威（Richard Hooker 的《教会政体 laws》，1594），这与路德的「唯独圣经」、加尔文的「圣经是唯一权威」不同。它保留了主教制、礼仪的庄严、以及圣礼的实在性。

**政治上**：它的模糊是为了让尽可能多的人留在同一个教会里——因为英国的统一依赖于宗教统一。伊丽莎白的名言（据传）是：「**我不会为人的灵魂开一扇窗**」（*I will not make windows into men's souls*）——意思是：你心里信什么我不管，你只要来教堂、用公祷书、不公开反对就行。

**这个安排的代价**：它同时激怒了双方——清教徒要求更彻底的新教（废除主教、简化礼仪），天主教徒要求回归罗马。**这两股不满，在 17 世纪引爆了英国内战。**
:::

### 13.3 清教徒与英国内战（1603–1660）

**（一）谁是清教徒。**
{{清教徒}}（Puritans）不是一个宗派，而是一个**运动**：他们留在英国国教内部（多数），但要求「进一步纯洁化」（*purify*）：

- 废除主教制（改为长老制或公理制）
- 废除《公祷书》中的「天主教的残余」（祭衣、十字架、跪领圣餐、婚戒）
- 强调讲道（而非礼仪）
- 严格的个人与家庭纪律（守主日、禁赌、禁戏）
- 反天主教的强烈意识

**（二）三个浪潮。**
1. **伊丽莎白时期（1558–1603）**：温和的清教徒在教会内部推动改革，失败。
2. **詹姆斯一世（1603–1625）**：「没有主教，就没有国王」（*No bishop, no king*）——詹姆斯明确支持主教制，因为主教的权威与王权的权威同构。**分离派**（Separatists）出现：他们认为英国国教已经腐败到无法改革，必须脱离。**1620 年「五月花号」**就是一批分离派（清教徒）移民北美。
3. **查理一世（1625–1649）**：查理与他的大主教**劳德**（William Laud）推行「高教会」政策（强调礼仪、祭坛、主教权威），激怒了清教徒与苏格兰长老会。**1637 年劳德试图把《公祷书》强加给苏格兰**，引发**1638 年全国誓约**（National Covenant）与**主教战争**。

**（三）英国内战（1642–1651）与查理一世之死。**
- 1640 年查理被迫召开议会（「短期议会」与「长期议会」）以筹款。
- 1642 年内战爆发：国王派（骑士党）vs 议会派（圆颅党）。
- 1645 年**纳西比战役**：议会军（新模范军，克伦威尔领导）决定性胜利。
- **1649 年 1 月 30 日，查理一世被以「叛国罪」处死**——**这是欧洲历史上第一次由一个法庭公开审判并处死一位在位君主。**
- 1649–1660：英格兰成为共和国（Commonwealth），克伦威尔任「护国公」（Lord Protector，1653–1658）。
- **1660 年王朝复辟**：查理二世回国，英国国教恢复，清教徒被排挤（1662 年《统一法案》要求所有牧师接受公祷书，约 2000 名牧师辞职——「大驱逐」*Great Ejection*）。

:::why t="英国内战为什么是「宗教战争」而不是「宪政革命」"
现代叙述常把它讲成「议会 vs 国王的宪政斗争」。这有一半是真的，但**宗教是核心**：

- 议会派的核心诉求是「真正的宗教改革」（废除主教制、纯洁教会）。
- 国王派的核心诉求是「维持主教制与王权」（二者在神学上互相支持）。
- 苏格兰人参战，是因为他们要保护自己的长老制。
- 克伦威尔本人是**独立派**（Independents，主张公理制，每个堂会自治），他的军队里有大量**浸信会、第五王国派、求索派**（*Seekers*）、以及各种激进派别——**新模范军是 17 世纪最激进的宗教实验场之一。**

**一个惊人的事实**：1640 年代的伦敦，出现了**出版自由**的短暂窗口，各种激进观点（妇女讲道、土地公有、废除教会什一税、甚至无神论）公开印行。**这是英语世界第一次「舆论爆炸」**——而它是由宗教争论驱动的。
:::

### 13.4 三十年战争（1618–1648）：宗教战争的终点

**（一）起因。**
1617 年，哈布斯堡的斐迪南（狂热天主教徒）成为波希米亚国王，撤销了新教徒的宗教权利。1618 年 5 月 23 日，波希米亚新教贵族把两名皇帝的官员**从布拉格城堡的窗户扔了出去**（「**布拉格抛窗事件**」，*Defenestration of Prague*）——两人落在粪堆上，活了下来（天主教方面宣称是圣母保佑，新教方面说是粪堆保佑）。

**（二）四个阶段。**

| 阶段 | 时间 | 事件 |
|---|---|---|
| 波希米亚—普法尔茨 | 1618–1625 | 白山战役（1620）：波希米亚新教贵族被击败，波希米亚被强制重新天主教化 |
| 丹麦 | 1625–1629 | 丹麦国王克里斯蒂安四世介入，失败 |
| 瑞典 | 1630–1635 | **古斯塔夫·阿道夫**（新教英雄）介入，1631 年布赖滕费尔德大胜，1632 年吕岑战役中阵亡 |
| 法国—瑞典 | 1635–1648 | **法国（天主教）加入新教一方**，对抗哈布斯堡——战争彻底变成权力政治 |

**（三）代价。**
中欧部分地区（尤其德意志）人口损失估计在 **20%–40%**（有些地区如符腾堡损失达 2/3）。**这不是「战斗死亡」，主要是饥荒、瘟疫、以及军队的掠夺**（雇佣兵没有军饷，靠抢劫为生）。

**（四）《威斯特伐利亚和约》（1648）。**
- 确认「**教随国立**」（*cuius regio, eius religio*）的原则，并**扩展到加尔文派**（1555 年只承认路德宗）。
- 1624 年为「基准年」：各领地按 1624 年的实际状况确定宗教归属。
- 承认荷兰与瑞士的独立。
- 建立「**主权国家**」的原则：各国在自己的领土内拥有主权，不受外部宗教权威（教宗）干预。
- 教宗英诺森十世宣布和约「无效」（*Zelo domus Dei*），但没有人理会——**这是教宗政治权威衰落的一个标志性时刻**。

:::why t="威斯特伐利亚为什么是「现代国际秩序」的起点"
因为它做了三件事：

1. **把宗教从国际政治中剥离**：各国不再以「保护同宗教徒」为理由干涉他国内政（至少在原则上）。
2. **确立主权平等**：所有国家（无论大小、无论宗教）在国际法上平等。
3. **承认「宗教分裂的永久性」**：不再追求「恢复统一」，而是接受「多个教会共存」。

**这就是「威斯特伐利亚主权」（Westphalian sovereignty）** 概念的来源。**它也是「宗教战争打累了」的产物**——不是因为人们变得宽容了，而是因为**没有人能赢**。

**一个深刻的反讽**：宗教自由的制度化，不是来自对自由的信念，而是来自**暴力的耗尽**。这一点，是理解现代世俗国家起源的关键。
:::

### 13.5 新教宗派图谱（16–17 世纪）

| 宗派 | 起源 | 神学 | 治理 | 圣餐 | 洗礼 |
|---|---|---|---|---|---|
| **路德宗** | 1517 德国 | 称义（归算）、圣餐同体论、单重预定 | 主教制（由诸侯管辖） | 基督身体真实临在 | 婴儿洗礼 |
| **改革宗/长老会** | 1520s 瑞士、1530s 日内瓦 | 神的主权、双重预定、圣餐属灵临在 | 长老制 | 属灵临在 | 婴儿洗礼 |
| **圣公会** | 1534 英国 | 中间道路（39 条，模糊） | 主教制（君主为最高治理者） | 真实临在（不定义机制） | 婴儿洗礼 |
| **重洗派/门诺派** | 1525 瑞士 | 门徒训练、非暴力、政教分离 | 会众制 | 象征/纪念 | **信徒洗礼** |
| **浸信会** | 1609 荷兰/英国 | 加尔文派或阿米念派、信徒洗礼、政教分离 | 会众制 | 象征/纪念 | **信徒洗礼** |
| **公理会/独立派** | 1580s 英国 | 加尔文派、每个堂会自治 | 会众制 | 属灵临在 | 婴儿洗礼（部分改为信徒） |
| **贵格会** | 1650s 英国 | 内心之光、无圣礼、无神职、和平主义 | 无结构（月会） | 无 | 无（洗礼是内在的） |
| **一位论派** | 1550s 波兰/1560s 特兰西瓦尼亚 | 反三位一体、理性主义 | 会众制 | 纪念 | 信徒（部分） |

:::note
**「新教有多少宗派？」** 这个问题的答案取决于统计口径。保守估计有 **9000 个**（World Christian Encyclopedia 的分类），宽口径统计（把独立教会都算进去）可达 **数万个**。

**但要注意**：宗派数量不等于神学差异。许多宗派的分裂原因是语言、族群、地域、历史事件（南北战争、移民、个人冲突），而不是教义。**把「数万宗派」当成「数万种神学」，是夸大了分裂；把它们当成「一个东西」，是低估了分裂。**
:::

### 13.6 争议与反驳

#### 13.6.1 天主教对新教的总体反驳（特伦托之后）

- **「你们的分裂证明了『唯独圣经』的自我瓦解。」** 一个没有最终裁判者的体系，必然分裂——这是天主教最有力、也最被历史支持的论点。
- **「你们的『因信称义』取消了成圣。」** 若人称义只是被宣告，那教会对道德的教导就失去了根基。
- **「你们的『信徒皆祭司』取消了圣职。」** 若人人都是祭司，那按立、圣礼、教会的秩序都成了可选项。
- **「你们的『两个国度』把信仰私人化。」** 宗教变成个人内心的事，公共生活失去了福音的约束。

#### 13.6.2 新教对天主教的总体反驳

- **「你们的教宗制度是历史建构，不是圣经教导。」**
- **「你们的功德宝库、赎罪券、炼狱没有圣经依据。」**
- **「你们把传统置于圣经之上。」** （特伦托会议把「圣经与传统」并列为权威来源。）
- **「你们在 16 世纪用火刑回应辩论。」** （布鲁诺 1600 年被烧死、伽利略 1633 年被判刑。）

#### 13.6.3 无神论与世俗主义对宗教改革的批评

- **「宗教改革是一场大规模的政治—经济再分配，神学是它的意识形态。」** （教会土地被没收、诸侯权力扩大、中产阶级兴起——这些是真实的后果。）
- **「『唯独圣经』释放了解释权的无政府状态。」** 结果不是「人人读经」，而是「人人自创教会」。
- **「三十年战争证明：宗教改革不是解放，而是把欧洲投入血海。」**
- **「宗教改革与资本主义、殖民主义、种族主义有共谋关系。」** （这一点在当代学术界有大量讨论，尤其关于加尔文主义与南非种族隔离的神学关联。）

**诚实的回应**：（1）这些批评大多有事实基础，不能一概否认；（2）但它们也有「以果推因」的问题——把 200 年后的后果归因于 1517 年的神学，忽略了其他变量（印刷术、国家建构、殖民经济）；（3）最重要的一点：**宗教改革的核心问题（我如何在神面前站立得住）是一个真实的人类问题**，任何历史批评都不能取消它的真实性。

### 13.7 常见误解

:::pit t="关于英国宗教改革与三十年战争的四个误解"
**误解一：「亨利八世是第一个新教徒」。**
亨利至死都认为自己是天主教徒（他攻击路德，1539 年还通过《六条法案》重申变体论、独身、告解等天主教教义）。他脱离罗马是**政治决定**，不是神学决定。

**误解二：「英国国教是天主教与新教的一半一半」。**
它是一个**独立的传统**（*via media*），有自己的神学（Hooker 的三重权威）、自己的礼仪（公祷书）、自己的灵修。它不是「混合体」，而是「第三条路」。

**误解三：「三十年战争是纯粹的新教 vs 天主教」。**
最后阶段（1635–1648）是**天主教法国对抗天主教哈布斯堡**——纯粹是权力政治。**宗教是战争的语言，不是战争的全部原因。**

**误解四：「威斯特伐利亚确立了宗教宽容」。**
它确立的是「**宗教的领土化**」——你在你的领地里信你的，我在我的领地里信我的。它**没有**确立个人信仰自由（那要到 18 世纪的启蒙运动与 19 世纪的法案）。**它结束了宗教战争，但不是因为宽容，而是因为疲惫。**
:::

:::titre
**下一章：现代与当代（第 14–17 章）**

宗教改革之后，基督教进入了一个全新的阶段：它不再是欧洲的统一信仰，而是全球的、多元的、不断分裂的运动。第五部要讲：18 世纪的复兴运动（卫斯理、爱德华兹）如何催生了福音派；19 世纪的自由主义神学如何回应达尔文与历史批判；20 世纪的五旬节运动如何成为增长最快的基督教形态；以及当代的灵恩运动、独立教会、末世论团体、以及进步与保守的持续分裂。
:::

## 第四部派别档案（卡片速查）

第四部是全书宗派最密集的一部。下面十张卡片覆盖了 16–17 世纪的主要家族，并标注它们的**分界线在哪里**——因为理解新教的关键，不是记住它们都反对什么，而是理解**它们彼此之间为什么也互相反对**。

> [[k:路德宗 | en:Lutheranism | 1517 至今 | 主流宗派 | 现存约 7000 万]]
> **主张**：称义是神**法庭式的宣告**，基督的义**归算**给信徒（*iustitia imputata*）；信徒「同时是义人与罪人」；圣经是唯一权威；圣餐中基督的身体与血**真实临在**（同体论）；单重预定（拣选无条件，但不强调弃绝的预定）。
> **来历**：1517 年路德《九十五条论纲》；1530 年《奥格斯堡信条》；1577 年《协和信条》。主要分布在德国、北欧（瑞典、丹麦、挪威、芬兰）、以及北美（ELCA、LCMS）。
> **要解决的问题**：**我怎么能确定神接纳我？** 若救恩取决于我的表现（哪怕是一点点），我就永远无法确定。
> **论敌**：天主教（注入的义）、改革宗（圣餐太弱）、重洗派（婴儿洗礼与「全民教会」）、农民（用福音支持社会革命）。
> **所受反驳**：（1）若人称义只是被宣告，恩典就没有真正改变人；（2）「同时是义人与罪人」在伦理上是危险的；（3）保留了太多天主教礼仪（祭衣、圣像、音乐），改革不彻底。
> **结局 / 现状**：成为北欧的国教；1999 年与天主教签署《关于称义教义的联合声明》，宣称在此问题上已无根本分歧（但双方内部都有强烈反对）。**注意**：路德宗内部在路德死后 30 年就爆发了信条内战（腓力派 vs 纯正派）。

> [[k:改革宗 / 长老会 | en:Reformed / Presbyterian | 1520s 至今 | 主流宗派 | 现存约 8000 万]]
> **主张**：神的主权是中心；**双重预定**（拣选与弃绝都是无条件的）；圣餐是**真实的属灵临在**（靠圣灵，而非物质）；教会由**长老**治理（牧师 + 平信徒长老）；「规范原则」——敬拜只做圣经命令的事。
> **来历**：茨温利（苏黎世，1519）、加尔文（日内瓦，1536/1541）、《海德堡要理问答》（1563）、《威斯敏斯特信条》（1646）。扩散到法国（胡格诺）、荷兰、苏格兰（诺克斯）、英格兰（清教）、以及北美。
> **要解决的问题**：**如果神有主权，人的一切（包括得救）都在他手中——那么教会应当如何组织、如何生活？**
> **论敌**：天主教、路德宗（圣餐与预定论）、阿米念派（自由意志）、重洗派（教会论）、以及自己内部的无穷派别。
> **所受反驳**：（1）双重预定使神成为恶的作者；（2）「有限赎罪」使「神爱世人」变成空话；（3）日内瓦的纪律机器是「道德警察国家」；（4）分裂最严重（仅美国就有数十个长老会宗派）。
> **结局 / 现状**：通过荷兰、苏格兰、英格兰影响了现代政治（抵抗权理论、宪政、联邦制）。**韦伯论证**它塑造了资本主义伦理（此论证远比流行版本复杂）。

> [[k:圣公会 | en:Anglicanism | 1534 至今 | 主流宗派 | 现存约 8500 万]]
> **主张**：**中间道路**（*via media*）——圣经、传统、理性三重权威（Hooker）；保留主教制与礼仪的庄严；《三十九条信条》措辞刻意模糊，容纳从「高教会」（近天主教）到「低教会」（近新教）的广泛光谱。
> **来历**：1534 年《至尊法案》（亨利八世的离婚案）；1549/1552 年《公祷书》；1559 年伊丽莎白的宗教安置；1571 年《三十九条》。
> **要解决的问题**：**如何在一个国家里同时容纳天主教徒与新教徒？** 答案是：用模糊的教义 + 统一的礼仪。
> **论敌**：清教徒（要求彻底改革）、天主教（要求回归罗马）、以及后来的福音派（要求更明确的称义教义）。
> **所受反驳**：（1）模糊是政治妥协，不是神学立场；（2）保留主教制与礼仪是「天主教的残余」；（3）它的统一依赖于国家权力（一旦国家不再强制，它就分裂了——见全球圣公会的现状）。
> **结局 / 现状**：全球圣公会（Anglican Communion）约 8500 万人，但**因为同性婚姻与女性按立问题正在事实上的分裂**（2016 年起，保守派成立「全球圣公会未来会议」GAFCON）。

> [[k:重洗派 / 门诺派 | en:Anabaptists / Mennonites | 1525 至今 | 激进改革派 | 现存约 210 万]]
> **主张**：**信徒的教会**（教会是自愿聚集的信徒，不是地域性的全民机构）；**信徒洗礼**（婴儿洗礼无效）；**门徒训练**（跟随耶稣是具体的生活方式，包括教会纪律）；多数群体主张**非暴力**、**不宣誓**、**不任公职**、**政教分离**。
> **来历**：1525 年 1 月 21 日苏黎世的「再洗礼」；瑞士弟兄会（格列伯、曼茨、布劳罗克）；荷兰的门诺·西蒙斯（1496–1561）；奥地利的雅各布·胡特（财产共享）。
> **要解决的问题**：**如果教会包含所有出生在其中的人，「作门徒」还有什么意义？**
> **论敌**：天主教、路德宗、改革宗**三方同时**（1529 年帝国法令定为死刑）；以及明斯特的暴力派（他们也谴责）。
> **所受反驳**：（1）婴儿洗礼是「新约的割礼」（西 2:11–12），应当给婴儿；（2）「自愿教会」会导致社会无政府；（3）非暴力是不负责任（路德的直接批评）；（4）明斯特证明重洗派会走向暴力（尽管绝大多数谴责它）。
> **结局 / 现状**：被大规模处死（16 世纪数千人，曼茨 1527 年在苏黎世被溺死），但**存续至今**：门诺派（210 万）、阿米什（37 万，1693 年因「回避」的严格程度分裂）、哈特派（5 万，财产共享的集体农庄）。**它的「信徒教会」直觉扩散到了浸信会、贵格会、五旬节派、以及大部分华人独立教会。**

> [[k:浸信会 | en:Baptists | 1609 至今 | 主流宗派 | 现存约 1 亿]]
> **主张**：**信徒洗礼**（只有认信者受洗，通常全身浸水）；**政教分离**（教会不应由国家支持或控制）；**会众制**（每个堂会自治，无上级机构）；圣经是唯一权威。神学上分为**加尔文派浸信会**（如美南浸信会中的改革宗派）与**阿米念派浸信会**（如自由意志浸信会）。
> **来历**：1609 年**约翰·史密斯**（John Smyth）在阿姆斯特丹为一批英国分离派施洗（这是现代浸信会的起点）；1638 年罗杰·威廉斯在北美普罗维登斯建立第一个浸信会堂会。**注意**：浸信会与 16 世纪重洗派有**相似的直觉，但不同的起源**。
> **要解决的问题**：**谁有资格受洗？** 若洗礼是认信的表达，婴儿就不能受洗；若教会是自愿的，国家就不能强制。
> **论敌**：圣公会（国教体制）、长老会（婴儿洗礼）、以及主张「政教合一」的一切体制。
> **所受反驳**：（1）信徒洗礼切断了「圣约家庭」的连续性；（2）会众制导致分裂（美南浸信会与美北浸信会因奴隶制分裂，至今未完全复合）；（3）「政教分离」在实践中常被读成「信仰私人化」。
> **结局 / 现状**：全球约 1 亿信徒，是最大的新教家族之一。**美南浸信会**（SBC）是美国最大的新教宗派（约 1300 万），近年因「教会中的性侵处理」与「批判种族理论」争议而持续内斗。

> [[k:贵格会 | en:Quakers / Religious Society of Friends | 1650s 至今 | 激进派 | 现存约 40 万]]
> **主张**：**「内心之光」**——每个人都有神的光照，不需要中介（不需要圣礼、不需要神职、不需要固定礼仪）；崇拜是**静默等待**，谁被圣灵感动谁就说话；**和平主义**（拒服兵役）；**平等**（早期支持女性讲道、反对奴隶制）。
> **来历**：**乔治·福克斯**（George Fox，1624–1691）在 1640 年代后期经历「内在的启示」，1650 年代在英格兰北部建立运动。名字来自他要求法官「在神面前战栗」（*quake*）。
> **要解决的问题**：**如果圣灵直接教导每个人，为什么还需要神职、圣礼、与神学院？**
> **论敌**：清教徒（指其为「狂热派」）、英国国教（大量贵格会士被监禁、处死）。
> **所受反驳**：（1）「内心之光」无法检验，任何人可以说自己的感动来自圣灵；（2）取消圣礼与神职，等于取消了教会的可见形态；（3）静默崇拜使教义无法传递。
> **结局 / 现状**：**在实践上影响极大**——废奴运动（英国与美国）、监狱改革、妇女权利、以及**宗教自由**（宾夕法尼亚殖民地是第一个真正实行宗教宽容的政体，1682 年由威廉·佩恩建立）。今天约 40 万人，分为「程序派」（有固定议程）与「静默派」。

> [[k:清教徒 | en:Puritans | 1560s–1700s | 运动（非宗派） | 演变为多个宗派]]
> **主张**：留在英国国教内部（多数）但要求「进一步纯洁化」——废除主教制、废除公祷书中的「天主教残余」（祭衣、十字架、跪领圣餐、婚戒）、强调讲道、严格的个人与家庭纪律（守主日、禁赌禁戏）、强烈的反天主教意识。
> **来历**：1550s–1560s 伊丽莎白时期的清教徒；1603 年詹姆斯一世拒绝改革后出现**分离派**；1620 年「五月花号」移民北美；1630 年马萨诸塞湾殖民地建立；1640s 英国内战与威斯敏斯特会议。
> **要解决的问题**：**英国国教的改革停在半路，怎么办？** 是「在里面继续推动」还是「分离出来」？——这个争论本身导致了清教徒的分裂。
> **论敌**：英国国教（高教会派）、天主教、以及**清教徒内部的其他清教徒**（长老派 vs 独立派 vs 浸信派 vs 求索派）。
> **所受反驳**：（1）「纯洁化」没有终点，会导致无穷分裂；（2）严格的道德纪律造成压抑（霍桑《红字》的原型）；（3）在马萨诸塞，清教徒自己建立了不宽容的政体（处死贵格会士、驱逐罗杰·威廉斯与安妮·哈钦森）。
> **结局 / 现状**：**在北美留下了极深的印记**——美国的「山巅之城」自我想象、工作伦理、教育（哈佛 1636、耶鲁 1701 皆为清教徒所建）、以及「美国例外论」的神学根源。今天的公理会、部分浸信会、以及福音派的某些支派是它的后裔。

> [[k:阿米念派 / 抗辩派 | en:Arminians / Remonstrants | 1610 至今 | 被多特会议谴责 | 存续]]
> **主张**：拣选基于**预知**的信心；基督为**所有人**死（无限赎罪）；恩典**可以被抗拒**；真信徒**可能失落**。
> **来历**：阿米念（1560–1609）在莱顿大学的立场；1610 年追随者提交《抗辩书》；1618–19 年多特会议谴责。
> **要解决的问题**：**如果拣选是无条件的，神是否偏私？如果恩典不可抗拒，人还有责任吗？**
> **论敌**：严格加尔文主义者（多特会议）、以及后来的改革宗正统派。
> **所受反驳**：（1）若拣选基于预知，得救就有一部分是人的功劳；（2）若恩典可抗拒，基督的死就可能「徒然」（*mortuus est frustra*）；（3）若圣徒可能失落，信徒就没有得救的确定性。
> **结局 / 现状**：多特会议后组织被禁，但**其神学通过卫理宗、五旬节派、以及大部分现代福音派存活下来**。今天多数美国福音派在实践上是阿米念式的（「你愿意接受耶稣吗？」这个邀请本身预设了自由意志）。

> [[k:胡格诺派 | en:Huguenots | 1550s–1700s | 少数派 | 已融入主流]]
> **主张**：法国加尔文派。神学上与日内瓦一致（双重预定、长老制、圣餐属灵临在）。
> **来历**：1550s 在法国贵族与城市中产中传播，约占总人口 10%。**1572 年 8 月 24 日圣巴多罗买日大屠杀**：巴黎及各省约 5000–30000 名胡格诺被杀（这是 16 世纪最严重的宗教屠杀之一）。1598 年《南特敕令》给予有限宽容；1685 年路易十四撤销，约 20 万胡格诺流亡（普鲁士、荷兰、英国、南非）。
> **要解决的问题**：**在一个天主教王国里，少数派如何生存？** 他们的答案是：武装抵抗（抵抗权理论）+ 争取法律保护。
> **论敌**：法国王室、天主教联盟、以及教宗。
> **所受反驳**：（1）武装抵抗违背「顺服掌权者」（罗 13 章）；（2）他们的「抵抗权」理论（低层官员有权反抗暴君）在政治上极其危险。
> **结局 / 现状**：**他们的抵抗权理论成为现代政治思想的重要源头**——从《温莎堡辩护》（1579）、到洛克的《政府论》、到美国《独立宣言》。流亡的胡格诺把技术（丝织、钟表、印刷）带到普鲁士与英国，深刻影响了这些国家的工业发展。

## 争论的温度计：第四部 {#part4-thermometer}

| 核心争议词 | 历史触发器 | 各方立场 | 今天的影响 |
|---|---|---|---|
| **人称义是「被宣告」还是「被改变」** | 1517 年赎罪券；路德的《塔上经验》 | 归算（新教）／注入（天主教）／「同时是义人与罪人」 | 1999 年《关于称义教义的联合声明》；福音派与天主教的持续对话 |
| **基督在圣餐中如何临在** | 1529 年马尔堡会谈（路德 vs 茨温利） | 同体论（路德）／属灵临在（加尔文）／纪念（茨温利）／变体论（天主教） | 新教两大阵营的分界线；宗派间「闭领圣餐」的实践 |
| **谁有资格受洗** | 1525 年苏黎世的「再洗礼」 | 婴儿（主流）／信徒（重洗派、浸信会） | 「大公教会」vs「信徒教会」两种教会论；华人教会的洗礼争议 |
| **教会由谁治理** | 1530s 日内瓦、1640s 威斯敏斯特 | 教宗／主教／长老／会众自治 | 天主教、圣公会、长老会、浸信会的结构差异；也影响政治（联邦制 vs 中央集权） |
| **拣选是无条件的吗** | 1610 年抗辩派；1618 年多特会议 | 无条件拣选（加尔文）／预知的信心（阿米念）／单重预定（路德宗） | TULIP；福音派内部的加尔文派与阿米念派之争 |
| **教会与国家的关系** | 1534 年英国至尊法案；1525 年重洗派 | 国家教会（路德宗、圣公会）／政教分离（重洗派、浸信会）／两把刀（天主教） | 美国宪法第一修正案；中国的「三自」与家庭教会问题 |
| **敬拜中可以做圣经没命令的事吗** | 1560s 清教徒；1640s 威斯敏斯特 | 规范原则（只做命令的）／路德宗的「无关之事」（*adiaphora*）／天主教的传统 | 当代的敬拜风格之争（乐器、投影、礼仪）；「传统 vs 当代」的崇拜战 |
| **礼仪能不能改** | 1549/1552/1559 年公祷书；1637 年苏格兰 | 统一礼仪（国家）／简化（清教徒）／保留（高教会） | 圣公会的分裂；梵二后的拉丁弥撒争议 |
| **圣经与传统谁是权威** | 1520 年《教会被掳于巴比伦》；1546 年特伦托 | 唯独圣经（新教）／圣经与传统并列（天主教）／圣经+传统+理性（圣公会） | 一切「唯独圣经」的实践困难；也解释了为什么新教分裂最多 |
| **谁有权解释圣经** | 1525 年闵采尔；1534 年英国；1640s 伦敦的出版自由 | 教宗／公会议／信条／个人（圣灵引导） | 数万宗派；「人人都是自己的教宗」这一批评的经验证据 |
| **基督徒能否用刀剑** | 1525 年农民战争；1531 年卡佩尔战役 | 正义战争（路德宗、改革宗）／非暴力（重洗派、贵格会）／圣战（十字军传统） | 和平主义宗派；军人基督徒的伦理困境 |
| **反抗暴君是顺服神还是违背神** | 1572 年圣巴多罗买；1649 年查理一世被处死 | 顺服掌权者（路德）／低层官员可抵抗（改革宗）／直接革命（清教徒独立派） | 洛克的《政府论》、美国《独立宣言》、以及「公民抗命」的神学基础 |

:::note
**怎么用第四部的温度计**：这一部最值得注意的一点是——**几乎每一行都有「两个以上的新教立场」**。

天主教与新教的分歧只有一条线；但新教内部分歧有十条线。**这就是为什么「新教」不是一个教会，而是一个家族**：他们共享「唯独圣经、唯独恩典、唯独信心」这三个口号，但对每一个具体问题都给出不同答案。

而这三个口号本身，恰好是分裂的引擎：**唯独圣经** → 谁的解释？**唯独恩典** → 恩典如何作用？**唯独信心** → 什么样的信心？**每一个「唯独」都打开了一个新的争论空间。**
:::

## 第四部小结：一场成功的革命，与一场失败的统一

1. **宗教改革成功了**（如果以「推翻罗马在西欧的垄断」为标准）：半个欧洲脱离了罗马，教会财产被重新分配，世俗国家获得了对教会的控制权。
2. **但它失败了**（如果以「建立一个纯洁的、统一的教会」为标准）：新教在 30 年内就分裂成路德宗、改革宗、圣公会、重洗派，此后又分裂成数万个宗派。
3. **它付出了巨大的代价**：农民战争（10 万人）、法国宗教战争（约 200 万）、三十年战争（中欧人口的 20–40%）、以及无数被处死的「异端」（塞尔维特、曼茨、胡斯之前的一百人）。
4. **它留下了两份遗产**：
   - **一份是解放性的**：个人良心的尊严、政教分离、宗教自由、普及教育（人人读经）、以及现代民主的部分制度（抵抗权、联邦制、代议制）。
   - **一份是压迫性的**：宗教不宽容的制度化、以神学为名的暴力、以及「分裂即忠诚」的宗派心理。

:::titre
**下一部：现代与当代（第 14–17 章）**

从 18 世纪开始，基督教进入了一个全新的阶段。它不再是欧洲的统一信仰，而是**全球的、多元的、不断分裂的运动**。你会看到：卫斯理的复兴如何催生福音派；施莱尔马赫如何用「感觉」重建神学；达尔文与历史批判如何撕裂教会；五旬节运动如何在 100 年内从零变成 6 亿人；以及当代的灵恩运动、独立教会、末世论团体、与进步/保守的持续战争。
:::

# 第五部：现代与当代

## 当基督教不再是「欧洲的宗教」

1700 年，全世界约 2.2 亿基督徒，其中绝大多数在欧洲。

2020 年，全世界约 24 亿基督徒，其中**超过 60% 在非洲、亚洲、拉丁美洲**。欧洲的教会大量空置（英国圣公会的出席率在 60 年间下降了 70% 以上），而非洲的教会每天新建数百个堂点，拉丁美洲的五旬节派在 50 年里从零增长到 2 亿人。

**换句话说：基督教的重心，在 20 世纪完成了一次大迁移。** 而这次迁移，比任何一次教义争论都更深刻地改变了基督教的面貌——因为非洲、亚洲、拉美的基督徒读经的方式、关心的问题、以及表达信仰的形式，与欧洲人完全不同。

:::why t="为什么第五部要处理「现代性」而不是继续讲教义"
因为从 18 世纪开始，基督教面对的主要挑战**不再是内部的教义争论，而是外部的三个冲击**：

1. **理性主义与启蒙**：圣经的历史可靠性被质疑，神迹被视为不可能，教会被视为迷信的残余。
2. **科学**：达尔文的进化论（1859）取代了创造叙事；地质学把地球年龄拉长到几十亿年。
3. **历史批判学**：学者开始把圣经当作历史文献来研究（作者是谁？何时写成？哪些是后来插入的？），而不是当作神的话。

**这三个冲击，把基督教撕成了两条路线**：
- **自由主义**：接受现代学术，重新解释信仰（圣经是人的宗教经验记录，神迹是象征，教义是文化产物）。
- **基要主义**：拒绝现代学术，坚持圣经无误、神迹真实、教义不可动摇。

**而这两条路线至今仍在打仗**——从 1925 年的斯科普斯审判，到今天的美国「进化论 vs 创造论」之争，到「历史耶稣」研究，到「圣经无误」的争论。**这是基督教在 21 世纪最深的裂口，比新教与天主教的分裂更活跃。**
:::

## 第 14 章：复兴、觉醒与启蒙（1675–1830） {#ch-14}

### 14.1 敬虔主义：当正统变得干燥

17 世纪末，路德宗的正统神学（*lutherische Orthodoxie*）达到了极高的技术水准——神学家们用亚里士多德的逻辑，精确地定义了每一个教义命题，写下了庞大的系统神学。**但普通信徒的生活几乎没有改变。** 讲道是教义论证，不是呼召悔改；教会是国家的机构，不是信徒的共同体。

**菲利普·雅各布·施本尔**（Philipp Jakob Spener，1635–1705）在法兰克福牧会时，提出了一个简单的方案：**在教会内部组织小型的「敬虔聚会」**（*collegia pietatis*）——在牧师家里读经、祷告、讨论，让平信徒也能说话。

1675 年，他出版了《**敬虔的渴望**》（*Pia Desideria*），提出六项改革建议，其中最著名的是：

> **「在讲道中，不仅要分辨真假教义，更要分辨真假基督徒。」**

**这句话是敬虔主义的核心**：正统（orthodoxy）不等于重生（regeneration）。一个人可以完全同意《奥格斯堡信条》的每一条，却从未真正信靠神。

**（一）哈勒与弗兰克。**
施本尔的学生**奥古斯特·赫尔曼·弗兰克**（August Hermann Francke，1663–1727）在哈勒大学建立了敬虔主义的中心：一所贫民学校、一所孤儿院、一个圣经印刷所、以及一个差会（丹麦-哈勒差会，1706 年派出第一批传教士到印度——**这是新教海外宣教的起点**）。

**（二）亲岑多夫与摩拉维亚弟兄会。**
**尼古劳斯·冯·亲岑多夫**（Nikolaus von Zinzendorf，1700–1760）是萨克森贵族，他在自己的领地**黑恩胡特**（Herrnhut）接纳了一批来自波希米亚的摩拉维亚难民（他们是胡斯派「波希米亚弟兄会」的后裔，见第 9 章）。1727 年 8 月 13 日，一次圣餐礼中，这群人经历了一次「圣灵的浇灌」，从此形成了**摩拉维亚弟兄会**（Moravian Church）。

**他们的特点**：
- **强烈的宣教热情**：在 30 年内派出了数百名宣教士（到格陵兰、西印度群岛、北美、非洲）。
- **「心宗教」**（*Herzensreligion*）：信仰是心的经历，不是头脑的同意。
- **24 小时连续祷告**（「守望祷告」持续了一百多年）。
- **对卫斯理的直接影响**：1738 年卫斯理在去美洲的船上遇到摩拉维亚信徒，被他们在风暴中的平静震撼；回伦敦后在阿尔德门街的一次摩拉维亚聚会中「心突然变得火热」。

### 14.2 卫斯理与循道运动：一次意外的大复兴

**约翰·卫斯理**（John Wesley，1703–1791）是牛津大学的希腊文讲师，英国国教牧师，**终身未脱离英国国教**（他至死都是圣公会神父）。

**（一）牛津的「圣社」。**
1729 年，卫斯理与弟弟查尔斯在牛津组织了一个小组，严格守圣餐、禁食、探监、学习圣经。同学嘲笑他们「**循规蹈矩的人**」（*Methodists*）——**这个名字从此成了整个运动的名称**。

**（二）1738 年 5 月 24 日，阿尔德门街。**
卫斯理在日记里写道：

> 「晚上我去阿尔德门街的一个聚会，有人正在读路德的《罗马书序言》。大约八点三刻，当他读到「神因信将他的义赐给人」时，我感到**我的心奇异地火热**（*my heart was strangely warmed*）。我感到自己确实信靠了基督，唯独基督，为我的救恩；并且我得到一个确据：他已除去我的罪，甚至是我自己的罪，并救我脱离了罪与死的律。」

**这就是循道运动的神学核心**：不是「我同意这个教义」，而是「**我感到神接纳了我**」。它是一个**经验**，不是一个命题。

**（三）露天讲道与组织天才。**
卫斯理最重要的事迹不在神学，而在**组织**：

- **露天讲道**：他一生骑马约 40 万公里，讲道约 4 万次。他公开讲道的原因很简单：教堂不让他讲（因为他的信息「太情绪化」），而工人、矿工、农民不会进教堂。
- **「会社」（societies）→「班会」（classes）→「支队」（bands）**：他把信徒组织成 10–12 人的小组，每周聚会，互相问责（「你的灵魂如何？」）。**这是现代「小组教会」的原型。**
- **平信徒讲道者**：他大量使用未受神学训练的平信徒（包括女性）讲道——**这在他那个时代是极其激进的**。
- **诗歌**：弟弟**查尔斯·卫斯理**写了约 6500 首圣诗（《万古磐石》《听啊天使高声唱》），这些诗歌是循道运动真正的神学载体。

**（四）亚米念式的神学。**
卫斯理明确站在阿米念一边：**拣选基于预知、基督为所有人死、恩典可以被抗拒**。他还提出两个独特的教义：

- **先在的恩典**（*prevenient grace*）：神在每个人心里都先赐下一种「普遍的光照」，使人在堕落之后仍**有能力回应**福音。**这是卫斯理对「全然败坏」的修正**：人不完全无能，因为恩典已经先行恢复了某种自由。
- **完全成圣**（*Christian perfection*）：信徒在今生可以达到「完全爱神爱人」的状态（不是无罪，而是动机的纯洁）。这是循道运动最独特、也最受争议的教义。

:::why t="卫斯理与路德的分歧，就是第 6 章的复演"
把两人的立场并排看，你会发现这是**奥古斯丁与半伯拉纠之争的第三次上演**：

| | 路德 | 卫斯理 |
|---|---|---|
| 人的能力 | 完全无能（*non posse non peccare*） | 因先在的恩典而能回应 |
| 拣选 | 无条件（奥古斯丁式） | 基于预知的信心（阿米念式） |
| 恩典 | 不可抗拒 | 可以抗拒 |
| 得救确据 | 唯独信心 | 信心 + 圣灵的见证（「双重确据」） |
| 成圣 | 终身是「同时义人与罪人」 | 今生可能达到完全的爱 |

**卫斯理自己以为他忠于路德**（他在阿尔德门街读的就是路德的《罗马书序言》），但他 1740 年代与怀特腓的决裂（关于预定论）证明了两者无法调和。**而这场 18 世纪的决裂，至今仍在福音派内部继续**（加尔文派 vs 阿米念派）。
:::

### 14.3 第一次大觉醒（1730s–1740s）：美洲的宗教革命

在北美殖民地，同一时期发生了**第一次大觉醒**（First Great Awakening）：

- **乔纳森·爱德华兹**（Jonathan Edwards，1703–1758）：马萨诸塞州北安普顿的牧师，哲学家，加尔文主义者。他的布道《**落在忿怒之神手中的罪人**》（*Sinners in the Hands of an Angry God*，1741）是北美最著名的布道（「你们被一根细线吊在地狱之上，线的每一刻都在被神的忿怒烧着」）。但他真正的贡献是哲学：他试图证明「真正的宗教经验」与「纯粹的情绪激动」的区别（《宗教情感》*Religious Affections*，1746）。
- **乔治·怀特腓**（George Whitefield，1714–1770）：英国循道运动的布道者，声音洪亮、表演力极强，在北美殖民地巡回布道，吸引数万人（当时最大的城市人口也不过 3 万）。他是**跨大西洋的媒体明星**（他的布道被印刷成册，广为流传）。
- **「新光」vs「旧光」**：大觉醒把殖民地教会分裂成支持复兴的「新光派」（New Lights）与反对的「旧光派」（Old Lights），**许多宗派（长老会、公理会、浸信会）因此永久分裂**。

:::note
**第一次大觉醒的政治后果常被低估**：它创造了一个**跨殖民地的、共同的宗教经验**——来自不同殖民地的人在同一个布道会中一起哭泣、一起悔改。**这是北美殖民地第一次有「我们是一个民族」的感觉。** 一些历史学家（如 Alan Heimert）认为，这是美国革命的宗教前奏。

同时，它也使**浸信会与循道会**（原本都是小宗派）在殖民地迅速增长——因为它们不需要受过教育的牧师，也不需要教堂建筑，只需要一个能讲道的人。**这两派后来成为美国南部与边境地区的主要宗派，深刻塑造了美国的文化地图。**
:::

### 14.4 启蒙的挑战：当理性成为裁判

与复兴运动同时，另一股力量正在摧毁传统的基督教世界观。

**（一）自然神论（Deism）。**
自然神论者（英国的廷德尔、托兰德，法国的伏尔泰）主张：
- 神创造了世界，然后让它按自然律运转（「钟表匠」的比喻），不再干预（**没有神迹**）。
- 宗教的本质是道德，不是教义。
- 圣经是人写的，其中有错误、有伪造、有历史局限。

**（二）莱辛与「丑陋的壕沟」。**
**莱辛**（Gotthold Ephraim Lessing，1729–1781）提出了一个至今未解决的问题：

> 「**偶然的历史真理，永远不能证明必然的理性真理。**」

意思是：即使你证明了「基督在 2000 年前的巴勒斯坦复活了」，这仍然是一个**历史事实**，它不能推出「这是神的启示，你必须信」。**历史的偶然性，与信仰的绝对性之间，有一道「丑陋的壕沟」（*der garstige breite Graben*）。**

**这个问题至今没有被解决**。它是「历史耶稣研究」、以及一切「基督教是否可信」讨论的核心。

**（三）康德：宗教在理性之外。**
**康德**（Immanuel Kant，1724–1804）在《纯粹理性批判》（1781）中论证：人的理性只能认识「现象」，不能认识「物自体」；因此**神、灵魂、自由意志都不能被理论理性证明**。但他同时在《实践理性批判》中论证：道德需要「神存在」与「灵魂不朽」作为「公设」。

**对基督教的影响**：神被移出了可认识的世界，被放进了道德的领域。**这既是保护（科学不能再攻击神），也是流放（神不再与世界有关）。**

### 14.5 施莱尔马赫：把宗教放在「感觉」里

**弗里德里希·施莱尔马赫**（Friedrich Schleiermacher，1768–1834）被称为「现代神学之父」。他的《**论宗教：对蔑视宗教的有教养者的讲话**》（1799）是对启蒙的回应，也是现代自由派神学的起点。

他的核心论证是：

> 宗教**不是**形而上学（不是关于神存在的命题），**不是**道德（不是一套行为规范），而是「**绝对依赖感**」（*das schlechthinnige Abhängigkeitsgefühl*）——一种对「一切有限存在都依赖于无限者」的直接感受。

**这个转向的后果是巨大的**：

- **好的一面**：它使宗教不再与科学竞争（宗教不谈论事实，只谈论感受），从而在 19 世纪存活下来。
- **危险的一面**：如果宗教只是「感受」，那么**教义的真理性问题就被取消了**——三位一体、道成肉身、复活，都不再是「真的」，而是「某种感受的表达」。**这就是基要主义最恨的一点。**

:::why t="施莱尔马赫为什么是「现代神学之父」"
因为他第一次系统地回答了那个致命问题：**当科学、历史学、哲学都质疑圣经的字面真实性时，基督教还能靠什么站立？**

他的答案是：**靠经验**。你可以质疑圣经的历史性、质疑神迹的可能性、质疑教义的逻辑，但你**不能质疑我的感受**——我确实感到自己绝对依赖于某个大于我的东西。

**这条路线一直延续到今天**：从施莱尔马赫到里奇尔到布尔特曼到蒂利希到「基督教非宗教化」的朋霍费尔，都是这个思路的变体。它的力量在于**不可被科学驳倒**；它的弱点在于**不可被任何人检验**。
:::

### 14.6 自由主义神学：从哈纳克到里奇尔

**（一）里奇尔（Albrecht Ritschl，1822–1889）**：神学的中心不是「形而上学」，而是「价值判断」——基督教的真理在于它对生活的价值（「神是爱」是一个价值判断，不是一个形而上学命题）。

**（二）哈纳克（Adolf von Harnack，1851–1930）**：《什么是基督教？》（1900）是他 1899–1900 年冬季学期对全校学生的演讲。他的著名论点：

> 「**基督教的核心不是教义，而是：神是父，人的灵魂有无限的价值，人有能力成为神的儿女。**」
> 「教义史是**希腊精神在福音土壤上的产物**（希腊化论题）。」

**（三）布尔特曼（Rudolf Bultmann，1884–1976）**：「**非神话化**」（*Entmythologisierung*）——新约的世界观（三层宇宙、魔鬼、神迹）是前科学时代的，现代人无法接受；但**宣信（*kerygma*）**仍然有效：「神在基督里与人和好」这个宣告，可以在不要求相信字面神迹的情况下被理解。

**（四）朋霍费尔（Dietrich Bonhoeffer，1906–1945）**：「**非宗教的基督教**」（*religionsloses Christentum*）——「人已经成年」，宗教（作为「补缺」的、私人化的、彼岸的）已经过时；基督徒应当「在世界中」活出信仰。他在 1945 年被纳粹处死，年仅 39 岁。

### 14.7 争议与反驳

#### 14.7.1 基要派对自由主义神学的批评

- **「你们把福音变成了哲学。」** 施莱尔马赫的感受、哈纳克的核心、布尔特曼的宣信，都不是圣经的福音。
- **「你们取消了复活。」** 如果复活是象征，那么基督教的全部宣告都失去了根基（林前 15:14「若基督没有复活，我们所传的便是枉然」）。
- **「你们的『历史批判』是一种不信任的解释学。」** 先假定神迹不可能，然后再「解释」神迹，这是循环论证。
- **「你们的神太小了。」** 一个只能被感受、不能行动的神，与自然神论的「钟表匠」没有区别。

#### 14.7.2 自由派对基要主义的批评

- **「你们的『圣经无误』是 19 世纪才发明的。」** 这个教义（inerrancy）的明确表述是 1880 年代普林斯顿神学家（贺治、华腓德）为了对抗自由派而提出的，不是教会的古老信条。
- **「你们的解经是选择性字面主义。」** 你们坚持创世记 6 天字面，却不坚持「不可穿混纺的衣服」（利 19:19）；坚持童女生子，却把「日头停住」（书 10:13）当比喻。
- **「你们拒绝现代学术，结果是自我隔绝。」** 不接受历史批判、不接受进化论、不接受心理学，最终使信仰变成一个封闭的亚文化。
- **「你们的『无误』教义使圣经成为第四个位格。」** 圣经成了不能被质疑的东西，而神本身反而被遗忘了。

:::pit t="这一组争论为什么至今无法解决"
因为它不是「谁读经更认真」的问题，而是**两个不可通约的前提**：

- **自由主义的前提**：真理必须是可被现代理性检验的。所以圣经中不符合现代理性的部分，必须被重新解释。
- **基要主义的前提**：圣经是神的启示，它的真实性不依赖于现代理性。所以现代理性的「不可能」不能用来审判圣经。

**两者都在各自的前提里自洽。** 而选择哪个前提，往往不是论证的结果，而是**社会位置**的结果——你受过什么教育、你在哪个阶层、你的社群如何理解「可信」。

**这就是为什么 20 世纪基督教的核心战场不是「教义」，而是「认识论」。**
:::

### 14.8 常见误解

:::pit t="关于复兴与启蒙的四个误解"
**误解一：「敬虔主义是反智的」。**
施本尔与弗兰克都极其重视教育（哈勒的学校体系是欧洲最先进的之一）。敬虔主义的反对的是「只有正确教义、没有生命改变」，不是「学习」。

**误解二：「卫斯理创立了循道宗」。**
他终身是英国国教的神父，从未正式脱离。循道宗在他死后才逐渐成为独立宗派（1784 年他按立了美洲的监督，1795 年计划会议之后才与国教分离）。

**误解三：「启蒙运动摧毁了基督教」。**
它摧毁的是**一种特定的基督教**（把圣经当作无错误的历史记录、把神迹当作可验证的事件）。但它也催生了新的基督教形态（自由派神学、敬虔主义、复兴运动）。**18 世纪的教会出席率其实在上升，不是下降**——因为复兴运动吸引了大量原来不进教堂的人。

**误解四：「施莱尔马赫是自由派，所以他不是基督徒」。**
他自己是虔诚的摩拉维亚背景，终身牧会、讲道，他的《基督教信仰》（*Der christliche Glaube*）是一部严肃的神学著作。**把他读成「不信的人」，是基要主义论战文献的塑造，不是史实。**
:::

## 第 15 章：19 世纪的分裂（1800–1900） {#ch-15}

### 15.1 达尔文：一场不只是「起源」的争论

1859 年，达尔文出版《物种起源》。

**（一）为什么它比哥白尼更危险。**
哥白尼只是把地球从宇宙中心挪开，但神仍然是创造者。达尔文做的是一件更根本的事：**他提供了一个不需要神的机制，来解释生命的设计感。**

- 如果眼睛的精妙可以由自然选择解释，那么「设计论证」（佩利的手表比喻）就失去了力量。
- 如果人类是從类人猿演化来的，那么「神的形像」「原罪」「堕落」的历史性都成了问题。
- 如果死亡与竞争是演化的机制，那么「死亡是罪的工价」（罗 6:23）就变成了一个可疑的命题。

**（二）教会的反应（不是一句话能概括的）。**

| 立场 | 代表 | 内容 |
|---|---|---|
| **完全拒绝** | 保守派（尤其 20 世纪{{基要派}}） | 创世记是字面历史，进化论是错误的世界观 |
| **有神进化论** | 大多数主流新教与天主教 | 神用进化作为创造的方式；《人类通谕》（1950）与若望保禄二世（1996）都持此立场 |
| **智慧设计** | 1980s 起的 ID 运动 | 某些生物结构「不可化约的复杂」，需要设计者 |
| **创造论科学** | 1960s 起的 YEC（年轻地球创造论） | 地球只有约 6000 年，洪水地质学 |

:::note
**一个重要的史实**：19 世纪教会对达尔文的反应**远比流行叙述温和**。达尔文的好友是牧师，他的《物种起源》出版后并未被教会大规模谴责；真正激烈的冲突发生在**20 世纪**（尤其 1925 年斯科普斯审判之后），而那是美国基要主义运动的产物，不是 19 世纪教会的反应。

**换句话说：「科学与宗教的战争」这个叙事，很大程度上是 19 世纪末的世俗主义者（如德雷伯、怀特）与 20 世纪的基要主义者**共同建构的**——前者为了证明宗教反科学，后者为了证明科学反信仰。** 而历史上的实际关系，更多是复杂的协商。
:::

### 15.2 历史批判学：把圣经当历史文献来读

**（一）施特劳斯（David Friedrich Strauss，1808–1874）。**
《耶稣传》（1835）主张：福音书中的神迹不是历史，而是「**神话**」（*Mythus*）——是早期社群为了表达「耶稣是弥赛亚」这个信仰而创造的叙事。**这本书使他失去了教职，也使他成为 19 世纪最有争议的神学家。**

**（二）鲍尔（F. C. Baur，1792–1860）与图宾根学派。**
主张新约的大部分书卷是 2 世纪的产物，反映的是「彼得派（犹太基督教）」与「保罗派（外邦基督教）」的斗争与调和。**这个框架今天已被修正，但它开创了「新约各书有其历史处境」的研究方法。**

**（三）威尔豪森（Julius Wellhausen，1844–1918）。**
提出「**底本假说**」（*Documentary Hypothesis*）：摩西五经由四个来源（J、E、D、P）编辑而成，成书时间远晚于摩西。**这个理论至今仍是旧约研究的主流框架**（虽然细节有大量修正）。

**（四）「历史耶稣」研究（Quest for the Historical Jesus）。**
从施韦泽（Albert Schweitzer，《历史耶稣的探求》，1906）到 20 世纪下半叶的「耶稣研讨会」（Jesus Seminar，1985），学者试图把「信仰的基督」（*Christus praedicatus*）与「历史的耶稣」（*Jesus historicus*）分开。

**施韦泽的结论**极具冲击力：**每一个时代的「历史耶稣」，其实都是那个时代的神学家自己的投影。** 19 世纪自由派找到的是一个「道德导师」，而历史上的耶稣是一个**末世论先知**，他宣告世界的终结——而这一点正是自由派最不想要的。

:::why t="历史批判学为什么比达尔文更伤教会"
因为达尔文攻击的是「创造的方式」，而历史批判攻击的是「圣经的性质」。

- 如果五经不是摩西写的，那么「摩西律法」的权威从哪来？
- 如果以赛亚书有三部分、但以理书是公元前 2 世纪的，那么「预言」怎么理解？
- 如果福音书在耶稣死后 40–60 年才写成，且经过口传与编辑，那么它们的可靠性如何？
- 如果提摩太前书不是保罗写的，那么「不许女人讲道」（提前 2:12）的权威何在？

**每一个问题都直接击中教义的根基。** 而自由派的回答（「圣经是神的话，但由人写成，因此有人性的限制」）与基要派的回答（「圣经完全无误」）都无法说服对方——**因为它们对「神的话」意味着什么，有完全不同的理解。**
:::

### 15.3 牛津运动与高教会的复兴（1833–1845）

在英格兰，一股相反的运动正在兴起。

**（一）背景。**
1830 年代，英国国教面临两个威胁：（1）自由主义神学（国家开始考虑改革教会，允许非国教徒进入牛津剑桥）；（2）福音派的「低教会」倾向（强调个人得救，轻视教会制度）。

**（二）基布尔的布道（1833 年 7 月 14 日）。**
**约翰·基布尔**（John Keble）在牛津的布道《论全国性的叛教》被公认为牛津运动的起点。他主张：英国国教是一个**神圣的制度**，不是国家的部门；国家干预教会就是叛教。

**（三）纽曼与《时论集》。**
**约翰·亨利·纽曼**（John Henry Newman，1801–1890）是牛津运动的核心人物。他与基布尔、普西（E. B. Pusey）出版《时论集》（*Tracts for the Times*，1833–1841），主张：

- 英国国教是**使徒统绪**的继承者，与罗马、东正教同属一个教会。
- 圣礼是恩典的渠道（不只是象征）。
- 教义的发展是合法的（这一点后来成为他改宗的关键）。
- 「**中间道路**」（*via media*）不是含糊，而是早期教父的传统。

**（四）第 90 篇与改宗。**
1841 年，纽曼发表《时论集》第 90 篇，主张《三十九条信条》可以与天主教教义相容。这引发了轩然大波。1845 年，**纽曼正式加入天主教会**，后来成为枢机。许多牛津运动成员跟随他改宗（史称「第二次英格兰宗教改革」）。

:::note
**牛津运动的悖论**：它本来是为了**防止**英国国教滑向自由主义与天主教，结果却导致了**一批最优秀的人改宗天主教**。

但它留下了一份持久的遗产：**高教会派**（Anglo-Catholicism）——今天英国国教内部的一个重要派别，强调圣礼、礼仪、使徒统绪、以及对圣母的敬礼。它也影响了**礼仪复兴**（19 世纪的教堂装饰、音乐、礼仪革新），以及后来的**普世教会运动**。

**纽曼的一句名言**至今仍被引用：「**在更高的世界里情况不同，但在此世，活着就是变化，而臻于完美就是经常变化。**」（*In a higher world it is otherwise, but here below to live is to change, and to be perfect is to have changed often.* ——《论教义的发展》，1845）
:::

### 15.4 梵蒂冈第一次会议（1869–1870）：教宗不可错误

**（一）背景。**
19 世纪，教宗国面临意大利统一的威胁（1870 年意大利军队攻入罗马，教宗国终结）。教宗庇护九世需要一个强有力的神学立场来对抗「现代主义」——包括自由主义、政教分离、以及「教宗只是荣誉首席」的说法。

**（二）《教宗不可错误》的定义。**
1870 年 7 月 18 日，梵一会议通过《永远牧者》（*Pastor Aeternus*），定义：

> 当罗马教宗**以他的最高使徒职分**（*ex cathedra*）**定义**关于信仰与道德的教义时，他享有**不可错误**（*infallibilitas*）的恩赐——这是救主愿意赐给他教会的。

**（三）必须澄清的常见误解。**

| 误解 | 实际 |
|---|---|
| 教宗说的每句话都不可错误 | 只有 *ex cathedra*（以最高职分正式定义）的信仰与道德教义 |
| 教宗不能犯罪或犯错 | 不可错误是**教导**的恩赐，与教宗的个人品德无关 |
| 历史上用过很多次 | 严格意义上的 *ex cathedra* 定义只有**两次**：1854 年马利亚无原罪、1950 年马利亚升天 |
| 这是古代教会的教义 | 这是 1870 年的定义；东正教与新教都拒绝，部分天主教徒（「老公教会派」Old Catholics）也因此分裂 |

**（四）后果。**
- **老公教会派**（Old Catholic Churches）分裂（德国、瑞士、荷兰、奥地利），今天约 10 万人。
- **东正教与圣公会的合一对话**从此更加困难（因为这条定义成了新的障碍）。
- **但它也强化了天主教的内部统一**：在面对现代主义、自由主义、民族主义的冲击时，教宗成了一个明确的权威中心。

### 15.5 美国：新宗派的爆发地

19 世纪的美国是宗教实验场（因为没有国教、没有宗教警察、政教分离），出现了大量新的宗派：

| 宗派 | 起源 | 核心主张 |
|---|---|---|
| **摩门教**（后期圣徒教会） | 1830，约瑟·斯密 | 《摩门经》是新启示；神有身体；人可成为神；先知持续存在；**三位一体被否定**（三个分开的神） |
| **复临安息日会** | 1863，怀爱伦 | 基督 1844 年进入天上圣所；守**星期六**为安息日；灵魂不是不朽的（「灵魂沉睡」）；健康饮食 |
| **耶和华见证人** | 1870s，罗素 | 否认三位一体（阿里乌式）；否认地狱永刑；1914 年基督已在天上作王；拒绝输血、参军、庆祝节日 |
| **基督会 / 门徒会**（Campbellites） | 1832，坎贝尔父子 | 恢复新约教会的原貌；不要信条，只要圣经；浸礼；每周圣餐 |
| **救世军** | 1865，卜维廉 | 军队式组织；不施圣礼；专注社会服务与街头布道 |
| **拿撒勒人会 / {{圣洁运动}}** | 1890s | 卫斯理式的「完全成圣」；后来的五旬节运动的直接前身 |

:::why t="为什么 19 世纪的美国能产生这么多新宗派"
三个结构性原因：

1. **政教分离**（宪法第一修正案，1791）：没有国教，没有宗教警察，任何人都可以创立教会——**成本极低**。
2. **边疆社会**：西进运动中，人口分散、制度薄弱，一个有魅力的布道者就能建立一个新的群体。
3. **「复原主义」精神**（Restorationism）：美国人相信可以「回到新约的原貌」，抛弃欧洲的历史包袱。**这个信念本身就是分裂的引擎**——因为每个人对「原貌」的理解都不同。

**结果**：今天美国有超过 200 个基督教宗派（保守估计），以及数千个独立教会。**美国是全世界基督教分裂最彻底的国家，也是宗教参与率最高的发达国家之一。** 这两个事实是同一个硬币的两面。
:::

### 15.6 圣洁运动：五旬节的前夜

19 世纪后期，卫斯理式的「完全成圣」教义在美国发展成一场运动（**圣洁运动**，Holiness movement）：

- **菲比·帕尔默**（Phoebe Palmer）：主张「完全成圣」是一个**瞬间的、可经验的**恩典工作（「祭坛上的奉献」）。
- **各宗派**：拿撒勒人会（1908）、神的教会（Anderson, Indiana）、救世军（部分）。
- **关键概念**：「**第二次祝福**」（second blessing）——信主之后，还有一次「圣灵的洗」，使人脱离罪的权势。

**这个「第二次祝福」的概念，直接导向了 20 世纪的五旬节运动**——因为五旬节派只是加了一句话：**这个「圣灵的洗」的证据，就是说方言。**

### 15.7 争议与反驳

#### 15.7.1 天主教对现代主义的回应

- **《异端谬说目录》（*Syllabus of Errors*，1864）**：庇护九世列举 80 条「现代谬说」，包括「教宗不应干预世俗事务」「每个人有信仰自由」「圣经可以与科学冲突」。
- **《主的羊群》（*Pascendi*，1907）**：庇护十世谴责「现代主义」，称其为「一切异端的综合」。
- **《反现代主义誓言》**（1910）：所有神职人员必须宣誓拒绝现代主义（1967 年被废除）。

#### 15.7.2 新教内部的争论

- **基要主义 vs 自由主义**（见第 16 章）。
- **「社会福音」vs「个人救恩」**：19 世纪末，**沃尔特·饶申布什**（Walter Rauschenbusch）提出「社会福音」——福音不只是救个人，也要改造社会结构（反贫穷、反童工、反种族歧视）。保守派则担心这会取代「个人重生」的核心。

#### 15.7.3 无神论与世俗主义的批评

- **「19 世纪的神学，是在现代学术面前节节败退的历史。」** 每一次学术进展（地质学、生物学、历史学、心理学），神学都退一步，把「神的领域」缩小一点（「补缺之神」*God of the gaps*）。
- **「自由派神学是自我解构的。」** 当你把神迹、复活、道成肉身都「重新解释」为象征时，你还在信什么？
- **「基要主义是反智的。」** 它拒绝一切不符合预设的证据，把信仰变成一个封闭的体系。
- **回应**：（1）「补缺之神」的批评是有效的，主流神学确实已放弃这种策略；（2）但「自由派自我解构」的批评也被反驳：重新解释不等于取消，象征也可以是真实的表达；（3）「基要主义反智」的批评有部分真实，但要注意基要主义也有自己的学术传统（普林斯顿神学、威斯敏斯特神学院）。

### 15.8 常见误解

:::pit t="关于 19 世纪的四个误解"
**误解一：「达尔文使教会分裂」。**
19 世纪教会的反应相当温和；真正的分裂发生在 20 世纪（尤其 1925 年斯科普斯审判之后），而且是美国特有的现象。

**误解二：「历史批判学是无神论者的阴谋」。**
许多历史批判学者是**虔诚的基督徒**（如 20 世纪的 C. S. Lewis 的朋友、以及大量天主教与信义宗学者）。他们认为，诚实地研究圣经的历史性，是对「道成肉身」的尊重——因为神真的进入了历史，所以历史研究是认识他的正当途径。

**误解三：「梵一会议的『教宗不可错误』使教宗成为绝对君主」。**
它只是一个**限定性的**教导恩赐（只在 *ex cathedra* 的信仰与道德定义上），且历史上只用过两次。

**误解四：「摩门教、耶和华见证人是基督教的宗派」。**
它们自称基督教，但**在核心教义上与尼西亚信经不相容**（都否认三位一体）。所以主流基督教（天主教、东正教、新教）通常把它们归为「**异端**」或「**另一个宗教**」，而不是「宗派」。
:::

:::titre
**下一章：20 世纪（第 16 章）**

20 世纪是基督教史上变化最剧烈的世纪：五旬节运动从零增长到 6 亿人；两次世界大战摧毁了自由派神学的乐观主义；巴特写出了「新正统」；梵二会议使天主教发生了三百年来最大的转变；而基要主义与自由主义的战争，把美国撕成了两半。**这一章要讲的是：当基督教面对极权主义、大屠杀、核武器、以及全球化时，它说了什么，以及它没说什么。**
:::

## 第 16 章：20 世纪——五旬节、基要主义与普世运动（1900–1970） {#ch-16}

### 16.1 1906 年，洛杉矶阿苏萨街

1906 年 4 月，洛杉矶一个废弃的非洲{{卫理公会}}教堂里，一位独眼的黑人布道者**威廉·西摩**（William J. Seymour）开始主持聚会。聚会很快失控：人们哭泣、颤抖、倒地，并且**说起「别国的语言」**（*glossolalia*，说方言）。

聚会持续了**三年**，每天三次。来自全美、欧洲、以及世界各地的访客来观看，然后把经验带回去。**在三年内，这场小聚会成了全球性运动的起点。**

:::why t="为什么阿苏萨街是 20 世纪最重要的宗教事件之一"
因为它开启了一场在**100 年内从零增长到 6 亿人**的运动。

今天，五旬节—{{灵恩派}}（Pentecostal-Charismatic）约占全球基督徒的 **25%–30%**，是基督教史上增长最快的形态。它的中心不在欧洲，而在**拉丁美洲、非洲、亚洲**（巴西、尼日利亚、韩国、菲律宾、中国、危地马拉、肯尼亚）。

**它的神学特征极其简单**，这也是它能在任何文化中传播的原因：
1. **圣灵的洗**是信主之后的**第二次经验**（不同于重生）。
2. **说方言**是圣灵之洗的「**初始证据**」（*initial evidence*）——这是五旬节派最独特的教义。
3. **神迹医治**、**预言**、**赶鬼**在今天仍然有效（不是使徒时代的专利）。
4. **末日临近**，传福音是紧急任务。

**它为什么能跨越文化**：因为它不依赖神学教育、不依赖礼仪传统、不依赖教堂建筑。**它只需要一个人、一个房间、以及「神今天仍然在工作」的信念。**
:::

**（一）神学谱系：从圣洁运动到五旬节。**
五旬节运动不是从石头里蹦出来的。它的直接祖先是**圣洁运动**（见 15.6）：卫斯理的「完全成圣」→ 帕尔默的「第二次祝福」→ 五旬节派加了一句：**这个「第二次祝福」的证据就是说方言**。

**（二）查尔斯·帕勒姆（Charles Parham）。**
1901 年，堪萨斯州托皮卡的圣经学校里，帕勒姆让学生研究「圣灵之洗的证据是什么」，结论是：**使徒行传中每次圣灵降临，都伴随说方言**。学生**阿格妮丝·奥兹曼**（Agnes Ozman）在祷告中开始说方言——这是现代五旬节运动的第一个记录案例。**帕勒姆是「初始证据」教义的发明者。**

**（三）西摩与种族。**
西摩是帕勒姆的学生，但因为是黑人，他被安排在教室外面的走廊听课（种族隔离）。**阿苏萨街的独特之处在于它是种族融合的**——黑人与白人一起敬拜，这在 1906 年的美国是极不寻常的。但这个融合没有持续：1910 年代，美国的种族隔离压力使五旬节运动分裂成黑人教会与白人教会，这个分裂至今存在。

### 16.2 一战与巴特：自由派神学的崩溃

**（一）1914 年的崩溃。**
19 世纪自由派神学的核心信念是：**人类在进步，历史在向着神的国度前进，教育与文化会使人变好。** 这个信念在 1914 年 8 月崩溃了——欧洲最「文明」的国家互相屠杀，而且**双方的牧师都在为各自的国家祝福**。

**卡尔·巴特**（Karl Barth，1886–1968）当时是瑞士的一个乡村牧师。他后来回忆：

> 「我那时是 19 世纪神学的学生，我把它带到讲台上……但我发现，我无法用这套神学去讲道。」

**（二）《罗马书注释》（1919/1922）。**
巴特写了一部《罗马书注释》，它的核心命题是：

> **神是「完全他者」（*totaliter aliter*）。** 神不是人的宗教经验的延伸，不是文化的产物，不是道德的升华。神是**审判者与恩典的主**，他从上面来，打破人的一切自我提升。

**这本书像一颗炸弹**，因为它同时攻击了：
- **自由派**：你们把神变成了人的经验。
- **敬虔派**：你们把神变成了我的感受。
- **基要派**：你们把神变成了正确的教义（「圣经无误」也是人的东西）。

**巴特的著名比喻**：神学应当像「**在黑暗中画一只鸟**」——你只能指出它不是什么样的。或者说，传道者应当一只手拿圣经、一只手拿报纸——**向神学家说圣经的话，向世界说世界的话。**

**（三）新正统（Neo-orthodoxy）。**
巴特与布伦纳（Emil Brunner）、戈加滕（Friedrich Gogarten）、布尔特曼、蒂利希被归为「新正统」。**他们既不是自由派，也不是基要派**：

| | 自由派 | 基要派 | 新正统（巴特） |
|---|---|---|---|
| 圣经 | 人的宗教记录，有错误 | 神的话，完全无误 | **圣经是见证神的话的人的语言**；圣经的权威在于它指向基督，不在于它本身的字句 |
| 启示 | 人的宗教感受 | 命题的传递 | **神在基督里的自我显现（事件）** |
| 神 | 内在的、与世界连续 | 可以被证明的 | **完全他者**，不能被证明，只能被顺服 |

:::why t="巴特为什么同时被两边骂"
因为他的立场是**结构性的**：

- 对自由派：他坚持神是超越的、审判的、不能被人掌握的——**这否定了自由派的核心**（人的宗教经验）。
- 对基要派：他坚持圣经是**人的语言**（有历史的、文化的、人性的限制），「圣经无误」是一个错误的教义——**这否定了基要派的核心**。

**他自称「正统」（orthodox）**，因为他回到宗教改革与教父的传统；但他被两边视为敌人。

**一个重要的历史细节**：巴特是《巴门宣言》（1934）的主要起草者，该宣言拒绝纳粹的「德国基督徒」运动（把希特勒当作神的启示）。**这证明他的「神是主」不是抽象的神学，而是具体的政治抵抗**——因为如果神是主，那希特勒就不是。
:::

### 16.3 基要主义与现代主义：美国的宗教内战

**（一）《基要》（*The Fundamentals*，1910–1915）。**
两位石油富翁出资，出版了一套 12 册的小书，分发给全美数十万牧师与主日学教师。这套书是**基要主义的诞生文件**，它列出了「**五个基要**」：

1. 圣经的**无误**（*inerrancy*）
2. 基督的**神性**
3. 基督的**童贞女降生**
4. 基督的**代赎之死**
5. 基督的**身体复活**与**再来**

**（二）斯科普斯审判（1925）。**
田纳西州通过了《巴特勒法案》，禁止在公立学校教授「与圣经的创造叙事相冲突的进化论」。美国公民自由联盟（ACLU）安排了一位年轻教师**约翰·斯科普斯**（John Scopes）故意「违法」，以此挑战该法案。

审判成了一场媒体马戏：**克拉伦斯·达罗**（Clarence Darrow，著名辩护律师，不可知论者）对**威廉·詹宁斯·布莱恩**（William Jennings Bryan，三次总统候选人、基要派领袖）当庭对质，逼他承认「约拿被大鱼吞下」等故事应当字面理解。

**结果**：斯科普斯被判有罪（罚金 100 美元，后被推翻），但**在舆论上，基要主义输得很惨**。此后半个世纪，基要主义退出公共领域，转向建立自己的**亚文化**（教会、学校、出版社、广播、后来的电视）。

**（三）基要派与福音派的分化。**
1940 年代，一部分基要派认为「退出公共领域」是错误的，主张「**分离但参与**」——他们被称为**福音派**（Evangelicals）：

- **葛培理**（Billy Graham，1918–2018）：全球布道，避免宗派争议，与自由派神学家合作（这使他被严格基要派骂为「妥协」）。
- **《今日基督教》**（*Christianity Today*，1956 创刊，葛培理创办）：福音派的旗舰刊物。
- **富勒神学院**（1947）：福音派的学术中心。

**基要派 vs 福音派的关键分歧**：
- 基要派：**分离**（不与自由派、天主教、甚至不够纯正的福音派合作）。
- 福音派：**合作**（在核心教义上合一，其他问题宽容）。

:::pit t="「基要主义」这个词在中文语境里的误用"
中文里的「基要主义」（fundamentalism）常被用来指「一切保守的、原教旨的宗教立场」，甚至被用来指「伊斯兰极端主义」。

**但它有严格的历史含义**：它是**20 世纪初美国新教内部的一场运动**，核心是「五个基要」与「圣经无误」。它不是一个通用的「保守」标签。

**更准确的用法**：如果要指「一切拒绝现代性的宗教立场」，用「**原教旨主义**」或「**宗教保守主义**」更合适。「基要主义」应当保留给它的历史所指。

**另一个需要注意的点**：1970 年代之后的「**宗教右派**」（Religious Right，如道德多数派、基督教联盟）与 1920 年代的基要主义**不是同一件事**——前者积极参与政治，后者退出政治。它们共享某些神学立场，但政治策略完全相反。
:::

### 16.4 梵蒂冈第二次会议（1962–1965）：天主教的三百年最大转向

**（一）背景。**
教宗**若望二十三世**（John XXIII，1958–1963 在位）宣布召开一次大公会议，目的是「**更新**」（*aggiornamento*，字面「使现代化」）。他说的著名比喻是：「**我要打开窗户，让新鲜空气进来。**」

**（二）主要文件与变革。**

| 文件 | 内容 |
|---|---|
| 《礼仪宪章》（*Sacrosanctum Concilium*） | 允许**本地语言**代替拉丁文；允许平信徒参与；祭坛面向会众 |
| 《教会宪章》（*Lumen Gentium*） | 教会是「**神的子民**」（不只教阶制）；「**普遍成圣的呼召**」；平信徒的祭司职分 |
| 《启示宪章》（*Dei Verbum*） | 圣经与传统的相互关系；鼓励平信徒读经（**这是天主教对「唯独圣经」的一个回应**） |
| 《宗教自由宣言》（*Dignitatis Humanae*） | **宗教自由是人的基本权利**——这是天主教对 19 世纪「谬说目录」的自我修正 |
| 《我们的时代》（*Nostra Aetate*） | 对犹太教的正面表述，否定「犹太人被神弃绝」；对伊斯兰教、印度教、佛教的尊重 |
| 《大公主义》（*Unitatis Redintegratio*） | 普世主义：承认其他教会也有「救恩的要素」 |

**（三）后果。**

- **礼仪**：拉丁弥撒几乎消失（1970 年新礼弥撒，*Novus Ordo*），神父面向会众，本地语言，平信徒读经。**这引发了「传统派」的分裂**——**勒费弗尔大主教**（Marcel Lefebvre）1988 年被绝罚（其团体「圣庇护十世会」SSPX 至今地位未定）。
- **平信徒**：大量平信徒参与教会事务；女性在礼仪中的角色扩大（但**女性按立**仍被禁止，若望保禄二世 1994 年明确宣布不可更改）。
- **普世主义**：与东正教、新教、犹太教、伊斯兰教的对话全面展开。
- **危机**：保守派指责梵二导致了教会衰退（出席率下降、圣召减少、教义模糊）；自由派认为梵二做得不够（避孕、女性按立、教会民主化）。

:::why t="梵二为什么是 20 世纪天主教会最重要的事件"
因为它**改变了天主教对自己、对世界、对其他宗教的整个态度**。

**之前的天主教**（19 世纪—1950 年代）：反现代主义的、防御性的、「**教会之外无救恩**」（*extra ecclesiam nulla salus*）、与世俗世界对立的「**堡垒心态**」。

**之后的天主教**：对话的、开放的、承认「其他宗教也有真理与恩典的要素」、承认宗教自由是人权。

**这个转变的深度，可以用一件事衡量**：1864 年庇护九世在《谬说目录》中谴责「每个人有信仰自由」；1965 年梵二在《宗教自由宣言》中宣布「宗教自由是人的基本权利」。**一百年内，同一教会的官方立场完全反转。**
:::

### 16.5 普世教会运动：从爱丁堡到世界基督教协进会

**（一）1910 年爱丁堡世界宣教会议。**
这是普世运动的起点：来自 160 个宣教机构的代表（大部分是新教）在爱丁堡开会，讨论「如何把福音传给全世界」。**注意**：天主教会与东正教会没有正式参加（天主教会到 1960 年代才参与）。

**（二）世界基督教协进会（WCC，1948 年阿姆斯特丹成立）。**
目前有约 350 个成员教会（新教、圣公会、东正教、以及部分五旬节派），代表约 5.8 亿基督徒。**天主教会不是成员**，但派观察员参与。

**（三）主要成果与失败。**

| 成果 | 失败 |
|---|---|
| 礼仪与神学的相互理解（大量双边对话） | 真正的「合一」（*visible unity*）从未实现 |
| 社会公义议题的共同立场（反种族隔离、反贫穷、环境保护） | 保守派（尤其福音派与五旬节派）拒绝参与（认为 WCC 是「自由派的俱乐部」） |
| 东正教与新教的对话（但 1991 年后因东欧剧变而紧张） | 性伦理议题（同性恋、女性按立）使圣公会与非洲教会几近分裂 |

**（四）关键的双边对话成果。**
- **信义宗—天主教**：《关于称义教义的联合声明》（1999）——这是宗教改革以来最重要的合一文件。
- **圣公会—天主教**：ARCIC（1966 起）在圣餐、圣职、权威上达成大量共识，但在「女性按立」与「教宗首席权」上卡住。
- **东正教—天主教**：1965 年撤销 1054 年的绝罚；但「教宗首席权」仍是最后的障碍。

### 16.6 灵恩运动（1960 起）：五旬节进入主流教会

五旬节派原本是「边缘的、贫穷的、无教育的」教会。1960 年代，它开始进入主流教会，形成**灵恩运动**（Charismatic Movement）：

- **1960 年**：丹尼斯·班尼特（Dennis Bennett），一位**圣公会**牧师，公开宣布自己「被圣灵充满、说了方言」，被教会解除职务。这被视为灵恩运动进入主流教会的标志。
- **1967 年**：「**天主教灵恩复兴**」（Catholic Charismatic Renewal）在杜肯大学开始，今天有数千万天主教徒参与。
- **1970s–80s**：「**第三波**」（Third Wave，彼得·魏格纳 Peter Wagner 的术语）——不强调「说方言是必须的证据」，但强调「圣灵的能力、神迹、属灵争战」。
- **1980s–90s**：「**多伦多祝福**」（Toronto Blessing）、「**布朗斯维尔复兴**」（Brownsville Revival）——大规模的情绪性聚会。

:::note
**灵恩运动的意义常被低估**：它是 20 世纪唯一一个**跨越宗派边界**的运动——天主教、圣公会、路德宗、长老会、浸信会、以及独立教会里都有灵恩派。

**但它也带来了新的分裂**：灵恩派与「非灵恩派」在同一宗派内的冲突（美国圣公会、路德宗、以及许多华人教会都因此分裂）。**争论的核心不是「圣灵是否工作」，而是「如何分辨圣灵的工作与情绪、暗示、甚至欺骗」。**
:::

### 16.7 处境化神学：解放、黑人、女性

20 世纪下半叶，神学不再只从欧洲的大学里产生，而是从**具体的苦难与压迫**中产生。

**（一）解放神学（Latin American Liberation Theology，1960s–）。**
**古斯塔沃·古铁雷斯**（Gustavo Gutiérrez）《解放神学》（1971）主张：神学不是「关于神的理论」，而是「**在压迫处境中的信仰反思**」；神「**优先选择穷人**」（*opción preferencial por los pobres*）；救恩不只是灵魂得救，也包括社会结构的解放。

**（二）黑人神学（Black Theology，1960s–）。**
**詹姆斯·科恩**（James Cone）《黑人神学与黑人权力》（1969）：如果神站在被压迫者一边，那么在美国的种族语境中，**神是黑的**；「耶稣的十字架」是黑人被私刑处死的象征。

**（三）女性神学（Feminist Theology，1970s–）。**
- **玛丽·戴利**（Mary Daly）：从「女性主义」走向「后基督教」（《超越父神》）。
- **罗斯玛丽·雷德福·路透**（Rosemary Radford Ruether）：批判「父权制的神学」，主张神学的核心是「**先知性的批判**」。
- **菲莉丝·特丽波**（Phyllis Trible）：用女性主义的解经方法重新读圣经（《恐怖的文本》）。

**（四）亚洲、非洲的处境化神学。**
- **非洲神学**：强调「共同体」（*ubuntu*）、祖先、医治、以及非洲独立教会（AIC）的本土化。
- **亚洲神学**：与佛教、伊斯兰教、印度教的对话；「**水的神学**」（水的柔韧）、「**米的神学**」（分享与生命）；以及韩国的「**民众神学**」（*minjung*，民众）。
- **「第三世界神学」的共同点**：神学必须从**具体的处境**出发，而不是从欧洲的哲学问题出发。

### 16.8 争议与反驳

#### 16.8.1 基要主义/福音派对 20 世纪神学的批评

- **「巴特的新正统是自由派的变种。」** 他否认圣经无误，否认历史性的亚当，否认字面的复活。
- **「解放神学是马克思主义的伪装。」** 它把福音变成了阶级斗争（1984 年与 1986 年，梵蒂冈信理部两次批评解放神学）。
- **「女性神学取消了圣经的权威。」** 它把圣经当作父权制的产物来批判。
- **「普世运动是出卖真理。」** 为了合一而淡化教义，最终什么都剩不下。

#### 16.8.2 自由派与处境化神学对保守派的批评

- **「你们的『圣经无误』是一个现代发明，而且它崇拜的是圣经，不是神。」**
- **「你们的『个人救恩』使你们对社会不义视而不见。」** 种族隔离、贫穷、战争——这些不是「属灵问题」，是罪。
- **「你们的『传统家庭价值』常常是父权制与种族主义的遮羞布。」**
- **「你们的『普世主义』其实是西方文化帝国主义。」** WCC 的领导层长期由欧美人主导，议程也由他们设定。

#### 16.8.3 无神论与世俗主义对 20 世纪基督教的批评

- **「20 世纪最残酷的暴行（纳粹、斯大林、两次世界大战）发生在最「文明」的基督教欧洲。」** 而教会的反应常常是沉默或配合（德国教会的大部分支持纳粹；天主教会对犹太人的援助有限且迟缓）。
- **「五旬节运动的成功证明宗教是情绪操纵。」** 说方言、倒地、大哭——这不正是群众心理学的经典案例？
- **回应**：（1）关于二战，教会既有抵抗者（巴特、朋霍费尔、丹麦教会的地下救援、意大利的犹太人的藏匿），也有配合者——**这正是「教会是麦子与稗子的混合体」的实例**；（2）关于五旬节，任何群众运动都有心理机制，但**心理机制的存在不证明经验是虚假的**（爱情也有心理机制）。

### 16.9 常见误解

:::pit t="关于 20 世纪的四个误解"
**误解一：「五旬节运动是从神学边缘来的，所以神学很浅。」**
它的神学确实简单，但它有极强的**实践神学**：属灵争战、医治、释放、宣教。而且它有庞大的学术体系（如英国切斯特大学、美国奥罗尔·罗伯茨大学、富勒神学院的灵恩研究）。

**误解二：「梵二使天主教变成新教」。**
没有。它改变了礼仪语言与开放态度，但**教义结构（七件圣礼、教宗制、马利亚敬礼、炼狱）全部保留**。新教徒常常高估了梵二的变革幅度。

**误解三：「普世运动已经失败」。**
它没有实现「可见的合一」，但它改变了教会之间的关系：从「互相绝罚」到「互相承认对方有救恩的要素」。**这是巨大的进步，只是不够戏剧化。**

**误解四：「解放神学被梵蒂冈否定了」。**
梵蒂冈批评了它的**马克思主义分析**（1984、1986），但没有否定它的**核心关切**（优先选择穷人）。本笃十六世（拉青格）在 2007 年的《阿帕雷西达文件》中明确说：「**优先选择穷人，是教会的特征**」。
:::

## 第 17 章：当代——全球南方、独立教会与身份之战（1970–今天） {#ch-17}

### 17.1 地理大迁移：基督教的重心南移

| 地区 | 1900 年基督徒人数 | 2020 年基督徒人数 | 趋势 |
|---|---|---|---|
| 欧洲 | 约 1.8 亿（占全球 66%） | 约 5.5 亿（占 22%） | 绝对数稳定，比例大幅下降 |
| 北美 | 约 0.6 亿 | 约 2.6 亿 | 稳定 |
| **非洲** | **约 1000 万** | **约 6.7 亿** | **爆炸性增长** |
| **拉丁美洲** | 约 0.6 亿 | 约 6.0 亿 | 从天主教转向五旬节派 |
| **亚洲** | 约 0.2 亿 | 约 4.0 亿 | 韩国、中国、菲律宾、印度增长显著 |

:::why t="这个迁移改变了什么"
它改变了基督教的**问题清单**。

- **欧洲基督徒关心**：历史批判学、世俗化、教会衰退、同性婚姻、环境伦理。
- **非洲基督徒关心**：贫穷、疾病、巫术与属灵争战、一夫多妻、祖先崇拜的处境化。
- **拉美基督徒关心**：社会不义、解放、灵恩经验、天主教与五旬节派的竞争。
- **亚洲基督徒关心**：少数派处境、宗教对话（与佛教、伊斯兰、{{儒家}}的关系）、快速现代化中的家庭结构。

**这意味着：「基督教神学」不再是一个统一的对话**。当非洲圣公会主教说「同性恋是西方帝国主义输入非洲的」，而美国圣公会主教说「包容是福音的要求」时，他们用的**是同一部圣经、同一个信经、同一个教会传统**——但他们的处境完全不同。**这就是 21 世纪基督教最深的张力：它已经不是一个文明，而是一个全球性的、多中心的网络。**
:::

### 17.2 独立教会与「灵恩第三波」

**（一）独立教会（Independent Churches）的崛起。**
今天全球增长最快的基督教形态，是**不属于任何历史宗派的独立教会**。它们有几个特征：

- 由一个有魅力的领袖创立（往往自称「使徒」或「先知」）；
- 强调圣灵的能力、医治、预言、成功；
- 组织松散、高度本地化；
- 通常不参与普世运动，也不参与神学对话。

**估计**：独立教会占全球基督徒的 **20%–25%**（约 5 亿人），是**仅次于天主教的第二大群体**。

**（二）非洲独立教会（AIC）。**
非洲有约 1 万个独立教会，其中最著名的包括：

- **基姆班古主义**（Kimbanguism，刚果）：西蒙·基姆班古（1889–1951）被视为先知，他的教会（约 1700 万信徒）把基督教与非洲传统结合。
- **锡安基督教会**（Zion Christian Church，南非，约 1500 万）：把旧约的以色列与非洲的锡安山结合。
- **埃塞俄比亚的「拉斯特法里」运动**：从埃塞俄比亚主义发展，把海尔·塞拉西视为弥赛亚（这影响了牙买加的拉斯塔法里教与雷鬼音乐）。

**（三）拉美的五旬节派。**
巴西是全球最大的天主教国家，但五旬节派增长极快（**神召会** Assembleias de Deus 约 2000 万；**普世神国教会** Igreja Universal do Reino de Deus 由埃迪尔·马塞多创立，影响力极大）。

**（四）韩国的巨型教会。**
**汝矣岛纯福音教会**（Yoido Full Gospel Church，首尔）曾是全球最大的教会（约 80 万信徒），由**赵镛基**创立，是五旬节派与「**成功神学**」结合的代表。

### 17.3 成功神学：一个必须单独讲的争议

**（一）主张。**
「**成功神学**」（Prosperity Gospel / Word of Faith）的核心是：

- 神愿意他的儿女**健康、富有、成功**；
- 贫穷与疾病是「咒诅」，是信心的缺乏；
- **「积极宣认」**（positive confession）：说出你想要的，神就会成就（「信心的话语有创造力」）；
- 奉献（尤其「**种子奉献**」）会带来百倍的回报。

**（二）代表。**
肯尼斯·哈金（Kenneth Hagin）、肯尼斯·科普兰（Kenneth Copeland）、约尔·欧斯汀（Joel Osteen）、以及大量非洲、拉美、亚洲的独立教会领袖。

**（三）批评。**

| 批评 | 内容 |
|---|---|
| **神学上** | 它把「十字架的神学」（受苦、舍己）换成了「成功的福音」；把耶稣的应许（「你们在世上有苦难」约 16:33）删掉了 |
| **解经上** | 它主要依靠少数经文（玛 3:10 的十一奉献、约三 1:2、赛 53:5），且脱离上下文 |
| **伦理上** | 它把贫穷归咎于受害者（「你没有信心」），而这与雅各书 2:1–7 的立场相反 |
| **实践上** | 它使大量穷人的奉献流向领袖的私人飞机与豪宅；2019 年美国的调查揭露了多起「成功神学」领袖的财务丑闻 |
| **牧养上** | 当一个信徒生病没有得医治、或奉献后没有致富，他会陷入信仰危机（「是不是我不够信？」） |

**（四）为什么它仍然吸引人。**
因为它回答了**一个真实的痛苦**：贫穷、疾病、无力感。在一个贫富悬殊的社会里，「神愿意你富有」比「神与你一同受苦」更有吸引力。**这一点值得认真对待**——它不是「骗子骗傻子」，而是「一个真实的盼望被一个错误的承诺绑架了」。

### 17.4 末世论团体与「邪教」：当等待变成灾难

20 世纪出现了一批以「末日时间表」为核心的团体，其中几个以悲剧收场：

| 团体 | 领袖 | 事件 |
|---|---|---|
| **人民圣殿教** | 吉姆·琼斯 | 1978 年圭亚那琼斯镇，914 人死亡（集体服毒/被杀） |
| **大卫教派**（Branch Davidians） | 大卫·考雷什 | 1993 年德州韦科，围困 51 天后起火，76 人死亡 |
| **天堂之门** | 马歇尔·阿普尔怀特 | 1997 年加州，39 人集体自杀，相信海尔-波普彗星后的飞船 |
| **奥姆真理教** | 麻原彰晃 | 1995 年东京地铁沙林毒气事件（这是佛教背景，但与末世论结构相似） |
| **「世界末日」预言失败案例** | 米勒（1844）、坎平（2011） | 预言失败后，一部分人离开，一部分人「重新解释」（**认知失调**的经典案例） |

:::why t="为什么这些团体值得在「基督教思想史」里讲"
因为它们是**边缘神学的极端实验**，而它们揭示的机制在主流教会里也存在：

1. **「只有我们能读懂圣经的时间表」**——这是末世论解经的常见傲慢（从达秘的时代论到当代的「圣经预言」产业）。
2. **「领袖的绝对权威」**——当一个人被认为是「神的先知」，他就不能被质疑（这在主流教会的「属灵权柄」文化里也有影子）。
3. **「离开就是背叛」**——群体的封闭性，使成员无法退出（这在严格宗派里也存在，只是程度不同）。
4. **「末日越近，越要顺服」**——末世的紧迫感常被用来压制批评。

**换句话说：主流教会与这些团体之间的差别，往往不是「神学是否正确」，而是「是否有制度性的制衡」。** 一个没有外部问责、没有财务透明、没有神学对话的群体，无论其教义多么正统，都有走向灾难的结构风险。
:::

### 17.5 性议题：21 世纪最活跃的分裂线

**（一）女性按立。**

| 宗派 | 立场 |
|---|---|
| 天主教、东正教 | 不允许（若望保禄二世 1994 年明确说「不可更改」） |
| 美南浸信会 | 不允许（2000 年《浸信会信仰与信息》明确「牧师应为男性」） |
| 圣公会 | 允许（但非洲与亚洲的部分教省反对，导致事实上的分裂） |
| 联合卫理公会 | 允许（但美国与非洲代表长期冲突，2024 年正式分裂） |
| 长老会（PCUSA） | 允许 |
| 五旬节派 | 混合（早期五旬节派有大量女性讲道者，后来多数宗派收紧了） |

**（二）同性议题。**
这是 21 世纪分裂最激烈的议题。主要立场：

1. **传统立场**：同性性行为是罪（依据利 18:22、罗 1:26–27、林前 6:9）。婚姻只限一男一女。这是天主教、东正教、保守新教、以及全球南方多数教会的立场。
2. **接纳但不变更教义**（「欢迎但不变」）：同性恋者可以参加教会，但须守独身。
3. **全面接纳**：同性婚姻可以祝福、同性恋者可以按立（美国圣公会、PCUSA、ELCA、联合教会、以及部分欧洲教会）。
4. **「已经解决」的立场**：认为圣经的禁令针对的是**特定的文化情境**（如娈童、偶像崇拜的性仪式），不适用于现代的责任性同性关系。

**（三）已经发生的分裂。**
- **美国圣公会**（2016 年起，保守派成立 ACNA，2009）
- **联合卫理公会**（2024 年正式分裂，保守派成立「全球卫理公会」GMC，约 4000 个堂会离开）
- **美国长老会**（PCUSA 2012 年允许同性婚姻，此前已有大量保守堂会离开加入 ECO 或 PCA）
- **全球圣公会**（2016 年起，保守派成立 GAFCON 与「全球圣公会未来会议」，与坎特伯雷的关系事实上中断）

:::pit t="为什么这个议题如此难以对话"
因为它同时涉及四个层面，而这四个层面的论证方式完全不同：

1. **解经层**：那些经文（利 18、罗 1、林前 6、提前 1）究竟在禁止什么？
2. **神学层**：创造秩序（创 1–2 的「一男一女」）是否具有规范性的意义？
3. **经验层**：同性恋者的真实生活、信仰、与痛苦，是否应当参与神学的形成？（「**经验作为神学来源**」是一个现代命题。）
4. **制度层**：谁有权决定？（普世会议？各教省？各堂会？）

**双方常常在不同的层面上争论**：一方在讲解经，另一方在讲经验；一方在讲圣经的权威，另一方在讲教会的包容。**这就是为什么这场对话如此激烈而少有进展。**
:::

### 17.6 华人教会的特殊谱系

中文读者可能最关心这一节。华人基督教有几个独特的脉络：

**（一）中国内地。**
- **三自爱国运动**（1950 起）：在政府领导下统一管理新教教会（「自治、自养、自传」），1954 年成立「中国基督教三自爱国运动委员会」，1958 年实行「联合礼拜」（各宗派合并）。
- **家庭教会**：不在三自体系内的聚会点，1970s 后在农村（河南、安徽、温州）与城市迅速增长。内部的谱系极其复杂：从传统的福音派、到灵恩派（如「哭重生」）、到改革宗（2000s 后的「改革宗复兴」）、到各种末世论团体（如「东方闪电」/全能神教）。
- **官方估计**：基督徒约 2000 万（官方数字）到 4000 万以上（独立估计）；2018 年后因新《宗教事务条例》的执行，教会面临新的压力。

**（二）台湾、香港、东南亚。**
- **台湾**：长老会（受苏格兰与加拿大宣教会影响）在社会运动中扮演重要角色；灵恩派与独立教会增长。
- **香港**：宗派林立（浸信会、宣道会、循道卫理、圣公会），2019 年后因政治环境变化，部分教会与信徒移民。
- **东南亚**：新加坡、马来西亚的华人教会以灵恩派与独立教会为主；印尼的华人教会与当地族群关系复杂。

**（三）北美华人教会。**
- 1960–1990 年代由留学生与移民建立，多为「**福音派 + 独立教会**」形态（不属于任何宗派）。
- 内部的「**粤语 vs 国语**」「**老侨 vs 新侨**」「**传统 vs 当代**」张力极大。
- 2000s 后出现「**改革宗复兴**」（受唐崇荣、以及大量翻译的加尔文主义著作影响），与原有的阿米念式福音派产生张力。

**（四）华人教会的共同特征。**
1. **强烈的「福音派」认同**（圣经权威、个人重生、宣教使命），对自由主义神学与历史批判学基本无接触。
2. **宗派意识淡薄**（独立教会占多数），但**神学立场鲜明**（常以「基要」为荣）。
3. **对「灵恩」的分歧极大**（有的教会完全拒绝，有的完全拥抱）。
4. **政治议题上高度分裂**（尤其在中国大陆、香港、台湾的教会）。

### 17.7 数字时代：「无教会基督徒」与新的分裂

**（一）「无教会基督徒」（*churchless Christians*，或 *dechurched*）。**
在欧美，大量人自称基督徒但不参加任何教会（「**相信但不归属**」，*believing without belonging*，Grace Davie 的术语）。原因包括：对制度的失望、性议题的冲突、疫情后的习惯改变、以及网络崇拜的替代。

**（二）网络教会与「算法牧养」。**
- 线上崇拜、Zoom 小组、播客讲道成为常态（2020 年疫情加速了这一进程）。
- 出现「**网络原生教会**」（internet-native churches），没有实体建筑，跨越地理边界。
- 也出现「**算法化的信仰**」：短视频平台上的讲道片段、灵修内容、以及「属灵网红」。

**（三）新的分裂形式。**
- **「平台分裂」**：一个教会因为牧师的社交媒体言论而分裂。
- **「信息茧房」**：信徒只接触与自己立场一致的内容，跨立场的对话减少。
- **「去中心化」**：权威从机构转向个人意见领袖（influencer）。

### 17.8 争议与反驳

#### 17.8.1 全球南方对西方教会的批评

- **「你们的神学是富裕社会的奢侈品。」** 你们讨论「神是否死了」，我们讨论「今天有没有饭吃」。
- **「你们的『包容』是文化帝国主义。」** 你们用金钱与机构权力，把你们的性伦理强加给我们。
- **「你们的教会衰败，是因为你们放弃了福音。」** 我们的教会增长，是因为我们相信神迹、传讲悔改、要求委身。

#### 17.8.2 西方对全球南方教会的批评

- **「你们的神学是前现代的。」** 你们把贫穷说成「属灵争战」，把疾病说成「魔鬼」，这会阻碍公共卫生与教育。
- **「你们的『成功神学』剥削穷人。」** 你们让最穷的人奉献他们最后的钱，去建领袖的豪宅。
- **「你们的性伦理是歧视。」** 你们用「传统」来为歧视辩护，而传统本身也是被建构的。

#### 17.8.3 无神论与世俗主义的批评

- **「基督教的全球化，只是宗教迷信的全球化。」** 五旬节派的增长证明了现代世界不是「世俗化」的，而是「**宗教化**」的——只是宗教的形式变了。
- **「基督教在非洲、拉美的增长，与殖民主义、贫困、以及社会失序有关。」** 它提供的是一个「解释苦难 + 提供社群 + 给予盼望」的包裹。
- **回应**：（1）「世俗化理论」确实被证伪了（Peter Berger 晚年公开承认自己错了）；（2）但「宗教提供心理补偿」的解释也不能说明为什么是**基督教**而不是别的宗教在增长。

### 17.9 常见误解

:::pit t="关于当代基督教的四个误解"
**误解一：「基督教正在衰亡」。**
欧洲在衰退，但全球在增长。**基督教在 20 世纪从 5.5 亿增长到 24 亿**，是历史上增长最快的宗教（绝对数）。衰亡的是「欧洲的、制度化的、国教式的」基督教。

**误解二：「五旬节派没有神学」。**
它有神学，只是**不用学术语言表达**。它的神学核心（圣灵的持续工作、属灵争战、医治、末世论）非常明确，而且与「世俗化的基督教」形成鲜明对比。

**误解三：「独立教会是『没有传统的教会』」。**
它们有传统，只是**不承认自己是传统**（往往自称「只要圣经」）。它们继承的是 19 世纪美国的复原主义 + 20 世纪的灵恩运动 + 当地的民间宗教元素。

**误解四：「性议题的分裂只是西方的问题」。**
**恰恰相反**：全球南方的教会（非洲、亚洲）在这个议题上**比西方保守得多**，而它们占全球基督徒的多数。所以「西方教会走向开放」不代表「全球基督教走向开放」——**这可能是 21 世纪最重要的一个误判。**
:::

:::titre
**下一部：外部批判（第 18–23 章）**

前五部讲的是「基督教内部怎么分裂」。第六部要换一个视角：**从外面看**。犹太教说「你们拜的是偶像」；伊斯兰教说「你们篡改了启示」；无神论说「这一切都是人编的」；世俗主义说「宗教应当退回私人领域」。这四种批判，每一种都比任何内部异端更根本——因为它们不接受基督教的前提。**而理解这些批判，是理解基督教在 21 世纪处境的必要条件。**
:::

## 第五部派别档案（卡片速查）

第五部的「派别」不再是「教义立场」，而是**运动类型**——因为它们跨越宗派边界。一张「五旬节派」卡片可以同时是路德宗的、圣公会的、或完全独立的。

> [[k:卫理公会 / 循道宗 | en:Methodism | 1738 至今 | 主流宗派 | 现存约 8000 万]]
> **主张**：**先在的恩典**（*prevenient grace*）——神在每个人心里先赐下普遍的光照，使堕落的人仍有能力回应福音；**拣选基于预知的信心**（阿米念式）；**圣灵的见证**给信徒得救的确据；**完全成圣**（今生可达到「完全爱神爱人」的状态，不是无罪而是动机的纯洁）；**社会圣洁**——个人得救必须带来对贫穷、奴隶制、酗酒、童工的社会行动。
> **来历**：1729 年牛津的「圣社」；1738 年 5 月 24 日卫斯理在阿尔德门街「心奇异地火热」；1784 年卫斯理为美洲按立监督；1795 年计划会议后与英国国教分离。**卫斯理本人终身是英国国教神父，从未正式脱离。**
> **要解决的问题**：**如果恩典不可抗拒、拣选无条件，那么「传福音」与「追求圣洁」还有什么意义？** 卫斯理的答案是：恩典是可拒绝的，而人可以被圣灵带到完全的愛里。
> **论敌**：严格加尔文主义者（1739–1741 年与怀特腓的决裂）、圣公会的保守派（指其「狂热」）、以及**卫理公会内部**（19 世纪的分裂：美以美会 vs 美普会 vs 监理会）。
> **所受反驳**：（1）「完全成圣」在经验上无法验证，且容易导致属灵骄傲；（2）阿米念式神学把得救的一部分功劳归给人；（3）情感化的复兴造成分裂（19 世纪美国卫理公会因奴隶制分裂为南北两派）。
> **结局 / 现状**：全球约 8000 万，是 18–19 世纪英语世界最有活力的运动。**它的神学通过五旬节派与圣洁运动扩散到全球**（今日多数「阿米念式」福音派都可追溯到这里）。**2024 年联合卫理公会因性议题正式分裂**，保守派成立「全球卫理公会」（GMC），约 4000 个堂会离开。

> [[k:五旬节派 | en:Pentecostalism | 1906 至今 | 运动/宗派 | 现存约 6 亿（含灵恩派）]]
> **主张**：**圣灵的洗**是信主之后的第二次经验；**说方言**是圣灵之洗的「初始证据」；神迹医治、预言、赶鬼在今天仍然有效；末日临近，传福音是紧急任务。
> **来历**：1901 年帕勒姆在堪萨斯托皮卡提出「初始证据」教义；1906–1909 年西摩在洛杉矶阿苏萨街的复兴；1914 年神召会（Assemblies of God）成立。
> **要解决的问题**：**如果圣灵在使徒时代工作，为什么今天不工作了？** 五旬节派的答案是：他一直在工作，只是主流教会不信。
> **论敌**：主流宗派（指其为「情绪主义」）、自由派（否认神迹）、以及**五旬节派内部**（关于「说方言是否是必须的证据」的争论）。
> **所受反驳**：（1）说方言在哥林多前书 12–14 章中不是「必须的证据」，而是众多恩赐之一，且保罗说「岂都是说方言的吗」（林前 12:30）；（2）情绪性的聚会容易走向操纵与分裂；（3）「成功神学」的变体剥削穷人。
> **结局 / 现状**：**基督教史上增长最快的形态**（100 年从零到 6 亿）。中心在拉美、非洲、亚洲。内部的多样性极大：从极其保守的「独一神格五旬节派」（否认三位一体）到主流的「神召会」，差别巨大。

> [[k:灵恩派 | en:Charismatic Movement | 1960 至今 | 跨宗派运动 | 现存数亿]]
> **主张**：与五旬节派共享对圣灵恩赐的强调，但**不要求「说方言是必须的证据」**；强调「圣灵的能力」可以在任何宗派中运行。
> **来历**：1960 年圣公会牧师丹尼斯·班尼特公开宣布「被圣灵充满」；1967 年天主教灵恩复兴在杜肯大学开始；1970–80 年代「第三波」（彼得·魏格纳）。
> **要解决的问题**：**主流教会的信仰是否太「理性化」、失去了圣灵的能力？**
> **论敌**：主流宗派的保守派（指其引入「灵恩混乱」）、以及五旬节派中的严格派（指其「不够彻底」）。
> **所受反驳**：（1）灵恩经验缺乏可检验的标准，容易与心理暗示混淆；（2）灵恩运动造成了大量教会分裂；（3）「属灵争战」的语言有时会滑向迷信（把一切问题归给魔鬼）。
> **结局 / 现状**：**已经渗透到几乎所有宗派**——天主教、圣公会、路德宗、长老会、浸信会里都有灵恩派。它使「五旬节」从一个宗派变成一个**跨宗派的维度**。

> [[k:福音派 | en:Evangelicalism | 1940s 至今 | 运动 | 现存约 3–4 亿]]
> **主张**：**四个标志**（David Bebbington 的经典概括）——（1）**归信主义**（conversionism，个人重生的必要性）；（2）**圣经主义**（biblicism，圣经是最高权威）；（3）**十字架中心**（crucicentrism，基督的代赎是核心）；（4）**行动主义**（activism，传福音与社会行动）。
> **来历**：1940 年代从基要派中分化出来（葛培理、《今日基督教》、富勒神学院），主张「分离但参与」——在核心教义上坚持，在其他问题上宽容合作。
> **要解决的问题**：**如何在拒绝现代主义的同时，不退出公共领域？** 基要派的答案是「退出」，福音派的答案是「参与」。
> **论敌**：自由派（神学上）、基要派（不够纯正）、以及**福音派内部**的加尔文派 vs 阿米念派、灵恩派 vs 非灵恩派、进步派 vs 保守派。
> **所受反驳**：（1）「福音派」太宽泛，几乎什么都可以叫福音派；（2）它与政治保守主义的绑定（尤其美国的宗教右派）使福音沦为政治工具；（3）「圣经主义」在实践中常变成「选择性字面主义」。
> **结局 / 现状**：全球约 3–4 亿，是美国最重要的宗教—政治力量。**内部的「福音派是否还能存续」的争论，是 21 世纪美国宗教的核心问题。**

> [[k:基要派 | en:Fundamentalists | 1910s 至今 | 运动 | 现存数百万]]
> **主张**：**五个基要**——圣经无误、基督神性、童贞女降生、代赎之死、身体复活与再来。**分离主义**：不与自由派、天主教、甚至「不够纯正」的福音派合作。
> **来历**：1910–1915 年《基要》十二册；1925 年斯科普斯审判后退出公共领域，转入亚文化（教会、学校、出版社、广播）。
> **要解决的问题**：**现代学术（历史批判、进化论、心理学）是否摧毁了圣经的可靠性？** 答案是：不，圣经完全无误，现代学术是错的。
> **论敌**：自由派神学、现代主义、进化论、以及后来的福音派（「妥协派」）。
> **所受反驳**：（1）「圣经无误」是 19 世纪普林斯顿神学家（贺治、华腓德）的发明，不是古代教会的信条；（2）选择性字面主义（坚持创世记 6 天，却不坚持利 19:19 的混纺禁令）；（3）拒绝现代学术导致自我隔绝与反智。
> **结局 / 现状**：在美国仍是一个有影响力的亚文化（鲍勃·琼斯大学、Answers in Genesis、以及大量独立基要派教会）。**它与福音派的分歧不在教义，而在「是否与别人合作」。**

> [[k:摩门教 / 后期圣徒教会 | en:LDS Church | 1830 至今 | 新兴宗教 | 现存约 1700 万]]
> **主张**：《摩门经》是与圣经并列的新启示；神有一个可触摸的身体；人可以通过「婚姻的印证」成为神；先知（从约瑟·斯密起）持续存在；**否认三位一体**（父、子、圣灵是三个分开的神，即三神论）；耶稣与撒但是灵界的兄弟。
> **来历**：1830 年约瑟·斯密（Joseph Smith）在纽约州出版《摩门经》；1844 年斯密在伊利诺伊州 Carthage 监狱被枪杀；杨百翰（Brigham Young）带领信徒西迁到犹他（1847）。
> **要解决的问题**：**如果神今天仍然说话，为什么没有现代先知？** 答案是：有，就是约瑟·斯密。
> **论敌**：主流基督教（天主教、新教都判其为异端或另一个宗教）、美国政府（一夫多妻制的冲突）。
> **所受反驳**：（1）《摩门经》的考古学与语言学证据薄弱；（2）约瑟·斯密的「翻译」方法（用「乌陵与土明」看石头）不可检验；（3）一夫多妻制（1890 年正式废除，但原教旨主义分支仍实行）；（4）种族歧视的历史（1978 年才允许黑人担任祭司）。
> **结局 / 现状**：全球约 1700 万，增长极快，组织极其严密（庞大的传教网络、家谱数据库、福利体系）。**它是 19 世纪美国「复原主义」最成功的产物。**

> [[k:耶和华见证人 | en:Jehovah's Witnesses | 1870s 至今 | 新兴宗教 | 现存约 870 万]]
> **主张**：**否认三位一体**（耶稣是神所造的最高存在，即阿里乌式）；否认地狱永刑（恶人永远毁灭，不是永远受苦）；否认灵魂不朽；1914 年基督已在天上作王；**拒绝输血、参军、庆祝节日、向国旗敬礼**；只有 14.4 万人（「受膏者」）能上天堂，其余得救者在地上乐园。
> **来历**：1870 年代查尔斯·泰兹·罗素（Charles Taze Russell）在宾夕法尼亚创立「圣经研究者」；1931 年改名为「耶和华见证人」。
> **要解决的问题**：**如果神是爱的，地狱永刑怎么可能是真的？** 答案是：地狱不存在，恶人会被消灭。
> **论敌**：所有主流宗派（尤其天主教会）、政府（因拒绝参军与输血）。
> **所受反驳**：（1）「1914 年」的预言多次失败并重新解释；（2）组织高度集权（「治理机构」拥有绝对权威）；（3）「逐出」（disfellowshipping）造成大量家庭破裂；（4）输血禁令导致死亡案例。
> **结局 / 现状**：全球约 870 万「传道员」，以挨家挨户传教著称。**它是「阿里乌主义」在 20 世纪最成功的复活。**

> [[k:复临安息日会 | en:Seventh-day Adventists | 1863 至今 | 宗派 | 现存约 2200 万]]
> **主张**：**守星期六（第七日）为安息日**；基督 1844 年进入「天上圣所」开始查案审判；灵魂不是不朽的（「灵魂沉睡」，恶人最终被消灭而非永刑）；健康饮食（许多信徒素食、禁烟酒）；怀爱伦（Ellen G. White）的著作被视为「预言之灵」。
> **来历**：1844 年米勒（William Miller）的「世界末日」预言失败（「大失望」）；怀爱伦与其他人重新解释为「基督进入天上圣所」；1863 年正式成立。
> **要解决的问题**：**如果基督没有在 1844 年再来，那预言错了吗？** 答案是：预言没错，是我们理解错了（他进入了天上的圣所）。
> **论敌**：主流宗派（尤其对「守安息日」与「怀爱伦的权威」的批评）。
> **所受反驳**：（1）「1844 年」的解释是事后补救（认知失调的经典案例）；（2）怀爱伦的著作有抄袭嫌疑（现代研究证实部分内容来自其他作者）；（3）守安息日与保罗的教导（罗 14:5–6、西 2:16–17）冲突。
> **结局 / 现状**：全球约 2200 万，组织极其发达（教育、医疗、出版体系）。**它是 19 世纪「末世论失败」之后成功重建的最典型案例。**

> [[k:基督教科学会 | en:Christian Science | 1879 至今 | 新兴宗教 | 现存约 10 万]]
> **主张**：**物质是幻象**，真实的只有「心」（*Mind*）与「灵」；疾病是错误的信念，因此真正的医治是**祈祷与心灵的正确认识**，不是药物；耶稣是「基督」的化身，但他不是神，而是「最伟大的灵性导师」；**玛丽·贝克·艾迪**（Mary Baker Eddy）的《科学与健康附圣经之钥》（1875）是解释圣经的权威。
> **来历**：1879 年艾迪在马萨诸塞州波士顿创立「基督教会（科学派）」；《基督教科学箴言报》（1908 创刊）是它最广为人知的产物。
> **要解决的问题**：**如果神是善的、全能的，那么疾病与痛苦从哪来？** 艾迪的答案是：它们不是真实的，是「必死的心」（*mortal mind*）的错误信念。
> **论敌**：主流医学界（因拒绝医疗）、主流基督教（因否认物质实在与基督的神性）。
> **所受反驳**：（1）拒绝医疗导致可预防的死亡（有多起法律案例，包括儿童因未获治疗而死亡）；（2）「物质是幻象」在逻辑上自我否定（若物质是幻象，那么这本书（物质的纸）也是幻象）；（3）它对圣经的解读高度选择性。
> **结局 / 现状**：{{基督教科学会}}约 10 万信徒（持续下降），但**《基督教科学箴言报》仍是国际知名的严肃媒体**——这是一个奇特的遗产：一个边缘教派的报纸成了主流新闻业的一部分。

> [[k:独立教会 / 成功神学 | en:Independent Churches / Prosperity Gospel | 20 世纪至今 | 运动 | 现存约 5 亿]]
> **主张**：不属于任何历史宗派；强调圣灵的能力、医治、预言、以及**成功**（健康、财富、成功是神的旨意）；「积极宣认」（说出你想要的，神就会成就）；「种子奉献」（奉献会带来百倍回报）。
> **来历**：20 世纪五旬节运动 + 美国「WORD OF FAITH」运动（哈金、科普兰）+ 拉美、非洲、亚洲的本土化。
> **要解决的问题**：**贫穷与疾病是神的旨意吗？** 答案是：不是，它们是咒诅，信心可以破除。
> **论敌**：主流宗派（指其为「异端」或「剥削」）、以及发展中国家的政府（部分国家限制其活动）。
> **所受反驳**：（1）神学上把「十字架的神学」换成了「成功的福音」；（2）解经上主要依靠少数经文且脱离上下文；（3）伦理上把贫穷归咎于受害者；（4）实践上使大量穷人的奉献流向领袖的豪宅与私人飞机。
> **结局 / 现状**：全球约 5 亿（独立教会 + 成功神学的影响范围极广）。**它是 21 世纪基督教增长最快的部分，也是争议最大的部分。**

## 争论的温度计：第五部 {#part5-thermometer}
